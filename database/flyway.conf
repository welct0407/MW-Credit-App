# Credentials and target URLs are supplied by scripts/database/Invoke-Flyway.ps1.
flyway.locations=filesystem:database/migrations
flyway.defaultSchema=public
flyway.table=flyway_schema_history
flyway.cleanDisabled=true
flyway.baselineOnMigrate=false
flyway.baselineVersion=1
flyway.baselineDescription=Verified existing PostgreSQL schema
flyway.validateOnMigrate=true
flyway.validateMigrationNaming=true
flyway.outOfOrder=false
flyway.placeholderReplacement=false
flyway.connectRetries=0
flyway.lockRetryCount=10
flyway.encoding=UTF-8
