      "is_partition": false,
      "options": null,
      "acl": null,
      "comment": null,
      "view_definition": " WITH ranked AS (\n         SELECT l.\"Row ID\",\n            l.\"Loan Date\",\n            l.\"Close Date\",\n            l.\"Principal Amount\",\n            l.\"Due Date\",\n            l.\"Ref Borrowers\",\n            l.\"Loan Arrangement\",\n            l.\"Loan Status\",\n            l.\"Loan Type\",\n            l.\"Current Daily Interest\",\n            l.\"Fixed Interest\",\n            l.\"Transfer Fee\",\n            l.\"Interest Payment Interval\",\n            l.\"Created By\",\n            l.\"Closed By\",\n            l.\"Defaulted\",\n            l.\"Default Loss Amount\",\n            l.\"Daily Payment Amount\",\n            l.\"Auto Charge Enabled\",\n            l.\"Interest Schedule Anchor Date\",\n            l.\"Ref Closing Payment\",\n            l.\"Charge Generation Request\",\n            l.\"Total Interest Received\",\n            l.\"Total Principal Received\",\n            l.\"Outstanding Principal\",\n            l.\"Total Amount Received\",\n            l.\"Expected Daily Interest Amount\",\n            l.\"Borrower Total Interest\",\n            l.\"Expected Interest This Month\",\n            l.\"Effective Daily Interest Rate\",\n            l.\"Principal Recovered by Interest %\",\n            l.\"Principal Days MTD\",\n            l.\"Loan Start Day Index\",\n            l.\"Principal Start Weight\",\n            l.\"Loan End Date\",\n            l.\"Loan Duration\",\n            l.\"30D Principal Days\",\n            l.\"Loan Age Days\",\n            l.\"Loan Age Bucket\",\n            l.\"Defaulted Flag\",\n            l.\"Maximum Days Late\",\n            l.\"Last Interest Charge Date\",\n            l.\"Accrued Interest Days\",\n            l.\"Accrued Interest\",\n            l.\"Daily Installment Base Principal\",\n            l.\"Ref Disbursed From Cash Account\",\n            l.\"Payment Request Cash Account\",\n            l.\"Payment Request Token\",\n            row_number() OVER (PARTITION BY l.\"Ref Borrowers\" ORDER BY l.\"Loan Date\", l.\"Row ID\") AS loan_sequence,\n            bool_or(l.\"Loan Date\" IS NULL) OVER (PARTITION BY l.\"Ref Borrowers\") AS incomplete_dates\n           FROM olap_loans_analytics l\n        )\n SELECT \"Row ID\" AS loan_id,\n    \"Ref Borrowers\" AS borrower_id,\n    \"Loan Date\" AS loan_date,\n    \"Close Date\" AS close_date,\n    \"Due Date\" AS due_date,\n    \"Principal Amount\"::numeric AS original_principal,\n    \"Outstanding Principal\" AS outstanding_principal,\n    \"Total Principal Received\" AS principal_received,\n    \"Total Interest Received\" AS interest_received,\n    \"Loan Status\" = 'ยังไม่ปิดยอด'::text AS is_active,\n        CASE \"Loan Status\"\n            WHEN 'ยังไม่ปิดยอด'::text THEN 'Active'::text\n            WHEN 'ปิดยอดแล้ว'::text THEN 'Closed'::text\n            ELSE \"Loan Status\"\n        END AS loan_status,\n        CASE \"Loan Type\"\n            WHEN 'กำหนดวันชำระ'::text THEN 'Fixed Due Date'::text\n            WHEN 'ดอกเบี้ยรายวัน'::text THEN 'Daily Interest'::text\n            WHEN 'ผ่อนชำระรายวัน'::text THEN 'Daily Installment'::text\n            ELSE 'Unknown'::text\n        END AS loan_type,\n    \"Current Daily Interest\"::numeric AS daily_interest,\n    \"Defaulted Flag\" AS defaulted,\n    \"Default Loss Amount\"::numeric AS default_loss,\n        CASE\n            WHEN incomplete_dates THEN 'Unavailable'::text\n            WHEN loan_sequence = 1 THEN 'First loan'::text\n            ELSE 'Repeat loan'::text\n        END AS borrowing_type\n   FROM ranked;",
      "partition_key": null,
      "partition_bound": null,
      "parents": null,
      "extension": null
    },
