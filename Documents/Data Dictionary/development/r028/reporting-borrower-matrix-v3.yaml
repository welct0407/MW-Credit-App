      "options": null,
      "acl": null,
      "comment": "R028: automatic schedule gate preserves V41 payment score and contribution. V2 retained for rollback/comparison; no borrower names or override records.",
      "view_definition": " SELECT m.borrower_id,\n    m.contribution_30d,\n    m.active_borrower_count,\n    m.portfolio_contribution_30d,\n    m.contribution_share,\n    m.equal_share,\n    m.relative_contribution,\n    m.reliability_score,\n    m.confidence,\n        CASE\n            WHEN s.arrangement_gate AND (m.quadrant = ANY (ARRAY['Star'::text, 'Cash Cow'::text])) THEN\n            CASE\n                WHEN m.relative_contribution >= 1::numeric THEN 'Question Mark'::text\n                ELSE 'Dog'::text\n            END\n            ELSE m.quadrant\n        END AS quadrant,\n        CASE\n            WHEN s.arrangement_gate THEN 'Automatic modified-schedule rule: auto-charge off and interest amount or charge-date coverage below 80%; payment score unchanged'::text\n            ELSE m.classification_reason\n        END AS classification_reason,\n    m.outstanding_principal,\n    m.reporting_date,\n    m.calculated_at,\n    'borrower-matrix-v3'::text AS method_version,\n    m.quadrant AS payment_only_quadrant,\n    s.arrangement_status,\n    s.arrangement_gate,\n    s.modified_schedule_loan_count,\n    s.interest_coverage_30d,\n    s.interest_date_coverage_30d,\n    s.arrangement_gate AND (m.quadrant = ANY (ARRAY['Star'::text, 'Cash Cow'::text])) AS category_adjusted\n   FROM reporting_borrower_matrix_v2 m\n     JOIN reporting_borrower_schedule_health_v1 s USING (borrower_id);",
      "partition_key": null,
      "partition_bound": null,
