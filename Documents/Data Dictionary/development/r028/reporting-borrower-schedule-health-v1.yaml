      "comment": "R028: any active loan meeting the automatic modified-schedule rule gates upper categories; recalculated on query with no manual intervention.",
      "view_definition": " WITH a AS (\n         SELECT reporting_loan_schedule_health_v1.borrower_id,\n            count(*)::integer AS active_loan_count,\n            count(*) FILTER (WHERE reporting_loan_schedule_health_v1.modified_schedule)::integer AS modified_schedule_loan_count,\n            count(*) FILTER (WHERE reporting_loan_schedule_health_v1.comparison_status <> 'Supported'::text)::integer AS unsupported_or_invalid_loan_count,\n            count(*) FILTER (WHERE reporting_loan_schedule_health_v1.assessment_eligible)::integer AS assessed_loan_count,\n            sum(reporting_loan_schedule_health_v1.expected_interest_30d) AS expected_interest_30d,\n            sum(reporting_loan_schedule_health_v1.recorded_interest_30d) AS recorded_interest_30d,\n            sum(reporting_loan_schedule_health_v1.recorded_principal_30d) AS recorded_principal_30d,\n            sum(reporting_loan_schedule_health_v1.expected_due_dates_30d) AS expected_due_dates_30d,\n            sum(reporting_loan_schedule_health_v1.recorded_interest_dates_30d) AS recorded_interest_dates_30d\n           FROM reporting_loan_schedule_health_v1\n          GROUP BY reporting_loan_schedule_health_v1.borrower_id\n        )\n SELECT b.\"Row ID\" AS borrower_id,\n    COALESCE(a.active_loan_count, 0) AS active_loan_count,\n    COALESCE(a.modified_schedule_loan_count, 0) AS modified_schedule_loan_count,\n    COALESCE(a.unsupported_or_invalid_loan_count, 0) AS unsupported_or_invalid_loan_count,\n    COALESCE(a.assessed_loan_count, 0) AS assessed_loan_count,\n    a.expected_interest_30d,\n    a.recorded_interest_30d,\n    a.recorded_principal_30d,\n    a.recorded_interest_30d / NULLIF(a.expected_interest_30d, 0::numeric) AS interest_coverage_30d,\n    a.recorded_interest_dates_30d::numeric / NULLIF(a.expected_due_dates_30d, 0)::numeric AS interest_date_coverage_30d,\n    COALESCE(a.modified_schedule_loan_count > 0, false) AS arrangement_gate,\n        CASE\n            WHEN a.modified_schedule_loan_count > 0 THEN 'Modified payment schedule'::text\n            WHEN COALESCE(a.active_loan_count, 0) = 0 THEN 'No active loans'::text\n            WHEN a.unsupported_or_invalid_loan_count > 0 THEN 'Not assessed: source/product'::text\n            WHEN a.assessed_loan_count = 0 THEN 'Insufficient observation'::text\n            ELSE 'No schedule restriction'::text\n        END AS arrangement_status,\n    olap_reporting_date() AS reporting_date,\n    statement_timestamp() AS calculated_at,\n    'schedule-health-v1'::text AS method_version\n   FROM \"Borrowers\" b\n     LEFT JOIN a ON a.borrower_id = b.\"Row ID\";",
      "partition_key": null,
      "partition_bound": null,
      "parents": null,
      "extension": null
    },
