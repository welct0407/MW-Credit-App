  "changes":
    "Row filter condition":
      "before":
        "state": "value"
        "value": 'AND([Status] = "Posted", OR(ISNOTBLANK([Receipt Image]), ISNOTBLANK([Uploaded Receipt])))'
      "after":
        "state": "value"
        "value": |-
          AND(
            [Status] = "Posted",
            OR(ISNOTBLANK([Receipt Image]), ISNOTBLANK([Uploaded Receipt])),
            COUNT(
              INTERSECT(
                SELECT([Related Payment Allocations][Ref Charge], [Allocated Amount] > 0),
                [Ref Borrower].[Todays Collection Charges]
              )
            ) > 0
          )
  "preserved": "Payments source, columns, read-only mode, Borrowers REF_ROWS and gallery configuration"
