    \ view definition."
  "source_representation": "AppSheet current editor fields and reviewed saved checkpoints"
  "properties":
    "column:Amount":
      "ValidIf": "AND([_THIS] > 0, OR(AND(IN([Row ID], Settlements[Row ID]), LOOKUP([Row ID], \"Settlements\", \"Row ID\"\
        , \"Status\") <> \"Cancelled\", [_THIS] = LOOKUP([Row ID], \"Settlements\", \"Row ID\", \"Amount\"), [Ref Partner]\
        \ = LOOKUP([Row ID], \"Settlements\", \"Row ID\", \"Ref Partner\")), [_THIS] <= [Ref Partner].[Net Profit Earned]\
        \ - SUM(SELECT(Settlements[Amount], AND([Ref Partner] = [_THISROW].[Ref Partner], [Row ID] <> [_THISROW].[Row ID],\
        \ [Status] <> \"Cancelled\")))))"
      "Invalid value error": "\"ยอดจ่ายต้องมากกว่า 0 และไม่เกินกำไรที่ยังจ่ายได้ กรุณาซิงค์เพื่อตรวจยอดล่าสุด / The settlement\
        \ must be positive and within the available profit. Sync to check the latest amount.\""
    "column:Ref Paid From Cash Account":
      "ValidIf": "SELECT(Cash Accounts[Row ID], AND([Ref Cash Holder] = \"ch:lisa\", OR([Active], AND(IN([_THISROW].[Row ID],\
        \ Settlements[Row ID]), [Row ID] = LOOKUP([_THISROW].[Row ID], \"Settlements\", \"Row ID\", \"Ref Paid From Cash Account\"\
        ), OR([_THISROW].[Status] <> \"Completed\", LOOKUP([_THISROW].[Row ID], \"Settlements\", \"Row ID\", \"Status\") =\
        \ \"Completed\")))))"
      "RequiredIf": "AND([Status] = \"Completed\", OR(NOT(IN([Row ID], Settlements[Row ID])), LOOKUP([Row ID], \"Settlements\"\
        , \"Row ID\", \"Status\") <> \"Completed\", [_THIS] <> LOOKUP([Row ID], \"Settlements\", \"Row ID\", \"Ref Paid From\
        \ Cash Account\")))"
      "EditableIf": "OR(NOT(IN([Row ID], Settlements[Row ID])), IN([Status], LIST(\"Pending\", \"Completed\")))"
      "Initial value": "ANY(SELECT(Cash Accounts[Row ID], AND([Active], [Default Account], [Ref Cash Holder] = \"ch:lisa\"\
        )))"
      "Invalid value error": "\"เลือกบัญชี Lisa ที่เปิดใช้งานก่อนยืนยันโอน / Select an active Lisa account before completing\
        \ the transfer.\""
    "column:Settlement Guidance":
      "Type": "Show"
      "Category": "Text"
      "App formula": "\"\""
      "Show": true
      "Content": "CONCATENATE(\"กำไรที่ยังจ่ายได้ (ซิงค์ล่าสุด) / Available profit (last sync): \", [Ref Partner].[Net Profit\
        \ Earned] - SUM(SELECT(Settlements[Amount], AND([Ref Partner] = [_THISROW].[Ref Partner], [Row ID] <> [_THISROW].[Row\
        \ ID], [Status] <> \"Cancelled\"))), \". ยอดจ่ายใหม่หรือยอดที่แก้ไขต้องเป็นบวกและไม่เกินกำไรที่ยังจ่ายได้ / New or\
        \ changed amounts must be positive and within available profit. การยืนยันโอนต้องใช้บัญชี Lisa ที่เปิดใช้งาน กรุณาแก้ไข\
        \ บันทึก และซิงค์ก่อน / Entering Completed requires an active Lisa account. Edit, save and sync first. ใช้ Reverse/Cancel\
        \ เพื่อเปลี่ยนสถานะ / Use Reverse/Cancel for status transitions.\")"
