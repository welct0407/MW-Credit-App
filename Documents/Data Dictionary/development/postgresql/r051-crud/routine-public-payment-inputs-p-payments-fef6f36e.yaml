  "catalog_observation":
    "name": "public.payment_inputs(p \"Payments\")"
    "definition": |
      CREATE OR REPLACE FUNCTION public.payment_inputs(p "Payments")
       RETURNS jsonb
       LANGUAGE sql
       IMMUTABLE
       SET search_path TO 'pg_catalog'
      AS $function$
       SELECT jsonb_build_array(p."Ref Borrower",p."Amount Received",p."Payment Date",p."Allocation Method",
       p."Ref Target Charge",p."Ref Target Loan",p."Selected Charge IDs")
      $function$
