    "constraints":
      "Cash Ledger_Amount_check": "CHECK (\"Amount\" > 0::numeric AND \"Amount\" < 'Infinity'::numeric AND \"Amount\" = trunc(\"\
        Amount\"))"
      "Cash Ledger_Amount_not_null": "NOT NULL \"Amount\""
      "Cash Ledger_Created At_not_null": "NOT NULL \"Created At\""
      "Cash Ledger_Created By_not_null": "NOT NULL \"Created By\""
      "Cash Ledger_Entry Origin_check": "CHECK (\"Entry Origin\" = ANY (ARRAY['System'::text, 'Manual'::text]))"
      "Cash Ledger_Entry Origin_not_null": "NOT NULL \"Entry Origin\""
      "Cash Ledger_Movement Date_not_null": "NOT NULL \"Movement Date\""
      "Cash Ledger_Movement Type_not_null": "NOT NULL \"Movement Type\""
      "Cash Ledger_Ref Business Expense_fkey": "FOREIGN KEY (\"Ref Business Expense\") REFERENCES \"Business Expenses\"(\"\
        Row ID\") ON DELETE SET NULL"
      "Cash Ledger_Ref From Cash Account_fkey": "FOREIGN KEY (\"Ref From Cash Account\") REFERENCES \"Cash Accounts\"(\"Row\
        \ ID\") ON DELETE RESTRICT"
      "Cash Ledger_Ref From Cash Holder_fkey": "FOREIGN KEY (\"Ref From Cash Holder\") REFERENCES \"Cash Holders\"(\"Row ID\"\
        ) ON DELETE RESTRICT"
      "Cash Ledger_Ref Loan_fkey": "FOREIGN KEY (\"Ref Loan\") REFERENCES \"Loans\"(\"Row ID\") ON DELETE RESTRICT"
      "Cash Ledger_Ref Payment_fkey": "FOREIGN KEY (\"Ref Payment\") REFERENCES \"Payments\"(\"Row ID\") ON DELETE RESTRICT"
      "Cash Ledger_Ref Settlement_fkey": "FOREIGN KEY (\"Ref Settlement\") REFERENCES \"Settlements\"(\"Row ID\") ON DELETE\
        \ RESTRICT"
      "Cash Ledger_Ref To Cash Account_fkey": "FOREIGN KEY (\"Ref To Cash Account\") REFERENCES \"Cash Accounts\"(\"Row ID\"\
        ) ON DELETE RESTRICT"
      "Cash Ledger_Ref To Cash Holder_fkey": "FOREIGN KEY (\"Ref To Cash Holder\") REFERENCES \"Cash Holders\"(\"Row ID\"\
        ) ON DELETE RESTRICT"
      "Cash Ledger_Row ID_not_null": "NOT NULL \"Row ID\""
      "Cash Ledger_Source Key_not_null": "NOT NULL \"Source Key\""
      "Cash Ledger_Source Type_not_null": "NOT NULL \"Source Type\""
      "Cash Ledger_Updated At_not_null": "NOT NULL \"Updated At\""
      "Cash Ledger_pkey": "PRIMARY KEY (\"Row ID\")"
      "cash_ledger_direction": "CHECK (COALESCE(\"Ref From Cash Holder\", \"Ref To Cash Holder\") IS NOT NULL AND (\"Ref From\
        \ Cash Holder\" IS DISTINCT FROM \"Ref To Cash Holder\" OR \"Ref From Cash Account\" IS NOT NULL AND \"Ref To Cash\
        \ Account\" IS NOT NULL AND \"Ref From Cash Account\" <> \"Ref To Cash Account\"))"
      "cash_ledger_source": "CHECK (\"Entry Origin\" = 'Manual'::text AND \"Source Type\" = 'Manual'::text AND \"Source Key\"\
        \ = ('MANUAL:'::text || \"Row ID\") AND \"Ref Payment\" IS NULL AND \"Ref Loan\" IS NULL AND \"Ref Settlement\" IS\
        \ NULL AND (\"Movement Type\" = ANY (ARRAY['Cash Handover'::text, 'Expense Reimbursement'::text, 'Opening Balance'::text,\
        \ 'Manual Correction'::text])) OR \"Entry Origin\" = 'System'::text AND (\"Source Type\" = 'Payment'::text AND \"\
        Movement Type\" = 'Payment Receipt'::text AND \"Source Key\" = ('PAYMENT:'::text || \"Ref Payment\") AND \"Ref Payment\"\
        \ IS NOT NULL AND num_nonnulls(\"Ref Payment\", \"Ref Loan\", \"Ref Business Expense\", \"Ref Settlement\") = 1 OR\
        \ \"Source Type\" = 'Loan'::text AND \"Movement Type\" = 'Loan Disbursement'::text AND \"Source Key\" = ('LOAN:'::text\
        \ || \"Ref Loan\") AND \"Ref Loan\" IS NOT NULL AND num_nonnulls(\"Ref Payment\", \"Ref Loan\", \"Ref Business Expense\"\
        , \"Ref Settlement\") = 1 OR \"Source Type\" = 'Business Expense'::text AND \"Movement Type\" = 'Business Expense'::text\
        \ AND \"Source Key\" = ('EXPENSE:'::text || \"Ref Business Expense\") AND \"Ref Business Expense\" IS NOT NULL AND\
        \ num_nonnulls(\"Ref Payment\", \"Ref Loan\", \"Ref Business Expense\", \"Ref Settlement\") = 1 OR \"Source Type\"\
        \ = 'Settlement'::text AND \"Movement Type\" = 'Partner Settlement'::text AND \"Source Key\" = ('SETTLEMENT:'::text\
        \ || \"Ref Settlement\") AND \"Ref Settlement\" IS NOT NULL AND num_nonnulls(\"Ref Payment\", \"Ref Loan\", \"Ref\
        \ Business Expense\", \"Ref Settlement\") = 1))"
      "zzzzzz_business_history_commit": "TRIGGER DEFERRABLE INITIALLY DEFERRED"
    "triggers":
      "a000_business_history_begin": "CREATE TRIGGER a000_business_history_begin BEFORE INSERT OR DELETE OR UPDATE ON \"Cash\
