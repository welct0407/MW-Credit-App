      "guard_cash_ledger": "CREATE TRIGGER guard_cash_ledger BEFORE INSERT OR DELETE OR UPDATE ON \"Cash Ledger\" FOR EACH\
        \ ROW EXECUTE FUNCTION guard_cash_ledger()"
      "mw_agent_capture": "CREATE TRIGGER mw_agent_capture AFTER INSERT OR DELETE OR UPDATE ON \"Cash Ledger\" FOR EACH ROW\
        \ EXECUTE FUNCTION agent_audit.capture_change()"
      "zzzz_business_history": "CREATE TRIGGER zzzz_business_history AFTER INSERT OR DELETE OR UPDATE ON \"Cash Ledger\" FOR\
