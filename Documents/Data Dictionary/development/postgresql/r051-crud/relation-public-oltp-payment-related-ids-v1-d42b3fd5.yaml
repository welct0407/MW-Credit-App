  "catalog_observation":
    "name": "public.oltp_payment_related_ids_v1"
    "kind": "ordinary view"
    "security_invoker": true
    "definition": |2-
       SELECT p."Row ID",
          COALESCE(r.ids, ''::text) AS "Repayment IDs",
          COALESCE(a.ids, ''::text) AS "Allocation IDs",
          COALESCE(l.ids, ''::text) AS "Closing Loan IDs",
          COALESCE(a.visible_ids, ''::text) AS "Visible Allocation IDs"
         FROM "Payments" p
           LEFT JOIN ( SELECT r_1."Ref Payment",
                  string_agg(r_1."Row ID", ' , '::text ORDER BY r_1."Payment Date" DESC, a_1."Allocation Order", r_1."Row ID") AS ids
                 FROM "Repayments" r_1
                   LEFT JOIN "Payment Allocations" a_1 ON a_1."Row ID" = r_1."Ref Payment Allocation"
                GROUP BY r_1."Ref Payment") r ON r."Ref Payment" = p."Row ID"
           LEFT JOIN ( SELECT "Payment Allocations"."Ref Payment",
                  string_agg("Payment Allocations"."Row ID", ' , '::text ORDER BY "Payment Allocations"."Allocation Order", "Payment Allocations"."Row ID") AS ids,
                  string_agg("Payment Allocations"."Row ID", ' , '::text ORDER BY "Payment Allocations"."Allocation Order", "Payment Allocations"."Row ID") FILTER (WHERE "Payment Allocations"."Allocated Amount" > 0::money) AS visible_ids
                 FROM "Payment Allocations"
                GROUP BY "Payment Allocations"."Ref Payment") a ON a."Ref Payment" = p."Row ID"
           LEFT JOIN ( SELECT "Loans"."Ref Closing Payment",
                  string_agg("Loans"."Row ID", ' , '::text ORDER BY "Loans"."Row ID") AS ids
                 FROM "Loans"
                GROUP BY "Loans"."Ref Closing Payment") l ON l."Ref Closing Payment" = p."Row ID";
    "columns":
    - - "Row ID"
      - "text"
    - - "Repayment IDs"
      - "text"
    - - "Allocation IDs"
