      "Business Expenses_Ref Related Borrower_fkey": "FOREIGN KEY (\"Ref Related Borrower\") REFERENCES \"Borrowers\"(\"Row\
        \ ID\")"
      "Business Expenses_Ref Related Loan_fkey": "FOREIGN KEY (\"Ref Related Loan\") REFERENCES \"Loans\"(\"Row ID\")"
      "Business Expenses_Row ID_not_null": "NOT NULL \"Row ID\""
      "Business Expenses_Source Type_check": "CHECK (\"Source Type\" = ANY (ARRAY['Manual'::text, 'Referral Rebate'::text]))"
      "Business Expenses_Source Type_not_null": "NOT NULL \"Source Type\""
      "Business Expenses_check": "CHECK ((\"Partner A Expense\" + \"Partner B Expense\") = \"Amount\")"
      "Business Expenses_check1": "CHECK ((\"Partner A Share\" + \"Partner B Share\") = 1::numeric)"
      "Business Expenses_check2": "CHECK (\"Source Type\" <> 'Referral Rebate'::text OR \"Amount\"::numeric > 0::numeric AND\
        \ \"Ref Related Loan\" IS NOT NULL AND \"Ref Related Borrower\" IS NOT NULL AND \"Ref Payee Borrower\" IS NOT NULL\
        \ AND \"Source Key\" = ('REFERRAL_REBATE:'::text || \"Ref Related Loan\") AND \"Rule Version\" = 'REFERRAL_REBATE_V1'::text)"
      "Business Expenses_pkey": "PRIMARY KEY (\"Row ID\")"
      "zzzzzz_business_history_commit": "TRIGGER DEFERRABLE INITIALLY DEFERRED"
