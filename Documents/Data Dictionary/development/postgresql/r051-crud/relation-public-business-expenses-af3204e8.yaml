      "Business Expenses_Created At_not_null": "NOT NULL \"Created At\""
      "Business Expenses_Created By_not_null": "NOT NULL \"Created By\""
      "Business Expenses_Expense Category_check": "CHECK (btrim(\"Expense Category\") <> ''::text)"
