      CREATE OR REPLACE FUNCTION public.payment_delete_requested()
       RETURNS trigger
       LANGUAGE plpgsql
       SET search_path TO 'pg_catalog', 'public'
      AS $function$
      BEGIN
       DELETE FROM public."Payments" WHERE "Row ID"=NEW."Row ID";
       RETURN NULL;
      END $function$
