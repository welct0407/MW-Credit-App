    "definition": "CREATE OR REPLACE FUNCTION public.guard_pwa_explicit_payment_v6()\n RETURNS trigger\n LANGUAGE plpgsql\n\
      \ SET search_path TO 'pg_catalog', 'public'\nAS $function$\r\nDECLARE envelope jsonb;c jsonb;ids text[];\r\nBEGIN\r\n\
      \ SELECT canonical_json::jsonb INTO envelope FROM public.pwa_payment_commands WHERE payment_id=NEW.\"Row ID\" AND outcome='posted'\
      \ AND canonical_json::jsonb->'command'->'schemaVersion'='6'::jsonb;\r\n IF envelope IS NULL THEN RETURN NEW;END IF;\r\
      \n c:=envelope->'command';SELECT array_agg(value->>'chargeId' ORDER BY (value->>'chargeId') COLLATE \"C\") INTO ids\
      \ FROM jsonb_array_elements(c->'allocations');\r\n IF TG_OP='INSERT' AND current_user<>'mw_app_dev_journal_owner' THEN\
      \ RAISE EXCEPTION USING ERRCODE='42501',MESSAGE='Explicit command receipt must originate in governed submit';END IF;\r\
      \n IF NEW.\"Ref Borrower\" IS DISTINCT FROM c->>'borrowerId' OR NEW.\"Amount Received\"::numeric IS DISTINCT FROM (c->>'amountReceived')::numeric\
      \ OR NEW.\"Allocation Method\" IS DISTINCT FROM 'Selected Charges' OR public.selected_charge_ids(NEW.\"Selected Charge\
      \ IDs\") IS DISTINCT FROM ids OR NEW.\"Ref Target Charge\" IS NOT NULL OR NEW.\"Ref Target Loan\" IS NOT NULL OR NEW.\"\
      Created By\" IS DISTINCT FROM envelope->'actor'->>'loginEmail' THEN RAISE EXCEPTION 'Immutable explicit allocation scope';END\
      \ IF;\r\n IF TG_OP='INSERT' AND (NEW.\"Status\" IS DISTINCT FROM 'Processing' OR NEW.\"Payment Date\" IS DISTINCT FROM\
      \ (c->>'paymentDate')::date OR NEW.\"Payment Method\" IS DISTINCT FROM c->>'paymentMethod' OR NEW.\"Ref Received By\
      \ Cash Account\" IS DISTINCT FROM c->>'cashAccountId') THEN RAISE EXCEPTION 'Explicit command input mismatch';END IF;\r\
      \n RETURN NEW;\r\nEND $function$\n"
