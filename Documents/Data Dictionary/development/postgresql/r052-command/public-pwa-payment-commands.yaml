        \ 'selection_unavailable'::text]))))) OR ((contract_version = 2) AND (payment_id IS NULL) AND (((outcome = 'applied'::text)\
        \ AND (rejection_code IS NULL) AND (jsonb_typeof(result_json) = 'object'::text) AND (octet_length((result_json)::text)\
        \ <= 524288) AND (result_json ?& ARRAY['operation'::text, 'targetType'::text, 'targetId'::text, 'paymentId'::text,\
        \ 'plan'::text, 'predecessorRequestId'::text]) AND ((result_json - ARRAY['operation'::text, 'targetType'::text, 'targetId'::text,\
        \ 'paymentId'::text, 'plan'::text, 'predecessorRequestId'::text, 'sourceCreatedBy'::text]) = '{}'::jsonb) AND ((NOT\
        \ (result_json ? 'sourceCreatedBy'::text)) OR (jsonb_typeof((result_json -> 'sourceCreatedBy'::text)) = ANY (ARRAY['string'::text,\
        \ 'null'::text]))) AND ((result_json ->> 'operation'::text) = ((canonical_json)::jsonb #>> '{command,operation}'::text[]))\
        \ AND ((result_json ->> 'targetType'::text) = ((canonical_json)::jsonb #>> '{command,targetType}'::text[])) AND ((result_json\
        \ ->> 'targetId'::text) = ((canonical_json)::jsonb #>> '{command,targetId}'::text[]))) OR ((outcome = 'rejected'::text)\
        \ AND (result_json IS NULL) AND (rejection_code = ANY (ARRAY['source_conflict'::text, 'not_found'::text, 'invalid_reference'::text,\
        \ 'borrower_name_exists'::text, 'dependency_conflict'::text, 'insufficient_funds'::text, 'plan_changed'::text, 'invalid_date'::text,\
