    "definition": "CREATE OR REPLACE FUNCTION public.pwa_apply_charge_v2(canonical text)\n RETURNS jsonb\n LANGUAGE plpgsql\n\
      \ SET search_path TO 'pg_catalog', 'public'\nAS $function$\r\nDECLARE e jsonb:=canonical::jsonb;i jsonb:=e#>'{command,inputs}';a\
      \ jsonb:=e->'actor';target text:=e#>>'{command,targetId}';op text:=e#>>'{command,operation}';old_loan text;new_loan\
      \ text;l public.\"Loans\"%ROWTYPE;payment text;plan jsonb;result_value jsonb;p numeric;interest numeric;message text;\r\
      \nBEGIN\r\n IF (current_database() NOT IN ('loan_manager_dev','payment_rehearsal','loan_manager_prod') OR current_user<>CASE\
      \ current_database() WHEN 'loan_manager_prod' THEN 'mw_app_prod_journal_owner' ELSE 'mw_app_dev_journal_owner' END)\
      \ OR op NOT IN('charge.create','charge.update','charge.delete') THEN RAISE EXCEPTION USING ERRCODE='42501',MESSAGE='Governed\
      \ operation required';END IF;\r\n SELECT \"Ref Loans\" INTO old_loan FROM public.\"Charges\" WHERE \"Row ID\"=target;new_loan:=CASE\
      \ WHEN op='charge.delete' THEN old_loan ELSE i->>'loanId' END;\r\n IF op<>'charge.create' AND old_loan IS NULL THEN\
      \ RAISE EXCEPTION USING ERRCODE='P5B02';END IF;\r\n PERFORM 1 FROM public.\"Borrowers\" WHERE \"Row ID\" IN(SELECT \"\
      Ref Borrowers\" FROM public.\"Loans\" WHERE \"Row ID\" IN(old_loan,new_loan)) ORDER BY \"Row ID\" COLLATE \"C\" FOR\
      \ UPDATE;\r\n PERFORM 1 FROM public.\"Loans\" WHERE \"Row ID\" IN(old_loan,new_loan) ORDER BY \"Row ID\" COLLATE \"\
      C\" FOR UPDATE;\r\n SELECT * INTO l FROM public.\"Loans\" WHERE \"Row ID\"=new_loan;IF NOT FOUND THEN RAISE EXCEPTION\
      \ USING ERRCODE='P5B04';END IF;\r\n PERFORM pg_advisory_xact_lock(hashtextextended('charge:'||target,0));\r\n PERFORM\
      \ 1 FROM public.\"Charges\" WHERE \"Row ID\"=target FOR UPDATE;\r\n IF op='charge.create' AND FOUND THEN RAISE EXCEPTION\
      \ USING ERRCODE='P5B01';END IF;\r\n IF op<>'charge.create' AND public.pwa_charge_version_v2(target) IS DISTINCT FROM\
      \ e#>>'{command,expectedVersion}' THEN RAISE EXCEPTION USING ERRCODE='P5B01';END IF;\r\n IF op<>'charge.delete' THEN\r\
      \n  p:=(i->>'principalDue')::numeric;interest:=(i->>'interestDue')::numeric;\r\n  IF p<0 OR (p=0 AND interest=0 AND\
      \ NOT(op='charge.update' AND EXISTS(SELECT 1 FROM public.\"Payment Allocations\" pa JOIN public.\"Payments\" pay ON\
      \ pay.\"Row ID\"=pa.\"Ref Payment\" WHERE pa.\"Ref Charge\"=target AND pay.\"Status\"='Posted') AND NOT EXISTS(SELECT\
      \ 1 FROM public.\"Payment Allocations\" WHERE \"Ref Charge\"=target AND \"Allocated Amount\"::numeric<>0) AND NOT EXISTS(SELECT\
      \ 1 FROM public.\"Repayments\" WHERE \"Ref Charges\"=target AND \"Principal Paid\"::numeric+\"Interest Paid\"::numeric<>0)))\
      \ THEN RAISE EXCEPTION USING ERRCODE='P5B06';END IF;\r\n END IF;\r\n IF op='charge.create' AND coalesce(l.\"Auto Charge\
      \ Enabled\",false) AND l.\"Loan Type\" IN('ดอกเบี้ยรายวัน','ผ่อนชำระรายวัน') AND (i->>'chargeDate')::date=l.\"Loan Date\"\
      \ AND p+interest>0 AND NOT EXISTS(SELECT 1 FROM public.\"Repayments\" WHERE \"Ref Charges\"=target) AND NOT EXISTS(SELECT\
      \ 1 FROM public.\"Payments\" WHERE \"Ref Target Charge\"=target AND \"Allocation Method\"='First-day Auto') THEN\r\n\
      \  IF p<>trunc(p) OR interest<>trunc(interest) OR interest<0 THEN RAISE EXCEPTION USING ERRCODE='P5B06';END IF;\r\n\
      \  payment:='fd6:'||target;\r\n  plan:=jsonb_build_object('borrowerId',l.\"Ref Borrowers\",'amountReceived',trim_scale(p+interest)::text,'allocations',jsonb_build_array(jsonb_build_object('chargeId',target,'principal',trim_scale(p)::text,'interest',trim_scale(interest)::text,'expectedPrincipalRemaining',trim_scale(p)::text,'expectedInterestRemaining',trim_scale(interest)::text,'chargeDate',i->>'chargeDate')),'allocationMethod','First-day\
      \ Auto','targetChargeId',target,'targetLoanId',NULL,'cashAccountId',coalesce(l.\"Ref Disbursed From Cash Account\",public.default_cash_account('ch:lisa')),'paymentDate',l.\"\
      Loan Date\"::text,'paymentMethod','Net-off at Disbursement');\r\n END IF;\r\n result_value:=jsonb_build_object('operation',op,'targetType','charge','targetId',target,'paymentId',payment,'plan',plan,'predecessorRequestId',NULL,'sourceCreatedBy',CASE\
      \ WHEN payment IS NOT NULL THEN l.\"Created By\" ELSE NULL END);\r\n IF payment IS NOT NULL THEN INSERT INTO public.pwa_payment_commands(request_id,contract_version,actor_issuer,actor_subject,actor_partner_id,actor_login_email,canonical_json,payload_sha256,outcome,payment_id,rejection_code,result_json)\
      \ VALUES((e->>'requestId')::uuid,2,a->>'issuer',a->>'subject',a->>'partnerId',a->>'loginEmail',canonical,encode(sha256(convert_to(canonical,'UTF8')),'hex'),'applied',NULL,NULL,result_value);END\
      \ IF;\r\n BEGIN\r\n CASE op WHEN 'charge.create' THEN INSERT INTO public.\"Charges\"(\"Row ID\",\"Ref Loans\",\"Charge\
      \ Date\",\"Principal Due\",\"Interest Due\",\"Notes\") VALUES(target,new_loan,(i->>'chargeDate')::date,p::money,interest::money,i->>'notes');\r\
      \n WHEN 'charge.update' THEN UPDATE public.\"Charges\" SET \"Ref Loans\"=new_loan,\"Charge Date\"=(i->>'chargeDate')::date,\"\
      Principal Due\"=p::money,\"Interest Due\"=interest::money,\"Notes\"=i->>'notes' WHERE \"Row ID\"=target;\r\n WHEN 'charge.delete'\
      \ THEN DELETE FROM public.\"Charges\" WHERE \"Row ID\"=target;END CASE;\r\n EXCEPTION WHEN foreign_key_violation THEN\
      \ RAISE EXCEPTION USING ERRCODE='P5B05';\r\n WHEN SQLSTATE 'P0001' THEN GET STACKED DIAGNOSTICS message=MESSAGE_TEXT;\r\
      \n IF message IN('Charge has receipts; reassign or delete those receipts first','Charge has receipts on its original\
      \ loan; reassign them first') THEN RAISE EXCEPTION USING ERRCODE='P5B05';\r\n ELSIF message='Charge amount cannot be\
      \ less than its posted component payments' THEN RAISE EXCEPTION USING ERRCODE='P5B06';ELSE RAISE;END IF;\r\n END;\r\n\
      \ IF payment IS NOT NULL AND NOT EXISTS(SELECT 1 FROM public.\"Payments\" WHERE \"Row ID\"=payment AND \"Status\"='Posted'\
      \ AND \"Amount Received\"::numeric=p+interest AND \"Created By\" IS NOT DISTINCT FROM l.\"Created By\") THEN RAISE EXCEPTION\
      \ 'First-day charge receipt differs from immutable plan';END IF;\r\n RETURN result_value;\r\nEND $function$\n"
