    "definition": "CREATE OR REPLACE FUNCTION public.pwa_apply_management_v2(payload text)\n RETURNS jsonb\n LANGUAGE plpgsql\n\
      \ SET search_path TO 'pg_catalog', 'public'\nAS $function$\r\nDECLARE e jsonb:=payload::jsonb;c jsonb:=e->'command';i\
      \ jsonb:=c->'inputs';op text:=c->>'operation';kind text:=split_part(op,'.',1);target text:=c->>'targetId';snapshot jsonb;version\
      \ text;constraint_name text;\r\nBEGIN\r\n IF (current_database() NOT IN ('loan_manager_dev','payment_rehearsal','loan_manager_prod')\
      \ OR current_user<>CASE current_database() WHEN 'loan_manager_prod' THEN 'mw_app_prod_journal_owner' ELSE 'mw_app_dev_journal_owner'\
      \ END) THEN RAISE EXCEPTION USING ERRCODE='42501';END IF;\r\n PERFORM public.pwa_management_input_text_v2(op,i);\r\n\
      \ PERFORM pg_advisory_xact_lock(hashtextextended('management:'||kind||':'||target,0));\r\n IF kind='cash-holder' THEN\
      \ SELECT to_jsonb(t) INTO snapshot FROM public.\"Cash Holders\" t WHERE t.\"Row ID\"=target FOR UPDATE;\r\n ELSIF kind='cash-account'\
      \ THEN SELECT to_jsonb(t) INTO snapshot FROM public.\"Cash Accounts\" t WHERE t.\"Row ID\"=target FOR UPDATE;\r\n ELSIF\
      \ kind='partner' THEN SELECT to_jsonb(t) INTO snapshot FROM public.\"Partners\" t WHERE t.\"Row ID\"=target FOR UPDATE;\r\
      \n ELSE RAISE EXCEPTION USING ERRCODE='22023';END IF;\r\n version:=encode(sha256(convert_to(snapshot::text,'UTF8')),'hex');\r\
      \n IF split_part(op,'.',2)='create' THEN IF snapshot IS NOT NULL THEN RAISE EXCEPTION USING ERRCODE='P5B01';END IF;\r\
      \n ELSE IF snapshot IS NULL THEN RAISE EXCEPTION USING ERRCODE='P5B02';END IF;IF version IS DISTINCT FROM c->>'expectedVersion'\
      \ THEN RAISE EXCEPTION USING ERRCODE='P5B01';END IF;END IF;\r\n IF kind='partner' AND split_part(op,'.',2)<>'delete'\
      \ THEN\r\n IF split_part(op,'.',2)='create' THEN\r\n IF coalesce((i->>'igIntegrationEnabled')::boolean,false) OR (i->>'aiReviewer')::boolean\
      \ THEN RAISE EXCEPTION USING ERRCODE='42501',MESSAGE='Integration permissions are read-only';END IF;\r\n ELSE IF (i->'igIntegrationEnabled',i->'aiReviewer')\
      \ IS DISTINCT FROM (snapshot->'IG Integration Enabled',snapshot->'AI Reviewer') THEN RAISE EXCEPTION USING ERRCODE='42501',MESSAGE='Integration\
      \ permissions are read-only';END IF;END IF;\r\n END IF;\r\n BEGIN\r\n IF op='cash-holder.create' THEN INSERT INTO public.\"\
      Cash Holders\"(\"Row ID\",\"Holder Name\",\"Active\",\"Sort Order\") VALUES(target,i->>'holderName',(i->>'active')::boolean,(i->>'sortOrder')::integer);\r\
      \n ELSIF op='cash-holder.update' THEN UPDATE public.\"Cash Holders\" SET \"Holder Name\"=i->>'holderName',\"Active\"\
      =(i->>'active')::boolean,\"Sort Order\"=(i->>'sortOrder')::integer WHERE \"Row ID\"=target;\r\n ELSIF op='cash-holder.delete'\
      \ THEN DELETE FROM public.\"Cash Holders\" WHERE \"Row ID\"=target;\r\n ELSIF op='cash-account.create' THEN INSERT INTO\
      \ public.\"Cash Accounts\"(\"Row ID\",\"Ref Cash Holder\",\"Account Label\",\"Bank Name\",\"Account Number\",\"Alternative\
      \ Account Number\",\"Default Account\",\"Active\",\"Sort Order\") VALUES(target,i->>'cashHolderId',i->>'accountLabel',i->>'bankName',i->>'accountNumber',i->>'alternativeAccountNumber',(i->>'defaultAccount')::boolean,(i->>'active')::boolean,(i->>'sortOrder')::integer);\r\
      \n ELSIF op='cash-account.update' THEN UPDATE public.\"Cash Accounts\" SET \"Account Label\"=i->>'accountLabel',\"Bank\
      \ Name\"=i->>'bankName',\"Account Number\"=i->>'accountNumber',\"Alternative Account Number\"=i->>'alternativeAccountNumber',\"\
      Default Account\"=(i->>'defaultAccount')::boolean,\"Active\"=(i->>'active')::boolean,\"Sort Order\"=(i->>'sortOrder')::integer\
      \ WHERE \"Row ID\"=target;\r\n ELSIF op='cash-account.delete' THEN DELETE FROM public.\"Cash Accounts\" WHERE \"Row\
      \ ID\"=target;\r\n ELSIF op='partner.create' THEN INSERT INTO public.\"Partners\"(\"Row ID\",\"Partner Name\",\"Partner\
      \ Role\",\"Login Email\",\"Email\",\"Instagram Username\",\"Language Preference\",\"IG Integration Enabled\",\"AI Reviewer\"\
      ) VALUES(target,i->>'partnerName',i->>'partnerRole',i->>'loginEmail',i->>'email',i->>'instagramUsername',i->>'languagePreference',(i->>'igIntegrationEnabled')::boolean,(i->>'aiReviewer')::boolean);\r\
      \n ELSIF op='partner.update' THEN UPDATE public.\"Partners\" SET \"Partner Name\"=i->>'partnerName',\"Partner Role\"\
      =i->>'partnerRole',\"Login Email\"=i->>'loginEmail',\"Email\"=i->>'email',\"Instagram Username\"=i->>'instagramUsername',\"\
      Language Preference\"=i->>'languagePreference',\"IG Integration Enabled\"=(i->>'igIntegrationEnabled')::boolean,\"AI\
      \ Reviewer\"=(i->>'aiReviewer')::boolean WHERE \"Row ID\"=target;\r\n ELSIF op='partner.delete' THEN DELETE FROM public.\"\
      Partners\" WHERE \"Row ID\"=target;\r\n END IF;\r\n EXCEPTION WHEN foreign_key_violation THEN RAISE EXCEPTION USING\
      \ ERRCODE='P5B05';\r\n WHEN SQLSTATE '23001' THEN GET STACKED DIAGNOSTICS constraint_name=CONSTRAINT_NAME;IF (op='cash-holder.delete'\
      \ AND constraint_name='Cash Accounts_Ref Cash Holder_fkey') OR (op='cash-account.delete' AND constraint_name IN('Borrowers_Ref\
      \ Preferred Receiving Cash Account_fkey','Borrowers_Payment Request Cash Account_fkey','Charges_Payment Request Cash\
      \ Account_fkey','Loans_Ref Disbursed From Cash Account_fkey','Loans_Payment Request Cash Account_fkey','Payments_Ref\
      \ Received By Cash Account_fkey','Business Expenses_Ref Paid By Cash Account_fkey','Settlements_Ref Paid From Cash Account_fkey','Cash\
      \ Ledger_Ref From Cash Account_fkey','Cash Ledger_Ref To Cash Account_fkey','r008_cash_account_cutover_Ref Cash Account_fkey'))\
      \ THEN RAISE EXCEPTION USING ERRCODE='P5B05';ELSE RAISE;END IF;\r\n WHEN unique_violation THEN GET STACKED DIAGNOSTICS\
      \ constraint_name=CONSTRAINT_NAME;\r\n IF constraint_name IN('partners_login_email_unique','Cash Holders_Holder Name_key','Cash\
      \ Accounts_Ref Cash Holder_Account Label_key','cash_account_one_default') THEN RAISE EXCEPTION USING ERRCODE='P5B05';ELSE\
      \ RAISE;END IF;\r\n WHEN raise_exception THEN\r\n IF SQLERRM IN('Choose a replacement default account before deletion','An\
      \ inactive cash account cannot be default','Select a replacement default before deactivating this account') THEN RAISE\
      \ EXCEPTION USING ERRCODE='P5B05';ELSE RAISE;END IF;\r\n END;\r\n RETURN jsonb_build_object('operation',op,'targetType',kind,'targetId',target,'paymentId',NULL,'plan',NULL,'predecessorRequestId',NULL,'sourceCreatedBy',NULL);\r\
      \nEND $function$\n"
