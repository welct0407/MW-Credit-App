    "definition": "CREATE OR REPLACE FUNCTION public.post_payment(p_id text)\n RETURNS void\n LANGUAGE plpgsql\n SET search_path\
      \ TO 'pg_catalog', 'public'\nAS $function$\r\nBEGIN\r\n IF EXISTS(SELECT 1 FROM public.pwa_payment_commands WHERE payment_id=p_id\
      \ AND outcome='posted' AND canonical_json::jsonb->'command'->'schemaVersion'='6'::jsonb) THEN\r\n  PERFORM public.post_payment_explicit_v6(p_id);\r\
      \n ELSE PERFORM public.post_payment_legacy_v59(p_id);END IF;\r\nEND $function$\n"
