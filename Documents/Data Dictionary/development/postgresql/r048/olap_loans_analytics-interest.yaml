      \                  x.\"Outstanding Principal\",\n                    x.\"Total Amount Received\",\n           \
      \         x.\"Expected Daily Interest Amount\",\n                    round(x.\"Borrower Total Interest\", 0) AS\
      \ \"Borrower Total Interest\",\n                    round(x.\"Expected Interest This Month\", 0) AS \"Expected\
      \ Interest This Month\",\n                    round(COALESCE(x.\"Effective Daily Interest Rate\", 0::numeric),\
      \ 4) AS \"Effective Daily Interest Rate\",\n                    round(x.\"Principal Recovered by Interest %\",\
      \ 2) AS \"Principal Recovered by Interest %\",\n                    x.\"Principal Days MTD\",\n               \
      \     round(x.\"Loan Start Day Index\", 0) AS \"Loan Start Day Index\",\n                    round(x.\"Principal\
      \ Start Weight\", 0) AS \"Principal Start Weight\",\n                    x.\"Loan End Date\",\n               \
      \     x.\"Loan Duration\",\n                    round(x.\"30D Principal Days\", 2) AS \"30D Principal Days\",\n\
      \                    x.\"Loan Age Days\",\n                    x.\"Loan Age Bucket\",\n                    x.\"\
      Defaulted Flag\",\n                    x.\"Maximum Days Late\",\n                    x.\"Last Interest Charge Date\"\
      ,\n                    x.\"Accrued Interest Days\",\n                    round(x.\"Accrued Interest\", 0) AS \"\
      Accrued Interest\",\n                    x.\"Daily Installment Base Principal\"\n                   FROM final\
      \ x) old_view\n             JOIN \"Loans\" b ON b.\"Row ID\" = old_view.\"Row ID\") existing\n     JOIN \"Loans\"\
      \ l ON l.\"Row ID\" = existing.\"Row ID\";"
