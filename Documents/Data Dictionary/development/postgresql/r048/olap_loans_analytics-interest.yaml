      \ Interest Rate\",\n            old_view.\"Principal Recovered by Interest %\",\n            old_view.\"Principal\
      \ Days MTD\",\n            old_view.\"Loan Start Day Index\",\n            old_view.\"Principal Start Weight\"\
      ,\n            old_view.\"Loan End Date\",\n            old_view.\"Loan Duration\",\n            old_view.\"30D\
      \ Principal Days\",\n            old_view.\"Loan Age Days\",\n            old_view.\"Loan Age Bucket\",\n     \
      \       old_view.\"Defaulted Flag\",\n            old_view.\"Maximum Days Late\",\n            old_view.\"Last\
      \ Interest Charge Date\",\n            old_view.\"Accrued Interest Days\",\n            old_view.\"Accrued Interest\"\
      ,\n            old_view.\"Daily Installment Base Principal\",\n            b.\"Ref Disbursed From Cash Account\"\
      ,\n            b.\"Payment Request Cash Account\",\n            b.\"Payment Request Token\"\n           FROM (\
      \ WITH ctx AS (\n                         SELECT q.d,\n                            date_trunc('month'::text, q.d::timestamp\
      \ with time zone)::date AS ms,\n                            (date_trunc('month'::text, q.d::timestamp with time\
      \ zone) + '1 mon -1 days'::interval)::date AS me\n                           FROM ( SELECT olap_reporting_date()\
      \ AS d) q\n                        ), cr AS (\n                         SELECT olap_charges_analytics.\"Ref Loans\"\
      \ AS id,\n                            max(olap_charges_analytics.\"Days Late\") AS late,\n                    \
      \        max(olap_charges_analytics.\"Charge Date\") FILTER (WHERE olap_charges_analytics.\"Charge Date\" <= ctx.d)\
      \ AS last_interest,\n                            max(olap_charges_analytics.\"Charge Date\") AS last_charge,\n\
      \                            sum(olap_charges_analytics.\"Interest Remaining\") FILTER (WHERE olap_charges_analytics.\"\
      Charge Date\" > ctx.d AND olap_charges_analytics.\"Charge Date\" <= ctx.me) AS scheduled\n                    \
      \       FROM olap_charges_analytics\n                             CROSS JOIN ctx\n                          GROUP\
      \ BY olap_charges_analytics.\"Ref Loans\"\n                        ), br AS (\n                         SELECT\
      \ \"Loans\".\"Ref Borrowers\" AS id,\n                            sum(\"Loans\".\"Total Interest Received\") AS\
      \ total\n                           FROM \"Loans\"\n                          GROUP BY \"Loans\".\"Ref Borrowers\"\
      \n                        ), a AS (\n                         SELECT l_1.\"Row ID\",\n                        \
      \    l_1.\"Loan Date\",\n                            l_1.\"Close Date\",\n                            l_1.\"Principal\
      \ Amount\",\n                            l_1.\"Due Date\",\n                            l_1.\"Ref Borrowers\",\n\
      \                            l_1.\"Loan Arrangement\",\n                            l_1.\"Loan Status\",\n    \
      \                        l_1.\"Loan Type\",\n                            l_1.\"Current Daily Interest\",\n    \
      \                        l_1.\"Fixed Interest\",\n                            l_1.\"Transfer Fee\",\n         \
      \                   l_1.\"Interest Payment Interval\",\n                            l_1.\"Created By\",\n     \
      \                       l_1.\"Closed By\",\n                            l_1.\"Defaulted\",\n                  \
      \          l_1.\"Default Loss Amount\",\n                            l_1.\"Daily Payment Amount\",\n          \
      \                  l_1.\"Auto Charge Enabled\",\n                            l_1.\"Interest Schedule Anchor Date\"\
      ,\n                            l_1.\"Ref Closing Payment\",\n                            l_1.\"Charge Generation\
      \ Request\",\n                            l_1.\"Total Interest Received\",\n                            l_1.\"\
      Total Principal Received\",\n                            l_1.\"Outstanding Principal\",\n                     \
      \       l_1.\"Total Amount Received\",\n                            l_1.\"Expected Daily Interest Amount\",\n \
      \                           COALESCE(br.total, 0::numeric) AS \"Borrower Total Interest\",\n                  \
      \              CASE\n                                    WHEN COALESCE(l_1.\"Principal Amount\"::numeric, 0::numeric)\
      \ > 0::numeric THEN COALESCE(l_1.\"Total Interest Received\", 0::numeric) / l_1.\"Principal Amount\"::numeric\n\
      \                                    ELSE 0::numeric\n                                END AS \"Principal Recovered\
      \ by Interest %\",\n                                CASE\n                                    WHEN l_1.\"Loan Date\"\
      \ > ctx.d THEN 0::numeric\n                                    ELSE COALESCE(l_1.\"Principal Amount\"::numeric,\
      \ 0::numeric) *\n                                    CASE\nWHEN l_1.\"Loan Date\" >= ctx.ms AND l_1.\"Loan Date\"\
      \ <= ctx.me THEN (ctx.d - l_1.\"Loan Date\" + 1)::numeric\nELSE EXTRACT(day FROM ctx.d)\n                     \
      \               END\n                                END AS \"Principal Days MTD\",\n                         \
      \   (l_1.\"Loan Date\" - '2000-01-01'::date)::numeric AS \"Loan Start Day Index\",\n                          \
      \  l_1.\"Close Date\" AS \"Loan End Date\",\n                                CASE\n                           \
      \         WHEN l_1.\"Close Date\" IS NOT NULL THEN l_1.\"Close Date\" - l_1.\"Loan Date\" + 1\n               \
      \                     ELSE NULL::integer\n                                END AS \"Loan Duration\",\n         \
      \                       CASE\n                                    WHEN l_1.\"Loan Date\" > ctx.d THEN 0::numeric\n\
      \                                    ELSE COALESCE(l_1.\"Principal Amount\"::numeric, 0::numeric) * (ctx.d - GREATEST(l_1.\"\
      Loan Date\", ctx.d - 29) + 1)::numeric\n                                END AS \"30D Principal Days\",\n      \
      \                      ctx.d - l_1.\"Loan Date\" AS \"Loan Age Days\",\n                            COALESCE(l_1.\"\
      Defaulted\", false) AS \"Defaulted Flag\",\n                            GREATEST(0, cr.late) AS \"Maximum Days\
      \ Late\",\n                            cr.last_interest AS \"Last Interest Charge Date\",\n                   \
      \         GREATEST(0, ctx.d - COALESCE(cr.last_interest, l_1.\"Loan Date\")) AS \"Accrued Interest Days\",\n  \
      \                          cr.last_charge,\n                            COALESCE(cr.scheduled, 0::numeric) AS scheduled,\n\
      \                            LEAST(l_1.\"Due Date\", ctx.me) AS forecast_end,\n                            l_1.\"\
      Due Date\" - l_1.\"Loan Date\" + 1 AS term_days\n                           FROM \"Loans\" l_1\n              \
      \               CROSS JOIN ctx\n                             LEFT JOIN cr ON cr.id = l_1.\"Row ID\"\n         \
      \                    LEFT JOIN br ON br.id = l_1.\"Ref Borrowers\"\n                        ), b AS (\n       \
      \                  SELECT a.\"Row ID\",\n                            a.\"Loan Date\",\n                       \
      \     a.\"Close Date\",\n                            a.\"Principal Amount\",\n                            a.\"\
      Due Date\",\n                            a.\"Ref Borrowers\",\n                            a.\"Loan Arrangement\"\
      ,\n                            a.\"Loan Status\",\n                            a.\"Loan Type\",\n             \
      \               a.\"Current Daily Interest\",\n                            a.\"Fixed Interest\",\n            \
      \                a.\"Transfer Fee\",\n                            a.\"Interest Payment Interval\",\n          \
      \                  a.\"Created By\",\n                            a.\"Closed By\",\n                          \
      \  a.\"Defaulted\",\n                            a.\"Default Loss Amount\",\n                            a.\"Daily\
      \ Payment Amount\",\n                            a.\"Auto Charge Enabled\",\n                            a.\"Interest\
      \ Schedule Anchor Date\",\n                            a.\"Ref Closing Payment\",\n                           \
      \ a.\"Charge Generation Request\",\n                            a.\"Total Interest Received\",\n              \
      \              a.\"Total Principal Received\",\n                            a.\"Outstanding Principal\",\n    \
      \                        a.\"Total Amount Received\",\n                            a.\"Expected Daily Interest\
      \ Amount\",\n                            a.\"Borrower Total Interest\",\n                            a.\"Principal\
      \ Recovered by Interest %\",\n                            a.\"Principal Days MTD\",\n                         \
      \   a.\"Loan Start Day Index\",\n                            a.\"Loan End Date\",\n                           \
      \ a.\"Loan Duration\",\n                            a.\"30D Principal Days\",\n                            a.\"\
      Loan Age Days\",\n                            a.\"Defaulted Flag\",\n                            a.\"Maximum Days\
      \ Late\",\n                            a.\"Last Interest Charge Date\",\n                            a.\"Accrued\
      \ Interest Days\",\n                            a.last_charge,\n                            a.scheduled,\n    \
      \                        a.forecast_end,\n                            a.term_days,\n                          \
      \  COALESCE(a.\"Principal Amount\"::numeric, 0::numeric) * a.\"Loan Start Day Index\" AS \"Principal Start Weight\"\
      ,\n                                CASE\n                                    WHEN a.\"Loan Age Days\" <= 10 THEN\
      \ '0-10 Days'::text\n                                    WHEN a.\"Loan Age Days\" <= 20 THEN '11-20 Days'::text\n\
      \                                    WHEN a.\"Loan Age Days\" <= 30 THEN '21-30 Days'::text\n                 \
      \                   WHEN a.\"Loan Age Days\" <= 60 THEN '31-60 Days'::text\n                                  \
      \  ELSE '60+ Days'::text\n                                END AS \"Loan Age Bucket\",\n                       \
      \         CASE\n                                    WHEN a.\"Auto Charge Enabled\" AND a.\"Loan Type\" = 'ดอกเบี้ยรายวัน'::text\
      \ THEN COALESCE(a.\"Current Daily Interest\"::numeric, 0::numeric) * a.\"Accrued Interest Days\"::numeric\n   \
      \                                 ELSE 0::numeric\n                                END AS \"Accrued Interest\"\
      ,\n                                CASE\n                                    WHEN a.\"Loan Type\" = 'ผ่อนชำระรายวัน'::text\
      \ AND a.\"Loan Date\" IS NOT NULL AND a.\"Due Date\" >= a.\"Loan Date\" THEN floor(COALESCE(a.\"Principal Amount\"\
      ::numeric, 0::numeric) / NULLIF(a.term_days, 0)::numeric)\n                                    ELSE 0::numeric\n\
      \                                END AS \"Daily Installment Base Principal\",\n                               \
      \ CASE\n                                    WHEN COALESCE(a.\"Outstanding Principal\", 0::numeric) <= 0::numeric\
      \ THEN 0::numeric\n                                    ELSE\n                                    CASE a.\"Loan\
      \ Type\"\nWHEN 'ดอกเบี้ยรายวัน'::text THEN COALESCE(a.\"Current Daily Interest\"::numeric, 0::numeric) / a.\"Outstanding\
      \ Principal\"\nWHEN 'กำหนดวันชำระ'::text THEN COALESCE(a.\"Fixed Interest\"::numeric, 0::numeric) / NULLIF(a.term_days,\
      \ 0)::numeric / a.\"Outstanding Principal\"\nWHEN 'ผ่อนชำระรายวัน'::text THEN (COALESCE(a.\"Daily Payment Amount\"\
      ::numeric, 0::numeric) * a.term_days::numeric - COALESCE(a.\"Principal Amount\"::numeric, 0::numeric)) / NULLIF(a.term_days,\
      \ 0)::numeric / a.\"Outstanding Principal\"\nELSE 0::numeric\n                                    END\n       \
      \                         END AS \"Effective Daily Interest Rate\"\n                           FROM a\n       \
      \                 ), final AS (\n                         SELECT b_1.\"Row ID\",\n                            b_1.\"\
      Loan Date\",\n                            b_1.\"Close Date\",\n                            b_1.\"Principal Amount\"\
      ,\n                            b_1.\"Due Date\",\n                            b_1.\"Ref Borrowers\",\n        \
      \                    b_1.\"Loan Arrangement\",\n                            b_1.\"Loan Status\",\n            \
      \                b_1.\"Loan Type\",\n                            b_1.\"Current Daily Interest\",\n            \
      \                b_1.\"Fixed Interest\",\n                            b_1.\"Transfer Fee\",\n                 \
      \           b_1.\"Interest Payment Interval\",\n                            b_1.\"Created By\",\n             \
      \               b_1.\"Closed By\",\n                            b_1.\"Defaulted\",\n                          \
      \  b_1.\"Default Loss Amount\",\n                            b_1.\"Daily Payment Amount\",\n                  \
      \          b_1.\"Auto Charge Enabled\",\n                            b_1.\"Interest Schedule Anchor Date\",\n \
      \                           b_1.\"Ref Closing Payment\",\n                            b_1.\"Charge Generation Request\"\
      ,\n                            b_1.\"Total Interest Received\",\n                            b_1.\"Total Principal\
      \ Received\",\n                            b_1.\"Outstanding Principal\",\n                            b_1.\"Total\
      \ Amount Received\",\n                            b_1.\"Expected Daily Interest Amount\",\n                   \
      \         b_1.\"Borrower Total Interest\",\n                            b_1.\"Principal Recovered by Interest %\"\
      ,\n                            b_1.\"Principal Days MTD\",\n                            b_1.\"Loan Start Day Index\"\
      ,\n                            b_1.\"Loan End Date\",\n                            b_1.\"Loan Duration\",\n   \
      \                         b_1.\"30D Principal Days\",\n                            b_1.\"Loan Age Days\",\n   \
      \                         b_1.\"Defaulted Flag\",\n                            b_1.\"Maximum Days Late\",\n   \
      \                         b_1.\"Last Interest Charge Date\",\n                            b_1.\"Accrued Interest\
      \ Days\",\n                            b_1.last_charge,\n                            b_1.scheduled,\n         \
      \                   b_1.forecast_end,\n                            b_1.term_days,\n                           \
      \ b_1.\"Principal Start Weight\",\n                            b_1.\"Loan Age Bucket\",\n                     \
      \       b_1.\"Accrued Interest\",\n                            b_1.\"Daily Installment Base Principal\",\n    \
      \                        b_1.\"Effective Daily Interest Rate\",\n                                CASE\n       \
      \                             WHEN b_1.\"Loan Status\" = 'ปิดยอดแล้ว'::text THEN 0::numeric\n                 \
      \                   WHEN NOT COALESCE(b_1.\"Auto Charge Enabled\", false) OR b_1.\"Loan Type\" = 'ดอกเบี้ยรายวัน'::text\
      \ AND COALESCE(b_1.\"Current Daily Interest\"::numeric, 0::numeric) = 0::numeric THEN b_1.scheduled\n         \
      \                           WHEN b_1.\"Loan Type\" = 'ดอกเบี้ยรายวัน'::text THEN GREATEST(0::numeric, b_1.\"Accrued\
      \ Interest\") + COALESCE(b_1.\"Current Daily Interest\"::numeric, 0::numeric) * (ctx.me - ctx.d)::numeric\n   \
      \                                 WHEN b_1.\"Loan Type\" = 'กำหนดวันชำระ'::text THEN\n                        \
      \            CASE\nWHEN b_1.\"Due Date\" > ctx.d AND b_1.\"Due Date\" <= ctx.me THEN COALESCE(b_1.\"Fixed Interest\"\
      ::numeric, 0::numeric)\nELSE 0::numeric\n                                    END\n                            \
      \        WHEN b_1.\"Loan Type\" = 'ผ่อนชำระรายวัน'::text THEN\n                                    CASE\nWHEN b_1.last_charge\
      \ IS NOT NULL AND b_1.forecast_end > b_1.last_charge THEN COALESCE(b_1.\"Daily Payment Amount\"::numeric, 0::numeric)\
      \ * (b_1.forecast_end - b_1.last_charge)::numeric - (floor(COALESCE(b_1.\"Principal Amount\"::numeric, 0::numeric)\
      \ / NULLIF(b_1.term_days, 0)::numeric) * (b_1.forecast_end - b_1.last_charge)::numeric + GREATEST(0::numeric, LEAST((b_1.forecast_end\
      \ - b_1.\"Loan Date\" + 1)::numeric, mod(COALESCE(b_1.\"Principal Amount\"::numeric, 0::numeric), NULLIF(b_1.term_days,\
      \ 0)::numeric)) - (b_1.last_charge - b_1.\"Loan Date\" + 1)::numeric))\nELSE 0::numeric\n                     \
      \               END\n                                    ELSE 0::numeric\n                                END AS\
      \ \"Expected Interest This Month\"\n                           FROM b b_1\n                             CROSS JOIN\
      \ ctx\n                        )\n                 SELECT x.\"Row ID\",\n                    x.\"Loan Date\",\n\
      \                    x.\"Close Date\",\n                    x.\"Principal Amount\",\n                    x.\"Due\
      \ Date\",\n                    x.\"Ref Borrowers\",\n                    x.\"Loan Arrangement\",\n            \
      \        x.\"Loan Status\",\n                    x.\"Loan Type\",\n                    x.\"Current Daily Interest\"\
      ,\n                    x.\"Fixed Interest\",\n                    x.\"Transfer Fee\",\n                    x.\"\
      Interest Payment Interval\",\n                    x.\"Created By\",\n                    x.\"Closed By\",\n   \
      \                 x.\"Defaulted\",\n                    x.\"Default Loss Amount\",\n                    x.\"Daily\
      \ Payment Amount\",\n                    x.\"Auto Charge Enabled\",\n                    x.\"Interest Schedule\
