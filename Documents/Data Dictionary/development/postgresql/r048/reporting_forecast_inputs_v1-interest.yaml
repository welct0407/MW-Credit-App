    "view_definition": " SELECT existing.loan_id,\n    existing.borrower_id,\n    existing.borrower,\n    existing.loan_type,\n\
      \    existing.loan_status,\n    existing.defaulted,\n    existing.outstanding_principal,\n    existing.reporting_date,\n\
      \    existing.month_end,\n    existing.loan || jsonb_build_object('original_rate', l.\"Original Daily Interest\
      \ Rate\") AS loan,\n    existing.charges\n   FROM ( WITH ctx AS (\n                 SELECT olap_reporting_date()\
      \ AS t\n                ), repayments AS (\n                 SELECT \"Repayments\".\"Ref Loans\" AS loan_id,\n\
      \                    COALESCE(sum(\"Repayments\".\"Principal Paid\"::numeric) FILTER (WHERE \"Repayments\".\"Payment\
      \ Date\" <= ctx_1.t), 0::numeric) AS principal,\n                    bool_or(\"Repayments\".\"Payment Date\" IS\
      \ NULL OR \"Repayments\".\"Principal Paid\" IS NULL OR \"Repayments\".\"Interest Paid\" IS NULL OR \"Repayments\"\
      .\"Payment Date\" > ctx_1.t) AS invalid\n                   FROM \"Repayments\"\n                     CROSS JOIN\
      \ ctx ctx_1\n                  GROUP BY \"Repayments\".\"Ref Loans\"\n                ), paid AS (\n          \
      \       SELECT r_1.\"Ref Charges\" AS charge_id,\n                    sum(r_1.\"Principal Paid\"::numeric) FILTER\
      \ (WHERE r_1.\"Payment Date\" <= ctx_1.t) AS p,\n                    sum(r_1.\"Interest Paid\"::numeric) FILTER\
      \ (WHERE r_1.\"Payment Date\" <= ctx_1.t) AS i,\n                    bool_or(r_1.\"Payment Date\" IS NULL OR r_1.\"\
      Principal Paid\" IS NULL OR r_1.\"Interest Paid\" IS NULL OR r_1.\"Ref Loans\" IS DISTINCT FROM c_1.\"Ref Loans\"\
      ) AS invalid\n                   FROM \"Repayments\" r_1\n                     LEFT JOIN \"Charges\" c_1 ON c_1.\"\
      Row ID\" = r_1.\"Ref Charges\"\n                     CROSS JOIN ctx ctx_1\n                  GROUP BY r_1.\"Ref\
      \ Charges\"\n                ), charges AS (\n                 SELECT c_1.\"Ref Loans\" AS loan_id,\n         \
      \           jsonb_agg(jsonb_build_object('id', c_1.\"Row ID\", 'date', c_1.\"Charge Date\", 'pdue', c_1.\"Principal\
      \ Due\"::numeric, 'idue', c_1.\"Interest Due\"::numeric, 'ppaid', COALESCE(p.p, 0::numeric), 'ipaid', COALESCE(p.i,\
      \ 0::numeric), 'invalid', COALESCE(p.invalid, false) OR c_1.\"Charge Date\" IS NULL OR c_1.\"Principal Due\" IS\
      \ NULL OR c_1.\"Interest Due\" IS NULL)) AS charges\n                   FROM \"Charges\" c_1\n                \
      \     LEFT JOIN paid p ON p.charge_id = c_1.\"Row ID\"\n                  GROUP BY c_1.\"Ref Loans\"\n        \
      \        )\n         SELECT l_1.\"Row ID\" AS loan_id,\n            l_1.\"Ref Borrowers\" AS borrower_id,\n   \
      \         COALESCE(NULLIF(b.\"Description\", ''::text), b.\"Borrower Name\", l_1.\"Ref Borrowers\", 'Unmapped'::text)\
      \ AS borrower,\n                CASE l_1.\"Loan Type\"\n                    WHEN 'ดอกเบี้ยรายวัน'::text THEN 'Daily\
      \ Interest'::text\n                    WHEN 'กำหนดวันชำระ'::text THEN 'Fixed Due Date'::text\n                \
      \    WHEN 'ผ่อนชำระรายวัน'::text THEN 'Daily Installment'::text\n                    ELSE 'Unknown'::text\n   \
      \             END AS loan_type,\n            l_1.\"Loan Status\" AS loan_status,\n            COALESCE(l_1.\"Defaulted\"\
      , false) AS defaulted,\n            l_1.\"Principal Amount\"::numeric - COALESCE(r.principal, 0::numeric) AS outstanding_principal,\n\
      \            ctx.t AS reporting_date,\n            (date_trunc('month'::text, ctx.t::timestamp with time zone)\
      \ + '1 mon -1 days'::interval)::date AS month_end,\n            jsonb_build_object('status', l_1.\"Loan Status\"\
      , 'defaulted', COALESCE(l_1.\"Defaulted\", false), 'start', l_1.\"Loan Date\", 'close', l_1.\"Close Date\", 'balance',\
      \ l_1.\"Principal Amount\"::numeric - COALESCE(r.principal, 0::numeric), 'daily', l_1.\"Current Daily Interest\"\
      ::numeric, 'auto', l_1.\"Auto Charge Enabled\", 'interval', l_1.\"Interest Payment Interval\", 'anchor', l_1.\"\
      Interest Schedule Anchor Date\", 'type', l_1.\"Loan Type\", 'due', l_1.\"Due Date\", 'arrangement', l_1.\"Loan\
      \ Arrangement\", 'original', l_1.\"Principal Amount\"::numeric, 'payment', l_1.\"Daily Payment Amount\"::numeric,\
      \ 'fixed', l_1.\"Fixed Interest\"::numeric, 'invalid', l_1.\"Loan Date\" IS NULL OR l_1.\"Principal Amount\" IS\
      \ NULL OR b.\"Row ID\" IS NULL OR COALESCE(r.invalid, false)) AS loan,\n            COALESCE(c.charges, '[]'::jsonb)\
      \ AS charges\n           FROM \"Loans\" l_1\n             LEFT JOIN \"Borrowers\" b ON b.\"Row ID\" = l_1.\"Ref\
      \ Borrowers\"\n             LEFT JOIN repayments r ON r.loan_id = l_1.\"Row ID\"\n             LEFT JOIN charges\
      \ c ON c.loan_id = l_1.\"Row ID\"\n             CROSS JOIN ctx) existing\n     JOIN \"Loans\" l ON l.\"Row ID\"\
      \ = existing.loan_id;"
