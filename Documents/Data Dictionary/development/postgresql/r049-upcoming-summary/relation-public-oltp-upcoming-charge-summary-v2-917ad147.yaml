        "acl": "{postgres=arwdDxtm/postgres}"
        "comment": "R049: read-only borrower/date totals for seven-day menu and first-five-date borrower summaries; detail\
          \ amounts reconcile to the bounded event provider. V1 retained for old-app compatibility."
        "view_definition": |2-
           SELECT (((('ufs1:'::text || length("Ref Borrower")) || ':'::text) || "Ref Borrower") || ':'::text) || to_char("Due Date"::timestamp with time zone, 'YYYY-MM-DD'::text) AS "Row ID",
              "Ref Borrower",
              "Due Date",
              sum("Amount Remaining") AS "Total Charge",
              "As Of Date"
             FROM oltp_upcoming_charge_events_v1
            WHERE "Due Date" > "As Of Date" AND "Due Date" <= "Horizon End"
            GROUP BY "Ref Borrower", "Due Date", "As Of Date";
