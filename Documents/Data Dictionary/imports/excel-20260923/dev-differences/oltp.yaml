        \ must be whole baht\", COUNT(Loan Form Context[Row ID]) <> 1, \"กรุณาซิงค์เพื่อโหลดวงเงิน / Sync to load available\
        \ cashpool\", TRUE, CONCATENATE(\"เงินต้นเกินเงินทุนคงเหลือ / Principal exceeds available cashpool: ฿\", ANY(Loan\
        \ Form Context[Available Cashpool]), \". ลดเงินต้นหรือซิงค์หลังเพิ่มทุน / Reduce principal or sync after adding capital.\"\
