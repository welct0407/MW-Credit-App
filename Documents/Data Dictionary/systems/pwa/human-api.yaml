  "borrower_upcoming":
    "summary_query":
      "businessDate": "required YYYY-MM-DD matching current Asia/Bangkok business date"
    "date_query":
      "businessDate": "required YYYY-MM-DD matching current Asia/Bangkok business date"
      "limit": "optional; default 25"
      "cursor": "optional; bound to borrower, business date and due date"
    "access": "Fresh Firebase principal, Partner oltp.read capability and visible borrower (Hidden Flag IS NOT TRUE); independent\
      \ of current Collection membership"
    "result": "Up to five upcoming dates ascending; selected-date detail ordered by loanId then event id using C collation"
    "source_rules": "Existing forecast SQL, horizon, freshness, review flags and calculations; no migration or grant change"
    "routes_source": "https://github.com/welct0407/MW-Credit-App/blob/68e8a39e63e44123dcbab3f819c72d711e2a3240/services/api/dev-read-handler.mjs"
    "forecast_source": "https://github.com/welct0407/MW-Credit-App/blob/68e8a39e63e44123dcbab3f819c72d711e2a3240/services/api/upcoming-read-contract.mjs"
  "paged_ordering":
    "collection":
      "order": "Existing status rank, then COALESCE(raw borrower name, empty string) ASC under C collation, then stable id\
        \ ASC; displayed description is not a sort key"
      "cursor": "v3; bound to kind, businessDate, rank, raw name, id and search query hash; old or mismatched cursors rejected"
      "source": "https://github.com/welct0407/MW-Credit-App/blob/2ef73db0f91769f1566cd83d91467390080c36ab/services/api/collection-read-contract.mjs"
    "loan_related":
      "routes":
      - "GET /api/loan-records/:id/charges"
      - "GET /api/loan-records/:id/payments"
      "order": "Charge Date or Payment Date DESC NULLS LAST, stable id ASC under C collation"
      "cursor": "v2; bound to loanId, kind, date (nullable) and id; old or cross-loan/kind cursors rejected"
      "source": "https://github.com/welct0407/MW-Credit-App/blob/2ef73db0f91769f1566cd83d91467390080c36ab/services/business/loan-related.mjs"
    "financial_scope": "Query ordering/cursors only; existing membership, source relationships, balances, capabilities and\
      \ financial calculations preserved; no migration or grant change."
  "offline_dataset":
    "routes":
    - "GET /api/offline-dataset?domain=records"
    - "GET /api/offline-dataset?domain=collection"
    - "GET /api/offline-dataset?domain=cash"
    - "GET /api/offline-dataset?domain=management"
    - "GET /api/notifications/offline-dataset"
    "guard": "DEV-only existing authenticated issuer/membership/capabilities and fixed target guards; production-business\
      \ composition denies bulk domain route; recipient notification endpoint enabled only in DEV."
    "transaction": "Each chunk uses ordinary authenticated read-only repeatable-read checks and existing projections/providers;\
      \ one shared bulk connection reservation preserves foreground capacity. No transaction snapshot is exported between\
      \ HTTP requests."
    "result": "Main schemaVersion 2 includes domain/generation/startedAt/asOf/businessDate, patches, nextCursor, complete,\
      \ phase progress and chunksCompleted. Notification schemaVersion 2 has recipient page progress but no chunksCompleted.\
      \ Complete requires traversal end and null nextCursor. Legacy omission returns complete schemaVersion 1."
    "data_contract": "No tables/columns/migrations/grants or financial calculation changes; no arbitrary SQL input or raw\
      \ storage access."
    "sources":
    - "https://github.com/welct0407/MW-Credit-App/blob/374fe98ed21ab233f068dd337d7cbaef0eb24788/services/business/offline-dataset-chunks.mjs"
    - "https://github.com/welct0407/MW-Credit-App/blob/374fe98ed21ab233f068dd337d7cbaef0eb24788/services/api/offline-dataset-cursor.mjs"
    - "https://github.com/welct0407/MW-Credit-App/blob/374fe98ed21ab233f068dd337d7cbaef0eb24788/services/payment-command/handler.mjs"
    - "https://github.com/welct0407/MW-Credit-App/blob/374fe98ed21ab233f068dd337d7cbaef0eb24788/services/payment-command/store.mjs"
    - "https://github.com/welct0407/MW-Credit-App/blob/374fe98ed21ab233f068dd337d7cbaef0eb24788/services/notifications/handler.mjs"
    - "https://github.com/welct0407/MW-Credit-App/blob/374fe98ed21ab233f068dd337d7cbaef0eb24788/services/notifications/store.mjs"
    "protocol": "Omitted protocol retains legacy schemaVersion 1 complete response. protocol=2 selects schemaVersion 2 on\
      \ both routes, with optional cursor. Explicit protocol=1, unknown/duplicate params or cursor without protocol=2 rejected."
    "cursor": "Canonical traversal cursor validates actor issuer/subject/partner, domain, business day, startedAt/generation,\
      \ phase/state and done count. Day change or age over 24h yields dataset_changed; no owner/domain traversal reuse."
    "bounds": "Main domain responses pack at most 8 logical pages, checking elapsed 750ms or 512KiB between pages; targets\
      \ are not hard limits on one query/page. Notification responses retain at most 25 history rows per page. Existing reader/detail\
      \ batching limits retained."
