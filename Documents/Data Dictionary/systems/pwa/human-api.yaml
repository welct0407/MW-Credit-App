  "borrower_upcoming":
    "summary_query":
      "businessDate": "required YYYY-MM-DD matching current Asia/Bangkok business date"
    "date_query":
      "businessDate": "required YYYY-MM-DD matching current Asia/Bangkok business date"
      "limit": "optional; default 25"
      "cursor": "optional; bound to borrower, business date and due date"
    "access": "Fresh Firebase principal, Partner oltp.read capability and visible borrower (Hidden Flag IS NOT TRUE); independent\
      \ of current Collection membership"
    "result": "Up to five upcoming dates ascending; selected-date detail ordered by loanId then event id using C collation"
    "source_rules": "Existing forecast SQL, horizon, freshness, review flags and calculations; no migration or grant change"
    "routes_source": "https://github.com/welct0407/MW-Credit-App/blob/68e8a39e63e44123dcbab3f819c72d711e2a3240/services/api/dev-read-handler.mjs"
