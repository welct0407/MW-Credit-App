    - "https://github.com/welct0407/MW-Credit-App/blob/6a3cf8cde2710a45b0368bc7f177f21bdab2693c/services/notifications/handler.mjs"
    - "https://github.com/welct0407/MW-Credit-App/blob/6a3cf8cde2710a45b0368bc7f177f21bdab2693c/services/notifications/store.mjs"
    "protocol": "Omitted protocol retains legacy schemaVersion 1 GET; protocol=2 GET with optional cursor retains bounded\
      \ full preparation. protocol=3 uses read-only POST with JSON cursor/need/sourceVersion body on both dataset routes;\
      \ initial complete bundles then refresh through content manifests. Explicit protocol=1 and malformed/duplicate query/body\
      \ fields rejected."
    "cursor": "Canonical traversal cursor validates actor issuer/subject/partner, domain, business day, startedAt/generation,\
      \ phase/state and done count. Day change or age over 24h yields dataset_changed; no owner/domain traversal reuse."
    "bounds": "Main protocol2 GET responses pack at most8 logical pages with elapsed750ms/512KiB checks between pages, not\
      \ hard single-query limits. Notification protocol2 keeps<=25 history rows/page. Protocol3 deterministic caps are defined\
      \ separately in delta_bounds."
    "delta_request": "cursor null or canonical base64url max32768; need unique SHA256 content hashes max2048; sourceVersion\
      \ null or SHA256. Main schemaVersion3 returns ref patches and values only for requested hashes; unchanged sourceVersion\
      \ can return unchanged complete checkpoint with no DTO work. Notifications sourceVersion=null and scan recipient manifests\
      \ every sweep."
    "delta_bounds": "Main protocol3 logical-page caps: records8/collection2/cash4/management1; 512KiB between-page boundary,\
      \ no elapsed cutoff so manifest/need replay is deterministic. Initial protocol2 remains max8pages/750ms/512KiB between\
      \ pages. Notifications retain <=25history rows per page."
    "delta_consistency": "Raw-table content/xmin fingerprints scoped actor/domain/day; deletes/direct other-user changes included.\
      \ Main start/end source gate rejects changed traversal with dataset_changed. Canonical value hashing normalizes Date\
      \ to JSON ISO and ignores asOf metadata. No CDC/retained server snapshot, no universal point-in-time guarantee."
