  "paged_ordering":
    "collection":
      "order": "Existing status rank, then COALESCE(raw borrower name, empty string) ASC under C collation, then stable id\
        \ ASC; displayed description is not a sort key"
      "cursor": "v3; bound to kind, businessDate, rank, raw name, id and search query hash; old or mismatched cursors rejected"
      "source": "https://github.com/welct0407/MW-Credit-App/blob/2ef73db0f91769f1566cd83d91467390080c36ab/services/api/collection-read-contract.mjs"
    "loan_related":
      "routes":
      - "GET /api/loan-records/:id/charges"
      - "GET /api/loan-records/:id/payments"
      "order": "Charge Date or Payment Date DESC NULLS LAST, stable id ASC under C collation"
      "cursor": "v2; bound to loanId, kind, date (nullable) and id; old or cross-loan/kind cursors rejected"
      "source": "https://github.com/welct0407/MW-Credit-App/blob/2ef73db0f91769f1566cd83d91467390080c36ab/services/business/loan-related.mjs"
    "financial_scope": "Query ordering/cursors only; existing membership, source relationships, balances, capabilities and\
      \ financial calculations preserved; no migration or grant change."
  "offline_dataset":
    "routes":
    - "GET /api/offline-dataset?domain=records"
    - "GET /api/offline-dataset?domain=collection"
    - "GET /api/offline-dataset?domain=cash"
    - "GET /api/offline-dataset?domain=management"
    - "GET /api/notifications/offline-dataset"
    "guard": "Existing environment-specific authenticated issuer/membership/capabilities and fixed target guards apply in\
      \ DEV and PROD. Production recipient endpoint requires existing notifications-enabled composition; deployment verified."
    "transaction": "Each chunk uses ordinary authenticated read-only repeatable-read checks and existing projections/providers;\
      \ one shared bulk connection reservation preserves foreground capacity. No transaction snapshot is exported between\
      \ HTTP requests."
    "result": "Main schemaVersion 2 includes domain/generation/startedAt/asOf/businessDate, patches, nextCursor, complete,\
      \ phase progress and chunksCompleted. Notification schemaVersion 2 has recipient page progress but no chunksCompleted.\
      \ Complete requires traversal end and null nextCursor. Legacy omission returns complete schemaVersion 1."
    "data_contract": "No tables/columns/migrations/grants or financial calculation changes; no arbitrary SQL input or raw\
      \ storage access."
    "sources":
    - "https://github.com/welct0407/MW-Credit-App/blob/6a3cf8cde2710a45b0368bc7f177f21bdab2693c/services/business/offline-dataset-delta.mjs"
    - "https://github.com/welct0407/MW-Credit-App/blob/6a3cf8cde2710a45b0368bc7f177f21bdab2693c/services/api/offline-dataset-delta.mjs"
    - "https://github.com/welct0407/MW-Credit-App/blob/6a3cf8cde2710a45b0368bc7f177f21bdab2693c/services/business/offline-dataset-chunks.mjs"
