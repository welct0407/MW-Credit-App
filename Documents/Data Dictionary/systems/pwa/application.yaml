  "saved_change_queue":
    "contents": "Only saved/confirmed unsynced requests, including autosaved notes. Applied/posted requests removed; rejected/conflicting\
      \ requests retained for review. Ordinary drafts/snapshots hidden. Waiting to sync sidebar/mobile button shows a top-right\
      \ count only when above zero, including queued/syncing/blocked pending states and excluding ordinary drafts/snapshots.\
      \ Count respects the current authorized repository and refreshes on saved events/focus and every 15 seconds; English/Thai\
      \ accessible labels include the count."
    "unfinished_forms": "Restore contextually in original forms; wait for restored draft before defaults/server data; no submission\
      \ until explicit Save/Confirm."
    "sync": "DEV startup/reconnect/foreground and queue events reconcile GET status before same-UUID retry. Focus/pageshow/visible\
      \ wake recovers missed online events; authenticated preferences renew expired local authorization before draining, while\
      \ purged repositories cannot renew. Retry delays 1/2/5/10/30 seconds while eligible queued changes remain. Origin/account\
      \ checked per request; Web Locks serialize tabs and recover abandoned holders, with timed IndexedDB lease fallback."
    "review_safety": "Explicit removal only for recorded rejection or never-dispatched request, with confirmation; attempted\
      \ unknown outcome cannot be discarded."
    "receipts": "Receipt blob and identity durable with pending payment; upload uses same request/receipt identity before\
      \ command POST."
    "legacy_notes": "Owner-authorized note-draft migration runs once per device in DEV. Existing pending requests reconcile\
      \ on each startup/reconnect/retry until terminal. Chained notes preserve full-field checks and unrelated later edits."
    "production_limit": "Explicit PROD paths remain supported; automatic PROD coordinator and automatic legacy-note migration\
      \ disabled; no PROD delivery authorized."
