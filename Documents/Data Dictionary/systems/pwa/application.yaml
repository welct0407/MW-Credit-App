  "borrower_upcoming":
    "scope": "Selected visible borrower detail in both operational full detail and read-only fallback; includes borrowers\
      \ with only future charges"
    "presentation": "Borrower Upcoming Charges auto-loads on opening, with independent loading/empty states and error-only\
      \ retry; no dedicated refresh button. Retry reloads the summary for a changed business date or unavailable selected\
      \ date. Shared Collection summary, date detail and paging remain unchanged."
    "freshness": "Previews reused for at most 60 seconds on the same Asia/Bangkok day and invalidated on visibility change;\
      \ date paging uses fresh API reads"
    "request_safety": "Abort and generation guards reject stale borrower results; controls do not submit borrower changes"
    "financial_effect": "Read-only forecast; no charge or financial write"
