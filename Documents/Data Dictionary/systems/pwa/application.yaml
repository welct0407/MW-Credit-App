      \ through existing authenticated receipt source reads; no date/amount/processing-time captions. Incremental paging appends\
      \ images; retry preserves loaded images and resumes the failed cursor. Existing eligibility and request scope remain."
    "receiver_image": "Single image picker hides while local image/receipt/upload state exists; content-width preview is shown\
      \ during receive and confirmation. Accessible top-right remove control restores picker and invalidates late upload results."
    "financial_effect": "Presentation only; receipt storage/access, eligibility, upload reconciliation and financial command\
      \ behavior unchanged."
