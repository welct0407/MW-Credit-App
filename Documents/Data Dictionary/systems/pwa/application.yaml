  "navigation":
    "swipe_back": "Single-touch right drag moves only the middle content and reveals the prior page with parallax; colored\
      \ header/footer stay fixed. Starts at left edge or over controls; eligible pages invoke the existing current Back action\
      \ and its form/discard guards. Root pages without Back do not navigate."
    "gesture": "Commit at 35% of middle viewport width or at least 60px with forward velocity over 0.5px/ms; otherwise snap\
      \ back. Settling is 180ms, zero duration for reduced motion."
    "previews": "Inert, aria-hidden session-memory DOM previews capture scroll/input state; scoped navigation keys and successful-creation\
      \ replacement preserve the correct parent. Context changes clear previews."
    "exclusions": "Horizontal scrollers, sliders/media and open dialogs; vertical-first movement, multiple touches, changed\
      \ Back action or disabled control cancel the gesture."
    "source": "https://github.com/welct0407/MW-Credit-App/blob/5d046627481ff151f299bad30b784ca418f4b58c/apps/pwa/src/swipe-back.ts"
