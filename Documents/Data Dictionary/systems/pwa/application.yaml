      \ dialogs, selection and horizontal scrollers retain their interactions; changed context/multiple touches cancel."
    "workspace_source": "https://github.com/welct0407/MW-Credit-App/blob/dfaa46d280e99e9f3694d735d75e615074249a97/apps/pwa/src/workspace-gestures.ts"
