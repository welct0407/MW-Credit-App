"content":
  "editor":
    "controls":
    - "label": "Require user sign-in?"
      "selected": null
      "tag": "INPUT"
      "type": "checkbox"
      "value": true
    - "label": "Authentication provider"
      "selected":
      - "Google"
      "tag": "SELECT"
      "type": "select-one"
      "value": "google"
    - "label": "Allow all signed-in users"
      "selected": null
      "tag": "INPUT"
