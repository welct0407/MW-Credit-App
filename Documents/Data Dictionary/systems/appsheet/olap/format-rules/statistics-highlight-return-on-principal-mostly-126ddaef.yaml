    "Rule name": "Statistics - Highlight Return on Principal - Mostly"
    "Format these columns and actions":
    - "Profit Coverage of Outstanding Principal"
    "For this data": "Statistics"
    "If this condition is true": |-
      =AND(
        [Profit Coverage of Outstanding Principal] >= 0.6,
        [Profit Coverage of Outstanding Principal] < 1
      )
