    "Rule name": "Overdue Payment"
    "Format these columns and actions":
    - "Charge Date"
    - "Amount Remaining"
    "For this data": "Charges"
    "If this condition is true": |-
      =AND(
        [Amount Remaining] > 0,
        [Charge Date] < TODAY()
      )
    "Rule order": "8"
    "Is this format rule disabled?": "No"
