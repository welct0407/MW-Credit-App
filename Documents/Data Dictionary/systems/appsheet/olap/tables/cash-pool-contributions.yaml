    "Amount":
      "inventory":
        "App": "OLAP"
        "Table": "Cash Pool Contributions"
        "Column": "Amount"
        "Type": "Price"
        "Virtual": "No"
        "Key": "No"
        "Label": "No"
        "Read-only": "No"
        "Hidden": "No"
      "rules":
        "Visible?": "ALWAYS"
        "Display name": "=\"จำนวนเงิน / Amount\""
        "Type Qualifier.CurrencySymbol": "฿"
        "Type Qualifier.DecimalDigits": "0"
        "Type Qualifier.ShowThousandsSeparator": "true"
        "Type Qualifier.NumberDisplayMode": "Auto"
        "Type Qualifier.Valid_If": |-
          =AND(
           [_THIS] > 0,
           OR(
           [Transaction Type] = "Contribution",
           AND(
           [Transaction Type] = "Withdrawal",
           [_THIS] <= SUM(
           SELECT(
           Cash Pool Contributions[Net Contribution],
           AND(
           [Ref Partner] = [_THISROW].[Ref Partner],
           [Contribution Date] <= [_THISROW].[Contribution Date],
           [Row ID] <> [_THISROW].[Row ID]
           )
           )
           )
           )
           )
          )
        "Type Qualifier.Error_Message_If_Invalid": |-
          ="จำนวนเงินต้องมากกว่า 0
          Amount must be greater than zero / You can't withdraw more than what you contributed."
        "Type Qualifier.Editable_If": |-
          =COUNT(
           SELECT(
           Repayments[Row ID],
           [Payment Date] >= [_THISROW].[Contribution Date]
           )
          ) = 0
