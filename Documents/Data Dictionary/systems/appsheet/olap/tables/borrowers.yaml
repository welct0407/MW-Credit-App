    "Matrix Stability Score":
      "inventory":
        "App": "OLAP"
        "Table": "Borrowers"
        "Column": "Matrix Stability Score"
        "Type": "Number"
        "Virtual": "No"
        "Key": "No"
        "Label": "No"
        "Read-only": "No"
        "Hidden": "No"
      "rules":
        "Column name": "Matrix Stability Score"
        "Visible?": "ALWAYS"
        "Type": "Number"
        "Type Qualifier": "{\"MaxValue\":null,\"MinValue\":null,\"StepValue\":null,\"NumericDigits\":null,\"ShowThousandsSeparator\"\
          :true,\"NumberDisplayMode\":\"Auto\",\"Valid_If\":null,\"Error_Message_If_Invalid\":null,\"Show_If\":null,\"Required_If\"\
          :null,\"Editable_If\":null,\"Reset_If\":null,\"Suggested_Values\":null}"
        "App formula": |-
          =ROUND(
            10
              * (
              IF(
                ISNOTBLANK([Matrix Recent Reliability Score]),
                [Matrix Recent Reliability Score] * 0.45,
                0
              )
                + IF(
                  ISNOTBLANK([Matrix Historical Reliability Score]),
                  [Matrix Historical Reliability Score] * 0.20,
                  0
                )
                + IF(
                  ISNOTBLANK([Matrix Delay Severity Score]),
                  [Matrix Delay Severity Score] * 0.20,
                  0
                )
                + [Matrix Current Condition Score] * 0.15
              )
              / (
              IF(ISNOTBLANK([Matrix Recent Reliability Score]), 0.45, 0)
                + IF(ISNOTBLANK([Matrix Historical Reliability Score]), 0.20, 0)
                + IF(ISNOTBLANK([Matrix Delay Severity Score]), 0.20, 0)
                + 0.15
              )
          )
          / 10
