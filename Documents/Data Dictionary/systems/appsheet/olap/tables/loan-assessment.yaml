        "Type Qualifier.LongTextFormatting": "Plain Text"
        "Type Qualifier.IsMulticolumnKey": "false"
        "App formula": "=IF(NOT(AND([SQL Source Current], [SQL As Of] = TODAY(), [Ref Borrower] = [SQL Input Borrower], [Proposed\
          \ Loan Amount] = [SQL Input Amount], ABS([Minimum Daily Profit Rate] - [SQL Input Rate]) < (1.0 / 10000000))), IF(NOT(AND([Ref\
          \ Borrower] = [SQL Input Borrower], [Proposed Loan Amount] = [SQL Input Amount], ABS([Minimum Daily Profit Rate]\
          \ - [SQL Input Rate]) < (1.0 / 10000000))), \"กำลังรอผลการคำนวณ ผลจะแสดงหลังบันทึกและซิงค์ / Waiting for calculation\
          \ results. Results appear after saving and syncing.\", \"ผลการประเมินไม่เป็นปัจจุบัน กรุณาแก้ไขและบันทึกข้อมูลการประเมิน\
          \ / Assessment is out of date. Update and save the assessment inputs.\"), CONCATENATE(IFS( ISBLANK([Ref Borrower]),\
          \ \"กรุณาเลือกผู้กู้ / Select a borrower\", OR(ISBLANK([Proposed Loan Amount]), [Proposed Loan Amount] <= 0), \"\
          กรุณากรอกวงเงินกู้ที่เสนอ / Enter the proposed loan amount\", OR(ISBLANK([Minimum Daily Profit Rate]), [Minimum\
          \ Daily Profit Rate] <= 0), \"กรุณากรอกอัตรากำไรขั้นต่ำ / Enter the minimum profit rate\", ISBLANK([Earliest Eligible\
          \ Date]), \"ไม่พบวันที่ผ่านเกณฑ์ภายในช่วงเวลาที่ประเมิน / No eligible date found within the forecast period\", [Earliest\
          \ Eligible Date] = TODAY(), \"สามารถปล่อยกู้ได้วันนี้ / Eligible to issue the loan today\", TRUE, CONCATENATE( \"\
          วันที่แนะนำให้ปล่อยกู้ได้เร็วที่สุด / Earliest recommended issue date: \", TEXT([Earliest Eligible Date], \"DD/MM/YYYY\"\
          ) ) ), \" | คำนวณเมื่อ / Calculated: \", TEXT([SQL Calculated At], \"DD/MM/YYYY HH:MM:SS\")))"
