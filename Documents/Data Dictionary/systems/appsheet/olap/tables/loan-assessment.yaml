          \ Loan Amount] = [SQL Input Amount], ABS([Minimum Daily Profit Rate] - [SQL Input Rate]) < (1.0 / 10000000))), IF(NOT(AND([Ref\
          \ Borrower] = [SQL Input Borrower], [Proposed Loan Amount] = [SQL Input Amount], ABS([Minimum Daily Profit Rate]\
          \ - [SQL Input Rate]) < (1.0 / 10000000))), \"กำลังรอผล / Awaiting results\", \"ผลไม่เป็นปัจจุบัน / Out of date\"\
          ), IFS( ISBLANK([Earliest Eligible Date]), \"ยังไม่ผ่านเกณฑ์ - Not Eligible\", [Earliest Eligible Date] <= TODAY(),\
          \ \"ปล่อยกู้ได้ตอนนี้ - Eligible Now\", TRUE, \"ควรรอก่อน - Wait\" ))"
        "Formula version": "0"
