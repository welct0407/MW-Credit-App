    "Do this": "SET_COLUMN_VALUE"
    "Attach to column": "Charge Generation Request"
    "Set this column": "Charge Generation Request"
    "Descriptive comment": |-
      Generate only if:
      ✅ Loan is still open
      ✅ Daily-interest loan OR fixed loan due today
      ✅ No charge exists today
    "Only if this condition is true": "=AND([Auto Charge Enabled], AND([Loan Status] = \"ยังไม่ปิดยอด\", COUNT(SELECT(Charges[Row\
      \ ID], AND([Ref Loans] = [_THISROW].[Row ID], [Charge Date] = DATE(UTCNOW() + \"007:00:00\")))) = 0, IFS([Loan Type]\
      \ = \"ดอกเบี้ยรายวัน\", AND([Current Daily Interest] > 0, [Accrued Interest] > 0, DATE(UTCNOW() + \"007:00:00\") > IF(ISBLANK([Interest\
      \ Schedule Anchor Date]), [Loan Date], [Interest Schedule Anchor Date]), [Interest Payment Interval] >= 1, MOD(FLOOR(TOTALHOURS(DATE(UTCNOW()\
      \ + \"007:00:00\") - IF(ISBLANK([Interest Schedule Anchor Date]), [Loan Date], [Interest Schedule Anchor Date])) / 24),\
      \ [Interest Payment Interval]) = 0), [Loan Type] = \"กำหนดวันชำระ\", [Due Date] = DATE(UTCNOW() + \"007:00:00\"), [Loan\
      \ Type] = \"ผ่อนชำระรายวัน\", AND(DATE(UTCNOW() + \"007:00:00\") > [Loan Date], DATE(UTCNOW() + \"007:00:00\") <= [Due\
      \ Date], [Interest Payment Interval] >= 1, ISNOTBLANK(MAX([Related Charges][Charge Date])), OR(MOD(FLOOR(TOTALHOURS(DATE(UTCNOW()\
      \ + \"007:00:00\") - [Loan Date]) / 24), [Interest Payment Interval]) = 0, DATE(UTCNOW() + \"007:00:00\") = [Due Date])),\
      \ TRUE, FALSE)))"
    "Disable automatic updates?": "No"
    "Action icon": ""
    "For a record of this table": "Loans"
    "Does this action apply to the whole table?": "No"
    "To this value": "=CONCATENATE(TEXT(DATE(UTCNOW() + \"007:00:00\"), \"YYYY-MM-DD\"), \"|\", UNIQUEID())"
    "Visible?": "ALWAYS"
