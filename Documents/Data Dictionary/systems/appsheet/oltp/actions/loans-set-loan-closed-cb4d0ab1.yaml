      =AND(
        [Loan Status] = "ยังไม่ปิดยอด",
        [Principal Amount] <= SUM(SELECT(Repayments[Principal Paid], [Ref Loans] = [_THISROW].[Row ID])),
        COUNT(SELECT(Charges[Row ID], AND(
          [Ref Loans] = [_THISROW].[Row ID],
          [Principal Due] + [Interest Due] >
            SUM(SELECT(Repayments[Principal Paid], [Ref Charges] = [_THISROW-1].[Row ID])) +
            SUM(SELECT(Repayments[Interest Paid], [Ref Charges] = [_THISROW-1].[Row ID]))
        ))) = 0
      )
