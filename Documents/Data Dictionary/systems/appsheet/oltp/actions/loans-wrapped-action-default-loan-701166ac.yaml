    "Confirmation Message": "=\"ยืนยันบันทึกหนี้สูญหรือไม่? ยอดค้างชำระของเงินกู้นี้จะถูกตัดออก และเงินต้นคงเหลือจะถูกบันทึกเป็นขาดทุน\
