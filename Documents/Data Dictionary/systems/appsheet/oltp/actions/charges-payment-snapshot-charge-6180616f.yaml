      :true}"
    "Do this": "ADD_RECORD_TO"
    "Only if this condition is true": "=AND(COUNT(SELECT(Payments[Row ID], AND([Ref Borrower] = [_THISROW].[Ref Loans].[Ref\
      \ Borrowers], [Status] = \"Processing\", IFS(IN([Allocation Method], LIST(\"Single Full\", \"Single Partial\", \"First-day\
      \ Auto\")), [Ref Target Charge] = [_THISROW].[Row ID], [Allocation Method] = \"Loan Close\", [Ref Target Charge].[Ref\
      \ Loans] = [_THISROW].[Ref Loans], IN([Allocation Method], LIST(\"Receive All\", \"Lump Sum\")), [_THISROW].[Charge\
      \ Date] <= [Payment Date], TRUE, FALSE)))) = 1, [Amount Remaining] > 0, [Interest Remaining] >= 0, [Principal Remaining]\
      \ >= 0, [Amount Remaining] = [Interest Remaining] + [Principal Remaining], COUNT(SELECT(Payment Allocations[Row ID],\
      \ AND([Ref Payment].[Ref Borrower] = [_THISROW].[Ref Loans].[Ref Borrowers], [Ref Payment].[Status] = \"Processing\"\
      , [Ref Charge] = [_THISROW].[Row ID]))) = 0, COUNT(SELECT(Payment Allocations[Row ID], AND([Ref Payment].[Ref Borrower]\
      \ = [_THISROW].[Ref Loans].[Ref Borrowers], [Ref Payment].[Status] = \"Processing\", [Allocation Order] > 0))) = 0)"
