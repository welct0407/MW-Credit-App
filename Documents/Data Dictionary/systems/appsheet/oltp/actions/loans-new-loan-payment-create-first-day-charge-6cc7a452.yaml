      \ Payment Amount] - (FLOOR([Principal Amount] / (TOTALHOURS([Due Date] - [Loan Date]) / 24 + 1)) + IF(MOD([Principal\
      \ Amount], (TOTALHOURS([Due Date] - [Loan Date]) / 24 + 1)) > 0, 1, 0)) + [Transfer Fee], TRUE, 0)\"}],\"InputParametersUsed\"\
