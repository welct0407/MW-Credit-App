        "Display name": "=\"เงินต้นที่ชำระ / Principal Paid\""
        "Type Qualifier.CurrencySymbol": "฿"
        "Type Qualifier.DecimalDigits": "0"
        "Type Qualifier.ShowThousandsSeparator": "true"
        "Type Qualifier.NumberDisplayMode": "Auto"
        "Type Qualifier.Valid_If": |-
          =AND(
           [_THIS] >= 0,
           [_THIS] <= (
           [Ref Charges].[Principal Due]
           - SUM(
           SELECT(
           Repayments[Principal Paid],
           AND(
           [Ref Charges] = [_THISROW].[Ref Charges],
           [Row ID] <> [_THISROW].[Row ID]
           )
           )
           )
           )
          )
        "Type Qualifier.Error_Message_If_Invalid": "=\"ยอดเงินต้นที่ชำระเกินยอดเงินต้นคงเหลือ / The principal amount paid\
          \ exceeds the remaining principal balance.\""
        "Type Qualifier.Editable_If": "=ISBLANK([Ref Payment])"
        "Formula version": "0"
        "Reset on edit?": "No"
        "Initial value": "=0"
