        "Label": "No"
        "Read-only": "Yes"
        "Hidden": "No"
      "rules":
        "Column name": "Principal Returned Days MTD"
        "Visible?": "ALWAYS"
        "Type": "Number"
        "Type Qualifier": "{\"MaxValue\":null,\"MinValue\":null,\"StepValue\":null,\"NumericDigits\":null,\"ShowThousandsSeparator\"\
          :true,\"NumberDisplayMode\":\"Auto\",\"Valid_If\":null,\"Error_Message_If_Invalid\":null,\"Show_If\":null,\"Required_If\"\
          :null,\"Editable_If\":null,\"Reset_If\":null,\"Suggested_Values\":null}"
        "App formula": |-
          =IF(
            OR([Principal Paid] <= 0, [Payment Date] > TODAY()),
            0,
            [Principal Paid]
              * IF(
                AND(
                  MONTH([Payment Date]) = MONTH(TODAY()),
                  YEAR([Payment Date]) = YEAR(TODAY())
                ),
                DAY(TODAY()) - DAY([Payment Date]) + 1,
                DAY(TODAY())
              )
          )
