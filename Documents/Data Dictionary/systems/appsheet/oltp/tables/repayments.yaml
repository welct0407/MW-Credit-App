          \ / This entry was generated from a receipt. Edit or delete the source receipt.\\\", TRUE, \\\"ตรวจยอดเรียกเก็บและรายการชำระที่เกี่ยวข้องก่อนแก้ไข\
          \ เงินต้นต้องไม่ติดลบ และเงินต้นกับดอกเบี้ยต้องไม่เป็นศูนย์พร้อมกัน / Review the charge and related payments before\
