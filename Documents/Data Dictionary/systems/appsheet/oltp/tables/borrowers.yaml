      "rules":
        "Column name": "Projected Interest Coverage Date"
        "Visible?": "ALWAYS"
        "Display name": "=\"วันที่ดอกเบี้ยครอบคลุมเงินต้น / Projected Interest Coverage Date\""
        "Type": "Date"
        "Type Qualifier": "{\"UseLongDateFormat\":false,\"Valid_If\":null,\"Error_Message_If_Invalid\":null,\"Show_If\":\"\
          =[Has Active Loan]\",\"Required_If\":null,\"Editable_If\":null,\"Reset_If\":null,\"Suggested_Values\":null}"
        "App formula": |-
          =IFS(
            [Total Outstanding Principal] <= 0,
            "",
            [Active Loan Interest Earned] >= [Total Outstanding Principal],
            TODAY(),
            [Active Daily Interest] > 0,
            TODAY()
              + CEILING(
                ( [Total Outstanding Principal] - [Active Loan Interest Earned] )
                  / [Active Daily Interest]
              ),
            TRUE,
            ""
          )
