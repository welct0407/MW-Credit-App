      "rules":
        "Column name": "Principal Amount"
        "Visible?": "ALWAYS"
        "Description": "=\"\""
        "Display name": "=CONCATENATE(\"เงินต้น / Principal Amount\", IF(AND(CONTEXT(\"ViewType\") = \"Form\", NOT(IN([Row\
          \ ID], Loans[Row ID])), COUNT(Loan Form Context[Row ID]) = 1), CONCATENATE(\" (฿\", ANY(Loan Form Context[Available\
          \ Cashpool]), \")\"), \"\"))"
        "Type": "Price"
        "Type Qualifier": "{\"CurrencySymbol\":\"฿\",\"MaxValue\":null,\"MinValue\":null,\"StepValue\":null,\"DecimalDigits\"\
          :0,\"NumericDigits\":null,\"ShowThousandsSeparator\":true,\"NumberDisplayMode\":\"Auto\",\"Valid_If\":\"=AND([_THIS]\
          \ > 0, OR([Loan Type] <> \\\"ผ่อนชำระรายวัน\\\", MOD([_THIS], 1) = 0), OR(IN([Row ID], Loans[Row ID]), AND(COUNT(Loan\
          \ Form Context[Row ID]) = 1, [_THIS] <= ANY(Loan Form Context[Available Cashpool]))), OR(NOT(IN([Row ID], Loans[Row\
          \ ID])), AND([_THIS] >= SUM(SELECT(Repayments[Principal Paid], [Ref Loans] = [_THISROW].[Row ID])), [_THIS] >= SUM(SELECT(Charges[Principal\
          \ Due], [Ref Loans] = [_THISROW].[Row ID])))))\",\"Error_Message_If_Invalid\":\"=IFS([_THIS] <= 0, \\\"เงินต้นต้องมากกว่า\
          \ 0 / Principal must be greater than zero\\\", AND([Loan Type] = \\\"ผ่อนชำระรายวัน\\\", MOD([_THIS], 1) <> 0),\
          \ \\\"เงินต้นผ่อนรายวันต้องเป็นจำนวนเต็มบาท / Daily installment principal must be whole baht\\\", AND(IN([Row ID],\
          \ Loans[Row ID]), OR([_THIS] < SUM(SELECT(Repayments[Principal Paid], [Ref Loans] = [_THISROW].[Row ID])), [_THIS]\
          \ < SUM(SELECT(Charges[Principal Due], [Ref Loans] = [_THISROW].[Row ID])))), \\\"เงินต้นต้องรองรับทั้งเงินต้นที่ชำระแล้วและยอดเงินต้นที่บันทึกไว้\
          \ กรุณาแก้ไขรายการต้นทางก่อนลดเงินต้น / Principal must cover both paid principal and recorded principal charges.\
          \ Correct related sources before reducing it.\\\", COUNT(Loan Form Context[Row ID]) <> 1, \\\"กรุณาซิงค์เพื่อโหลดวงเงิน\
          \ / Sync to load available cashpool\\\", TRUE, CONCATENATE(\\\"เงินต้นเกินเงินทุนคงเหลือ / Principal exceeds available\
          \ cashpool: ฿\\\", ANY(Loan Form Context[Available Cashpool]), \\\". ลดเงินต้นหรือซิงค์หลังเพิ่มทุน / Reduce principal\
          \ or sync after adding capital.\\\"))\",\"Show_If\":null,\"Required_If\":null,\"Editable_If\":\"=OR(NOT(IN([Row\
          \ ID], Loans[Row ID])), NOT([Defaulted] = TRUE))\",\"Reset_If\":null,\"Suggested_Values\":null}"
