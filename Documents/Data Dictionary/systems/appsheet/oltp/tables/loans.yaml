      "rules":
        "Column name": "Expected Interest This Month"
        "Visible?": "ALWAYS"
        "Display name": "=คาดการณ์ดอกเบี้ยเดือนนี้"
        "Type": "Price"
        "Type Qualifier": "{\"CurrencySymbol\":\"฿\",\"MaxValue\":null,\"MinValue\":null,\"StepValue\":null,\"DecimalDigits\"\
          :0,\"NumericDigits\":null,\"ShowThousandsSeparator\":true,\"NumberDisplayMode\":\"Auto\",\"Valid_If\":\"=OR(\\n\
          \  [Loan Type] <> \\\"ดอกเบี้ยรายวัน\\\",\\n  [Current Daily Interest] > 0\\n)\",\"Error_Message_If_Invalid\":null,\"\
          Show_If\":\"=IN([Loan Type], LIST(\\\"ดอกเบี้ยรายวัน\\\", \\\"ผ่อนชำระรายวัน\\\"))\",\"Required_If\":null,\"Editable_If\"\
          :null,\"Reset_If\":null,\"Suggested_Values\":null}"
        "App formula": "=IF([Loan Status] = \"ปิดยอดแล้ว\", 0, IFS(OR(NOT([Auto Charge Enabled]), AND([Loan Type] = \"ดอกเบี้ยรายวัน\"\
          , [Current Daily Interest] = 0)), SUM(SELECT([Related Charges][Interest Remaining], AND([Charge Date] > TODAY(),\
          \ [Charge Date] <= EOMONTH(TODAY(), 0)))), [Loan Type] = \"ดอกเบี้ยรายวัน\", MAX(LIST([Current Daily Interest] *\
          \ 0, [Accrued Interest])) + ([Current Daily Interest] * (DAY(EOMONTH(TODAY(), 0)) - DAY(TODAY()))), [Loan Type]\
          \ = \"กำหนดวันชำระ\", IF(AND([Due Date] > TODAY(), MONTH([Due Date]) = MONTH(TODAY()), YEAR([Due Date]) = YEAR(TODAY())),\
          \ [Fixed Interest], 0), [Loan Type] = \"ผ่อนชำระรายวัน\", IF(AND(ISNOTBLANK(MAX([Related Charges][Charge Date])),\
          \ IF([Due Date] < EOMONTH(TODAY(), 0), [Due Date], EOMONTH(TODAY(), 0)) > MAX([Related Charges][Charge Date])),\
          \ ([Daily Payment Amount] * IF(IF([Due Date] < EOMONTH(TODAY(), 0), [Due Date], EOMONTH(TODAY(), 0)) > MAX([Related\
          \ Charges][Charge Date]), TOTALHOURS(IF([Due Date] < EOMONTH(TODAY(), 0), [Due Date], EOMONTH(TODAY(), 0)) - MAX([Related\
          \ Charges][Charge Date])) / 24, 0)) - (FLOOR([Principal Amount] / (TOTALHOURS([Due Date] - [Loan Date]) / 24 + 1))\
          \ * IF(IF([Due Date] < EOMONTH(TODAY(), 0), [Due Date], EOMONTH(TODAY(), 0)) > MAX([Related Charges][Charge Date]),\
          \ TOTALHOURS(IF([Due Date] < EOMONTH(TODAY(), 0), [Due Date], EOMONTH(TODAY(), 0)) - MAX([Related Charges][Charge\
          \ Date])) / 24, 0) + IF((IF((TOTALHOURS(IF([Due Date] < EOMONTH(TODAY(), 0), [Due Date], EOMONTH(TODAY(), 0)) -\
          \ [Loan Date]) / 24 + 1) < MOD([Principal Amount], (TOTALHOURS([Due Date] - [Loan Date]) / 24 + 1)), (TOTALHOURS(IF([Due\
          \ Date] < EOMONTH(TODAY(), 0), [Due Date], EOMONTH(TODAY(), 0)) - [Loan Date]) / 24 + 1), MOD([Principal Amount],\
          \ (TOTALHOURS([Due Date] - [Loan Date]) / 24 + 1))) - (TOTALHOURS(MAX([Related Charges][Charge Date]) - [Loan Date])\
          \ / 24 + 2) + 1) > 0, (IF((TOTALHOURS(IF([Due Date] < EOMONTH(TODAY(), 0), [Due Date], EOMONTH(TODAY(), 0)) - [Loan\
          \ Date]) / 24 + 1) < MOD([Principal Amount], (TOTALHOURS([Due Date] - [Loan Date]) / 24 + 1)), (TOTALHOURS(IF([Due\
          \ Date] < EOMONTH(TODAY(), 0), [Due Date], EOMONTH(TODAY(), 0)) - [Loan Date]) / 24 + 1), MOD([Principal Amount],\
          \ (TOTALHOURS([Due Date] - [Loan Date]) / 24 + 1))) - (TOTALHOURS(MAX([Related Charges][Charge Date]) - [Loan Date])\
          \ / 24 + 2) + 1), 0)), 0), TRUE, 0))"
