    "definition": "CREATE OR REPLACE FUNCTION public.pwa_apply_assessment_v2(payload text)\n RETURNS jsonb\n LANGUAGE plpgsql\n\
      \ SET search_path TO 'pg_catalog', 'public'\nAS $function$\r\nDECLARE e jsonb:=payload::jsonb;c jsonb:=e->'command';i\
      \ jsonb:=c->'inputs';op text:=c->>'operation';target text:=c->>'targetId';snapshot jsonb;day date:=(CURRENT_TIMESTAMP\
      \ AT TIME ZONE 'Asia/Bangkok')::date;message text;\r\nBEGIN\r\n IF (current_database() NOT IN ('loan_manager_dev','payment_rehearsal','loan_manager_prod')\
      \ OR current_user<>CASE current_database() WHEN 'loan_manager_prod' THEN 'mw_app_prod_journal_owner' ELSE 'mw_app_dev_journal_owner'\
      \ END) OR op NOT IN('assessment.create','assessment.update','assessment.refresh','assessment.delete') THEN RAISE EXCEPTION\
      \ USING ERRCODE='42501';END IF;\r\n PERFORM public.pwa_management_tools_text_v2(op,i);\r\n PERFORM pg_advisory_xact_lock(hashtextextended('management:assessment:'||target,0));\r\
      \n SELECT to_jsonb(s) INTO snapshot FROM public.\"Loan Assessment SQL Lab\" s WHERE \"Row ID\"=target FOR UPDATE;\r\n\
      \ IF op='assessment.create' THEN IF snapshot IS NOT NULL THEN RAISE EXCEPTION USING ERRCODE='P5B01';END IF;\r\n ELSE\
      \ IF snapshot IS NULL THEN RAISE EXCEPTION USING ERRCODE='P5B02';END IF;IF encode(sha256(convert_to(snapshot::text,'UTF8')),'hex')\
      \ IS DISTINCT FROM c->>'expectedVersion' THEN RAISE EXCEPTION USING ERRCODE='P5B01';END IF;END IF;\r\n IF op IN('assessment.create','assessment.update')\
      \ AND i->>'borrowerId' IS NOT NULL AND NOT EXISTS(SELECT 1 FROM public.\"Borrowers\" WHERE \"Row ID\"=i->>'borrowerId')\
      \ THEN RAISE EXCEPTION USING ERRCODE='P5B04';END IF;\r\n IF op='assessment.create' AND ((i->>'forecastStart')::date<>day\
      \ OR (i->>'forecastEnd')::date<>day) THEN RAISE EXCEPTION USING ERRCODE='P5B08';END IF;\r\n IF op='assessment.update'\
      \ AND (i->>'forecastStart' IS DISTINCT FROM snapshot->>'SQL Forecast Start' OR i->>'forecastEnd' IS DISTINCT FROM snapshot->>'SQL\
      \ Forecast End') THEN RAISE EXCEPTION USING ERRCODE='P5B08';END IF;\r\n BEGIN\r\n IF op='assessment.create' THEN INSERT\
      \ INTO public.\"Loan Assessment SQL Lab\"(\"Row ID\",\"Assessment ID\",\"Ref Borrower\",\"Proposed Loan Amount\",\"\
      Minimum Daily Profit Rate\",\"SQL Forecast Start\",\"SQL Forecast End\") VALUES(target,i->>'assessmentId',i->>'borrowerId',(i->>'proposedLoanAmount')::numeric::money,(i->>'minimumDailyProfitRate')::real,day,day);\r\
      \n ELSIF op='assessment.update' THEN UPDATE public.\"Loan Assessment SQL Lab\" SET \"Assessment ID\"=i->>'assessmentId',\"\
      Ref Borrower\"=i->>'borrowerId',\"Proposed Loan Amount\"=(i->>'proposedLoanAmount')::numeric::money,\"Minimum Daily\
      \ Profit Rate\"=(i->>'minimumDailyProfitRate')::real WHERE \"Row ID\"=target;\r\n ELSIF op='assessment.refresh' THEN\
      \ UPDATE public.\"Loan Assessment SQL Lab\" SET \"SQL Forecast Start\"=(public.pwa_assessment_refresh_window_v2(\"SQL\
      \ Forecast Start\",\"SQL Forecast End\",day))[1],\"SQL Forecast End\"=(public.pwa_assessment_refresh_window_v2(\"SQL\
      \ Forecast Start\",\"SQL Forecast End\",day))[2],\"SQL Refresh Token\"=e->>'requestId' WHERE \"Row ID\"=target;\r\n\
      \ ELSE DELETE FROM public.\"Loan Assessment SQL Lab\" WHERE \"Row ID\"=target;END IF;\r\n EXCEPTION WHEN foreign_key_violation\
      \ THEN RAISE EXCEPTION USING ERRCODE='P5B04';\r\n WHEN raise_exception THEN GET STACKED DIAGNOSTICS message=MESSAGE_TEXT;\r\
      \n IF message='Forecast window must include today and cannot exceed 3660 days' THEN RAISE EXCEPTION USING ERRCODE='P5B08';ELSE\
      \ RAISE;END IF;\r\n END;\r\n RETURN jsonb_build_object('operation',op,'targetType','assessment','targetId',target,'paymentId',NULL,'plan',NULL,'predecessorRequestId',NULL,'sourceCreatedBy',NULL);\r\
      \nEND $function$\n"
