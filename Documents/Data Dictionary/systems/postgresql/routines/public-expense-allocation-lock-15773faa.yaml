      CREATE OR REPLACE FUNCTION public.expense_allocation_lock()
       RETURNS trigger
       LANGUAGE plpgsql
       SET search_path TO 'pg_catalog', 'public'
      AS $function$
      BEGIN
       IF NOT pg_try_advisory_xact_lock(9152026,15) THEN
         RAISE EXCEPTION 'Partner allocation is busy; sync and retry';
       END IF;
       RETURN NULL;
      END $function$
