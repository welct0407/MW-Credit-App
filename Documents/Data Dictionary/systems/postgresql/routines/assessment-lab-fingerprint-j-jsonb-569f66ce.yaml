    "definition": "CREATE OR REPLACE FUNCTION assessment_lab.fingerprint(j jsonb)\n RETURNS text\n LANGUAGE sql\n IMMUTABLE\n\
      AS $function$\r\n SELECT md5(jsonb_build_object('loans',(SELECT jsonb_agg(x ORDER BY x::text) FROM jsonb_array_elements(j->'loans')\
      \ x),'charges',(SELECT jsonb_agg(x ORDER BY x::text) FROM jsonb_array_elements(j->'charges') x))::text)\r\n$function$\n"
