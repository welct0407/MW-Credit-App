    "definition": |
      CREATE OR REPLACE FUNCTION public.fifo_current_month_settled(prior_net numeric, month_net numeric, completed numeric)
       RETURNS numeric
       LANGUAGE sql
       IMMUTABLE PARALLEL SAFE STRICT
       SET search_path TO 'pg_catalog'
      AS $function$
       SELECT least(greatest(month_net,0), greatest(completed-greatest(prior_net,0),0))
      $function$
