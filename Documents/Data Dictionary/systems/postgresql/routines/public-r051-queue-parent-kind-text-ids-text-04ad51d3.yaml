    "definition": "CREATE OR REPLACE FUNCTION public.r051_queue_parent(kind text, ids text[])\n RETURNS void\n LANGUAGE plpgsql\n\
      \ SET search_path TO 'pg_catalog', 'public'\nAS $function$\r\nBEGIN\r\n PERFORM set_config('r051_dirty.'||kind,\r\n\
      \  (coalesce(nullif(current_setting('r051_dirty.'||kind,true),'')::jsonb,'{}'::jsonb)||\r\n   coalesce((SELECT jsonb_object_agg(k,true)\
      \ FROM unnest(ids) k WHERE k IS NOT NULL),'{}'::jsonb))::text,true);\r\nEND $function$\n"
