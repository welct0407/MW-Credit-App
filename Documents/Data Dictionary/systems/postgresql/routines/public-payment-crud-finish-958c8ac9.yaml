    "definition": "CREATE OR REPLACE FUNCTION public.payment_crud_finish()\n RETURNS trigger\n LANGUAGE plpgsql\n SET search_path\
      \ TO 'pg_catalog', 'public'\nAS $function$\r\nBEGIN\r\n IF TG_OP='UPDATE' AND public.payment_inputs(NEW) IS NOT DISTINCT\
      \ FROM public.payment_inputs(OLD) AND NEW.\"Ref Received By Cash Account\" IS NOT DISTINCT FROM OLD.\"Ref Received By\
      \ Cash Account\" THEN RETURN NULL;END IF;\r\n PERFORM public.payment_crud_finish_core_v83(OLD,CASE WHEN TG_OP='UPDATE'\
      \ THEN NEW ELSE OLD END,TG_OP);RETURN NULL;\r\nEND $function$\n"
