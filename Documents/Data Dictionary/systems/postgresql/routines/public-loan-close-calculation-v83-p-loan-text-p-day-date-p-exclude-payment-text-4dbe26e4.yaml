    "definition": "CREATE OR REPLACE FUNCTION public.loan_close_calculation_v83(p_loan text, p_day date, p_exclude_payment\
      \ text)\n RETURNS jsonb\n LANGUAGE plpgsql\n STABLE\n SET search_path TO 'pg_catalog', 'public'\nAS $function$\r\nDECLARE\
      \ l public.\"Loans\"%ROWTYPE; outstanding numeric;scheduled numeric;missing numeric;interest numeric:=0;\r\n target\
      \ text;today_count integer;latest date;mutation jsonb:='null'::jsonb;lines jsonb;total numeric;context jsonb;\r\nBEGIN\r\
      \n SELECT * INTO l FROM public.\"Loans\" WHERE \"Row ID\"=p_loan;\r\n IF NOT FOUND THEN RAISE EXCEPTION 'Target loan\
      \ must belong to the payment borrower';END IF;\r\n IF p_exclude_payment IS NOT NULL AND l.\"Ref Closing Payment\"=p_exclude_payment\
      \ AND l.\"Defaulted\" IS NOT TRUE THEN l.\"Loan Status\":='ยังไม่ปิดยอด';END IF;\r\n IF l.\"Loan Status\" IS DISTINCT\
      \ FROM 'ยังไม่ปิดยอด' OR l.\"Loan Type\" IS DISTINCT FROM 'ดอกเบี้ยรายวัน' OR NOT coalesce(l.\"Auto Charge Enabled\"\
      ,false) THEN RAISE EXCEPTION 'Loan Close requires an open auto-enabled daily-interest loan';END IF;\r\n IF l.\"Loan\
      \ Date\" IS NULL OR l.\"Loan Date\">p_day OR l.\"Current Daily Interest\" IS NULL OR l.\"Current Daily Interest\"::numeric<0\
      \ OR l.\"Principal Amount\" IS NULL THEN RAISE EXCEPTION 'Loan Close requires valid loan date, principal and daily interest';END\
      \ IF;\r\n IF EXISTS(SELECT 1 FROM public.\"Charges\" c LEFT JOIN LATERAL(SELECT coalesce(sum(r.\"Principal Paid\"::numeric),0)\
      \ p,coalesce(sum(r.\"Interest Paid\"::numeric),0) i FROM public.\"Repayments\" r WHERE r.\"Ref Charges\"=c.\"Row ID\"\
      \ AND r.\"Ref Payment\" IS DISTINCT FROM p_exclude_payment) paid ON true WHERE c.\"Ref Loans\"=p_loan AND(c.\"Principal\
      \ Due\" IS NULL OR c.\"Interest Due\" IS NULL OR c.\"Principal Due\"::numeric<paid.p OR c.\"Interest Due\"::numeric<paid.i))\
      \ THEN RAISE EXCEPTION 'Loan charge components require reconciliation before closing';END IF;\r\n SELECT l.\"Principal\
      \ Amount\"::numeric-coalesce(sum(\"Principal Paid\"::numeric),0) INTO outstanding FROM public.\"Repayments\" WHERE \"\
      Ref Loans\"=p_loan AND \"Ref Payment\" IS DISTINCT FROM p_exclude_payment;\r\n IF outstanding IS NULL OR outstanding<=0\
      \ THEN RAISE EXCEPTION 'Loan has no outstanding principal to close';END IF;\r\n SELECT coalesce(sum(c.\"Principal Due\"\
      ::numeric-(SELECT coalesce(sum(r.\"Principal Paid\"::numeric),0) FROM public.\"Repayments\" r WHERE r.\"Ref Charges\"\
      =c.\"Row ID\" AND r.\"Ref Payment\" IS DISTINCT FROM p_exclude_payment)),0) INTO scheduled FROM public.\"Charges\" c\
      \ WHERE c.\"Ref Loans\"=p_loan;\r\n missing:=outstanding-scheduled;\r\n IF missing<0 THEN RAISE EXCEPTION 'Principal\
      \ already due exceeds outstanding loan principal';END IF;\r\n SELECT count(*),min(\"Row ID\") INTO today_count,target\
      \ FROM public.\"Charges\" WHERE \"Ref Loans\"=p_loan AND \"Charge Date\"=p_day;\r\n IF today_count>1 THEN RAISE EXCEPTION\
      \ 'Multiple charges today require reconciliation before closing';END IF;\r\n IF today_count=0 THEN\r\n  SELECT max(\"\
      Charge Date\") INTO latest FROM public.\"Charges\" WHERE \"Ref Loans\"=p_loan;\r\n  interest:=l.\"Current Daily Interest\"\
      ::numeric*greatest(0,p_day-coalesce(latest,l.\"Loan Date\"));\r\n  IF missing+interest>0 THEN\r\n   target:='lc7:'||length(p_loan)||':'||p_loan||':'||p_day::text;\r\
      \n   mutation:=jsonb_build_object('kind','insert','chargeId',target,'principal',missing::text,'interest',interest::text);\r\
      \n  END IF;\r\n ELSIF missing>0 THEN mutation:=jsonb_build_object('kind','increase','chargeId',target,'principal',missing::text,'interest','0');END\
      \ IF;\r\n IF target IS NULL THEN SELECT \"Row ID\" INTO target FROM public.\"Charges\" WHERE \"Ref Loans\"=p_loan ORDER\
      \ BY \"Charge Date\" DESC,\"Row ID\" COLLATE \"C\" DESC LIMIT 1;END IF;\r\n WITH paid AS(SELECT r.\"Ref Charges\" id,sum(r.\"\
      Principal Paid\"::numeric) p,sum(r.\"Interest Paid\"::numeric) i FROM public.\"Repayments\" r WHERE r.\"Ref Loans\"\
      =p_loan AND r.\"Ref Payment\" IS DISTINCT FROM p_exclude_payment GROUP BY r.\"Ref Charges\"),\r\n projected AS(SELECT\
      \ c.\"Row ID\" id,c.\"Charge Date\" AS charge_day,c.\"Principal Due\"::numeric-coalesce(paid.p,0)+CASE WHEN mutation->>'kind'='increase'\
      \ AND c.\"Row ID\"=target THEN missing ELSE 0 END p,c.\"Interest Due\"::numeric-coalesce(paid.i,0) i FROM public.\"\
      Charges\" c LEFT JOIN paid ON paid.id=c.\"Row ID\" WHERE c.\"Ref Loans\"=p_loan\r\n UNION ALL SELECT target,p_day,missing,interest\
      \ WHERE mutation->>'kind'='insert')\r\n SELECT coalesce(jsonb_agg(jsonb_build_object('chargeId',id,'principal',trim_scale(p)::text,'interest',trim_scale(i)::text,'expectedPrincipalRemaining',trim_scale(p)::text,'expectedInterestRemaining',trim_scale(i)::text,'chargeDate',charge_day::text)\
      \ ORDER BY id COLLATE \"C\") FILTER(WHERE p+i>0),'[]'::jsonb),sum(p+i) INTO lines,total FROM projected;\r\n IF total\
      \ IS NULL OR total<=0 OR total<>trunc(total) THEN RAISE EXCEPTION 'Final receipt must be a positive whole-baht amount';END\
      \ IF;\r\n context:=jsonb_build_object('sourceVersion',public.pwa_loan_version_v2(p_loan),'excludedPayment',p_exclude_payment,'businessDate',p_day::text,'borrowerId',l.\"\
      Ref Borrowers\",'amount',trim_scale(total)::text,'allocations',lines,'targetChargeId',target,'targetLoanId',p_loan,'mutation',mutation);\r\
      \n IF p_exclude_payment IS NULL THEN context:=context-'excludedPayment';END IF;\r\n RETURN context||jsonb_build_object('planHash',encode(sha256(convert_to(context::text,'UTF8')),'hex'));\r\
      \nEND $function$\n"
