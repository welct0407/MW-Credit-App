    "definition": "CREATE OR REPLACE FUNCTION public.payment_charge_balances(p_id text)\n RETURNS TABLE(charge text, loan\
      \ text, charge_day date, principal numeric, interest numeric)\n LANGUAGE sql\n STABLE\n SET search_path TO 'pg_catalog',\
      \ 'public'\nAS $function$\r\n  SELECT c.\"Row ID\",c.\"Ref Loans\",c.\"Charge Date\",\r\n    c.\"Principal Due\"::numeric-paid.p,c.\"\
      Interest Due\"::numeric-paid.i\r\n  FROM public.\"Payments\" p\r\n  JOIN public.\"Loans\" l ON l.\"Ref Borrowers\"=p.\"\
      Ref Borrower\"\r\n  JOIN public.\"Charges\" c ON c.\"Ref Loans\"=l.\"Row ID\"\r\n  LEFT JOIN public.\"Charges\" target\
      \ ON target.\"Row ID\"=p.\"Ref Target Charge\"\r\n  CROSS JOIN LATERAL (\r\n    SELECT coalesce(sum(r.\"Principal Paid\"\
      ::numeric),0) p,\r\n           coalesce(sum(r.\"Interest Paid\"::numeric),0) i\r\n    FROM public.\"Repayments\" r WHERE\
      \ r.\"Ref Charges\"=c.\"Row ID\"\r\n  ) paid\r\n  WHERE p.\"Row ID\"=p_id AND CASE\r\n    WHEN p.\"Allocation Method\"\
      \ IN ('Single Full','Single Partial','First-day Auto')\r\n      THEN c.\"Row ID\"=p.\"Ref Target Charge\"\r\n    WHEN\
      \ p.\"Allocation Method\"='Loan Close' THEN c.\"Ref Loans\"=target.\"Ref Loans\"\r\n    WHEN p.\"Allocation Method\"\
      \ IN ('Receive All','Lump Sum') THEN c.\"Charge Date\"<=p.\"Payment Date\"\r\n    WHEN p.\"Allocation Method\"='Selected\
      \ Charges' THEN\r\n      c.\"Row ID\"=ANY(public.selected_charge_ids(p.\"Selected Charge IDs\"))\r\n      AND c.\"Charge\
      \ Date\"<=p.\"Payment Date\"\r\n    ELSE false END;\r\n$function$\n"
