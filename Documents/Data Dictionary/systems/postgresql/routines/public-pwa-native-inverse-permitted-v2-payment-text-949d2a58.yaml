    "definition": "CREATE OR REPLACE FUNCTION public.pwa_native_inverse_permitted_v2(payment text)\n RETURNS boolean\n LANGUAGE\
      \ sql\n STABLE\n SET search_path TO 'pg_catalog', 'public'\nAS $function$\r\n SELECT current_database() IN ('loan_manager_dev','payment_rehearsal','loan_manager_prod')\
      \ AND current_user=CASE current_database() WHEN 'loan_manager_prod' THEN 'mw_app_prod_journal_owner' ELSE 'mw_app_dev_journal_owner'\
      \ END\r\n AND nullif(current_setting('pwa.native_inverse_request',true),'') IS NOT NULL\r\n AND EXISTS(SELECT 1 FROM\
      \ public.pwa_payment_commands j WHERE j.request_id::text=current_setting('pwa.native_inverse_request',true)\r\n  AND\
      \ j.contract_version=2 AND j.outcome='applied' AND j.canonical_json::jsonb#>>'{command,operation}'='payment.correct'\r\
      \n  AND j.canonical_json::jsonb#>>'{command,targetId}'=$1\r\n  AND j.actor_partner_id=(SELECT \"Row ID\" FROM public.\"\
      Partners\" WHERE lower(btrim(\"Login Email\"))=j.actor_login_email)\r\n  AND NOT EXISTS(SELECT 1 FROM public.pwa_payment_commands\
      \ successor WHERE successor.contract_version=2 AND successor.outcome='applied' AND successor.canonical_json::jsonb#>>'{command,operation}'='payment.correct'\
      \ AND successor.canonical_json::jsonb#>>'{command,targetId}'=$1 AND successor.canonical_json::jsonb#>>'{command,predecessorRequestId}'=j.request_id::text));\r\
      \n$function$\n"
