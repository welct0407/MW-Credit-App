      CREATE OR REPLACE FUNCTION public.begin_business_history()
       RETURNS trigger
       LANGUAGE plpgsql
       SET search_path TO 'pg_catalog', 'public'
      AS $function$
      BEGIN
       IF pg_trigger_depth()=1 THEN PERFORM set_config('business_history.statement_active','on',true); END IF;
       RETURN NULL;
      END $function$
