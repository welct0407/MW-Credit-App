    "definition": "CREATE OR REPLACE FUNCTION public.payment_crud_prepare()\n RETURNS trigger\n LANGUAGE plpgsql\n SET search_path\
      \ TO 'pg_catalog', 'public'\nAS $function$\r\nBEGIN\r\n IF TG_OP='UPDATE' AND NEW.\"Row ID\" IS DISTINCT FROM OLD.\"\
      Row ID\" THEN RAISE EXCEPTION 'Payment key cannot be changed';END IF;\r\n IF TG_OP='UPDATE' AND public.payment_inputs(NEW)\
      \ IS NOT DISTINCT FROM public.payment_inputs(OLD) THEN RETURN NEW;END IF;\r\n RETURN public.payment_crud_prepare_core_v83(OLD,CASE\
      \ WHEN TG_OP='UPDATE' THEN NEW ELSE OLD END,TG_OP);\r\nEND $function$\n"
