    "definition": "CREATE OR REPLACE FUNCTION public.apply_loan_close_calculation_v83(p_loan text, p_day date, p_expected\
      \ text)\n RETURNS jsonb\n LANGUAGE plpgsql\n SET search_path TO 'pg_catalog', 'public'\nAS $function$\r\nDECLARE parent\
      \ text;calculation jsonb;m jsonb;\r\nBEGIN\r\n SELECT \"Ref Borrowers\" INTO parent FROM public.\"Loans\" WHERE \"Row\
      \ ID\"=p_loan;\r\n PERFORM 1 FROM public.\"Borrowers\" WHERE \"Row ID\"=parent FOR UPDATE;\r\n PERFORM 1 FROM public.\"\
      Loans\" WHERE \"Row ID\"=p_loan FOR UPDATE;\r\n PERFORM 1 FROM public.\"Charges\" WHERE \"Ref Loans\"=p_loan ORDER BY\
      \ \"Row ID\" COLLATE \"C\" FOR UPDATE;\r\n calculation:=public.loan_close_calculation_v83(p_loan,p_day);\r\n IF p_expected\
      \ IS NOT NULL AND calculation->>'planHash' IS DISTINCT FROM p_expected THEN RAISE EXCEPTION USING ERRCODE='P5B09',MESSAGE='Close\
      \ plan changed';END IF;\r\n m:=calculation->'mutation';\r\n IF m->>'kind'='insert' THEN INSERT INTO public.\"Charges\"\
      (\"Row ID\",\"Ref Loans\",\"Charge Date\",\"Principal Due\",\"Interest Due\",\"Notes\") VALUES(m->>'chargeId',p_loan,p_day,(m->>'principal')::numeric::money,(m->>'interest')::numeric::money,'Final\
      \ charge prepared by Loan Close');\r\n ELSIF m->>'kind'='increase' THEN UPDATE public.\"Charges\" SET \"Principal Due\"\
      =(\"Principal Due\"::numeric+(m->>'principal')::numeric)::money WHERE \"Row ID\"=m->>'chargeId';END IF;\r\n RETURN calculation;\r\
      \nEND $function$\n"
