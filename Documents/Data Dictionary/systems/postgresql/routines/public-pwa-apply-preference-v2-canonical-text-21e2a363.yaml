    "definition": "CREATE OR REPLACE FUNCTION public.pwa_apply_preference_v2(canonical text)\n RETURNS jsonb\n LANGUAGE plpgsql\n\
      \ SET search_path TO 'pg_catalog', 'public'\nAS $function$\r\nDECLARE e jsonb:=canonical::jsonb;c jsonb:=e->'command';i\
      \ jsonb:=c->'inputs';target text:=c->>'targetId';today date:=(CURRENT_TIMESTAMP AT TIME ZONE 'Asia/Bangkok')::date;\r\
      \nBEGIN\r\n IF (current_database() NOT IN ('loan_manager_dev','payment_rehearsal','loan_manager_prod') OR current_user<>CASE\
      \ current_database() WHEN 'loan_manager_prod' THEN 'mw_app_prod_journal_owner' ELSE 'mw_app_dev_journal_owner' END)\
      \ OR target IS DISTINCT FROM e#>>'{actor,partnerId}' OR c->>'operation'<>'preference.update' THEN RAISE EXCEPTION USING\
      \ ERRCODE='42501',MESSAGE='Own preferences required';END IF;\r\n PERFORM 1 FROM public.\"Partners\" WHERE \"Row ID\"\
      =target FOR UPDATE;IF NOT FOUND THEN RAISE EXCEPTION USING ERRCODE='P5B02';END IF;\r\n PERFORM 1 FROM public.\"Cash\
      \ Statement Context\" WHERE \"Ref Partner\"=target FOR UPDATE;\r\n IF public.pwa_preference_version_v2(target) IS DISTINCT\
      \ FROM c->>'expectedVersion' THEN RAISE EXCEPTION USING ERRCODE='P5B01';END IF;\r\n IF i->>'statementAccountId' IS NOT\
      \ NULL AND NOT EXISTS(SELECT 1 FROM public.\"Cash Accounts\" WHERE \"Row ID\"=i->>'statementAccountId' AND \"Active\"\
      \ IS TRUE) THEN RAISE EXCEPTION USING ERRCODE='P5B04';END IF;\r\n IF i->>'statementDate' IS NOT NULL AND (i->>'statementDate')::date\
      \ NOT BETWEEN today-14 AND today THEN RAISE EXCEPTION USING ERRCODE='P5B08';END IF;\r\n UPDATE public.\"Partners\" SET\
      \ \"Language Preference\"=i->>'language' WHERE \"Row ID\"=target;\r\n INSERT INTO public.\"Cash Statement Context\"\
      (\"Ref Partner\",\"Ref Cash Account\",\"Statement Date\") VALUES(target,i->>'statementAccountId',(i->>'statementDate')::date)\
      \ ON CONFLICT(\"Ref Partner\") DO UPDATE SET \"Ref Cash Account\"=EXCLUDED.\"Ref Cash Account\",\"Statement Date\"=EXCLUDED.\"\
      Statement Date\";\r\n RETURN jsonb_build_object('operation','preference.update','targetType','preference','targetId',target,'paymentId',NULL,'plan',NULL,'predecessorRequestId',NULL,'sourceCreatedBy',NULL);\r\
      \nEND $function$\n"
