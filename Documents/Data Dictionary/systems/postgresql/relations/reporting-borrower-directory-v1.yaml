    "definition": {
      "schema": "public",
      "name": "reporting_borrower_directory_v1",
      "kind": "v",
      "owner": "postgres",
      "row_security": false,
      "force_row_security": false,
      "replica_identity": "n",
      "persistence": "p",
      "is_partition": false,
      "options": null,
      "acl": "{postgres=arwdDxtm/postgres,mw_integration_agent=r/postgres,metabase_borrower_reader=r/postgres}",
      "comment": null,
      "view_definition": " WITH loans AS (\n         SELECT reporting_borrower_loan_facts_v1.borrower_id,\n            count(*) AS loan_count,\n            count(*) FILTER (WHERE reporting_borrower_loan_facts_v1.is_active) AS active_loans,\n            min(reporting_borrower_loan_facts_v1.loan_date) AS first_loan_date,\n                CASE\n                    WHEN bool_and(reporting_borrower_loan_facts_v1.outstanding_principal IS NOT NULL) THEN sum(reporting_borrower_loan_facts_v1.outstanding_principal)\n                    ELSE NULL::numeric\n                END AS principal,\n            count(*) FILTER (WHERE reporting_borrower_loan_facts_v1.loan_date IS NULL OR reporting_borrower_loan_facts_v1.original_principal IS NULL OR reporting_borrower_loan_facts_v1.outstanding_principal IS NULL OR reporting_borrower_loan_facts_v1.is_active IS NULL) AS invalid_loans\n           FROM reporting_borrower_loan_facts_v1\n          GROUP BY reporting_borrower_loan_facts_v1.borrower_id\n        ), payments AS (\n         SELECT l_1.\"Ref Borrowers\" AS borrower_id,\n            max(r.\"Payment Date\") FILTER (WHERE r.\"Payment Date\" <= olap_reporting_date()) AS last_payment_date,\n                CASE\n                    WHEN bool_and(r.\"Interest Paid\" IS NOT NULL) THEN sum(r.\"Interest Paid\"::numeric) FILTER (WHERE r.\"Payment Date\" <= olap_reporting_date())\n                    ELSE NULL::numeric\n                END AS lifetime_interest,\n            count(*) FILTER (WHERE r.\"Payment Date\" IS NULL OR r.\"Principal Paid\" IS NULL OR r.\"Interest Paid\" IS NULL) AS invalid_payments\n           FROM olap_repayments_analytics r\n             LEFT JOIN olap_loans_analytics l_1 ON l_1.\"Row ID\" = r.\"Ref Loans\"\n          GROUP BY l_1.\"Ref Borrowers\"\n        ), names AS (\n         SELECT b_1.\"Row ID\" AS borrower_id,\n            COALESCE(NULLIF(b_1.\"Description\", ''::text), 'Unnamed borrower'::text) AS borrower_name,\n            b_1.\"Hidden Flag\" AS hidden_flag,\n            count(*) OVER (PARTITION BY (COALESCE(NULLIF(b_1.\"Description\", ''::text), 'Unnamed borrower'::text))) AS name_count\n           FROM olap_borrowers_analytics b_1\n        )\n SELECT b.borrower_id,\n    b.borrower_name,\n    b.borrower_name ||\n        CASE\n            WHEN b.name_count > 1 THEN ' · '::text || b.borrower_id\n            ELSE ''::text\n        END AS borrower_label,\n    b.hidden_flag,\n    COALESCE(l.loan_count, 0::bigint) AS loan_count,\n    COALESCE(l.active_loans, 0::bigint) AS active_loans,\n    COALESCE(l.active_loans, 0::bigint) > 0 AS has_active_loan,\n    l.first_loan_date,\n        CASE\n            WHEN l.borrower_id IS NULL THEN 0::numeric\n            ELSE l.principal\n        END AS outstanding_principal,\n    p.last_payment_date,\n        CASE\n            WHEN p.borrower_id IS NULL THEN 0::numeric\n            WHEN p.invalid_payments > 0 THEN NULL::numeric\n            ELSE COALESCE(p.lifetime_interest, 0::numeric)\n        END AS lifetime_interest,\n    COALESCE(l.invalid_loans, 0::bigint) + COALESCE(p.invalid_payments, 0::bigint) AS invalid_fact_count,\n    olap_reporting_date() AS reporting_date,\n    statement_timestamp() AS calculated_at\n   FROM names b\n     LEFT JOIN loans l USING (borrower_id)\n     LEFT JOIN payments p USING (borrower_id);",
      "partition_key": null,
      "partition_bound": null,
