  "content": {
    "definition": {
      "schema": "public",
      "name": "reporting_borrower_matrix_plot_v1",
      "kind": "v",
      "owner": "postgres",
      "row_security": false,
      "force_row_security": false,
      "replica_identity": "n",
      "persistence": "p",
      "is_partition": false,
      "options": null,
      "acl": "{postgres=arwdDxtm/postgres,mw_integration_agent=r/postgres,metabase_borrower_reader=r/postgres}",
      "comment": "R029 display-only coordinates: fixed 0-100 matrix, midpoint 50; high health left, contribution >=1x above. Modified schedules at x75 are categorical placement, not a changed payment score. V3 is unchanged. Padding affects rendering only; invalid inputs and Unclassified remain explicit.",
      "view_definition": " WITH inputs AS (\n         SELECT m.borrower_id,\n            m.contribution_30d,\n            m.active_borrower_count,\n            m.portfolio_contribution_30d,\n            m.contribution_share,\n            m.equal_share,\n            m.relative_contribution,\n            m.reliability_score,\n            m.confidence,\n            m.quadrant,\n            m.classification_reason,\n            m.outstanding_principal,\n            m.reporting_date,\n            m.calculated_at,\n            m.method_version,\n            m.payment_only_quadrant,\n            m.arrangement_status,\n            m.arrangement_gate,\n            m.modified_schedule_loan_count,\n            m.interest_coverage_30d,\n            m.interest_date_coverage_30d,\n            m.category_adjusted,\n                CASE\n                    WHEN m.quadrant = 'Unclassified'::text THEN 'Unclassified'::text\n                    WHEN (m.quadrant <> ALL (ARRAY['Star'::text, 'Cash Cow'::text, 'Question Mark'::text, 'Dog'::text])) OR m.reliability_score IS NULL OR m.reliability_score < 0::numeric OR m.reliability_score > 100::numeric OR m.relative_contribution IS NULL OR (m.relative_contribution::text = ANY (ARRAY['NaN'::text, 'Infinity'::text, '-Infinity'::text])) OR m.arrangement_gate IS NULL THEN 'Invalid plot input'::text\n                    WHEN (m.quadrant = ANY (ARRAY['Star'::text, 'Cash Cow'::text])) <> (m.reliability_score >= 80::numeric AND NOT m.arrangement_gate) OR (m.quadrant = ANY (ARRAY['Star'::text, 'Question Mark'::text])) <> (m.relative_contribution >= 1::numeric) THEN 'Invalid plot input'::text\n                    ELSE 'Plotted'::text\n                END AS plot_status\n           FROM reporting_borrower_matrix_v3 m\n        ), coordinates AS (\n         SELECT i.borrower_id,\n            i.contribution_30d,\n            i.active_borrower_count,\n            i.portfolio_contribution_30d,\n            i.contribution_share,\n            i.equal_share,\n            i.relative_contribution,\n            i.reliability_score,\n            i.confidence,\n            i.quadrant,\n            i.classification_reason,\n            i.outstanding_principal,\n            i.reporting_date,\n            i.calculated_at,\n            i.method_version,\n            i.payment_only_quadrant,\n            i.arrangement_status,\n            i.arrangement_gate,\n            i.modified_schedule_loan_count,\n            i.interest_coverage_30d,\n            i.interest_date_coverage_30d,\n            i.category_adjusted,\n            i.plot_status,\n                CASE\n                    WHEN i.plot_status = 'Plotted'::text THEN\n                    CASE\n                        WHEN i.arrangement_gate THEN 75::numeric\n                        WHEN i.reliability_score < 80::numeric THEN 100::numeric - 50::numeric * i.reliability_score / 80::numeric\n                        ELSE 50::numeric - 50::numeric * (i.reliability_score - 80::numeric) / 20::numeric\n                    END\n                    ELSE NULL::numeric\n                END AS matrix_x,\n                CASE\n                    WHEN i.plot_status = 'Plotted'::text THEN\n                    CASE\n                        WHEN i.relative_contribution < 0::numeric THEN 0::numeric\n                        ELSE 100::numeric * i.relative_contribution / (1::numeric + i.relative_contribution)\n                    END\n                    ELSE NULL::numeric\n                END AS matrix_y\n           FROM inputs i\n        )\n SELECT borrower_id,\n    contribution_30d,\n    active_borrower_count,\n    portfolio_contribution_30d,\n    contribution_share,\n    equal_share,\n    relative_contribution,\n    reliability_score,\n    confidence,\n    quadrant,\n    classification_reason,\n    outstanding_principal,\n    reporting_date,\n    calculated_at,\n    method_version,\n    payment_only_quadrant,\n    arrangement_status,\n    arrangement_gate,\n    modified_schedule_loan_count,\n    interest_coverage_30d,\n    interest_date_coverage_30d,\n    category_adjusted,\n    plot_status,\n    matrix_x,\n    matrix_y,\n        CASE\n            WHEN plot_status = 'Plotted'::text THEN\n            CASE\n                WHEN quadrant = ANY (ARRAY['Star'::text, 'Cash Cow'::text]) THEN GREATEST(2::numeric, LEAST(49.5, matrix_x))\n                ELSE GREATEST(50.5, LEAST(98::numeric, matrix_x))\n            END\n            ELSE NULL::numeric\n        END AS plot_x,\n        CASE\n            WHEN plot_status = 'Plotted'::text THEN\n            CASE\n                WHEN quadrant = ANY (ARRAY['Star'::text, 'Question Mark'::text]) THEN GREATEST(50.5, LEAST(98::numeric, matrix_y))\n                ELSE GREATEST(2::numeric, LEAST(49.5, matrix_y))\n            END\n            ELSE NULL::numeric\n        END AS plot_y,\n        CASE\n            WHEN plot_status <> 'Plotted'::text THEN plot_status\n            WHEN arrangement_gate THEN 'Modified-schedule category placement'::text\n            ELSE 'Measured score'::text\n        END AS position_basis,\n        CASE\n            WHEN plot_status = 'Plotted'::text THEN relative_contribution < 0::numeric\n            ELSE false\n        END AS contribution_clipped,\n    'bcg-display-v1'::text AS plot_method_version\n   FROM coordinates c;",
      "partition_key": null,
      "partition_bound": null,
      "parents": null,
      "extension": null
    },
