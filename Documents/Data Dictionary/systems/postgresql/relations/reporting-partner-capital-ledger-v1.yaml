      "acl": "{postgres=arwdDxtm/postgres,mw_integration_agent=r/postgres,metabase_borrower_reader=r/postgres}",
      "comment": null,
      "view_definition": " WITH dated AS (\n         SELECT reporting_partner_capital_v1.partner_id,\n            reporting_partner_capital_v1.activity_date,\n            sum(reporting_partner_capital_v1.net_movement) AS movement\n           FROM reporting_partner_capital_v1\n          WHERE reporting_partner_capital_v1.activity_date IS NOT NULL\n          GROUP BY reporting_partner_capital_v1.partner_id, reporting_partner_capital_v1.activity_date\n        ), balances AS (\n         SELECT dated.partner_id,\n            dated.activity_date,\n            sum(dated.movement) OVER (PARTITION BY dated.partner_id ORDER BY dated.activity_date ROWS UNBOUNDED PRECEDING) AS date_end_capital\n           FROM dated\n        )\n SELECT c.capital_id,\n    c.partner_id,\n    c.partner_name,\n    c.partner_role,\n    c.activity_date,\n    c.transaction_type,\n    c.amount,\n    c.net_movement,\n    c.valid,\n    b.date_end_capital\n   FROM reporting_partner_capital_v1 c\n     LEFT JOIN balances b USING (partner_id, activity_date);",
      "partition_key": null,
      "partition_bound": null,
      "parents": null,
      "extension": null
    },
