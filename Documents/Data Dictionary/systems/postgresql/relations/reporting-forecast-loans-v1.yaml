  "content": {
    "definition": {
      "schema": "public",
      "name": "reporting_forecast_loans_v1",
      "kind": "v",
      "owner": "postgres",
      "row_security": false,
      "force_row_security": false,
      "replica_identity": "n",
      "persistence": "p",
      "is_partition": false,
      "options": null,
      "acl": "{postgres=arwdDxtm/postgres,mw_integration_agent=r/postgres,metabase_borrower_reader=r/postgres}",
      "comment": null,
      "view_definition": " WITH ev AS (\n         SELECT reporting_forecast_events_v1.loan_id,\n            COALESCE(sum(reporting_forecast_events_v1.interest) FILTER (WHERE reporting_forecast_events_v1.eligible AND (reporting_forecast_events_v1.bucket = ANY (ARRAY['Today'::text, 'Future'::text]))), 0::numeric) AS ui,\n            COALESCE(sum(reporting_forecast_events_v1.principal) FILTER (WHERE reporting_forecast_events_v1.eligible AND (reporting_forecast_events_v1.bucket = ANY (ARRAY['Today'::text, 'Future'::text]))), 0::numeric) AS up,\n            COALESCE(sum(reporting_forecast_events_v1.interest) FILTER (WHERE reporting_forecast_events_v1.eligible AND reporting_forecast_events_v1.bucket = 'Overdue'::text), 0::numeric) AS oi,\n            COALESCE(sum(reporting_forecast_events_v1.principal) FILTER (WHERE reporting_forecast_events_v1.eligible AND reporting_forecast_events_v1.bucket = 'Overdue'::text), 0::numeric) AS op,\n            COALESCE(sum(reporting_forecast_events_v1.interest) FILTER (WHERE reporting_forecast_events_v1.bucket = 'Recovery only'::text), 0::numeric) AS xi,\n            COALESCE(sum(reporting_forecast_events_v1.principal) FILTER (WHERE reporting_forecast_events_v1.bucket = 'Recovery only'::text), 0::numeric) AS xp,\n            COALESCE(sum(reporting_forecast_events_v1.interest) FILTER (WHERE reporting_forecast_events_v1.eligible AND (reporting_forecast_events_v1.bucket = ANY (ARRAY['Today'::text, 'Future'::text])) AND reporting_forecast_events_v1.origin = 'Recorded'::text), 0::numeric) AS recorded_interest,\n            COALESCE(sum(reporting_forecast_events_v1.interest) FILTER (WHERE reporting_forecast_events_v1.origin = 'Simulated'::text), 0::numeric) AS simulated_interest,\n            min(reporting_forecast_events_v1.due_date) FILTER (WHERE reporting_forecast_events_v1.eligible AND (reporting_forecast_events_v1.bucket = ANY (ARRAY['Today'::text, 'Future'::text])) AND (reporting_forecast_events_v1.principal + reporting_forecast_events_v1.interest) > 0::numeric) AS next_due,\n            bool_or(reporting_forecast_events_v1.origin = 'Exception'::text) AS incomplete,\n            string_agg(DISTINCT reporting_forecast_events_v1.issue, '; '::text ORDER BY reporting_forecast_events_v1.issue) AS issues\n           FROM reporting_forecast_events_v1\n          GROUP BY reporting_forecast_events_v1.loan_id\n        ), actual AS (\n         SELECT reporting_forecast_actuals_v1.loan_id,\n            sum(reporting_forecast_actuals_v1.interest) AS actual_interest\n           FROM reporting_forecast_actuals_v1\n          GROUP BY reporting_forecast_actuals_v1.loan_id\n        )\n SELECT i.loan_id,\n    i.borrower_id,\n    i.borrower,\n    i.loan_type,\n    i.loan_status,\n    i.defaulted,\n    i.outstanding_principal,\n    i.reporting_date,\n    i.month_end,\n    COALESCE(e.ui, 0::numeric) AS ui,\n    COALESCE(e.up, 0::numeric) AS up,\n    COALESCE(e.oi, 0::numeric) AS oi,\n    COALESCE(e.op, 0::numeric) AS op,\n    COALESCE(e.xi, 0::numeric) AS xi,\n    COALESCE(e.xp, 0::numeric) AS xp,\n    COALESCE(e.recorded_interest, 0::numeric) AS recorded_interest,\n    COALESCE(e.simulated_interest, 0::numeric) AS simulated_interest,\n    COALESCE(a.actual_interest, 0::numeric) AS actual_interest,\n    e.next_due,\n    COALESCE(e.incomplete, false) AS incomplete,\n    e.issues,\n    COALESCE(h.arrangement_status, 'Not assessed'::text) AS arrangement_status\n   FROM reporting_forecast_inputs_v1 i\n     LEFT JOIN ev e USING (loan_id)\n     LEFT JOIN actual a USING (loan_id)\n     LEFT JOIN reporting_loan_schedule_health_v1 h USING (loan_id);",
      "partition_key": null,
      "partition_bound": null,
      "parents": null,
      "extension": null
    },
