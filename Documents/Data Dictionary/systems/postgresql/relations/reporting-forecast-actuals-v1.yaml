    "definition": {
      "schema": "public",
      "name": "reporting_forecast_actuals_v1",
      "kind": "v",
      "owner": "postgres",
      "row_security": false,
      "force_row_security": false,
      "replica_identity": "n",
      "persistence": "p",
      "is_partition": false,
      "options": null,
      "acl": "{postgres=arwdDxtm/postgres,mw_integration_agent=r/postgres,metabase_borrower_reader=r/postgres}",
      "comment": null,
      "view_definition": " SELECT r.\"Row ID\" AS repayment_id,\n    r.\"Ref Loans\" AS loan_id,\n    l.\"Ref Borrowers\" AS borrower_id,\n    COALESCE(NULLIF(b.\"Description\", ''::text), b.\"Borrower Name\", 'Unmapped'::text) AS borrower,\n        CASE l.\"Loan Type\"\n            WHEN 'ดอกเบี้ยรายวัน'::text THEN 'Daily Interest'::text\n            WHEN 'กำหนดวันชำระ'::text THEN 'Fixed Due Date'::text\n            WHEN 'ผ่อนชำระรายวัน'::text THEN 'Daily Installment'::text\n            ELSE 'Unknown'::text\n        END AS loan_type,\n    r.\"Payment Date\" AS payment_date,\n    r.\"Interest Paid\"::numeric AS interest,\n    r.\"Principal Paid\"::numeric AS principal,\n    l.\"Row ID\" IS NULL OR b.\"Row ID\" IS NULL OR r.\"Interest Paid\" IS NULL OR r.\"Principal Paid\" IS NULL AS invalid\n   FROM \"Repayments\" r\n     LEFT JOIN \"Loans\" l ON l.\"Row ID\" = r.\"Ref Loans\"\n     LEFT JOIN \"Borrowers\" b ON b.\"Row ID\" = l.\"Ref Borrowers\"\n  WHERE r.\"Payment Date\" >= date_trunc('month'::text, olap_reporting_date()::timestamp with time zone)::date AND r.\"Payment Date\" <= olap_reporting_date();",
      "partition_key": null,
      "partition_bound": null,
      "parents": null,
      "extension": null
    },
