      "acl": "{postgres=arwdDxtm/postgres,mw_integration_agent=r/postgres,metabase_borrower_reader=r/postgres}",
      "comment": "R044 complete read-only settlement projection including future/undated Pending reservations and retained Cancelled audit rows. No contact or bank details.",
      "view_definition": " SELECT s.\"Row ID\" AS settlement_id,\n    s.\"Ref Partner\" AS partner_id,\n    p.\"Partner Name\" AS partner_name,\n    p.\"Partner Role\" AS partner_role,\n    s.\"Transfer Date\" AS activity_date,\n    s.\"Amount\"::numeric AS amount,\n    s.\"Status\" AS status,\n        CASE\n            WHEN s.\"Status\" = 'Completed'::text THEN s.\"Amount\"::numeric\n            ELSE 0::numeric\n        END AS completed_amount,\n        CASE\n            WHEN s.\"Status\" = 'Pending'::text THEN s.\"Amount\"::numeric\n            ELSE 0::numeric\n        END AS pending_amount,\n        CASE\n            WHEN s.\"Status\" IS DISTINCT FROM 'Cancelled'::text THEN s.\"Amount\"::numeric\n            ELSE 0::numeric\n        END AS reserved_amount,\n    ((p.\"Partner Role\" = ANY (ARRAY['A'::text, 'B'::text])) AND s.\"Amount\" IS NOT NULL AND s.\"Amount\"::numeric > 0::numeric AND (s.\"Status\" = ANY (ARRAY['Completed'::text, 'Pending'::text, 'Cancelled'::text]))) IS TRUE AS valid,\n        CASE\n            WHEN s.\"Transfer Date\" IS NULL THEN 'Date missing'::text\n            WHEN s.\"Transfer Date\" > olap_reporting_date() THEN 'Future transfer date'::text\n            ELSE 'Dated'::text\n        END AS date_status\n   FROM \"Settlements\" s\n     LEFT JOIN \"Partners\" p ON p.\"Row ID\" = s.\"Ref Partner\";",
      "partition_key": null,
      "partition_bound": null,
      "parents": null,
      "extension": null
    },
