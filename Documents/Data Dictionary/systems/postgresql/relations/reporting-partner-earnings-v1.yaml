      "view_definition": " WITH mapping AS (\n         SELECT \"Partners\".\"Partner Role\" AS role,\n            min(\"Partners\".\"Row ID\") AS partner_id\n           FROM \"Partners\"\n          WHERE \"Partners\".\"Partner Role\" = ANY (ARRAY['A'::text, 'B'::text])\n          GROUP BY \"Partners\".\"Partner Role\"\n         HAVING count(*) = 1\n        ), events AS (\n         SELECT 'Interest'::text AS event_type,\n            r.\"Row ID\" AS event_id,\n            r.\"Payment Date\" AS activity_date,\n            v.role,\n            v.amount AS allocated_interest,\n            0::numeric AS allocated_expense,\n            r.\"Interest Paid\" IS NOT NULL AS amount_known\n           FROM olap_repayments_analytics r\n             CROSS JOIN LATERAL ( VALUES ('A'::text,r.\"Partner A Profit\"), ('B'::text,r.\"Partner B Profit\")) v(role, amount)\n        UNION ALL\n         SELECT 'Expense'::text,\n            e_1.\"Row ID\",\n            e_1.\"Expense Date\",\n            v.role,\n            0::numeric AS \"numeric\",\n            v.amount,\n            e_1.\"Amount\" IS NOT NULL\n           FROM \"Business Expenses\" e_1\n             CROSS JOIN LATERAL ( VALUES ('A'::text,e_1.\"Partner A Expense\"::numeric), ('B'::text,e_1.\"Partner B Expense\"::numeric)) v(role, amount)\n        )\n SELECT e.event_type,\n    e.event_id,\n    e.activity_date,\n    e.role,\n    e.allocated_interest,\n    e.allocated_expense,\n    e.amount_known,\n    m.partner_id,\n    p.\"Partner Name\" AS partner_name,\n    e.allocated_interest - e.allocated_expense AS net_earned,\n    m.partner_id IS NOT NULL AND e.activity_date IS NOT NULL AND e.amount_known AND e.allocated_interest IS NOT NULL AND e.allocated_expense IS NOT NULL AS valid\n   FROM events e\n     LEFT JOIN mapping m ON m.role = e.role\n     LEFT JOIN \"Partners\" p ON p.\"Row ID\" = m.partner_id;",
