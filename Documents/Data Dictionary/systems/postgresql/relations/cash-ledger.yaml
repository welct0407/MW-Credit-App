    "cash_ledger_direction":
      "Table": "Cash Ledger"
      "Constraint": "cash_ledger_direction"
      "Type": "c"
      "Validated": true
      "Definition": "CHECK (((COALESCE(\"Ref From Cash Holder\", \"Ref To Cash Holder\") IS NOT NULL) AND (\"Ref From Cash\
        \ Holder\" IS DISTINCT FROM \"Ref To Cash Holder\")))"
    "cash_ledger_source":
      "Table": "Cash Ledger"
      "Constraint": "cash_ledger_source"
      "Type": "c"
      "Validated": true
      "Definition": "CHECK ((((\"Entry Origin\" = 'Manual'::text) AND (\"Source Type\" = 'Manual'::text) AND (\"Source Key\"\
        \ = ('MANUAL:'::text || \"Row ID\")) AND (\"Ref Payment\" IS NULL) AND (\"Ref Loan\" IS NULL) AND (\"Ref Settlement\"\
        \ IS NULL) AND (\"Movement Type\" = ANY (ARRAY['Cash Handover'::text, 'Expense Reimbursement'::text, 'Opening Balance'::text,\
        \ 'Manual Correction'::text]))) OR ((\"Entry Origin\" = 'System'::text) AND (((\"Source Type\" = 'Payment'::text)\
        \ AND (\"Movement Type\" = 'Payment Receipt'::text) AND (\"Source Key\" = ('PAYMENT:'::text || \"Ref Payment\")) AND\
        \ (\"Ref Payment\" IS NOT NULL) AND (num_nonnulls(\"Ref Payment\", \"Ref Loan\", \"Ref Business Expense\", \"Ref Settlement\"\
        ) = 1)) OR ((\"Source Type\" = 'Loan'::text) AND (\"Movement Type\" = 'Loan Disbursement'::text) AND (\"Source Key\"\
        \ = ('LOAN:'::text || \"Ref Loan\")) AND (\"Ref Loan\" IS NOT NULL) AND (num_nonnulls(\"Ref Payment\", \"Ref Loan\"\
        , \"Ref Business Expense\", \"Ref Settlement\") = 1)) OR ((\"Source Type\" = 'Business Expense'::text) AND (\"Movement\
        \ Type\" = 'Business Expense'::text) AND (\"Source Key\" = ('EXPENSE:'::text || \"Ref Business Expense\")) AND (\"\
        Ref Business Expense\" IS NOT NULL) AND (num_nonnulls(\"Ref Payment\", \"Ref Loan\", \"Ref Business Expense\", \"\
        Ref Settlement\") = 1)) OR ((\"Source Type\" = 'Settlement'::text) AND (\"Movement Type\" = 'Partner Settlement'::text)\
        \ AND (\"Source Key\" = ('SETTLEMENT:'::text || \"Ref Settlement\")) AND (\"Ref Settlement\" IS NOT NULL) AND (num_nonnulls(\"\
        Ref Payment\", \"Ref Loan\", \"Ref Business Expense\", \"Ref Settlement\") = 1))))))"
