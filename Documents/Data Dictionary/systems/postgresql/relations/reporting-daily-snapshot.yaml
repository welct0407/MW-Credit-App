    "acl": "{postgres=arwdDxtm/postgres,mw_integration_agent=r/postgres,metabase_borrower_reader=r/postgres}"
    "comment": "R016 stored portfolio/date history. Sum daily flows; select EOD balances at a date, never sum them across\
      \ dates. Current operational cards must use existing live providers. Reconstructed from current source facts, not an\
      \ as-recorded audit archive."
    "view_definition": |2-
       SELECT "Row ID",
          "Snapshot Date",
          "Generated At",
          "Model Version",
          "Principal Issued",
          "Loans Issued",
          "Principal Returned",
          "Interest Received",
          "Repayments Count",
          "Outstanding Principal EOD",
          "Active Loans EOD",
          "Active Borrowers EOD",
          "Pending Charges EOD",
          "Total Cash Pool EOD",
          "Available Cash EOD",
          "Unsettled Profit EOD",
          "Business Expenses",
          "Net Profit",
          "Net Unsettled Profit EOD",
          "Capital Contributed",
          "Capital Withdrawn",
          "Partner Settlements",
          "Partner A Net Profit",
          "Partner B Net Profit",
          "Partner A Settlements",
          "Partner B Settlements",
          "Cash Money In",
          "Cash Money Out",
          "Cash Opening Balance",
          "Cash Balance EOD",
          "Cash Available From",
          "Cash Balance Status",
          "Snapshot Date" = olap_reporting_date() AS "Provisional",
          'Hourly snapshot'::text AS "Freshness Basis"
         FROM "Daily Analytics" a;
    "partition_key": null
    "partition_bound": null
    "parents": null
    "extension": null
