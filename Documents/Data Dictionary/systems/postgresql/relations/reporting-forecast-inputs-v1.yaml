      "view_definition": " WITH ctx AS (\n         SELECT olap_reporting_date() AS t\n        ), repayments AS (\n         SELECT \"Repayments\".\"Ref Loans\" AS loan_id,\n            COALESCE(sum(\"Repayments\".\"Principal Paid\"::numeric) FILTER (WHERE \"Repayments\".\"Payment Date\" <= ctx_1.t), 0::numeric) AS principal,\n            bool_or(\"Repayments\".\"Payment Date\" IS NULL OR \"Repayments\".\"Principal Paid\" IS NULL OR \"Repayments\".\"Interest Paid\" IS NULL OR \"Repayments\".\"Payment Date\" > ctx_1.t) AS invalid\n           FROM \"Repayments\"\n             CROSS JOIN ctx ctx_1\n          GROUP BY \"Repayments\".\"Ref Loans\"\n        ), paid AS (\n         SELECT r_1.\"Ref Charges\" AS charge_id,\n            sum(r_1.\"Principal Paid\"::numeric) FILTER (WHERE r_1.\"Payment Date\" <= ctx_1.t) AS p,\n            sum(r_1.\"Interest Paid\"::numeric) FILTER (WHERE r_1.\"Payment Date\" <= ctx_1.t) AS i,\n            bool_or(r_1.\"Payment Date\" IS NULL OR r_1.\"Principal Paid\" IS NULL OR r_1.\"Interest Paid\" IS NULL OR r_1.\"Ref Loans\" IS DISTINCT FROM c_1.\"Ref Loans\") AS invalid\n           FROM \"Repayments\" r_1\n             LEFT JOIN \"Charges\" c_1 ON c_1.\"Row ID\" = r_1.\"Ref Charges\"\n             CROSS JOIN ctx ctx_1\n          GROUP BY r_1.\"Ref Charges\"\n        ), charges AS (\n         SELECT c_1.\"Ref Loans\" AS loan_id,\n            jsonb_agg(jsonb_build_object('id', c_1.\"Row ID\", 'date', c_1.\"Charge Date\", 'pdue', c_1.\"Principal Due\"::numeric, 'idue', c_1.\"Interest Due\"::numeric, 'ppaid', COALESCE(p.p, 0::numeric), 'ipaid', COALESCE(p.i, 0::numeric), 'invalid', COALESCE(p.invalid, false) OR c_1.\"Charge Date\" IS NULL OR c_1.\"Principal Due\" IS NULL OR c_1.\"Interest Due\" IS NULL)) AS charges\n           FROM \"Charges\" c_1\n             LEFT JOIN paid p ON p.charge_id = c_1.\"Row ID\"\n          GROUP BY c_1.\"Ref Loans\"\n        )\n SELECT l.\"Row ID\" AS loan_id,\n    l.\"Ref Borrowers\" AS borrower_id,\n    COALESCE(NULLIF(b.\"Description\", ''::text), b.\"Borrower Name\", l.\"Ref Borrowers\", 'Unmapped'::text) AS borrower,\n        CASE l.\"Loan Type\"\n            WHEN 'ดอกเบี้ยรายวัน'::text THEN 'Daily Interest'::text\n            WHEN 'กำหนดวันชำระ'::text THEN 'Fixed Due Date'::text\n            WHEN 'ผ่อนชำระรายวัน'::text THEN 'Daily Installment'::text\n            ELSE 'Unknown'::text\n        END AS loan_type,\n    l.\"Loan Status\" AS loan_status,\n    COALESCE(l.\"Defaulted\", false) AS defaulted,\n    l.\"Principal Amount\"::numeric - COALESCE(r.principal, 0::numeric) AS outstanding_principal,\n    ctx.t AS reporting_date,\n    (date_trunc('month'::text, ctx.t::timestamp with time zone) + '1 mon -1 days'::interval)::date AS month_end,\n    jsonb_build_object('status', l.\"Loan Status\", 'defaulted', COALESCE(l.\"Defaulted\", false), 'start', l.\"Loan Date\", 'close', l.\"Close Date\", 'balance', l.\"Principal Amount\"::numeric - COALESCE(r.principal, 0::numeric), 'daily', l.\"Current Daily Interest\"::numeric, 'auto', l.\"Auto Charge Enabled\", 'interval', l.\"Interest Payment Interval\", 'anchor', l.\"Interest Schedule Anchor Date\", 'type', l.\"Loan Type\", 'due', l.\"Due Date\", 'arrangement', l.\"Loan Arrangement\", 'original', l.\"Principal Amount\"::numeric, 'payment', l.\"Daily Payment Amount\"::numeric, 'fixed', l.\"Fixed Interest\"::numeric, 'invalid', l.\"Loan Date\" IS NULL OR l.\"Principal Amount\" IS NULL OR b.\"Row ID\" IS NULL OR COALESCE(r.invalid, false)) AS loan,\n    COALESCE(c.charges, '[]'::jsonb) AS charges\n   FROM \"Loans\" l\n     LEFT JOIN \"Borrowers\" b ON b.\"Row ID\" = l.\"Ref Borrowers\"\n     LEFT JOIN repayments r ON r.loan_id = l.\"Row ID\"\n     LEFT JOIN charges c ON c.loan_id = l.\"Row ID\"\n     CROSS JOIN ctx;",
