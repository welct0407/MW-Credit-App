    "acl": "{postgres=arwdDxtm/postgres,mw_integration_agent=r/postgres,metabase_borrower_reader=r/postgres}"
    "comment": "R016 stored account/date history. Holder ownership immutable; labels are current. Select one date before summing\
      \ accounts. Current operational cards use Cash Account Balances. Positive/negative parts are derived, not stored twice."
    "view_definition": |2-
       SELECT a."Row ID",
          a."Snapshot Date",
          a."Ref Cash Account",
          a."Generated At",
          a."Model Version",
          a."Money In",
          a."Money Out",
          a."Opening Balance",
          a."Closing Balance",
          a."Transaction Count",
          a."Available From",
          a."Balance Status",
          c."Ref Cash Holder",
          c."Account Label",
          h."Holder Name",
          a."Money In" - a."Money Out" AS "Net Movement",
              CASE
                  WHEN a."Closing Balance" IS NOT NULL THEN GREATEST(a."Closing Balance", 0::numeric)
                  ELSE NULL::numeric
              END AS "Positive Cash Balance",
              CASE
                  WHEN a."Closing Balance" IS NOT NULL THEN GREATEST(- a."Closing Balance", 0::numeric)
                  ELSE NULL::numeric
              END AS "Negative Balance Amount",
          a."Snapshot Date" = olap_reporting_date() AS "Provisional",
          'Hourly snapshot'::text AS "Freshness Basis"
         FROM "Cash Account Daily Analytics" a
           JOIN "Cash Accounts" c ON c."Row ID" = a."Ref Cash Account"
           JOIN "Cash Holders" h ON h."Row ID" = c."Ref Cash Holder";
    "partition_key": null
    "partition_bound": null
    "parents": null
    "extension": null
