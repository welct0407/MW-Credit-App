      "comment": null,
      "view_definition": " SELECT olap_reporting_date() AS reporting_date,\n    statement_timestamp() AS calculated_at,\n    c.\"Business Cash Held\" AS current_cash,\n    c.\"Cash Status\" AS cash_status,\n    ( SELECT count(*) AS count\n           FROM \"Repayments\"\n          WHERE \"Repayments\".\"Payment Date\" IS NULL OR \"Repayments\".\"Interest Paid\" IS NULL OR \"Repayments\".\"Principal Paid\" IS NULL) AS invalid_receipts,\n    ( SELECT count(*) AS count\n           FROM \"Charges\" c_1\n             LEFT JOIN \"Loans\" l ON l.\"Row ID\" = c_1.\"Ref Loans\"\n          WHERE l.\"Row ID\" IS NULL) AS orphan_charges\n   FROM ( SELECT 1 AS \"?column?\") anchor\n     LEFT JOIN reporting_cash_daily c ON c.\"Date\" = olap_reporting_date();",
