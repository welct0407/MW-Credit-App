  "constraints":
    "Business Expenses_Expense Category_check":
      "Table": "DEV Business Expenses"
      "Constraint": "Business Expenses_Expense Category_check"
      "Type": "c"
      "Validated": "Yes"
      "Definition": "CHECK ((btrim(\"Expense Category\") <> ''::text))"
    "Business Expenses_Amount_check":
      "Table": "DEV Business Expenses"
      "Constraint": "Business Expenses_Amount_check"
      "Type": "c"
      "Validated": "Yes"
      "Definition": "CHECK ((((\"Amount\")::numeric <> (0)::numeric) AND ((\"Amount\")::numeric = round((\"Amount\")::numeric))))"
    "Business Expenses_Source Type_check":
      "Table": "DEV Business Expenses"
      "Constraint": "Business Expenses_Source Type_check"
      "Type": "c"
      "Validated": "Yes"
      "Definition": "CHECK ((\"Source Type\" = ANY (ARRAY['Manual'::text, 'Referral Rebate'::text])))"
    "Business Expenses_check":
      "Table": "DEV Business Expenses"
      "Constraint": "Business Expenses_check"
      "Type": "c"
      "Validated": "Yes"
      "Definition": "CHECK (((\"Partner A Expense\" + \"Partner B Expense\") = \"Amount\"))"
    "Business Expenses_check1":
      "Table": "DEV Business Expenses"
      "Constraint": "Business Expenses_check1"
      "Type": "c"
      "Validated": "Yes"
      "Definition": "CHECK (((\"Partner A Share\" + \"Partner B Share\") = (1)::numeric))"
    "Business Expenses_check2":
      "Table": "DEV Business Expenses"
      "Constraint": "Business Expenses_check2"
      "Type": "c"
      "Validated": "Yes"
      "Definition": "CHECK (((\"Source Type\" <> 'Referral Rebate'::text) OR (((\"Amount\")::numeric > (0)::numeric) AND (\"\
        Ref Related Loan\" IS NOT NULL) AND (\"Ref Related Borrower\" IS NOT NULL) AND (\"Ref Payee Borrower\" IS NOT NULL)\
        \ AND (\"Source Key\" = ('REFERRAL_REBATE:'::text || \"Ref Related Loan\")) AND (\"Rule Version\" = 'REFERRAL_REBATE_V1'::text))))"
