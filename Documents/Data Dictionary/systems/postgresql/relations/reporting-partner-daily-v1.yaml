      "view_definition": " WITH bounds AS (\n         SELECT LEAST(COALESCE(min(x.d), olap_reporting_date()), olap_reporting_date()) AS starts\n           FROM ( SELECT reporting_partner_capital_v1.activity_date AS d\n                   FROM reporting_partner_capital_v1\n                UNION ALL\n                 SELECT reporting_partner_earnings_v1.activity_date\n                   FROM reporting_partner_earnings_v1\n                UNION ALL\n                 SELECT reporting_partner_settlements_v1.activity_date\n                   FROM reporting_partner_settlements_v1) x\n        ), dates AS (\n         SELECT generate_series(bounds.starts::timestamp with time zone, olap_reporting_date()::timestamp with time zone, '1 day'::interval)::date AS activity_date\n           FROM bounds\n        ), capital AS (\n         SELECT reporting_partner_capital_v1.partner_id,\n            reporting_partner_capital_v1.activity_date,\n            sum(reporting_partner_capital_v1.amount) FILTER (WHERE reporting_partner_capital_v1.transaction_type = 'Contribution'::text) AS contributed,\n            sum(reporting_partner_capital_v1.amount) FILTER (WHERE reporting_partner_capital_v1.transaction_type = 'Withdrawal'::text) AS withdrawn,\n            sum(reporting_partner_capital_v1.net_movement) AS movement\n           FROM reporting_partner_capital_v1\n          GROUP BY reporting_partner_capital_v1.partner_id, reporting_partner_capital_v1.activity_date\n        ), earnings AS (\n         SELECT reporting_partner_earnings_v1.partner_id,\n            reporting_partner_earnings_v1.activity_date,\n            sum(reporting_partner_earnings_v1.allocated_interest) AS interest,\n            sum(reporting_partner_earnings_v1.allocated_expense) AS expense\n           FROM reporting_partner_earnings_v1\n          GROUP BY reporting_partner_earnings_v1.partner_id, reporting_partner_earnings_v1.activity_date\n        ), settled AS (\n         SELECT reporting_partner_settlements_v1.partner_id,\n            reporting_partner_settlements_v1.activity_date,\n            sum(reporting_partner_settlements_v1.completed_amount) AS completed\n           FROM reporting_partner_settlements_v1\n          GROUP BY reporting_partner_settlements_v1.partner_id, reporting_partner_settlements_v1.activity_date\n        ), daily AS (\n         SELECT p.partner_id,\n            p.partner_name,\n            d_1.activity_date,\n            p.ready,\n            p.capital_exceptions,\n            p.earnings_exceptions,\n            p.settlement_exceptions,\n                CASE\n                    WHEN p.capital_exceptions = 0 AND p.earnings_exceptions = 0 AND p.role_count = 1 THEN COALESCE(e.interest, 0::numeric)\n                    ELSE NULL::numeric\n                END AS allocated_interest,\n                CASE\n                    WHEN p.capital_exceptions = 0 AND p.earnings_exceptions = 0 AND p.role_count = 1 THEN COALESCE(e.expense, 0::numeric)\n                    ELSE NULL::numeric\n                END AS allocated_expense,\n                CASE\n                    WHEN p.settlement_exceptions = 0 THEN COALESCE(s.completed, 0::numeric)\n                    ELSE NULL::numeric\n                END AS completed_payouts,\n                CASE\n                    WHEN p.capital_exceptions = 0 THEN COALESCE(c.contributed, 0::numeric)\n                    ELSE NULL::numeric\n                END AS capital_contributed,\n                CASE\n                    WHEN p.capital_exceptions = 0 THEN COALESCE(c.withdrawn, 0::numeric)\n                    ELSE NULL::numeric\n                END AS capital_withdrawn,\n                CASE\n                    WHEN p.capital_exceptions = 0 THEN COALESCE(c.movement, 0::numeric)\n                    ELSE NULL::numeric\n                END AS capital_movement\n           FROM reporting_partner_position_v1 p\n             CROSS JOIN dates d_1\n             LEFT JOIN capital c USING (partner_id, activity_date)\n             LEFT JOIN earnings e USING (partner_id, activity_date)\n             LEFT JOIN settled s USING (partner_id, activity_date)\n        )\n SELECT partner_id,\n    partner_name,\n    activity_date,\n    ready,\n    capital_exceptions,\n    earnings_exceptions,\n    settlement_exceptions,\n    allocated_interest,\n    allocated_expense,\n    completed_payouts,\n    capital_contributed,\n    capital_withdrawn,\n    capital_movement,\n    allocated_interest - allocated_expense AS net_earned,\n        CASE\n            WHEN capital_exceptions = 0 THEN sum(capital_movement) OVER (PARTITION BY partner_id ORDER BY activity_date ROWS UNBOUNDED PRECEDING)\n            ELSE NULL::numeric\n        END AS capital_eod\n   FROM daily d;",
