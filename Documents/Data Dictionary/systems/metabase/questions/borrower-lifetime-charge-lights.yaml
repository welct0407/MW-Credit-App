    "kind": "question",
    "name": "369 / Latest seven charges · oldest → newest",
    "scope": "production"
  },
  "verification": {
    "status": "documented",
    "source": "outputs/r050-borrower-lifetime/saved.json"
  },
  "content": {
    "key": "charge-lights",
    "id": 369,
    "name": "Latest seven charges · oldest → newest",
    "description": "Latest seven eligible individual charges due before today, ordered by due date and immutable charge ID. Overdue: current remaining >0.005; green: fully paid on time; orange: settled late. Today/future, invalid, zero and default-accounting obligations excluded. Grey means fewer than seven eligible charges. Hover a light for date, loan and amounts. No date-filter mapping.",
    "display": "scatter",
    "dataset_query": {
      "stages": [
        {
          "template-tags": [
            {
              "display-name": "Borrower",
              "id": "bp-borrower",
              "name": "borrower_id",
              "type": "text"
            }
          ],
          "lib/type": "mbql.stage/native",
          "native": "WITH chosen AS (SELECT * FROM public.reporting_borrower_directory_v1 WHERE borrower_id= [[{{borrower_id}} --]] '__select_borrower__'\n), latest AS (SELECT h.*,row_number() OVER(ORDER BY h.due_date DESC,h.charge_id DESC) rn\n FROM chosen c JOIN public.reporting_charge_payment_health_v1 h USING(borrower_id) WHERE h.history_eligible ORDER BY h.due_date DESC,h.charge_id DESC LIMIT 7)\n SELECT s.pos AS \"Position\",1 AS \"Light\",1 AS \"Size\",\n CASE WHEN h.charge_id IS NULL THEN 'No earlier charge' WHEN h.is_overdue THEN 'Overdue' WHEN h.on_time THEN 'Paid on time' ELSE 'Paid late' END AS \"Status\",\n h.due_date AS \"Charge date\",c.borrower_name||'-'||to_char(l.original_principal,'FM999,999,999,990.00')||'-'||to_char(l.loan_date,'DD/MM') AS \"Loan\",h.principal_due AS \"Principal due ฿\",h.interest_due AS \"Interest due ฿\",\n h.remaining_current AS \"Remaining ฿\",h.final_settlement_date AS \"Settlement before today\"\n FROM chosen c CROSS JOIN generate_series(1,7) s(pos) LEFT JOIN latest h ON h.rn=8-s.pos\n LEFT JOIN public.reporting_borrower_loan_facts_v1 l ON l.loan_id=h.loan_id ORDER BY s.pos"
        }
      ],
      "lib/type": "mbql/query",
      "database": 2
    },
    "visualization_settings": {
      "graph.show_values": false,
      "scatter.bubble": "Size",
      "graph.show_legend": true,
      "graph.x_axis.labels_enabled": false,
      "graph.y_axis.max": 2,
      "graph.x_axis.axis_enabled": false,
      "graph.y_axis.labels_enabled": false,
      "graph.y_axis.auto_split": false,
      "graph.metrics": [
        "Light"
      ],
      "graph.y_axis.axis_enabled": false,
      "graph.tooltip_columns": [
        "[\"name\",\"Status\"]",
        "[\"name\",\"Charge date\"]",
        "[\"name\",\"Loan\"]",
        "[\"name\",\"Principal due ฿\"]",
        "[\"name\",\"Interest due ฿\"]",
        "[\"name\",\"Remaining ฿\"]",
        "[\"name\",\"Settlement before today\"]"
      ],
      "graph.colors": [
        "#16A34A",
        "#F59E0B",
        "#DC2626",
        "#CBD5E1"
      ],
      "graph.series_order": null,
      "series_settings": {
        "Paid on time": {
          "color": "#16A34A"
        },
        "Paid late": {
          "color": "#F59E0B"
        },
        "Overdue": {
          "color": "#DC2626"
        },
        "No earlier charge": {
          "color": "#CBD5E1"
        }
      },
      "graph.y_axis.auto_range": false,
      "graph.x_axis.scale": "ordinal",
      "graph.dimensions": [
        "Position",
        "Status"
      ],
      "graph.y_axis.min": 0
    }
  }
}
