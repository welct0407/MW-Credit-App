"content":
  "key": "context"
  "id": 315
  "name": "Overall charts · dates and data availability"
  "description": "R038. Lifetime interest return = all signed interest received / total original principal lent, active and\
    \ closed loans, through current Bangkok date. Repeated lending counts each loan once. Gross interest before expenses/losses.\
    \ Activity slicer ignored; population applies."
  "type": "question"
  "display": "table"
  "dataset_query":
    "stages":
    - "template-tags":
      - "type": "text"
        "id": "r037-pop"
        "name": "population"
        "display-name": "Population"
        "default": "All with loan history"
      - "type": "card"
        "id": "r037-model"
        "name": "#310"
        "display-name": "Borrower lifetime economics"
        "card-id": 310
      "lib/type": "mbql.stage/native"
      "native": |-
        WITH cohort AS (SELECT * FROM {{#310}} m WHERE ([[{{population}} --]] 'All with loan history'
        ='All with loan history' OR [[{{population}} --]] 'All with loan history'
        ='Currently active' AND "Has active loan" OR [[{{population}} --]] 'All with loan history'
        ='Currently inactive' AND NOT "Has active loan")) SELECT max("Lifetime through") AS "Lifetime rate through",max("30D start") AS "Profit starts",max("30D end") AS "Profit ends",max("Current as of") AS "Principal as of",count(*) FILTER(WHERE "Achieved daily rate" IS NULL) AS "Borrowers without daily rate",count(*) FILTER(WHERE "Lifetime interest return" IS NULL) AS "Borrowers without lifetime return",CASE WHEN count(*) FILTER(WHERE "Interest 30D" IS NULL)>0 THEN 'Profit pie unavailable: incomplete receipts' WHEN count(*) FILTER(WHERE "Interest 30D">0)=0 THEN 'No positive 30-day interest' ELSE 'Positive borrower contributions only; negative adjustments excluded' END AS "Profit pie status",coalesce(sum("Interest 30D") FILTER(WHERE "Interest 30D"<0),0) AS "Excluded negative interest ฿",CASE WHEN count(*) FILTER(WHERE "Principal outstanding"<0 OR "Principal outstanding" IS NULL)>0 THEN 'Principal pie unavailable: negative or incomplete balances' ELSE 'Principal pie available' END AS "Principal pie status" FROM cohort
    "lib/type": "mbql/query"
    "database": 2
  "visualization_settings":
    "table.pivot": false
