          "operator": "=",
          "value": "Overdue",
          "color": "#FFF2D6",
          "highlight_row": true
        },
        {
          "columns": [
            "Rating status"
          ],
          "type": "single",
          "operator": "=",
          "value": "Data review",
          "color": "#ECEFF1",
          "highlight_row": true
        }
      ],
      "column_settings": {
        "[\"name\",\"Daily interest ฿\"]": {
          "number_style": "decimal",
          "decimals": 2,
