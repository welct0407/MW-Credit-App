          "native": "SELECT b.\"Description\" AS \"Borrower\",h.has_active_loan AS \"Active loan\",h.rating_status AS \"Status\",h.data_quality_status AS \"Data quality\",h.default_count AS \"Default count\",h.recorded_default_loss AS \"Recorded loss ฿\",h.overdue_amount AS \"Overdue ฿\",h.reason_text AS \"Reason\" FROM public.reporting_borrower_payment_health_v1 h JOIN public.olap_borrowers_analytics b ON b.\"Row ID\"=h.borrower_id WHERE h.rating_status<>'Rated' ORDER BY h.borrower_id"
