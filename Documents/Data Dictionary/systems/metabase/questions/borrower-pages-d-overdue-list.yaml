"content":
  "key": "d-overdue-list"
  "id": 308
  "name": "All current overdue obligations · any due date"
  "description": "R035 additive borrower pages. Immutable borrower keys; Bangkok dates; current health from V41/V42. Signed\
    \ receipts. No AppSheet/financial writes."
  "display": "table"
  "type": "question"
  "dataset_query":
    "stages":
    - "template-tags":
      - "display-name": "Borrower"
        "id": "bp-borrower"
        "name": "borrower_id"
        "type": "text"
      "lib/type": "mbql.stage/native"
      "native": |-
        WITH clock AS (SELECT public.olap_reporting_date() today), chosen AS (SELECT * FROM public.reporting_borrower_directory_v1 WHERE borrower_id= [[{{borrower_id}} --]] '__select_borrower__'
        ) SELECT h.due_date AS "Due date",h.loan_id AS "Loan ID",h.charge_id AS "Charge ID",h.principal_due AS "Principal due ฿",h.interest_due AS "Interest due ฿",h.principal_remaining_current AS "Principal remaining ฿",h.interest_remaining_current AS "Interest remaining ฿",h.current_days_overdue AS "Days overdue",CASE WHEN NOT h.history_eligible THEN 'Excluded' WHEN h.on_time THEN 'On time' ELSE 'Not on time' END AS "Historical timing",coalesce(h.exclusion_reason,h.data_quality_status) AS "Evidence status" FROM chosen c JOIN public.reporting_charge_payment_health_v1 h USING(borrower_id) WHERE h.is_overdue ORDER BY h.due_date,h.charge_id
    "lib/type": "mbql/query"
    "database": 2
