    "id": 353,
    "key": "context",
    "name": "Forecast scope & assumptions",
    "display": "table",
    "dataset_query": {
      "database": 2,
      "type": "native",
      "native": {
        "query": "WITH args AS (SELECT coalesce([[{{ci}},]]100)::numeric ci,coalesce([[{{cp}},]]100)::numeric cp,coalesce([[{{rr}},]]0)::numeric rr,coalesce([[{{scenario}},]]'Planning')::text scenario,coalesce([[{{kind}},]]'All')::text kind,coalesce([[{{target}},]]NULL)::numeric target), loans AS MATERIALIZED (SELECT l.* FROM {{#344}} l,args a WHERE a.kind='All' OR l.loan_type=a.kind),\n actual AS (SELECT coalesce(sum(interest),0) a,coalesce(bool_or(invalid),false) invalid FROM {{#345}} l,args a WHERE a.kind='All' OR l.loan_type=a.kind),\n sums AS (SELECT coalesce(sum(ui),0) ui,coalesce(sum(up),0) up,coalesce(sum(oi),0) oi,coalesce(sum(op),0) op,coalesce(bool_or(incomplete),false) incomplete FROM loans),\n s AS (SELECT a.*,v.a actual,r.remaining_interest ri,r.remaining_principal rp,NOT (q.incomplete OR v.invalid OR c.invalid_receipts>0 OR c.orphan_charges>0) ready,c.reporting_date,c.calculated_at,c.current_cash,c.cash_status FROM args a CROSS JOIN sums q CROSS JOIN actual v CROSS JOIN {{#347}} c CROSS JOIN LATERAL public.forecast_scenario_v1(q.ui,q.up,q.oi,q.op,a.ci,a.cp,a.rr,a.scenario) r) SELECT reporting_date AS \"Bangkok today\",calculated_at AS \"Calculated at\",scenario AS \"Scenario\",kind AS \"Loan type\",ci AS \"Interest %\",cp AS \"Principal %\",rr AS \"Overdue %\",CASE WHEN NOT ready THEN 'Incomplete: headlines unavailable; detail contains known subtotals' WHEN ci=100 AND cp=100 AND rr=0 THEN 'Unadjusted schedule assumptions' ELSE 'User assumptions; not payment probabilities' END AS \"Status\",CASE WHEN target IS NULL THEN 'Target not set' WHEN target<0 OR target::text='NaN' THEN 'Invalid target' ELSE 'Target set' END AS \"Target\" FROM s",
        "template-tags": {
          "ci": {
            "id": "fp-ci",
            "name": "ci",
            "display-name": "Interest collected %",
            "type": "number",
            "default": 100
          },
