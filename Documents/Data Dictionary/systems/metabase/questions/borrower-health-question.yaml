  "name": "Question Mark · active borrowers"
  "description": "R028 automatic schedule categories. Payment score unchanged; auto-off plus <80% interest amount OR charge-date\
    \ coverage, >=7 observed days and >=2 due dates, restricts upper categories. Current 30 completed Bangkok days; no manual\
    \ confirmations."
  "display": "table"
  "dataset_query":
    "lib/type": "mbql/query"
    "stages":
    - "lib/type": "mbql.stage/native"
      "native": "SELECT b.\"Row ID\" AS \"Borrower ID\",b.\"Description\" AS \"Borrower\",m.reliability_score AS \"Score\"\
        ,m.relative_contribution AS \"Value ×\",m.confidence AS \"History\",m.arrangement_status AS \"Schedule\",h.overdue_amount\
        \ AS \"Overdue ฿\" FROM public.reporting_borrower_matrix_v3 m JOIN public.reporting_borrower_payment_health_v1 h USING(borrower_id)\
        \ JOIN public.olap_borrowers_analytics b ON b.\"Row ID\"=m.borrower_id WHERE m.quadrant='Question Mark' ORDER BY m.contribution_30d\
        \ DESC,m.borrower_id"
