  },
  "content": {
    "key": "active-return",
    "id": 373,
    "name": "Return on active principal",
    "description": "Borrower lifetime/current loan groups; ignores activity dates. Active return = lifetime active-loan interest / current outstanding principal. Closed totals use only loans whose current status is Closed, including defaulted closures. Interest is gross signed receipts. Coverage date is the existing constant-daily-interest estimate; when already covered it displays the current reporting date, not a historical crossing date.",
    "display": "scalar",
    "dataset_query": {
      "stages": [
        {
          "template-tags": [
            {
              "display-name": "Borrower",
              "id": "bp-borrower",
              "name": "borrower_id",
              "type": "text"
            }
          ],
          "lib/type": "mbql.stage/native",
          "native": "WITH chosen AS (SELECT * FROM public.reporting_borrower_directory_v1 WHERE borrower_id= [[{{borrower_id}} --]] '__select_borrower__'\n), totals AS (SELECT b.\"Total Outstanding Principal\" principal,b.\"Active Loan Interest Earned\" interest,b.\"Projected Interest Coverage Date\" coverage,\n z.principal closed_principal,z.interest closed_interest FROM chosen c JOIN public.olap_borrowers_analytics b ON b.\"Row ID\"=c.borrower_id\n CROSS JOIN LATERAL (SELECT CASE WHEN count(*)=0 THEN 0 WHEN bool_and(original_principal IS NOT NULL) THEN sum(original_principal) END principal,\n CASE WHEN count(*)=0 THEN 0 WHEN bool_and(interest_received IS NOT NULL) THEN sum(interest_received) END interest\n FROM public.reporting_borrower_loan_facts_v1 l WHERE l.borrower_id=c.borrower_id AND l.loan_status='Closed') z) SELECT coalesce(to_char((CASE WHEN principal>0 THEN interest/principal END)*100,'FM999999990.0')||'%','—') AS \"Return on active principal\" FROM totals"
        }
      ],
      "lib/type": "mbql/query",
      "database": 2
    },
    "visualization_settings": {
      "scalar.field": "Return on active principal",
      "column_settings": {
        "[\"name\",\"Return on active principal\"]": {
          "number_style": "percent",
          "decimals": 1,
          "number_separators": ".,",
          "compact": false
        }
      }
    }
  }
}
