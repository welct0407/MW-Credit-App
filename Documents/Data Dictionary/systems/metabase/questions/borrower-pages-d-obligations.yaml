"content":
  "key": "d-obligations"
  "id": 307
  "name": "Obligation evidence · selected due dates"
  "description": "R035 additive borrower pages. Immutable borrower keys; Bangkok dates; current health from V41/V42. Signed\
    \ receipts. No AppSheet/financial writes."
  "display": "table"
  "type": "question"
  "dataset_query":
    "stages":
    - "template-tags":
      - "widget-type": "date/all-options"
        "id": "bp-period"
        "name": "period"
        "display-name": "Activity period"
        "type": "dimension"
        "dimension":
        - "field"
        - "base-type": "type/Date"
          "lib/uuid": "c9af89ec-328f-4fe0-b813-6c628cb21ec9"
          "effective-type": "type/Date"
        - 82
        "alias": "d.\"Date\""
      - "name": "borrower_id"
        "display-name": "Borrower"
        "id": "bp-borrower"
        "type": "text"
      "lib/type": "mbql.stage/native"
      "native": |-
        WITH clock AS (SELECT public.olap_reporting_date() today), selected AS (SELECT d."Date" FROM (SELECT generate_series(DATE '1900-01-01',DATE '2199-12-31',interval '1 day')::date "Date") d WHERE [[{{period}} --]] d."Date" BETWEEN (SELECT today-30 FROM clock) AND (SELECT today-1 FROM clock)
        ), bounds AS (SELECT min("Date") starts,max("Date") ends,count(*) days,count(*)>0 AND count(*)=max("Date")-min("Date")+1 AND max("Date")<=(SELECT today FROM clock) valid FROM selected), chosen AS (SELECT * FROM public.reporting_borrower_directory_v1 WHERE borrower_id= [[{{borrower_id}} --]] '__select_borrower__'
        ), activity AS (SELECT a.* FROM public.reporting_borrower_activity_daily_v1 a JOIN chosen c USING(borrower_id) CROSS JOIN bounds b WHERE b.valid AND a.activity_date BETWEEN b.starts AND b.ends) SELECT h.due_date AS "Due date",CASE WHEN k."Row ID" IS NULL THEN 'Loan key unavailable' ELSE coalesce(c.borrower_name,'Unknown borrower')||'-'||to_char(k."Principal Amount"::numeric,'FM999,999,999,990.00')||'-'||to_char(k."Loan Date",'DD/MM')||'-'||coalesce(to_char(k."Effective Daily Interest Rate"::numeric*100,'FM999990.00')||'%','Unavailable') END AS "Loan Key",h.principal_due AS "Principal due ฿",h.interest_due AS "Interest due ฿",h.principal_remaining_current AS "Principal remaining ฿",h.interest_remaining_current AS "Interest remaining ฿",h.current_days_overdue AS "Days overdue",CASE WHEN NOT h.history_eligible THEN 'Excluded' WHEN h.on_time THEN 'On time' ELSE 'Not on time' END AS "Historical timing",coalesce(h.exclusion_reason,h.data_quality_status) AS "Evidence status" FROM chosen c JOIN public.reporting_charge_payment_health_v1 h USING(borrower_id) LEFT JOIN public.olap_loans_analytics k ON k."Row ID"=h.loan_id CROSS JOIN bounds b WHERE b.valid AND h.due_date BETWEEN b.starts AND b.ends ORDER BY h.due_date DESC,h.charge_id
    "lib/type": "mbql/query"
    "database": 2
