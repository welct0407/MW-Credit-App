"content":
  "id": 360
  "key": "watchlist"
  "name": "Forecast watchlist"
  "display": "table"
  "dataset_query":
    "lib/type": "mbql/query"
    "stages":
    - "lib/type": "mbql.stage/native"
      "template-tags":
      - "display-name": "Forecast scenario"
        "type": "text"
        "id": "fp-scenario"
        "name": "scenario"
        "default": "Planning"
      - "display-name": "Principal collected %"
        "type": "number"
        "id": "fp-cp"
        "name": "cp"
        "default": 100
      - "display-name": "Interest collected %"
        "type": "number"
        "id": "fp-ci"
        "name": "ci"
        "default": 100
      - "display-name": "Forecast source 344"
        "type": "card"
        "id": "fp-model-344"
        "name": "#344"
        "card-id": 344
      - "display-name": "Forecast loan type"
        "type": "text"
        "id": "fp-kind"
        "name": "kind"
        "default": "All"
      - "name": "target"
        "display-name": "Interest target ฿"
        "id": "fp-target"
        "type": "number"
      - "display-name": "Forecast source 347"
        "type": "card"
        "id": "fp-model-347"
        "name": "#347"
        "card-id": 347
      - "display-name": "Forecast source 345"
        "type": "card"
        "id": "fp-model-345"
        "name": "#345"
        "card-id": 345
      - "display-name": "Overdue recovered %"
        "type": "number"
        "id": "fp-rr"
        "name": "rr"
        "default": 0
      "native": |-
        WITH args AS (SELECT coalesce([[{{ci}},]]100)::numeric ci,coalesce([[{{cp}},]]100)::numeric cp,coalesce([[{{rr}},]]0)::numeric rr,coalesce([[{{scenario}},]]'Planning')::text scenario,coalesce([[{{kind}},]]'All')::text kind,coalesce([[{{target}},]]NULL)::numeric target), loans AS MATERIALIZED (SELECT l.* FROM {{#344}} l,args a WHERE a.kind='All' OR l.loan_type=a.kind),
         actual AS (SELECT coalesce(sum(interest),0) a,coalesce(bool_or(invalid),false) invalid FROM {{#345}} l,args a WHERE a.kind='All' OR l.loan_type=a.kind),
         sums AS (SELECT coalesce(sum(ui),0) ui,coalesce(sum(up),0) up,coalesce(sum(oi),0) oi,coalesce(sum(op),0) op,coalesce(bool_or(incomplete),false) incomplete FROM loans),
         s AS (SELECT a.*,v.a actual,r.remaining_interest ri,r.remaining_principal rp,NOT (q.incomplete OR v.invalid OR c.invalid_receipts>0 OR c.orphan_charges>0) ready,c.reporting_date,c.calculated_at,c.current_cash,c.cash_status FROM args a CROSS JOIN sums q CROSS JOIN actual v CROSS JOIN {{#347}} c CROSS JOIN LATERAL public.forecast_scenario_v1(q.ui,q.up,q.oi,q.op,a.ci,a.cp,a.rr,a.scenario) r) SELECT borrower AS "Borrower",borrower_id AS "Borrower ID",CASE WHEN k."Row ID" IS NULL THEN 'Loan key unavailable' ELSE borrower||'-'||to_char(k."Principal Amount"::numeric,'FM999,999,999,990.00')||'-'||to_char(k."Loan Date",'DD/MM')||'-'||coalesce(k."Original Daily Interest Rate"::text||'%','Unavailable') END AS "Loan Key",loan_type AS "Loan type",outstanding_principal AS "Principal outstanding ฿",next_due AS "Next due",ui AS "Today / future interest ฿",up AS "Today / future principal ฿",oi AS "Overdue interest ฿",op AS "Overdue principal ฿",xi+xp AS "Recovery only ฿",recorded_interest AS "Recorded interest ฿",simulated_interest AS "Simulated interest ฿",f.remaining_interest AS "Scenario interest ฿",f.remaining_principal AS "Scenario principal ฿",arrangement_status AS "Schedule",coalesce(issues,'Covered') AS "Coverage" FROM loans LEFT JOIN public.olap_loans_analytics k ON k."Row ID"=loans.loan_id CROSS JOIN args a CROSS JOIN LATERAL public.forecast_scenario_v1(ui,up,oi,op,ci,cp,rr,scenario) f WHERE oi+op+xi+xp>0 OR issues IS NOT NULL OR arrangement_status='Modified payment schedule' ORDER BY incomplete DESC,ui DESC,loan_id
    "database": 2
