"content":
  "key": "rate"
  "id": 313
  "name": "Lifetime Effective Achieved Daily Interest Rate · top 8"
  "description": "R037. Overall borrower economics; population filter applies, activity date slicer does not. Lifetime rate\
    \ uses completed Bangkok days and end-of-day outstanding principal. Gross interest before expenses. See chart context\
    \ and handover."
  "type": "question"
  "display": "row"
  "dataset_query":
    "stages":
    - "template-tags":
      - "type": "text"
        "id": "r037-pop"
        "name": "population"
        "display-name": "Population"
        "default": "All with loan history"
      - "type": "card"
        "id": "r037-model"
        "name": "#310"
        "display-name": "Borrower lifetime economics"
        "card-id": 310
      "lib/type": "mbql.stage/native"
      "native": |-
        WITH cohort AS (SELECT * FROM {{#310}} m WHERE ([[{{population}} --]] 'All with loan history'
        ='All with loan history' OR [[{{population}} --]] 'All with loan history'
        ='Currently active' AND "Has active loan" OR [[{{population}} --]] 'All with loan history'
        ='Currently inactive' AND NOT "Has active loan")) SELECT "Borrower","Achieved daily rate","Borrower ID","Lifetime interest","Principal days","Active loan interest","Principal outstanding" FROM cohort WHERE "Achieved daily rate" IS NOT NULL ORDER BY "Achieved daily rate" DESC,"Borrower ID" LIMIT 8
    "lib/type": "mbql/query"
    "database": 2
  "visualization_settings":
    "graph.show_goal": false
    "graph.show_values": true
    "graph.show_legend": false
    "graph.x_axis.title_enabled": true
    "graph.goal_label": "100% coverage"
    "graph.x_axis.title_text": "Achieved interest · % per day"
    "graph.goal_value": 1
