"content":
  "key": "d-active-loans"
  "id": 303
  "name": "Active loans & recorded next plan"
  "description": "R035 additive borrower pages. Immutable borrower keys; Bangkok dates; current health from V41/V42. Signed\
    \ receipts. No AppSheet/financial writes."
  "display": "table"
  "type": "question"
  "dataset_query":
    "stages":
    - "template-tags":
      - "display-name": "Borrower"
        "id": "bp-borrower"
        "name": "borrower_id"
        "type": "text"
      "lib/type": "mbql.stage/native"
      "native": |-
        WITH clock AS (SELECT public.olap_reporting_date() today), chosen AS (SELECT * FROM public.reporting_borrower_directory_v1 WHERE borrower_id= [[{{borrower_id}} --]] '__select_borrower__'
        ) SELECT l.loan_id AS "Loan ID",l.loan_date AS "Loan date",l.loan_type AS "Loan type",l.original_principal AS "Original principal ฿",l.outstanding_principal AS "Current principal ฿",l.due_date AS "Due date",l.daily_interest AS "Daily interest ฿",s.schedule_reason AS "Schedule",s.next_plan_due_date AS "Next plan due",s.next_plan_principal AS "Next principal ฿",s.next_plan_interest AS "Next interest ฿" FROM chosen c JOIN public.reporting_borrower_loan_facts_v1 l USING(borrower_id) LEFT JOIN public.reporting_loan_schedule_health_v1 s USING(loan_id) WHERE l.is_active ORDER BY l.loan_date DESC,l.loan_id
    "lib/type": "mbql/query"
    "database": 2
