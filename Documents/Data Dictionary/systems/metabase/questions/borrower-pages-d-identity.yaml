        "id": "bp-borrower"
        "name": "borrower_id"
        "type": "text"
      "lib/type": "mbql.stage/native"
      "native": |-
        WITH clock AS (SELECT public.olap_reporting_date() today), chosen AS (SELECT * FROM public.reporting_borrower_directory_v1 WHERE borrower_id= [[{{borrower_id}} --]] '__select_borrower__'
        ) SELECT borrower_label AS "Borrower",borrower_id AS "Borrower ID",CASE WHEN has_active_loan THEN 'Active' ELSE 'Inactive' END AS "Status",CASE WHEN hidden_flag THEN 'Hidden in operational app' ELSE 'Visible' END AS "Operational visibility",first_loan_date AS "First loan",reporting_date AS "As of" FROM chosen
    "lib/type": "mbql/query"
    "database": 2
