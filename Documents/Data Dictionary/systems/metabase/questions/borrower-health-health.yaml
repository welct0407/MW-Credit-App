    "display": "table",
    "collection_id": 5,
    "dataset_query": {
      "stages": [
        {
          "lib/type": "mbql.stage/native",
          "native": "SELECT b.\"Description\" AS \"Borrower\",h.has_active_loan AS \"Active loan\",h.current_health_status AS \"Current health\",h.overdue_amount AS \"Overdue ฿\",h.overdue_charge_count AS \"Overdue charges\",h.oldest_unpaid_days AS \"Oldest days\",h.rating_status AS \"Rating status\",h.reliability_score AS \"Reliability /100\",h.confidence AS \"Confidence\",coalesce(m.quadrant,'Outside active cohort') AS \"Category\",h.reason_text AS \"Reason\" FROM public.reporting_borrower_payment_health_v1 h JOIN public.olap_borrowers_analytics b ON b.\"Row ID\"=h.borrower_id LEFT JOIN public.reporting_borrower_matrix_v2 m USING(borrower_id) ORDER BY h.overdue_amount DESC NULLS FIRST,h.oldest_unpaid_days DESC NULLS LAST,h.borrower_id"
        }
      ],
      "lib/type": "mbql/query",
      "database": 2
    },
    "visualization_settings": {
      "table.pivot": false,
      "table.column_formatting": [
