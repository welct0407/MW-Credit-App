    "key": "p-first-repeat",
    "id": 288,
    "name": "First and repeat loans · weekly",
    "description": "R035 additive borrower pages. Immutable borrower keys; Bangkok dates; current health from V41/V42. Signed receipts. No AppSheet/financial writes.",
    "display": "bar",
    "type": "question",
    "dataset_query": {
      "stages": [
        {
          "template-tags": [
            {
              "widget-type": "date/all-options",
              "id": "bp-period",
              "name": "period",
              "display-name": "Activity period",
              "type": "dimension",
              "dimension": [
                "field",
                {
                  "base-type": "type/Date",
                  "lib/uuid": "b388b260-1f2b-4805-9a26-f98be212b864",
                  "effective-type": "type/Date"
                },
                82
              ],
              "alias": "d.\"Date\""
            },
            {
              "type": "text",
              "id": "bp-population",
              "name": "population",
              "display-name": "Population",
              "default": "All with loan history"
            }
          ],
          "lib/type": "mbql.stage/native",
          "native": "WITH clock AS (SELECT public.olap_reporting_date() today), selected AS (SELECT d.\"Date\" FROM (SELECT generate_series(DATE '1900-01-01',DATE '2199-12-31',interval '1 day')::date \"Date\") d WHERE [[{{period}} --]] d.\"Date\" BETWEEN (SELECT today-30 FROM clock) AND (SELECT today-1 FROM clock)\n), bounds AS (SELECT min(\"Date\") starts,max(\"Date\") ends,count(*) days,count(*)>0 AND count(*)=max(\"Date\")-min(\"Date\")+1 AND max(\"Date\")<=(SELECT today FROM clock) valid FROM selected), cohort AS (SELECT p.* FROM bounds b CROSS JOIN LATERAL public.reporting_borrower_period_v1(b.starts,b.ends,[[{{population}} --]] 'All with loan history'\n) p WHERE b.valid) SELECT date_trunc('week',a.activity_date)::date AS \"Week\",sum(a.first_loans) AS \"First loans\",sum(a.repeat_loans) AS \"Repeat loans\",sum(a.unclassified_loans) AS \"Unavailable classification\",sum(a.principal_issued) AS \"Principal issued ฿\",count(DISTINCT a.borrower_id) FILTER(WHERE a.loans_issued>0) AS \"Borrowers\"\n FROM public.reporting_borrower_activity_daily_v1 a JOIN cohort c USING(borrower_id) CROSS JOIN bounds b WHERE a.activity_date BETWEEN b.starts AND b.ends AND a.loans_issued>0 GROUP BY 1 ORDER BY 1"
        }
      ],
      "lib/type": "mbql/query",
      "database": 2
    },
