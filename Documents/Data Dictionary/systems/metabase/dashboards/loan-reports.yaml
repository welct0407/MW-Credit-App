    - "id": 184
      "key": "income-status"
      "name": "Income period & freshness"
      "display": "table"
      "dataset_query":
        "database": 2
        "type": "native"
        "native":
          "query": |-
            WITH statement AS ({{snippet: Income statement period}}) SELECT v.detail AS "Detail",v.value AS "Value" FROM statement s CROSS JOIN LATERAL (VALUES
             (1,'Period',coalesce(to_char(s."Period Start",'YYYY-MM-DD')||' → '||to_char(s."Period End",'YYYY-MM-DD'),'Unavailable')),
             (2,'Source','Live on report refresh'),(3,'Queried at',to_char(s."Queried At",'YYYY-MM-DD HH24:MI')),
             (4,'Status',s."Selection Status")) v(step,detail,value) ORDER BY v.step
          "template-tags":
            "statement_period":
              "id": "r016-statement_period"
              "name": "statement_period"
              "display-name": "Statement period"
              "type": "dimension"
              "dimension":
              - "field"
              - 82
              - null
              "widget-type": "date/all-options"
              "alias": "d.\"Date\""
            "#186":
              "id": "r016-model-186"
              "name": "#186"
              "display-name": "Model 186"
              "type": "card"
              "card-id": 186
            "snippet: Income statement period":
              "id": "r016-snippet-2"
              "name": "snippet: Income statement period"
              "display-name": "Income statement period"
              "type": "snippet"
              "snippet-id": 2
              "snippet-name": "Income statement period"
      "visualization_settings":
        "table.pivot": false
