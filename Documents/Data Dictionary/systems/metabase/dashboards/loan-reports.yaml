      "key": "movement"
      "name": "Cash movement by transaction type"
      "display": "table"
      "dataset_query":
        "database": 2
        "type": "native"
        "native":
          "query": "WITH statement AS ({{snippet: Cashflow statement period}}) SELECT CASE WHEN grouping(t.\"Transaction Type\"\
            )=1 THEN 'TOTAL' ELSE t.\"Transaction Type\" END AS \"Transaction Type\",coalesce(sum(t.\"Money In\"),0) AS \"\
            Money In\",coalesce(sum(t.\"Money Out\"),0) AS \"Money Out\",coalesce(sum(t.\"Net Movement\"),0) AS \"Net Movement\"\
            \ FROM statement s LEFT JOIN LATERAL public.reporting_cash_period_entries(s.\"Period Start\",s.\"Period End\"\
            ,{{cash_account}}) t ON true WHERE s.\"Continuous Period\" GROUP BY GROUPING SETS ((t.\"Transaction Type\"),())\
            \ HAVING bool_or(s.\"Continuous Period\") AND (grouping(t.\"Transaction Type\")=1 OR count(t.\"Entry ID\")>0)\
            \ ORDER BY grouping(t.\"Transaction Type\"),1"
          "template-tags":
            "cashflow_period":
              "id": "r016-cashflow_period"
              "name": "cashflow_period"
              "display-name": "Statement period"
              "type": "dimension"
              "dimension":
              - "field"
