    - "id": 233
      "name": "Weekly loan-cohort return · live"
      "description": "For loans issued within the selected dates, group by Monday issuance week. Loan Return = interest received\
        \ from those same loan IDs within the selected dates / original principal of those loans, counted once each. Includes\
        \ loans with no in-period interest (0); excludes payments from other cohorts/outside the period. Gross interest, not\
        \ principal repayments or net profit. Live on refresh, including today; future dates excluded. Partial weeks use selected\
        \ issue dates. 100% means selected-period interest equals original cohort principal."
      "display": "bar"
      "dataset_query":
        "stages":
        - "template-tags":
          - "widget-type": "date/all-options"
            "id": "r019-cohort-period"
            "name": "performance_period"
            "display-name": "Performance period"
            "type": "dimension"
            "dimension":
            - "field"
            - "base-type": "type/Date"
              "lib/uuid": "b19aa48c-39df-4f34-b08e-37e4a260cc29"
              "effective-type": "type/Date"
            - 82
            "alias": "d.\"Date\""
          - "type": "card"
            "id": "r019-model-70"
            "name": "#70"
            "display-name": "Model 70"
            "card-id": 70
          - "type": "card"
            "id": "r019-model-71"
            "name": "#71"
            "display-name": "Model 71"
            "card-id": 71
          "lib/type": "mbql.stage/native"
          "native": |-
            WITH clock AS (SELECT public.olap_reporting_date() today),
             available AS (SELECT min("Date") starts FROM public.reporting_statement_calendar),
             selected AS (
             SELECT d."Date" FROM (SELECT generate_series(DATE '1900-01-01',DATE '2199-12-31',INTERVAL '1 day')::date AS "Date") d
             WHERE [[{{performance_period}} --]] d."Date" BETWEEN (SELECT starts FROM available) AND (SELECT today FROM clock)
             ), bounds AS (SELECT min("Date") starts,max("Date") ends,count(*) days,
             count(*)>0 AND count(*)=max("Date")-min("Date")+1 continuous FROM selected),
             live_days AS (SELECT d."Date" FROM selected d CROSS JOIN bounds b CROSS JOIN clock c WHERE b.continuous AND d."Date"<=c.today),
             history_days AS (SELECT d."Date" FROM selected d CROSS JOIN bounds b CROSS JOIN clock c WHERE b.continuous AND d."Date"<c.today)
            , issued AS (
             SELECT l."Loan ID",l."Loan Date",l."Principal Amount"
             FROM {{#70}} l JOIN live_days d ON l."Loan Date"=d."Date"
            ), received AS (
             SELECT p."Loan ID",count(*) payments,count(p."Interest Paid") known_interest,sum(p."Interest Paid") interest
             FROM {{#71}} p JOIN issued l ON l."Loan ID"=p."Loan ID"
             JOIN live_days d ON p."Payment Date"=d."Date"
             GROUP BY p."Loan ID"
            ), per_loan AS (
             SELECT l.*,CASE WHEN p.payments IS NULL THEN 0 WHEN p.payments=p.known_interest THEN p.interest END interest
             FROM issued l LEFT JOIN received p ON p."Loan ID"=l."Loan ID"
            )
            SELECT date_trunc('week',"Loan Date")::date AS "Week starting",
             CASE WHEN count(interest)=count(*) AND count("Principal Amount")=count(*)
             THEN sum(interest)/nullif(sum("Principal Amount"),0) END AS "Loan Return",
             count(*) AS "Loans in cohort",sum("Principal Amount") AS "Cohort principal",
             CASE WHEN count(interest)=count(*) THEN sum(interest) END AS "Interest in selected period"
            FROM per_loan GROUP BY 1 ORDER BY 1
        "lib/type": "mbql/query"
        "database": 2
      "visualization_settings":
        "line.missing": "none"
        "graph.show_goal": true
        "graph.show_trendline": false
        "graph.y_axis.title_text": "Loan-cohort return (%)"
        "graph.show_values": true
        "graph.show_legend": false
        "graph.goal_label": "Reference · 100%"
        "graph.x_axis.title_text": "Loan issuance week (Monday)"
        "graph.goal_value": 1
        "graph.y_axis.auto_split": false
        "graph.metrics":
        - "Loan Return"
        "graph.colors":
        - "#43A047"
        "column_settings":
          "[\"name\",\"Loan Return\"]":
            "number_style": "percent"
            "decimals": 2
            "number_separators": ".,"
          "[\"name\",\"Cohort principal\"]":
            "number_style": "decimal"
            "decimals": 0
          "[\"name\",\"Interest in selected period\"]":
            "number_style": "decimal"
            "decimals": 0
        "series_settings":
          "Loan Return":
            "color": "#43A047"
            "axis": "left"
        "graph.dimensions":
        - "Week starting"
        "stackable.stack_type": null
        "graph.label_value_frequency": "fit"
      "collection_id": 5
    - "id": 234
      "name": "Net principal deployed · live"
      "description": "Selected-period principal issued minus principal repayments received from all loans, including older\
        \ cohorts. Positive means net lending; negative means net capital recovery. Uses Loan Date for issuance and Payment\
        \ Date for returns. Live on refresh; Bangkok dates, future excluded. Not cash balance or profit. No transactions =\
        \ 0; no eligible dates/unknown inputs = unavailable."
      "display": "scalar"
      "dataset_query":
        "stages":
        - "template-tags":
          - "widget-type": "date/all-options"
            "id": "r021-period"
            "name": "performance_period"
            "display-name": "Performance period"
            "type": "dimension"
            "dimension":
            - "field"
            - "base-type": "type/Date"
              "lib/uuid": "ef8f22ae-7277-4f7f-80c7-071f8e6408b9"
              "effective-type": "type/Date"
            - 82
            "alias": "d.\"Date\""
          - "type": "card"
            "id": "r021-model-70"
            "name": "#70"
            "display-name": "Model 70"
            "card-id": 70
          - "type": "card"
            "id": "r021-model-71"
            "name": "#71"
            "display-name": "Model 71"
            "card-id": 71
          "lib/type": "mbql.stage/native"
          "native": |-
            WITH clock AS (SELECT public.olap_reporting_date() today),
             available AS (SELECT min("Date") starts FROM public.reporting_statement_calendar),
             selected AS (
             SELECT d."Date" FROM (SELECT generate_series(DATE '1900-01-01',DATE '2199-12-31',INTERVAL '1 day')::date AS "Date") d
             WHERE [[{{performance_period}} --]] d."Date" BETWEEN (SELECT starts FROM available) AND (SELECT today FROM clock)
             ), bounds AS (SELECT min("Date") starts,max("Date") ends,count(*) days,
             count(*)>0 AND count(*)=max("Date")-min("Date")+1 continuous FROM selected),
             live_days AS (SELECT d."Date" FROM selected d CROSS JOIN bounds b CROSS JOIN clock c WHERE b.continuous AND d."Date"<=c.today),
             history_days AS (SELECT d."Date" FROM selected d CROSS JOIN bounds b CROSS JOIN clock c WHERE b.continuous AND d."Date"<c.today), issued AS (SELECT s."Principal Amount" amount FROM {{#70}} s JOIN live_days d ON s."Loan Date"=d."Date"),
            returned AS (SELECT s."Principal Paid" amount FROM {{#71}} s JOIN live_days d ON s."Payment Date"=d."Date")
            SELECT CASE WHEN EXISTS(SELECT 1 FROM live_days)
             AND NOT EXISTS(SELECT 1 FROM issued WHERE amount IS NULL) AND NOT EXISTS(SELECT 1 FROM returned WHERE amount IS NULL)
             THEN (SELECT coalesce(sum(amount),0) FROM issued)-(SELECT coalesce(sum(amount),0) FROM returned) END AS "Net principal deployed"
        "lib/type": "mbql/query"
        "database": 2
      "visualization_settings":
        "scalar.field": "Net principal deployed"
        "column_settings":
          "[\"name\",\"Net principal deployed\"]":
            "number_style": "decimal"
            "decimals": 0
            "number_separators": ".,"
            "compact": false
