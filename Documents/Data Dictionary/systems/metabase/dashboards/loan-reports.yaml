            \ \"Amount\" FROM statement s CROSS JOIN LATERAL (VALUES (1,'Income',s.\"Operating Income\"),(2,'Expenses',s.\"\
            Operating Expenses\")) v(step,movement,amount) ORDER BY v.step"
