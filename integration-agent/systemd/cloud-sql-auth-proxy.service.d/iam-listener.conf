# ALL-ARCH-03: the automatic IAM listener on 127.0.0.1:5433 (VM service account
# mw-integration-agent@clever-oasis-508610-n7.iam) runs as its own unit, cloud-sql-auth-proxy-iam.service.
# This unit keeps its own ExecStart: password listener on 5432 for mw_reviewer_dml and mw_receipt_projector
# and token sign-in for IAM users such as codex-cloud-read. Do not relist 5433 here: listeners in one proxy
# process share one certificate, and auto-iam-authn on any of them breaks token sign-in on 5432.
# Not installed by deploy-runtime.py; rollback: remove this drop-in and the IAM unit, daemon-reload, restart the proxy.
[Unit]
Wants=cloud-sql-auth-proxy-iam.service
After=cloud-sql-auth-proxy-iam.service
