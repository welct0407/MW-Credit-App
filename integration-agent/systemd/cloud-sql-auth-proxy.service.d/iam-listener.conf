# ALL-ARCH-03 (prepared; install only with the agent deploy go, see the W3 agent change note).
# Adds a second listener on 127.0.0.1:5433 that uses Automatic IAM database authentication with the
# VM service account (mw-integration-agent@clever-oasis-508610-n7.iam). The password listener on 5432
# stays for mw_reviewer_dml and mw_receipt_projector until W4 relaxes the session_user checks.
# Not installed by deploy-runtime.py; rollback: remove this drop-in, daemon-reload, restart the proxy.
[Service]
ExecStart=
ExecStart=/usr/local/bin/cloud-sql-proxy --address 127.0.0.1 --structured-logs "clever-oasis-508610-n7:asia-southeast1:appsheet-pg-prod-20260914?port=5432" "clever-oasis-508610-n7:asia-southeast1:appsheet-pg-prod-20260914?port=5433&auto-iam-authn=true"
