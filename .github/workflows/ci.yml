name: Development checks
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build:live-dev
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npx playwright install --with-deps chromium
        if: ${{ github.event_name != 'pull_request' || (github.event.action == 'labeled' && github.event.label.name == 'ci:checkpoint') }}
      - run: npm run test:e2e
        if: ${{ github.event_name != 'pull_request' || (github.event.action == 'labeled' && github.event.label.name == 'ci:checkpoint') }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.5
      - run: terraform fmt -check -recursive infrastructure
      - run: terraform -chdir=infrastructure/dev init -backend=false
      - run: terraform -chdir=infrastructure/dev validate
      - run: terraform -chdir=infrastructure/dev-dns init -backend=false
      - run: terraform -chdir=infrastructure/dev-dns validate
