name: Development checks
# One workflow, five stages. A small `changes` job classifies the event so a
# documentation-only pull request still posts the `Development checks result`
# status (this is what branch protection can require) without running the
# expensive stages. Main pushes are classified by the pushed commit range; a
# first push and an unreadable range select everything. Then
# scripts/ci/reuse-evidence.mjs drops every selected stage whose checks all
# have trusted evidence for the same stage hash (sha256 over the tracked files
# relevant to the stage in scripts/ci/stages.json): each stage job computes
# that key right after checkout and uploads an `evidence-ci-<stage>-<hash>`
# artifact as its last step, so it exists only when every step passed.
# Records-only follow-up pushes, "merge main" commits and the merge of a tested
# pull request then reuse the earlier run, and the step summary cites it.
# Manual dispatch also reuses unless `force` is set.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      force:
        description: Run every stage even when an earlier run already covers it
        type: boolean
        default: false
permissions:
  contents: read
  pull-requests: read
  # Evidence lookup: artifacts, runs and jobs of earlier runs.
  actions: read
concurrency:
  group: development-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      check: ${{ steps.reuse.outputs.run_check }}
      lint: ${{ steps.reuse.outputs.run_lint }}
      e2e: ${{ steps.reuse.outputs.run_e2e }}
      terraform: ${{ steps.reuse.outputs.run_terraform }}
      evidence: ${{ steps.reuse.outputs.evidence }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # Both run on every event, including documentation-only PRs, because the
      # evidence folders and documents they guard are exactly what the stages
      # below skip: binary evidence placement, then documentation links, pins
      # and change-note headings (warnings are printed but never fail).
      - run: node scripts/check-binary-evidence.mjs
      - run: node scripts/check-docs.mjs
      - name: Classify changed files
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          everything() { echo "app=true" >> "$GITHUB_OUTPUT"; echo "e2e=true" >> "$GITHUB_OUTPUT"; echo "terraform=true" >> "$GITHUB_OUTPUT"; echo "$1: run every stage"; exit 0; }
          case "${{ github.event_name }}" in
            pull_request)
              gh api --paginate "repos/${{ github.repository }}/pulls/${PR_NUMBER}/files" --jq '.[].filename' > changed.txt ;;
            push)
              # A zero "before" is a branch creation; a compare that fails is a
              # force update or an unreadable range. Both run every stage.
              case "$PUSH_BEFORE" in ''|0000000000000000000000000000000000000000) everything "First push";; esac
              if ! gh api --paginate "repos/${{ github.repository }}/compare/${PUSH_BEFORE}...${PUSH_AFTER}?per_page=100" --jq '.files[].filename' > changed.txt; then everything "Unreadable push range"; fi ;;
            *) everything "${{ github.event_name }}" ;;
          esac
          # Documentation, project records and the integration agent have their own checks.
          grep -Ev '^(project/|integration-agent/|Change Logs/)|\.md$' changed.txt > app.txt || true
          app=false; e2e=false; terraform=false
          if [ -s app.txt ]; then app=true; fi
          if grep -Eq '^(apps/pwa/|tests/e2e/|playwright\.config\.ts$|package(-lock)?\.json$|vite\.config\.ts$|tsconfig\.json$|index\.html$|\.nvmrc$|\.github/workflows/ci\.yml$)' app.txt; then e2e=true; fi
          if grep -Eq '^(infrastructure/|\.github/workflows/ci\.yml$)' app.txt; then terraform=true; fi
          echo "app=$app" >> "$GITHUB_OUTPUT"; echo "e2e=$e2e" >> "$GITHUB_OUTPUT"; echo "terraform=$terraform" >> "$GITHUB_OUTPUT"
          printf 'changed=%s app=%s e2e=%s terraform=%s\n' "$(wc -l < changed.txt)" "$app" "$e2e" "$terraform"
      - name: Reuse evidence from earlier runs
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDED: check=${{ steps.classify.outputs.app }},lint=${{ steps.classify.outputs.app }},terraform=${{ steps.classify.outputs.terraform }},e2e=${{ steps.classify.outputs.e2e }}
          FORCE: ${{ inputs.force == true && '--force' || '' }}
        run: node scripts/ci/reuse-evidence.mjs --workflow ci --needed "$NEEDED" $FORCE

  check:
    needs: changes
    if: needs.changes.outputs.check == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      # Stage evidence key (scripts/ci/reuse-evidence.mjs), written outside the checkout
      # before the tests; the runner image's node runs it.
      - name: Evidence key
        id: evidence
        run: node scripts/ci/reuse-evidence.mjs --hash --workflow ci --stage check --check "check" --out "$RUNNER_TEMP/evidence/{name}.json"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build:live-dev
      - run: npm audit --omit=dev --audit-level=moderate
      - name: Checks leave tracked files unchanged
        run: git diff --exit-code --stat && test -z "$(git status --porcelain)"
      # Last step, so it runs only when every step above passed.
      - name: Keep stage evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.evidence.outputs.name }}
          path: ${{ steps.evidence.outputs.path }}
          retention-days: 90
          if-no-files-found: error
          overwrite: true

  lint:
    # ALL-CI-04: Biome lint (rules in biome.json). Blocking on errors;
    # warnings are reported as annotations and do not fail the job.
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      # Stage evidence key (scripts/ci/reuse-evidence.mjs), written outside the checkout
      # before the tests; the runner image's node runs it.
      - name: Evidence key
        id: evidence
        run: node scripts/ci/reuse-evidence.mjs --hash --workflow ci --stage lint --check "lint" --out "$RUNNER_TEMP/evidence/{name}.json"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint -- --reporter=github
      # Last step, so it runs only when every step above passed.
      - name: Keep stage evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.evidence.outputs.name }}
          path: ${{ steps.evidence.outputs.path }}
          retention-days: 90
          if-no-files-found: error
          overwrite: true

  terraform:
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      # Stage evidence key (scripts/ci/reuse-evidence.mjs), written outside the checkout
      # before the tests; the runner image's node runs it.
      - name: Evidence key
        id: evidence
        run: node scripts/ci/reuse-evidence.mjs --hash --workflow ci --stage terraform --check "terraform" --out "$RUNNER_TEMP/evidence/{name}.json"
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false
      - name: Cache Terraform providers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/tf-plugins
          key: tf-plugins-${{ hashFiles('infrastructure/**/.terraform.lock.hcl') }}
      - run: terraform fmt -check -recursive infrastructure
      # ALL-CI-03: every root and module is initialised without a backend and
      # validated; directories with tests/*.tftest.hcl (mock providers, plan
      # only, no credentials) also run `terraform test`.
      - name: Validate and test every Terraform root
        env:
          TF_PLUGIN_CACHE_DIR: ${{ runner.temp }}/tf-plugins
        run: |
          set -euo pipefail
          mkdir -p "$TF_PLUGIN_CACHE_DIR" "$RUNNER_TEMP/tf-data"
          failed=0; tested=0; roots=0
          for dir in infrastructure/*/ infrastructure/modules/*/; do
            dir=${dir%/}
            ls "$dir"/*.tf >/dev/null 2>&1 || continue
            roots=$((roots+1))
            export TF_DATA_DIR="$RUNNER_TEMP/tf-data/${dir//\//_}"
            lock=(); [ -f "$dir/.terraform.lock.hcl" ] && lock=(-lockfile=readonly)
            if ! terraform -chdir="$dir" init -backend=false -input=false "${lock[@]}" >"$TF_DATA_DIR.init.log" 2>&1; then
              echo "::error::terraform init failed: $dir"; tail -20 "$TF_DATA_DIR.init.log"; failed=1; continue
            fi
            terraform -chdir="$dir" validate -no-color || { echo "::error::terraform validate failed: $dir"; failed=1; }
            if ls "$dir"/tests/*.tftest.hcl >/dev/null 2>&1; then
              tested=$((tested+1))
              terraform -chdir="$dir" test -no-color || { echo "::error::terraform test failed: $dir"; failed=1; }
            fi
          done
          echo "validated=$roots tested_directories=$tested"
          exit $failed
      # Last step, so it runs only when every step above passed.
      - name: Keep stage evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.evidence.outputs.name }}
          path: ${{ steps.evidence.outputs.path }}
          retention-days: 90
          if-no-files-found: error
          overwrite: true

  e2e:
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    name: e2e (shard ${{ matrix.shard }} of 3)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      # Stage evidence key (scripts/ci/reuse-evidence.mjs), written outside the checkout
      # before the tests; the runner image's node runs it.
      - name: Evidence key
        id: evidence
        run: node scripts/ci/reuse-evidence.mjs --hash --workflow ci --stage e2e --check "e2e (shard ${{ matrix.shard }} of 3)" --out "$RUNNER_TEMP/evidence/{name}.json"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The canonical and static specs serve the live-dev build from dist-live-dev.
      - run: npx vite build --mode live-dev
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --shard=${{ matrix.shard }}/3
      # ALL-CI-08: specs write captures only to ignored test-results/; a spec
      # that modifies or adds a tracked path fails the shard.
      - name: Specs leave the checkout clean
        run: git diff --exit-code --stat && test -z "$(git status --porcelain)"
      - name: Keep traces and report for failed or flaky tests
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-shard-${{ matrix.shard }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
      # Last step, so it runs only when every step above passed.
      - name: Keep stage evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.evidence.outputs.name }}
          path: ${{ steps.evidence.outputs.path }}
          retention-days: 90
          if-no-files-found: error
          overwrite: true

  result:
    # Single status for branch protection: fails when any selected stage failed
    # or was cancelled, passes when stages were skipped as not applicable or as
    # covered by an earlier run (named in `evidence`).
    name: Development checks result
    needs: [changes, check, lint, terraform, e2e]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          EVIDENCE: ${{ needs.changes.outputs.evidence }}
        run: |
          echo "changes=${{ needs.changes.result }} check=${{ needs.check.result }} lint=${{ needs.lint.result }} terraform=${{ needs.terraform.result }} e2e=${{ needs.e2e.result }}"
          [ -z "$EVIDENCE" ] || echo "reused: $EVIDENCE"
          case "${{ needs.changes.result }} ${{ needs.check.result }} ${{ needs.lint.result }} ${{ needs.terraform.result }} ${{ needs.e2e.result }}" in
            *failure*|*cancelled*) echo 'A selected stage failed'; exit 1 ;;
          esac
