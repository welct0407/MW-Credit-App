name: Release tag
# Creates the final annotated Rnnn evidence tag for a verified release
# (Release_Workflow.md "Close once") and publishes the matching GitHub
# Release. Cloud sessions cannot push tags, so they start this workflow
# instead. Manual only. It never moves or deletes a release tag: an existing
# tag name is refused, and the target must be a commit on main.
#
# publish_only=true publishes the GitHub Release for a tag that already
# exists (backfill of earlier releases); the tag is not touched and an
# existing GitHub Release for it is refused. The release body is `notes`
# when given, else the tag message, followed (R144) by a "## Component
# versions" section from scripts/promotion/component-versions.mjs; if that
# derivation fails the run warns and publishes without it. The release is
# marked latest only when the tag is the highest Rnnn tag in the repository.
#
# Needs the repository secret RELEASE_TAG_TOKEN: a fine-grained token for this
# repository only, with Contents and Workflows read/write. The built-in
# GITHUB_TOKEN cannot be given the Workflows permission, and GitHub refuses a
# tag on an older commit whose workflow files differ from main without it.
#
# check_only=true proves the token works without creating a release tag: it
# creates a throwaway tag "tag-check-<run id>" on the given commit, then
# deletes it.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create, for example R064 (ignored when check_only is true)
        required: false
        type: string
      commit:
        description: Full 40-character SHA of the deployed main commit (not used by backfill)
        required: false
        type: string
      message:
        description: Tag message (release pins and verification time; ignored when check_only is true)
        required: false
        type: string
      notes:
        description: GitHub Release body (Markdown); defaults to the tag message
        required: false
        type: string
      publish_only:
        description: Publish the GitHub Release for an existing tag without creating a tag
        required: false
        type: boolean
        default: false
      check_only:
        description: Only prove the token can create and delete a tag
        required: false
        type: boolean
        default: false
      backfill:
        description: One-off (12 November 2026) backfill of R001 to R058 from scripts/promotion/backfill-release-tags.json; every other input is ignored
        required: false
        type: boolean
        default: false
      backfill_dry_run:
        description: With backfill, print the plan and change nothing
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-tag
  cancel-in-progress: false

jobs:
  tag:
    if: ${{ inputs.backfill != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the release tag token
        env:
          RELEASE_TAG_TOKEN: ${{ secrets.RELEASE_TAG_TOKEN }}
        run: |
          [ -n "$RELEASE_TAG_TOKEN" ] || { echo "::error::Repository secret RELEASE_TAG_TOKEN is not set"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TAG_TOKEN }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ inputs.check_only != true }}
        with:
          node-version-file: .nvmrc
      - name: Validate and create the tag
        env:
          TAG: ${{ inputs.tag }}
          COMMIT: ${{ inputs.commit }}
          MESSAGE: ${{ inputs.message }}
          CHECK_ONLY: ${{ inputs.check_only }}
          PUBLISH_ONLY: ${{ inputs.publish_only }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Commit must be a full 40-character SHA"; exit 1; }
          git cat-file -e "$COMMIT^{commit}" || { echo "::error::Commit $COMMIT not found"; exit 1; }
          git merge-base --is-ancestor "$COMMIT" origin/main || { echo "::error::Commit $COMMIT is not on main"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$CHECK_ONLY" = "true" ]; then
            probe="tag-check-$RUN_ID"
            git tag -a "$probe" "$COMMIT" -m "Release tag workflow token check"
            git push origin "refs/tags/$probe"
            git push origin --delete "refs/tags/$probe"
            echo "Token check passed: created and deleted $probe at $COMMIT"
            exit 0
          fi
          [[ "$TAG" =~ ^R[0-9]{3}$ ]] || { echo "::error::Tag must look like R064"; exit 1; }
          [ "$PUBLISH_ONLY" = "true" ] || [[ -n "${MESSAGE//[[:space:]]/}" ]] || { echo "::error::Tag message is empty"; exit 1; }
          if [ "$PUBLISH_ONLY" = "true" ]; then
            git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null || { echo "::error::Tag $TAG does not exist; publish_only needs an existing tag"; exit 1; }
            [ "$(git rev-list -n1 "$TAG")" = "$COMMIT" ] || { echo "::error::Tag $TAG is not on commit $COMMIT"; exit 1; }
            echo "Tag $TAG exists at $COMMIT; publishing the GitHub Release only"
          else
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
              echo "::error::Tag $TAG already exists; release tags are never moved"; exit 1
            fi
            git tag -a "$TAG" "$COMMIT" -m "$MESSAGE"
            git push origin "refs/tags/$TAG"
            echo "Created $TAG at $COMMIT"
          fi
      - name: Derive component versions
        # R144: the per-component versions (the last Rnnn that changed each component, with its native counter) at the
        # tagged commit, computed without the release token in the environment. Best effort: a failure warns and leaves
        # the file empty, and the release still publishes.
        if: ${{ inputs.check_only != true }}
        env:
          TAG: ${{ inputs.tag }}
          COMMIT: ${{ inputs.commit }}
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/components.md"
          if node scripts/promotion/component-versions.mjs derive --release "$TAG" --commit "$COMMIT" --format md >"$out" 2>"$RUNNER_TEMP/components.err" && grep -q '[^[:space:]]' "$out"; then
            echo "Derived component versions for $TAG"
          else
            : >"$out"
            echo "::warning::Component versions were not derived for $TAG; publishing without them ($(head -c 300 "$RUNNER_TEMP/components.err" | tr '\n' ' '))"
          fi
      - name: Publish the GitHub Release
        if: ${{ inputs.check_only != true }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TAG_TOKEN }}
          TAG: ${{ inputs.tag }}
          NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::GitHub Release $TAG already exists; releases are never rewritten by this workflow"; exit 1
          fi
          git fetch --tags --quiet origin
          body="${NOTES:-$(git tag -l --format='%(contents)' "$TAG")}"
          [[ -n "${body//[[:space:]]/}" ]] || { echo "::error::Release body is empty"; exit 1; }
          # R144: the table comes from the token-free step above; empty means it was not derived.
          if [ -s "$RUNNER_TEMP/components.md" ]; then
            body="$body"$'\n\n## Component versions\n\n'"$(cat "$RUNNER_TEMP/components.md")"
          fi
          highest=$(git tag -l 'R[0-9][0-9][0-9]' --sort=-v:refname | head -1)
          latest=false; [ "$TAG" = "$highest" ] && latest=true
          printf '%s\n' "$body" > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --latest="$latest"
          echo "Published GitHub Release $TAG (latest=$latest)"

  # One-off, owner instruction of 12 November 2026: backfill the R001 to R058 tags with their original release dates.
  # Lives only on the branch it is run from and is removed again after the run.
  backfill:
    if: ${{ inputs.backfill == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require the release tag token
        env:
          RELEASE_TAG_TOKEN: ${{ secrets.RELEASE_TAG_TOKEN }}
        run: |
          [ -n "$RELEASE_TAG_TOKEN" ] || { echo "::error::Repository secret RELEASE_TAG_TOKEN is not set"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TAG_TOKEN }}
      - name: Backfill R001 to R058
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TAG_TOKEN }}
          DRY_RUN: ${{ inputs.backfill_dry_run }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --quiet origin main:refs/remotes/origin/main
          bash scripts/promotion/backfill-release-tags.sh scripts/promotion/backfill-release-tags.json
