name: Database migrations
# Push-only trigger: a branch push and its pull request share the head commit,
# so one run serves both (the check appears on the PR). Release tags reuse the
# tested commit; avoid duplicate tag runs. Service changes run the integration
# groups too (APP-TEST-02): they exercise services/** against real SQL.
# Markdown never triggers a rebuild. The `changes` job skips the rebuild groups
# when all four have trusted evidence for the same database stage hash
# (scripts/ci/reuse-evidence.mjs: sha256 over the database-relevant tracked
# files); each group uploads its `evidence-database-rebuild-<hash>-<group>`
# artifact as its last step. `guards` always runs. A Windows dispatch always
# rebuilds (different route) and records no evidence.
on:
  push:
    branches: ['**']
    paths: ['database/**', 'scripts/database/**', 'tests/integration/**', 'services/**', 'scripts/rehearsal/**', 'package-lock.json', '.github/workflows/database.yml', 'scripts/dictionary/capture_postgresql.py', 'project/outputs/database-transfer-20261007/source-manifest.json', 'scripts/ci/**', '!**/*.md']
  workflow_dispatch:
    inputs:
      runner:
        description: Runner for the rebuild groups (Windows reproduces the VM-01 route)
        type: choice
        options: [ubuntu-latest, windows-latest]
        default: ubuntu-latest
permissions:
  contents: read
  # Evidence lookup: artifacts, runs and jobs of earlier runs.
  actions: read
concurrency:
  group: database-migrations-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rebuild: ${{ steps.reuse.outputs.run_rebuild }}
      evidence: ${{ steps.reuse.outputs.evidence }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reuse evidence from earlier runs
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.runner == 'windows-latest' && '--force' || '' }}
        run: node scripts/ci/reuse-evidence.mjs --workflow database --needed rebuild=true $FORCE
  guards:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reject modifications to existing migrations
        shell: pwsh
        env:
          BASE_COMMIT: ${{ github.event.before }}
        run: |
          $reachable = $false
          if ($env:BASE_COMMIT -and $env:BASE_COMMIT -notmatch '^0+$') {
            git cat-file -e "$($env:BASE_COMMIT)^{commit}" 2>$null
            $reachable = ($LASTEXITCODE -eq 0)
          }
          if ($reachable) {
            $changes = @(git diff --name-status --no-renames $env:BASE_COMMIT HEAD -- database/migrations)
            if ($LASTEXITCODE) { throw 'Cannot inspect migration history' }
            if (@($changes | Where-Object { $_ -notmatch '^A\s' }).Count) {
              throw 'Existing migrations are immutable; add a new version'
            }
          } else { Write-Host 'No reachable base commit (new branch or force update); immutability is enforced by the manifest and checksum checks' }
      - name: Verify transferred migration bytes
        run: python3 scripts/database/Verify-TransferredMigrations.py
      - name: Runner guards
        run: python3 -m unittest discover -s scripts/database -p "test_*.py"
      - name: Grouped production transaction guard (pure, manifest-driven)
        shell: pwsh
        run: ./scripts/database/Test-ProductionTransactionGuards.ps1

  rebuild:
    # The four groups of scripts/database/Test-CI.ps1 each own disposable
    # clusters, so they run as parallel jobs. Linux by default (DB-CI-01);
    # a manual dispatch can select windows-latest.
    needs: changes
    if: needs.changes.outputs.rebuild == 'true'
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        group: [migrations, receiving, phase5, phase8]
    name: rebuild (${{ matrix.group }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Stage evidence key (scripts/ci/reuse-evidence.mjs), written outside the checkout before the
      # tests; the runner image's node runs it.
      # Linux only: the evidence name carries no OS, so a Windows pass must not count for Linux.
      - name: Evidence key
        if: runner.os == 'Linux'
        id: evidence
        shell: bash
        run: node scripts/ci/reuse-evidence.mjs --hash --workflow database --stage rebuild --check "rebuild (${{ matrix.group }})" --out "$RUNNER_TEMP/evidence/{name}.json"
      - name: Keep the toolchain outside the checkout
        shell: pwsh
        run: '"MW_DB_TOOL_ROOT=$(Join-Path $env:RUNNER_TEMP db-tools)" >> $env:GITHUB_ENV'
      - name: Cache pinned Flyway and PostgreSQL tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.MW_DB_TOOL_ROOT }}
          key: db-tools-${{ runner.os }}-${{ hashFiles('database/toolchain.json', 'scripts/database/Install-Tools.ps1', 'scripts/database/Common.ps1') }}
      - name: Install pinned tools outside checkout (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/database/Install-Tools.ps1
      - name: Install PostgreSQL 18 (PGDG) and pinned Flyway (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get install -y -q postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -q postgresql-18
          echo "MW_PG_BIN=/usr/lib/postgresql/18/bin" >> "$GITHUB_ENV"
          version=$(jq -r .flywayVersion database/toolchain.json)
          if [ ! -x "$MW_DB_TOOL_ROOT/flyway-$version/flyway" ]; then
            mkdir -p "$MW_DB_TOOL_ROOT"
            curl -fsSL -o "$RUNNER_TEMP/flyway.tar.gz" "$(jq -r .linux.url database/toolchain.json)"
            echo "$(jq -r .linux.sha256 database/toolchain.json)  $RUNNER_TEMP/flyway.tar.gz" | sha256sum -c -
            tar -xzf "$RUNNER_TEMP/flyway.tar.gz" -C "$MW_DB_TOOL_ROOT"
          fi
          "$MW_DB_TOOL_ROOT/flyway-$version/flyway" -v | grep -q "Flyway.*$version"
          /usr/lib/postgresql/18/bin/pg_ctl --version
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install application test dependencies
        run: npm ci
      - name: Rebuild and validate disposable database
        shell: pwsh
        run: ./scripts/database/Test-CI.ps1 -Group ${{ matrix.group }}
      - name: Tests leave tracked files unchanged
        shell: bash
        run: git diff --exit-code --stat && test -z "$(git status --porcelain)"
      # Last step, so it runs only when every step above passed. Linux only, as the key above.
      - name: Keep stage evidence
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.evidence.outputs.name }}
          path: ${{ steps.evidence.outputs.path }}
          retention-days: 90
          if-no-files-found: error
          overwrite: true
