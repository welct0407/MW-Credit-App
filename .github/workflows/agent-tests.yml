name: Agent tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths: ['integration-agent/**', 'database/migrations/**', 'scripts/database/Test-AppRolePrerequisites.sql', '.github/workflows/agent-tests.yml']
  push:
    branches: [main]
    paths: ['integration-agent/**', 'database/migrations/**', 'scripts/database/Test-AppRolePrerequisites.sql', '.github/workflows/agent-tests.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install package and hash-pinned dependencies
        run: |
          # requirements.lock arrives with the agent branch; until then install from pyproject.
          if [ -f integration-agent/requirements.lock ]; then
            python -m pip install --require-hashes -r integration-agent/requirements.lock
            python -m pip install --no-deps ./integration-agent
          else
            python -m pip install ./integration-agent
          fi
      # ALL-CI-04: ruff (pinned) with the rule set in integration-agent/pyproject.toml; blocking.
      - name: Install pinned ruff
        run: python -m pip install ruff==0.16.8
      - name: Ruff
        run: ruff check --no-cache integration-agent --output-format=github
      - name: Run synthetic and local tests
        # Private PostgreSQL lab and renderer prerequisites retain their existing
        # unittest skips; this workflow does not manufacture integration proof.
        # Tests read package files relative to integration-agent/.
        working-directory: integration-agent
        run: python -m unittest discover -s tests -v

  lab:
    # AGT-TEST-01: the PostgreSQL lab suites (otherwise skipped) on a disposable
    # loopback cluster built by integration-agent/tests/lab/setup.sh (agent
    # branch). The runner user is not root, as PostgreSQL requires.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install PostgreSQL 18 (PGDG) and pinned Flyway
        run: |
          set -euo pipefail
          sudo apt-get install -y -q postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -q postgresql-18
          version=$(jq -r .flywayVersion database/toolchain.json)
          curl -fsSL -o "$RUNNER_TEMP/flyway.tar.gz" "$(jq -r .linux.url database/toolchain.json)"
          echo "$(jq -r .linux.sha256 database/toolchain.json)  $RUNNER_TEMP/flyway.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/flyway.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/flyway-$version" >> "$GITHUB_PATH"
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
      - name: Install package and hash-pinned dependencies
        run: |
          # requirements.lock arrives with the agent branch; until then install from pyproject.
          if [ -f integration-agent/requirements.lock ]; then
            python -m pip install --require-hashes -r integration-agent/requirements.lock
            python -m pip install --no-deps ./integration-agent
          else
            python -m pip install ./integration-agent
          fi
      - name: Build the disposable lab cluster
        run: env LAB_ROOT="$RUNNER_TEMP/agent-state-lab-ci" LAB_PORT=15540 PYTHON=python bash integration-agent/tests/lab/setup.sh
      - name: Run the PostgreSQL lab suites
        working-directory: integration-agent
        run: |
          export MW_AGENT_LAB_MANIFEST="$RUNNER_TEMP/agent-state-lab-ci/manifest.json"
          export MW_DML_TEST_DSN="host=127.0.0.1 port=15540 user=postgres dbname=mw_dml_test_ci"
          python -m unittest -v tests.test_postgres_state tests.test_postgres_dml_audit \
            tests.test_conversation_dml tests.test_notice_acknowledgement \
            tests.test_operator_audit_postgres tests.test_operator_execution_postgres \
            tests.test_receipt_audit_postgres tests.test_state_migration_postgres \
            tests.test_statement_snapshot
      - name: Stop the lab cluster
        if: always()
        run: env LAB_ROOT="$RUNNER_TEMP/agent-state-lab-ci" LAB_PORT=15540 PYTHON=python bash integration-agent/tests/lab/setup.sh stop
