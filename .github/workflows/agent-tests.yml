name: Agent tests
# Markdown never triggers a run. The `changes` job skips a job that has trusted
# evidence for the same stage hash (scripts/ci/reuse-evidence.mjs: sha256 over
# the agent-relevant tracked files); each job uploads its
# `evidence-agent-tests-<job>-<hash>` artifact as its last step, so the merge of
# a tested pull request into main does not repeat the suites. The PostgreSQL data
# dictionary is an input of the `test` stage only (the packaged schema digest is
# built from it and its drift test runs there). All three jobs
# check out the same candidate (the pull request head) so their hashes agree.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths: ['integration-agent/**', 'database/migrations/**', 'scripts/database/Test-AppRolePrerequisites.sql', '.github/workflows/agent-tests.yml', 'scripts/ci/**', 'project/Documents/Data Dictionary/systems/postgresql/**', '!**/*.md']
  push:
    branches: [main]
    paths: ['integration-agent/**', 'database/migrations/**', 'scripts/database/Test-AppRolePrerequisites.sql', '.github/workflows/agent-tests.yml', 'scripts/ci/**', 'project/Documents/Data Dictionary/systems/postgresql/**', '!**/*.md']
  workflow_dispatch:

permissions:
  contents: read
  # Evidence lookup: artifacts, runs and jobs of earlier runs.
  actions: read

concurrency:
  group: agent-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      test: ${{ steps.reuse.outputs.run_test }}
      lab: ${{ steps.reuse.outputs.run_lab }}
      evidence: ${{ steps.reuse.outputs.evidence }}
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Reuse evidence from earlier runs
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/reuse-evidence.mjs --workflow agent-tests --needed test=true,lab=true

  test:
    needs: changes
    if: needs.changes.outputs.test == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      # Stage evidence key (scripts/ci/reuse-evidence.mjs), written outside the checkout
      # before the tests; the runner image's node runs it.
      - name: Evidence key
        id: evidence
        run: node scripts/ci/reuse-evidence.mjs --hash --workflow agent-tests --stage test --check test --out "$RUNNER_TEMP/evidence/{name}.json"
      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install package and hash-pinned dependencies
        run: |
          # requirements.lock arrives with the agent branch; until then install from pyproject.
          if [ -f integration-agent/requirements.lock ]; then
            python -m pip install --require-hashes -r integration-agent/requirements.lock
            python -m pip install --no-deps ./integration-agent
          else
            python -m pip install ./integration-agent
          fi
      # ALL-CI-04: ruff (pinned) with the rule set in integration-agent/pyproject.toml; blocking.
      - name: Install pinned ruff
        run: python -m pip install ruff==0.16.8
      - name: Ruff
        run: ruff check --no-cache integration-agent --output-format=github
      - name: Run synthetic and local tests
        # Private PostgreSQL lab and renderer prerequisites retain their existing
        # unittest skips; this workflow does not manufacture integration proof.
        # Tests read package files relative to integration-agent/.
        working-directory: integration-agent
        run: python -m unittest discover -s tests -v
      # Last step, so it runs only when every step above passed.
      - name: Keep stage evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.evidence.outputs.name }}
          path: ${{ steps.evidence.outputs.path }}
          retention-days: 90
          if-no-files-found: error
          overwrite: true

  lab:
    # AGT-TEST-01: the PostgreSQL lab suites (otherwise skipped) on a disposable
    # loopback cluster built by integration-agent/tests/lab/setup.sh (agent
    # branch). The runner user is not root, as PostgreSQL requires.
    needs: changes
    if: needs.changes.outputs.lab == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      # Stage evidence key (scripts/ci/reuse-evidence.mjs), written outside the checkout
      # before the tests; the runner image's node runs it.
      - name: Evidence key
        id: evidence
        run: node scripts/ci/reuse-evidence.mjs --hash --workflow agent-tests --stage lab --check lab --out "$RUNNER_TEMP/evidence/{name}.json"
      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install PostgreSQL 18 (PGDG) and pinned Flyway
        run: |
          set -euo pipefail
          sudo apt-get install -y -q postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -q postgresql-18
          version=$(jq -r .flywayVersion database/toolchain.json)
          curl -fsSL -o "$RUNNER_TEMP/flyway.tar.gz" "$(jq -r .linux.url database/toolchain.json)"
          echo "$(jq -r .linux.sha256 database/toolchain.json)  $RUNNER_TEMP/flyway.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/flyway.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/flyway-$version" >> "$GITHUB_PATH"
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
      - name: Install package and hash-pinned dependencies
        run: |
          # requirements.lock arrives with the agent branch; until then install from pyproject.
          if [ -f integration-agent/requirements.lock ]; then
            python -m pip install --require-hashes -r integration-agent/requirements.lock
            python -m pip install --no-deps ./integration-agent
          else
            python -m pip install ./integration-agent
          fi
      - name: Build the disposable lab cluster
        run: env LAB_ROOT="$RUNNER_TEMP/agent-state-lab-ci" LAB_PORT=15540 PYTHON=python bash integration-agent/tests/lab/setup.sh
      - name: Start an empty cluster for the fresh central-migration suite
        # DB-AGENTDB-01: test_state_migration_postgres bootstraps mw_agent here and
        # applies V1..Vn from nothing; it refuses a server that already has them.
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/agent-fresh-migration" /tmp/mwpg-15611
          initdb -D "$RUNNER_TEMP/agent-fresh-migration/data" -U postgres --auth=trust --encoding=UTF8 --locale=C >/dev/null
          pg_ctl -D "$RUNNER_TEMP/agent-fresh-migration/data" -o "-h 127.0.0.1 -p 15611 -k /tmp/mwpg-15611" -l "$RUNNER_TEMP/agent-fresh-migration/postgres.log" -w start
      - name: Run the PostgreSQL lab suites
        working-directory: integration-agent
        run: |
          export MW_AGENT_LAB_MANIFEST="$RUNNER_TEMP/agent-state-lab-ci/manifest.json"
          export MW_AGENT_FRESH_PG_DSN="host=127.0.0.1 port=15611 user=postgres dbname=postgres"
          # R091: the reviewer DML and conversation SQL lab suites left with the Instagram Partner conversation.
          python -m unittest -v tests.test_postgres_state tests.test_notice_acknowledgement \
            tests.test_operator_audit_postgres tests.test_operator_execution_postgres \
            tests.test_receipt_audit_postgres tests.test_state_migration_postgres \
            tests.test_audit_retention_postgres tests.test_statement_snapshot
      - name: Stop the lab cluster
        if: always()
        run: |
          env LAB_ROOT="$RUNNER_TEMP/agent-state-lab-ci" LAB_PORT=15540 PYTHON=python bash integration-agent/tests/lab/setup.sh stop
          pg_ctl -D "$RUNNER_TEMP/agent-fresh-migration/data" -m fast stop || true
      # Last step, so it runs only when every step above passed.
      - name: Keep stage evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.evidence.outputs.name }}
          path: ${{ steps.evidence.outputs.path }}
          retention-days: 90
          if-no-files-found: error
          overwrite: true
