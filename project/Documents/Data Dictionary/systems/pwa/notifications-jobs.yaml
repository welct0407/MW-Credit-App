  "push_content": "R080 (V99, Released 20 October 2026, source 4a7e199; source_base is unchanged) and R081 (V100, Released 20 October 2026, source b36dce9): the dispatcher reads public.pwa_notify_content_v1(delivery, generation) between prepare and start and renders title (activity + amount) and body in the recipient language (Partners Language Preference ไทย is Thai, else English) with grapheme budgets 30 and 80 in services/notifications/content.mjs. R081 name rule: Thai recipients get Borrowers Borrower Name; English recipients get only the English name (Borrowers Description, trimmed), and the body is empty (title only) when there is none. A failed read sends generic New activity. Web Push payload v2 {v, eventId, title, body, url, tag}, title 1 to 60 and body 0 to 200 characters; apps/pwa/pwa/sw.js renders it and falls back for v1 or malformed payloads. R089 (V103, Released 22 October 2026, source 99758c71): each Notifications history item also carries title and body, the same wording rendered by services/notifications/store.mjs through public.pwa_notify_history_content_v1(actor, events) for the page's events with the caller as recipient; an event without facts, or an unavailable function, gives the generic New activity, and PWA rows cached before R089 show MW Credit / New activity."
  "source_base": "https://github.com/welct0407/MW-Credit-App/blob/808cdf53225ce627ea41ef4d3666bf97a3c9cbfe/"
  "offline_history": "DEV and owner-authorized PROD recipient endpoint retains protocol2 cursor GET; protocol 1 is retired\
    \ and protocol=2 or 3 is required. Protocol3 read-only POST uses bounded content-hash manifests, transferring only requested\
    \ missing values through protected recipient RPCs. sourceVersion=null: every sweep scans manifests, without main-domain\
    \ fast gate or global snapshot claim. Dispatch/subscriptions/schedules unchanged."
  "offline_history_source": "https://github.com/welct0407/MW-Credit-App/blob/6a3cf8cde2710a45b0368bc7f177f21bdab2693c/services/notifications/store.mjs"
  "offline_history_production_source": "https://github.com/welct0407/MW-Credit-App/blob/b77a1ef3d58c488a2113b97948aefe83945e84ec/services/production/business-runtime.mjs"
  "subscription_privilege": "Device subscription, revoke and preference are read-capability actions; the store resolves the\
    \ actor with capability read for every route (services/notifications/store.mjs). Accepted by the owner, 16 October 2026\
    \ (APP-NOTIFY-01)."
  "row_change_log":
