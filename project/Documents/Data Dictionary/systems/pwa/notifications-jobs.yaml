    "columns": "seq bigint identity primary key; table_name text; row_key text (primary key text, or '*' after a TRUNCATE);\
      \ txid xid8 default pg_current_xact_id(); changed_at timestamptz default clock_timestamp()"
    "index": "pwa_row_changes_table_seq (table_name, seq)"
    "writers": "AFTER ROW trigger zzzzzzz_pwa_row_change on 19 source tables and AFTER TRUNCATE statement trigger zzzzzzz_pwa_row_truncate,\
      \ both ENABLE ALWAYS; SECURITY DEFINER function pwa_track_row_change() owned by mw_changes_owner_<env> with a pinned\
      \ search_path"
    "retention": "pwa_row_changes_prune_v1() deletes rows older than 7 days but keeps the newest row; run by the hourly recent-analytics\
      \ job branch"
    "access": "mw_app_<env> SELECT only (table and identity sequence)"
    "readers": "offline dataset protocol 4 (since cursor {seq, xmin}); an unreadable or missing table makes the server omit\
      \ the change cursor and walk"
    "status": "V97 and V98 applied to DEV and PROD on 19 October 2026 (R078); mw_app_<env> has SELECT only on the table and\
      \ its sequence"
