    "behavior": "DEV and PROD prepare complete read DTO bundles and authorized receipt images so unvisited pages, local search\
      \ and paging can work offline once prepared. Ordinary queued forms use prepared reference data."
    "preparation": "One bounded request at a time. Foreground navigation pauses the next chunk without discarding in-flight\
      \ server work. Online/focus resumes durable cursor stages; manual active-domain requests coalesce. Failed preparation\
      \ retries at 5/15/30 seconds; local applied mutation restarts its read revision."
    "storage": "Complete bundles/media remain separate from response LRU. Partial stages resume; completed data and checkpoint\
      \ atomically CAS original local mutation revision, expected cursor and prior complete base. Response-cache epoch is\
      \ separate; missing initial epoch disables cache/fallback for that read while valid online response succeeds. Downloads\
      \ never rewrite pending requests/drafts; retained complete data remains visible on update/failure."
    "coverage": "Used server read DTOs, existing membership/financial calculations, eligible records and recent cash-statement\
      \ dates. Receipt media uses authenticated native reads, not raw storage access or signed URLs."
    "progress": "Header bar is determinate with numeric percentage only during an active online preparation cycle, using cycle-completed\
      \ work separate from retained cached completeness. Hides immediately offline or when the current cycle is idle/finished,\
      \ independent of retained cached readiness. No indeterminate dataset bar; current GET activity remains refresh-icon\
      \ feedback."
    "network_only": "Fresh financial close/correction/auto-assignment/review and command status stay online. Guarded read-only\
      \ Collection Note baseline may use prepared data only when not editing, busy, blocked or pending; dirty text is not\
      \ replaced. Note autosave algorithm and deferred concern unchanged."
