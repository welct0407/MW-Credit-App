  "hybrid_read_cache":
    "behavior": "Used read views render cached/prepared data and receipt images first; authorized network refresh updates\
      \ the same view. Header spinner and left progress bar show request/preparation activity. Distinct ! badge/tooltip/live\
      \ status indicates current-page refresh failure even without cache; scope epoch blocks late prior-page failures. Successful\
      \ retry clears failure; cached fallback indication is separate."
    "isolation": "Owner issuer/uid and environment namespace; full URL/query and relevant Asia/Bangkok business date keys;\
      \ account/session authorization lease and read-revision guards; no cross-owner/environment/search/date leakage."
    "bounds":
      "maximum_responses": 512
      "maximum_total_bytes": 33554432
      "maximum_response_bytes": 8388608
      "authorization_lease_hours": 24
      "note": "Authorization lease is not a claim that every cached response expires after 24 hours; cache retains bounded\
        \ responses with revision/authorization checks."
    "formats": "Allowlisted authenticated GET JSON and receipt PNG/JPEG/WebP blobs. Tokens/auth fields/signed URLs excluded;\
      \ no credential-bearing URLs."
    "network_authority": "Fresh financial/action previews and command status remain network-only. Guarded read-only Collection\
      \ Note baseline may use prepared datasets without replacing dirty text or pending requests; autosave algorithm unchanged\
      \ and latest concern deferred."
    "invalidation": "Applied writes invalidate response revisions; queued offline changes retain viewed cache. Responses begun\
      \ before invalidation cannot revive old data. Authorization denial/navigation abort prevents cached fallback; cache\
      \ storage failure must not block valid network reads. Without valid fallback, preserve the actual429/5xx response, body\
      \ and request reference; do not substitute a generic transport failure."
    "editor_safety": "Dirty editable values are not replaced by refresh; current navigation/context and pending-write revisions\
      \ protect late child/parent updates."
    "sources":
