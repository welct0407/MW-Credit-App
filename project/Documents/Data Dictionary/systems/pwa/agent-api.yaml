  "group_chat_summary": "R146 (released 13 November 2026; the agent service group_chat_summary is installed disabled). POST /internal/agent/group-chat-summaries has its own handler branch behind the unchanged token check and policy; body exactly {command}, at most 16,384 bytes, command.environment equal to the policy environment; no actor Partner, after-commit effect or notification. canonicalGroupChatSummary: exact keys, code-point limits 160 (headline) and 200 (point), no control characters, sorted unique borrowerIds (0 to 20), requestId equal to the agent's derivation. It calls public.pwa_put_group_chat_summary_v1 (V146) with the command service's own rights. Replies: 200 {kind: stored|unchanged|superseded|cleared}; 400 invalid_summary_command (also SQLSTATE 22023); 401 caller; 422 unknown_borrower (P0002); 503 summary_unavailable or summary_outcome_unknown; 404 without a policy, for another method or for a longer path. The agent maps 400 to POST_REFUSED, 422 to POST_UNKNOWN_BORROWER and 503 to RECEIPT_API_OUTCOME_UNCERTAIN; the post is an idempotent overwrite."
  "group_chat_summary_request_identity": "SHA-256-derived version-4-format UUID of ['mw-credit-agent-group-summary-v1', environment, conversationKey, sourceSha256]; one test vector is shared by the Node and Python tests"
  "receipt_request_identity": "SHA-256-derived version-4-format UUID of ['mw-credit-agent-receipt-v1', environment, reviewId]"
