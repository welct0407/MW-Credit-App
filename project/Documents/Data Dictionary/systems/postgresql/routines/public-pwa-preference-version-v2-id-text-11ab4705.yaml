    "definition": "CREATE OR REPLACE FUNCTION public.pwa_preference_version_v2(id text)\n RETURNS text\n LANGUAGE sql\n STABLE\n\
      \ SET search_path TO 'pg_catalog', 'public'\nAS $function$\r\n SELECT encode(sha256(convert_to(jsonb_build_object('partnerId',p.\"\
      Row ID\",'language',p.\"Language Preference\",'context',to_jsonb(c))::text,'UTF8')),'hex') FROM public.\"Partners\"\
      \ p LEFT JOIN public.\"Cash Statement Context\" c ON c.\"Ref Partner\"=p.\"Row ID\" WHERE p.\"Row ID\"=$1;\r\n$function$\n"
