    "comment": "R165: records that the actor (its login email must map to exactly its Partner, 42501 otherwise) asks for the\
      \ borrower's group chat summary to be refreshed. Returns {kind: accepted (a new request) | pending (an open request\
      \ younger than 10 minutes, same requestId) | recent (completed less than 60 seconds ago), requestId, requestedAt, completedAt,\
      \ outcome}. Raises unknown_borrower (P0002) or invalid_request (22023). Invoker rights."
