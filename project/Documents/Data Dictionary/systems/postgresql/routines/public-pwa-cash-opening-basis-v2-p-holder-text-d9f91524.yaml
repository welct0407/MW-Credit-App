    "definition": "CREATE OR REPLACE FUNCTION public.pwa_cash_opening_basis_v2(p_holder text)\n RETURNS jsonb\n LANGUAGE sql\n\
      \ STABLE\n SET search_path TO 'pg_catalog', 'public'\nAS $function$\r\n SELECT jsonb_build_object('holderId',h.\"Row\
      \ ID\",'holderLabel',h.\"Holder Name\",\r\n 'sourceVersion',encode(sha256(convert_to(to_jsonb(h)::text,'UTF8')),'hex'),\r\
      \n 'holderBalance',b.\"Current Balance\"::text,\r\n 'accounts',coalesce((SELECT jsonb_agg(jsonb_build_object('accountId',a.\"\
      Ref Cash Account\",\r\n 'label',a.\"Account Label\",'initialized',a.\"Initialized\",'balance',a.\"Current Balance\"\
      ::text)\r\n ORDER BY a.\"Ref Cash Account\" COLLATE \"C\") FROM public.\"Cash Account Balances\" a\r\n WHERE a.\"Ref\
      \ Cash Holder\"=h.\"Row ID\"),'[]'::jsonb))\r\n FROM public.\"Cash Holders\" h JOIN public.\"Cash Holder Balances\"\
      \ b ON b.\"Ref Cash Holder\"=h.\"Row ID\"\r\n WHERE h.\"Row ID\"=p_holder\r\n$function$\n"
