    "acl": "{=X/postgres,postgres=X/postgres,mw_app_prod=X/postgres}"
    "comment": "R111/R118/R120/R129: the referral rebate of a closed referred loan, the referrer's rate (default 10%) of the\
      \ interest and late charges received, at most the referrer's cap (default 1,000), offset to the referrer's open loan\
      \ where possible; the rest is pending payment until a rebate settlement (REFERRAL_REBATE_V3). The applied terms are\
      \ stored on the expense."
