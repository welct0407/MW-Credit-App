      CREATE OR REPLACE FUNCTION public.pwa_plan_effects_v83(lines jsonb)
       RETURNS jsonb
       LANGUAGE sql
       IMMUTABLE
       SET search_path TO 'pg_catalog', 'public'
      AS $function$ SELECT coalesce(jsonb_agg(value-ARRAY['expectedPrincipalRemaining','expectedInterestRemaining'] ORDER BY (value->>'chargeId') COLLATE "C"),'[]'::jsonb) FROM jsonb_array_elements(lines); $function$
