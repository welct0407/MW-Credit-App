    "definition": "CREATE OR REPLACE FUNCTION public.pwa_payment_head_v2(id text)\n RETURNS uuid\n LANGUAGE plpgsql\n STABLE\n\
      \ SET search_path TO 'pg_catalog', 'public'\nAS $function$\r\nDECLARE head uuid;candidate uuid;total integer;\r\nBEGIN\r\
      \n SELECT request_id INTO head FROM public.pwa_payment_commands WHERE contract_version=1 AND outcome='posted' AND payment_id=$1;\r\
      \n IF head IS NULL THEN SELECT request_id INTO head FROM public.pwa_payment_commands WHERE contract_version=2 AND outcome='applied'\
      \ AND result_json->>'paymentId'=$1 AND canonical_json::jsonb#>>'{command,operation}' IN('loan.create','loan.close','charge.create');END\
      \ IF;\r\n LOOP\r\n SELECT count(*) INTO total FROM public.pwa_payment_commands WHERE contract_version=2 AND outcome='applied'\
      \ AND canonical_json::jsonb#>>'{command,operation}'='payment.correct' AND canonical_json::jsonb#>>'{command,targetId}'=$1\
      \ AND canonical_json::jsonb#>>'{command,predecessorRequestId}' IS NOT DISTINCT FROM head::text;\r\n IF total=0 THEN\
      \ EXIT;END IF;IF total<>1 THEN RAISE EXCEPTION 'Invalid correction lineage';END IF;\r\n SELECT request_id INTO candidate\
      \ FROM public.pwa_payment_commands WHERE contract_version=2 AND outcome='applied' AND canonical_json::jsonb#>>'{command,operation}'='payment.correct'\
      \ AND canonical_json::jsonb#>>'{command,targetId}'=$1 AND canonical_json::jsonb#>>'{command,predecessorRequestId}' IS\
      \ NOT DISTINCT FROM head::text;\r\n IF candidate=head THEN RAISE EXCEPTION 'Invalid correction lineage';END IF;head:=candidate;\r\
      \n END LOOP;RETURN head;\r\nEND $function$\n"
