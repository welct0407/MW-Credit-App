    "definition": "CREATE OR REPLACE FUNCTION public.pwa_borrower_version_v2(id text)\n RETURNS text\n LANGUAGE sql\n STABLE\n\
      \ SET search_path TO 'pg_catalog', 'public'\nAS $function$\r\n -- R120: the referral rebate terms are part of the version.\n\
      \ SELECT encode(sha256(convert_to(jsonb_build_object('id',b.\"Row ID\",'createdDate',b.\"Creation Date\",'aiCollectionEnabled',b.\"\
      AI Collection Enabled\",'name',b.\"Borrower Name\",'description',b.\"Description\",'communicationName',b.\"Communication\
      \ Name\",'instagramUsername',b.\"Instagram Username\",'city',b.\"City\",'workingLocation',b.\"Working Location\",'address',b.\"\
      Address\",'hidden',b.\"Hidden Flag\",'referrerId',b.\"Ref Referrer\",'preferredReceivingAccountId',b.\"Ref Preferred\
      \ Receiving Cash Account\",'note',b.\"Borrower Note\",'referralRebateRate',b.\"Referral Rebate Rate\",'referralRebateCap',b.\"\
      Referral Rebate Cap\" )::text,'UTF8')),'hex') FROM public.\"Borrowers\" b WHERE b.\"Row ID\"=$1;\r\n$function$\n"
    "owner": "postgres"
    "language": "sql"
