    "comment": "R116 (V130): true for a principal write-off repayment: a df10: posting, or a zero-cash loss pair (no Ref Payment,\
      \ principal X > 0, interest -X, a non-lc7:/ls2: charge of X/-X with exactly one repayment). Pure; the caller supplies\
      \ the charge."
