    "definition": "CREATE OR REPLACE FUNCTION public.pwa_apply_loan_source_v2(canonical text)\n RETURNS jsonb\n LANGUAGE plpgsql\n\
      \ SET search_path TO 'pg_catalog', 'public'\nAS $function$\r\nDECLARE e jsonb:=canonical::jsonb;i jsonb:=e#>'{command,inputs}';a\
      \ jsonb:=e->'actor';target text:=e#>>'{command,targetId}';op text:=e#>>'{command,operation}';\r\n parent text;l public.\"\
      Loans\"%ROWTYPE;message text;\r\nBEGIN\r\n IF (current_database() NOT IN ('loan_manager_dev','payment_rehearsal','loan_manager_prod')\
      \ OR current_user<>CASE current_database() WHEN 'loan_manager_prod' THEN 'mw_app_prod_journal_owner' ELSE 'mw_app_dev_journal_owner'\
      \ END) OR op NOT IN('loan.update','loan.delete','loan.default','loan.undo-default','loan.generate-charge') THEN RAISE\
      \ EXCEPTION USING ERRCODE='42501',MESSAGE='Governed operation required';END IF;\r\n SELECT \"Ref Borrowers\" INTO parent\
      \ FROM public.\"Loans\" WHERE \"Row ID\"=target;\r\n IF NOT FOUND THEN RAISE EXCEPTION USING ERRCODE='P5B02';END IF;\r\
      \n PERFORM 1 FROM public.\"Borrowers\" WHERE \"Row ID\"=parent OR (op='loan.update' AND \"Row ID\"=i->>'borrowerId')\
      \ ORDER BY \"Row ID\" COLLATE \"C\" FOR UPDATE;\r\n IF op='loan.update' AND NOT EXISTS(SELECT 1 FROM public.\"Borrowers\"\
      \ WHERE \"Row ID\"=i->>'borrowerId') THEN RAISE EXCEPTION USING ERRCODE='P5B04';END IF;\r\n SELECT * INTO l FROM public.\"\
      Loans\" WHERE \"Row ID\"=target FOR UPDATE;\r\n IF NOT FOUND THEN RAISE EXCEPTION USING ERRCODE='P5B02';END IF;\r\n\
      \ IF l.\"Ref Borrowers\" IS DISTINCT FROM parent THEN RAISE EXCEPTION USING ERRCODE='P5B01';END IF;\r\n PERFORM 1 FROM\
      \ public.\"Charges\" WHERE \"Ref Loans\"=target ORDER BY \"Row ID\" COLLATE \"C\" FOR UPDATE;\r\n IF public.pwa_loan_version_v2(target)\
      \ IS DISTINCT FROM e#>>'{command,expectedVersion}' THEN RAISE EXCEPTION USING ERRCODE='P5B01';END IF;\r\n IF op IN('loan.default','loan.generate-charge')\
      \ AND (i->>'businessDate')::date IS DISTINCT FROM (statement_timestamp() AT TIME ZONE 'Asia/Bangkok')::date THEN RAISE\
      \ EXCEPTION USING ERRCODE='P5B08';END IF;\r\n\r\n BEGIN\r\n CASE op\r\n WHEN 'loan.delete' THEN DELETE FROM public.\"\
      Loans\" WHERE \"Row ID\"=target;\r\n WHEN 'loan.default' THEN UPDATE public.\"Loans\" SET \"Defaulted\"=true,\"Close\
      \ Date\"=(i->>'businessDate')::date,\"Closed By\"=a->>'loginEmail' WHERE \"Row ID\"=target;\r\n WHEN 'loan.undo-default'\
      \ THEN UPDATE public.\"Loans\" SET \"Defaulted\"=false WHERE \"Row ID\"=target;\r\n WHEN 'loan.generate-charge' THEN\
      \ UPDATE public.\"Loans\" SET \"Charge Generation Request\"=(i->>'businessDate')||'|'||(e->>'requestId') WHERE \"Row\
      \ ID\"=target;\r\n WHEN 'loan.update' THEN\r\n IF i ? 'scheduleAnchor' AND (i->>'scheduleAnchor')::date<(i->>'loanDate')::date\
      \ THEN RAISE EXCEPTION USING ERRCODE='P5B08';END IF;\r\n UPDATE public.\"Loans\" SET \"Ref Borrowers\"=i->>'borrowerId',\"\
      Loan Date\"=(i->>'loanDate')::date,\"Principal Amount\"=(i->>'principal')::numeric::money,\"Transfer Fee\"=(i->>'transferFee')::numeric::money,\"\
      Ref Disbursed From Cash Account\"=i->>'disbursingAccountId',\"Loan Type\"=i->>'type',\"Due Date\"=(i->>'dueDate')::date,\"\
      Daily Payment Amount\"=(i->>'dailyPayment')::numeric::money,\"Fixed Interest\"=(i->>'fixedInterest')::numeric::money,\"\
      Current Daily Interest\"=(i->>'currentDailyInterest')::numeric::money,\"Interest Payment Interval\"=(i->>'paymentInterval')::integer,\"\
      Interest Schedule Anchor Date\"=CASE WHEN i ? 'scheduleAnchor' THEN (i->>'scheduleAnchor')::date ELSE l.\"Interest Schedule\
      \ Anchor Date\" END,\"Loan Arrangement\"=i->>'arrangement',\"Auto Charge Enabled\"=(i->>'autoChargeEnabled')::boolean\
      \ WHERE \"Row ID\"=target;\r\n END CASE;\r\n EXCEPTION\r\n WHEN foreign_key_violation THEN RAISE EXCEPTION USING ERRCODE='P5B05';\r\
      \n WHEN SQLSTATE 'P0001' THEN\r\n  GET STACKED DIAGNOSTICS message=MESSAGE_TEXT;\r\n  IF message=ANY(ARRAY['Undo Default\
      \ before deleting this loan','Loan has receipts; delete or reassign those receipts first','Loan has receipts for its\
      \ original borrower; reassign them first','Related expense borrower must be corrected before moving this loan']) THEN\
      \ RAISE EXCEPTION USING ERRCODE='P5B05';END IF;\r\n  IF message=ANY(ARRAY[\r\n   'Loan principal must cover its posted\
      \ principal and recorded principal charges','Undo default before changing loan inputs','Original daily interest rate\
      \ unavailable; review original loan terms before principal repayment','Original daily interest rate unavailable; review\
      \ original loan terms before daily conversion','Automatic daily conversion requires a loan date and positive interest\
      \ payment interval',\r\n   'Default requires an open auto-enabled nondefaulted loan','Resolve processing or error payments\
      \ before default','Default requires outstanding principal','Charge components require reconciliation before default','A\
      \ paid charge today prevents Default Loan',\r\n   'Default loss posting no longer matches; reconcile its components\
      \ before undo','Default charge has no original component evidence; reconcile before undo','Default charge evidence is\
      \ malformed; reconcile before undo','Default charge changed since write-off; reconcile before undo'\r\n  ]) THEN RAISE\
      \ EXCEPTION USING ERRCODE='P5B06';ELSE RAISE;END IF;\r\n END;\r\n RETURN jsonb_build_object('operation',op,'targetType','loan','targetId',target,'paymentId',NULL,'plan',NULL,'predecessorRequestId',NULL,'sourceCreatedBy',NULL);\r\
      \nEND $function$\n"
