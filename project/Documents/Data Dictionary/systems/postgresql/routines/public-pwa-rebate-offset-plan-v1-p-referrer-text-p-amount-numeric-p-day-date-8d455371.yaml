    "comment": "R184: the offset of a rebate settlement to the referrer's own loan, the Loan Close offset plan (pwa_pay_forward_plan_v1,\
      \ forward only: due charges first, then future charges to the 93-day horizon): available (an open, not defaulted loan\
      \ the plan can pay), dueAmount, maxAmount and, for an amount, covered, lines and planHash. Shown by Pay rebates and\
      \ recomputed by rebate-settlement.create. Read only."
