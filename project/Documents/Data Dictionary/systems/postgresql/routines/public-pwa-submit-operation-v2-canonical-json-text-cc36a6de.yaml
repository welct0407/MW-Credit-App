  "status": "documented"
  "source": "Change Logs/CHANGE_NOTES_W4_DATABASE_2026-10-16.md"
"content":
  "definition": "CREATE OR REPLACE FUNCTION public.pwa_submit_operation_v2(canonical_json text)\n RETURNS jsonb\n LANGUAGE\
    \ plpgsql\n SECURITY DEFINER\n SET search_path TO 'pg_catalog', 'public'\nAS $function$\r\nDECLARE e jsonb;a jsonb;c jsonb;i\
    \ jsonb;old public.pwa_payment_commands%ROWTYPE;request uuid;target text;op text;expected text;canonical text;input_text\
    \ text;receipt_text text;r jsonb;actor_text text;command_text text;k text;v text;rejection text;result_value jsonb;keys\
    \ text[];source_version text;\r\nBEGIN\r\n IF current_database() NOT IN ('loan_manager_dev','payment_rehearsal','loan_manager_prod')\
    \ OR NOT pg_has_role(session_user,CASE current_database() WHEN 'loan_manager_prod' THEN 'mw_app_prod' ELSE 'mw_app_dev'\
    \ END,'MEMBER') THEN RAISE EXCEPTION USING ERRCODE='42501',MESSAGE='Application session required';END IF;\r\n PERFORM\
    \ set_config('pwa.native_inverse_request','',true);\r\n IF $1 IS NULL OR octet_length($1)>524288 THEN RAISE EXCEPTION\
    \ USING ERRCODE='22023',MESSAGE='Invalid operation';END IF;\r\n BEGIN\r\n e:=$1::jsonb;a:=e->'actor';c:=e->'command';i:=c->'inputs';\r\
    \n IF jsonb_typeof(e) IS DISTINCT FROM 'object' OR (SELECT array_agg(key ORDER BY key) FROM jsonb_object_keys(e) key)\
    \ IS DISTINCT FROM ARRAY['actor','command','contractVersion','receipt','requestId'] OR e->'contractVersion'<>'2'::jsonb\
    \ THEN RAISE EXCEPTION 'shape';END IF;\r\n IF jsonb_typeof(c) IS DISTINCT FROM 'object' OR (SELECT array_agg(key ORDER\
    \ BY key) FROM jsonb_object_keys(c) key) IS DISTINCT FROM ARRAY['expectedVersion','inputs','operation','predecessorRequestId','schemaVersion','targetId','targetType']\
    \ OR c->'schemaVersion'<>'1'::jsonb OR c->>'targetType' IS DISTINCT FROM split_part(c->>'operation','.',1) THEN RAISE\
    \ EXCEPTION 'command';END IF;\r\n IF e->>'requestId' !~ '^[a-f0-9]{8}-[a-f0-9]{4}-4[a-f0-9]{3}-[89ab][a-f0-9]{3}-[a-f0-9]{12}$'\
    \ THEN RAISE EXCEPTION 'id';END IF;request:=(e->>'requestId')::uuid;\r\n target:=c->>'targetId';op:=c->>'operation';expected:=c->>'expectedVersion';\r\
    \n IF jsonb_typeof(c->'targetId') IS DISTINCT FROM 'string' OR octet_length(target) NOT BETWEEN 1 AND 256 OR target~'[[:cntrl:]]'\
    \ OR op NOT IN('borrower.create','borrower.update','borrower.delete','loan.create','loan.update','loan.delete','loan.default','loan.undo-default','loan.generate-charge','loan.close','charge.create','charge.update','charge.delete','payment.correct','payment.delete','payment.move-interest','expense.create','expense.update','expense.delete','preference.update','cash-holder.create','cash-holder.update','cash-holder.delete','cash-account.create','cash-account.update','cash-account.delete','partner.create','partner.update','partner.delete','capital-contribution.create','capital-contribution.update','capital-contribution.delete','settlement.create','settlement.update','settlement.complete','settlement.reverse','settlement.cancel','settlement.settle-all','cash-movement.create','cash-movement.update','cash-movement.delete','cash-openings.initialize','assessment.create','assessment.update','assessment.refresh','assessment.delete','analytics.refresh')\
    \ THEN RAISE EXCEPTION 'target';END IF;\r\n IF split_part(op,'.',1)='payment' THEN IF c->'predecessorRequestId'<>'null'::jsonb\
    \ AND (jsonb_typeof(c->'predecessorRequestId') IS DISTINCT FROM 'string' OR c->>'predecessorRequestId'!~'^[a-f0-9]{8}-[a-f0-9]{4}-4[a-f0-9]{3}-[89ab][a-f0-9]{3}-[a-f0-9]{12}$')\
    \ THEN RAISE EXCEPTION 'predecessor';END IF;ELSIF c->'predecessorRequestId'<>'null'::jsonb THEN RAISE EXCEPTION 'predecessor';END\
    \ IF;\r\n IF op IN('borrower.create','loan.create','charge.create','expense.create','cash-holder.create','cash-account.create','partner.create','capital-contribution.create','settlement.create','settlement.settle-all','cash-movement.create','assessment.create')\
    \ THEN IF c->'expectedVersion'<>'null'::jsonb OR target !~ '^[a-f0-9]{8}-[a-f0-9]{4}-4[a-f0-9]{3}-[89ab][a-f0-9]{3}-[a-f0-9]{12}$'\
    \ THEN RAISE EXCEPTION 'create';END IF;\r\n ELSE IF jsonb_typeof(c->'expectedVersion') IS DISTINCT FROM 'string' OR expected\
    \ !~ '^[a-f0-9]{64}$' THEN RAISE EXCEPTION 'version';END IF;END IF;\r\n IF jsonb_typeof(a) IS DISTINCT FROM 'object' OR\
    \ (SELECT array_agg(key ORDER BY key) FROM jsonb_object_keys(a) key) IS DISTINCT FROM ARRAY['issuer','loginEmail','partnerId','subject']\
    \ THEN RAISE EXCEPTION 'actor';END IF;\r\n FOREACH k IN ARRAY ARRAY['issuer','subject','partnerId','loginEmail'] LOOP\
    \ v:=a->>k;IF jsonb_typeof(a->k) IS DISTINCT FROM 'string' OR btrim(v)='' OR v~'[[:cntrl:]]' OR octet_length(v)>(CASE\
    \ k WHEN 'issuer' THEN 1024 WHEN 'subject' THEN 128 WHEN 'partnerId' THEN 256 ELSE 320 END) THEN RAISE EXCEPTION 'actor';END\
    \ IF;END LOOP;\r\n IF a->>'loginEmail'<>lower(btrim(a->>'loginEmail')) OR a->>'partnerId'<>btrim(a->>'partnerId') THEN\
    \ RAISE EXCEPTION 'actor';END IF;\r\n actor_text:='{\"issuer\":'||to_json(a->>'issuer')::text||',\"subject\":'||to_json(a->>'subject')::text||',\"\
    partnerId\":'||to_json(a->>'partnerId')::text||',\"loginEmail\":'||to_json(a->>'loginEmail')::text||'}';\r\n r:=e->'receipt';receipt_text:='null';\r\
    \n IF r IS DISTINCT FROM 'null'::jsonb THEN\r\n  IF op NOT IN('loan.close','payment.correct') OR jsonb_typeof(r) IS DISTINCT\
    \ FROM 'object' OR (SELECT array_agg(key ORDER BY key) FROM jsonb_object_keys(r) key) IS DISTINCT FROM ARRAY['mimeType','receiptId','sha256','sizeBytes','storageReference']\
    \ THEN RAISE EXCEPTION 'receipt';END IF;\r\n  IF jsonb_typeof(r->'receiptId') IS DISTINCT FROM 'string' OR r->>'receiptId'!~'^[a-f0-9]{8}-[a-f0-9]{4}-4[a-f0-9]{3}-[89ab][a-f0-9]{3}-[a-f0-9]{12}$'\
    \ OR jsonb_typeof(r->'sha256') IS DISTINCT FROM 'string' OR r->>'sha256'!~'^[a-f0-9]{64}$' OR r->>'mimeType' NOT IN('image/png','image/jpeg')\
    \ OR jsonb_typeof(r->'sizeBytes') IS DISTINCT FROM 'number' OR r->>'sizeBytes'!~'^[1-9][0-9]*$' OR (r->>'sizeBytes')::numeric>5242880\
    \ OR jsonb_typeof(r->'storageReference') IS DISTINCT FROM 'string' OR octet_length(r->>'storageReference') NOT BETWEEN\
    \ 1 AND 2048 OR r->>'storageReference'~'[\\r\\n]' THEN RAISE EXCEPTION 'receipt';END IF;\r\n  receipt_text:='{\"receiptId\"\
    :'||to_json(r->>'receiptId')::text||',\"sha256\":'||to_json(r->>'sha256')::text||',\"mimeType\":'||to_json(r->>'mimeType')::text||',\"\
    sizeBytes\":'||(r->>'sizeBytes')||',\"storageReference\":'||to_json(r->>'storageReference')::text||'}';\r\n END IF;\r\n\
    \ IF jsonb_typeof(i) IS DISTINCT FROM 'object' THEN RAISE EXCEPTION 'inputs';END IF;\r\n IF split_part(op,'.',1) IN('cash-openings','assessment','analytics')\
    \ THEN input_text:=public.pwa_management_tools_text_v2(op,i);ELSIF split_part(op,'.',1) IN('capital-contribution','settlement','cash-movement')\
    \ THEN input_text:=public.pwa_management_financial_text_v2(op,i);ELSIF split_part(op,'.',1) IN('cash-holder','cash-account','partner')\
    \ THEN input_text:=public.pwa_management_input_text_v2(op,i);\r\n ELSIF op='preference.update' THEN\r\n IF (SELECT array_agg(key\
    \ ORDER BY key) FROM jsonb_object_keys(i) key) IS DISTINCT FROM ARRAY['language','statementAccountId','statementDate']\
    \ OR jsonb_typeof(i->'language') IS DISTINCT FROM 'string' OR i->>'language' NOT IN('English','ไทย') OR jsonb_typeof(i->'statementAccountId')\
    \ NOT IN('string','null') OR jsonb_typeof(i->'statementDate') NOT IN('string','null') THEN RAISE EXCEPTION 'preference\
    \ fields';END IF;\r\n IF i->'statementAccountId'<>'null'::jsonb AND (octet_length(i->>'statementAccountId') NOT BETWEEN\
    \ 1 AND 256 OR i->>'statementAccountId'~'[[:cntrl:]]') THEN RAISE EXCEPTION 'preference account';END IF;\r\n IF i->'statementDate'<>'null'::jsonb\
    \ AND (i->>'statementDate'!~'^[0-9]{4}-[0-9]{2}-[0-9]{2}$' OR ((i->>'statementDate')::date)::text<>i->>'statementDate')\
    \ THEN RAISE EXCEPTION 'preference date';END IF;\r\n input_text:='{\"language\":'||to_json(i->>'language')::text||',\"\
    statementAccountId\":'||coalesce(to_json(i->>'statementAccountId')::text,'null')||',\"statementDate\":'||coalesce(to_json(i->>'statementDate')::text,'null')||'}';\r\
    \n ELSIF op IN('expense.create','expense.update') THEN\r\n keys:=ARRAY['expenseDate','category','amount','payeeName','relatedBorrowerId','relatedLoanId','notes','paidByAccountId'];\r\
    \n IF (SELECT array_agg(key ORDER BY key) FROM jsonb_object_keys(i) key) IS DISTINCT FROM (SELECT array_agg(key ORDER\
    \ BY key) FROM unnest(keys) key) THEN RAISE EXCEPTION 'expense keys';END IF;\r\n input_text:='{';FOREACH k IN ARRAY keys\
    \ LOOP\r\n IF jsonb_typeof(i->k) NOT IN('string','null') OR octet_length(i->>k)>65536 THEN RAISE EXCEPTION 'expense field';END\
    \ IF;\r\n IF k IN('expenseDate','category','amount') AND jsonb_typeof(i->k) IS DISTINCT FROM 'string' THEN RAISE EXCEPTION\
    \ 'expense required';END IF;\r\n IF k IN('relatedBorrowerId','relatedLoanId','paidByAccountId') AND i->k<>'null'::jsonb\
    \ AND (octet_length(i->>k) NOT BETWEEN 1 AND 256 OR i->>k~'[[:cntrl:]]') THEN RAISE EXCEPTION 'expense reference';END\
    \ IF;\r\n input_text:=input_text||CASE WHEN input_text='{' THEN '' ELSE ',' END||to_json(k)::text||':'||coalesce(to_json(i->>k)::text,'null');END\
    \ LOOP;input_text:=input_text||'}';\r\n IF i->>'expenseDate'!~'^[0-9]{4}-[0-9]{2}-[0-9]{2}$' OR ((i->>'expenseDate')::date)::text<>i->>'expenseDate'\
    \ OR btrim(i->>'category')='' OR i->>'amount'!~'^-?[1-9][0-9]*$' OR abs((i->>'amount')::numeric)>92233720368547758 THEN\
    \ RAISE EXCEPTION 'expense input';END IF;\r\n ELSIF op='payment.correct' THEN input_text:=public.pwa_payment_correction_text_v2(i);IF\
    \ (i->>'receiptMode'='replace') IS DISTINCT FROM (r<>'null'::jsonb) THEN RAISE EXCEPTION 'receipt mode';END IF;\r\n ELSIF\
    \ op='payment.move-interest' THEN IF (SELECT array_agg(key ORDER BY key) FROM jsonb_object_keys(i) key) IS DISTINCT FROM\
    \ ARRAY['allocationId','targetChargeId'] THEN RAISE EXCEPTION 'move keys';END IF;FOREACH k IN ARRAY ARRAY['allocationId','targetChargeId']\
    \ LOOP IF jsonb_typeof(i->k) IS DISTINCT FROM 'string' OR octet_length(i->>k) NOT BETWEEN 1 AND 256 OR i->>k~'[[:cntrl:]]'\
    \ THEN RAISE EXCEPTION 'move reference';END IF;END LOOP;input_text:='{\"allocationId\":'||to_json(i->>'allocationId')::text||',\"\
    targetChargeId\":'||to_json(i->>'targetChargeId')::text||'}';\r\n ELSIF op IN('loan.create','loan.update') THEN\r\n keys:=ARRAY['borrowerId','loanDate','principal','transferFee','disbursingAccountId','type','dueDate','dailyPayment','fixedInterest','currentDailyInterest','paymentInterval','arrangement','autoChargeEnabled'];\r\
    \n IF i ? 'scheduleAnchor' THEN keys:=array_append(keys,'scheduleAnchor');END IF;\r\n IF (SELECT array_agg(key ORDER BY\
    \ key) FROM jsonb_object_keys(i) key) IS DISTINCT FROM (SELECT array_agg(key ORDER BY key) FROM unnest(keys) key) THEN\
    \ RAISE EXCEPTION 'loan keys';END IF;\r\n input_text:='{';FOREACH k IN ARRAY keys LOOP\r\n  IF k='autoChargeEnabled' THEN\
    \ IF jsonb_typeof(i->k) NOT IN('boolean','null') THEN RAISE EXCEPTION 'loan boolean';END IF;\r\n  ELSIF k='paymentInterval'\
    \ THEN IF i->k<>'null'::jsonb AND (jsonb_typeof(i->k)<>'number' OR i->>k!~'^[1-9][0-9]*$' OR (i->>k)::numeric>2147483647)\
    \ THEN RAISE EXCEPTION 'loan interval';END IF;\r\n  ELSE\r\n   IF jsonb_typeof(i->k) NOT IN('string','null') OR octet_length(i->>k)>65536\
    \ THEN RAISE EXCEPTION 'loan text';END IF;\r\n   IF k IN('principal','transferFee','dailyPayment','fixedInterest','currentDailyInterest')\
    \ AND i->k<>'null'::jsonb AND (i->>k!~'^(0|[1-9][0-9]*)(\\.[0-9]{1,2})?$' OR (i->>k)::numeric>92233720368547758.07) THEN\
    \ RAISE EXCEPTION 'loan amount';END IF;\r\n   IF k='type' AND i->k<>'null'::jsonb AND i->>k NOT IN('กำหนดวันชำระ','ดอกเบี้ยรายวัน','ผ่อนชำระรายวัน')\
    \ THEN RAISE EXCEPTION 'loan type';END IF;\r\n   IF k IN('loanDate','dueDate','scheduleAnchor') AND i->k<>'null'::jsonb\
    \ AND (i->>k!~'^[0-9]{4}-[0-9]{2}-[0-9]{2}$' OR ((i->>k)::date)::text<>i->>k) THEN RAISE EXCEPTION 'loan date';END IF;\r\
    \n   IF k IN('borrowerId','disbursingAccountId') AND ((op='loan.create' AND i->k='null'::jsonb) OR (i->k<>'null'::jsonb\
    \ AND (octet_length(i->>k) NOT BETWEEN 1 AND 256 OR i->>k~'[[:cntrl:]]'))) THEN RAISE EXCEPTION 'loan reference';END IF;\r\
    \n  END IF;\r\n  input_text:=input_text||CASE WHEN input_text='{' THEN '' ELSE ',' END||to_json(k)::text||':'||CASE WHEN\
    \ i->k='null'::jsonb THEN 'null' WHEN k IN('autoChargeEnabled','paymentInterval') THEN (i->k)::text ELSE to_json(i->>k)::text\
    \ END;\r\n END LOOP;input_text:=input_text||'}';\r\n IF op='loan.create' AND ((i->>'principal')::numeric IS NULL OR (i->>'principal')::numeric<=0\
    \ OR i->>'loanDate' IS NULL OR i->>'type' IS NULL OR i->>'type' NOT IN('กำหนดวันชำระ','ดอกเบี้ยรายวัน','ผ่อนชำระรายวัน'))\
    \ THEN RAISE EXCEPTION 'loan required';END IF;\r\n ELSIF op IN('charge.create','charge.update') THEN\r\n keys:=ARRAY['loanId','chargeDate','principalDue','interestDue','notes'];\r\
    \n IF (SELECT array_agg(key ORDER BY key) FROM jsonb_object_keys(i) key) IS DISTINCT FROM (SELECT array_agg(key ORDER\
    \ BY key) FROM unnest(keys) key) THEN RAISE EXCEPTION 'charge keys';END IF;\r\n input_text:='{';FOREACH k IN ARRAY keys\
    \ LOOP\r\n IF (k='notes' AND jsonb_typeof(i->k) NOT IN('string','null')) OR (k<>'notes' AND jsonb_typeof(i->k) IS DISTINCT\
    \ FROM 'string') OR octet_length(i->>k)>65536 THEN RAISE EXCEPTION 'charge input';END IF;\r\n input_text:=input_text||CASE\
    \ WHEN input_text='{' THEN '' ELSE ',' END||to_json(k)::text||':'||coalesce(to_json(i->>k)::text,'null');\r\n END LOOP;input_text:=input_text||'}';\r\
    \n IF octet_length(i->>'loanId') NOT BETWEEN 1 AND 256 OR i->>'loanId'~'[[:cntrl:]]' OR i->>'chargeDate'!~'^[0-9]{4}-[0-9]{2}-[0-9]{2}$'\
    \ OR ((i->>'chargeDate')::date)::text<>i->>'chargeDate' OR i->>'principalDue'!~'^-?(0|[1-9][0-9]*)(\\.[0-9]{1,2})?$' OR\
    \ i->>'interestDue'!~'^-?(0|[1-9][0-9]*)(\\.[0-9]{1,2})?$' OR abs((i->>'principalDue')::numeric)>92233720368547758.07\
    \ OR abs((i->>'interestDue')::numeric)>92233720368547758.07 THEN RAISE EXCEPTION 'charge input';END IF;\r\n ELSIF op='loan.close'\
    \ THEN\r\n keys:=ARRAY['paymentDate','cashAccountId','paymentMethod','notes','expectedAmount','expectedPlanHash'];\r\n\
    \ IF (SELECT array_agg(key ORDER BY key) FROM jsonb_object_keys(i) key) IS DISTINCT FROM (SELECT array_agg(key ORDER BY\
    \ key) FROM unnest(keys) key) THEN RAISE EXCEPTION 'close keys';END IF;\r\n input_text:='{';FOREACH k IN ARRAY keys LOOP\r\
    \n  IF (k='notes' AND jsonb_typeof(i->k) NOT IN('string','null')) OR (k<>'notes' AND jsonb_typeof(i->k) IS DISTINCT FROM\
    \ 'string') OR octet_length(i->>k)>65536 THEN RAISE EXCEPTION 'close input';END IF;\r\n  input_text:=input_text||CASE\
    \ WHEN input_text='{' THEN '' ELSE ',' END||to_json(k)::text||':'||coalesce(to_json(i->>k)::text,'null');\r\n END LOOP;input_text:=input_text||'}';\r\
    \n IF i->>'paymentDate'!~'^[0-9]{4}-[0-9]{2}-[0-9]{2}$' OR ((i->>'paymentDate')::date)::text<>i->>'paymentDate' OR octet_length(i->>'cashAccountId')\
    \ NOT BETWEEN 1 AND 256 OR i->>'cashAccountId'~'[[:cntrl:]]' OR i->>'paymentMethod' NOT IN('Bank Transfer','Cash','Net-off\
    \ at Disbursement') OR i->>'expectedAmount'!~'^[1-9][0-9]*$' OR (i->>'expectedAmount')::numeric>92233720368547758 OR i->>'expectedPlanHash'!~'^[a-f0-9]{64}$'\
    \ THEN RAISE EXCEPTION 'close input';END IF;\r\n ELSIF op IN('loan.default','loan.generate-charge') THEN\r\n IF (SELECT\
    \ array_agg(key ORDER BY key) FROM jsonb_object_keys(i) key) IS DISTINCT FROM ARRAY['businessDate'] OR jsonb_typeof(i->'businessDate')\
    \ IS DISTINCT FROM 'string' OR i->>'businessDate'!~'^[0-9]{4}-[0-9]{2}-[0-9]{2}$' OR ((i->>'businessDate')::date)::text<>i->>'businessDate'\
    \ THEN RAISE EXCEPTION 'business date';END IF;\r\n input_text:='{\"businessDate\":'||to_json(i->>'businessDate')::text||'}';\r\
    \n ELSIF op IN('borrower.delete','loan.delete','loan.undo-default','charge.delete','payment.delete','expense.delete')\
    \ THEN IF i<>'{}'::jsonb THEN RAISE EXCEPTION 'delete';END IF;input_text:='{}';\r\n ELSE\r\n IF (SELECT array_agg(key\
    \ ORDER BY key) FROM jsonb_object_keys(i-'aiCollectionEnabled') key) IS DISTINCT FROM ARRAY['address','city','communicationName','description','hidden','instagramUsername','name','note','preferredReceivingAccountId','referrerId','workingLocation']\
    \ THEN RAISE EXCEPTION 'inputs';END IF;\r\n input_text:='{';FOREACH k IN ARRAY ARRAY['name','description','communicationName','instagramUsername','city','workingLocation','address','hidden','referrerId','preferredReceivingAccountId','note']||CASE\
    \ WHEN i?'aiCollectionEnabled' THEN ARRAY['aiCollectionEnabled'] ELSE ARRAY[]::text[] END LOOP\r\n  IF k IN('hidden','aiCollectionEnabled')\
    \ THEN IF jsonb_typeof(i->k) NOT IN('boolean','null') THEN RAISE EXCEPTION 'boolean';END IF;\r\n  ELSE IF jsonb_typeof(i->k)\
    \ NOT IN('string','null') OR octet_length(i->>k)>65536 THEN RAISE EXCEPTION 'text';END IF;\r\n  IF k IN('referrerId','preferredReceivingAccountId')\
    \ AND i->k<>'null'::jsonb AND (octet_length(i->>k) NOT BETWEEN 1 AND 256 OR i->>k~'[[:cntrl:]]') THEN RAISE EXCEPTION\
    \ 'ref';END IF;END IF;\r\n  input_text:=input_text||CASE WHEN input_text='{' THEN '' ELSE ',' END||to_json(k)::text||':'||CASE\
    \ WHEN i->k='null'::jsonb THEN 'null' WHEN k IN('hidden','aiCollectionEnabled') THEN (i->k)::text ELSE to_json(i->>k)::text\
    \ END;\r\n END LOOP;input_text:=input_text||'}';END IF;\r\n command_text:='{\"schemaVersion\":1,\"operation\":'||to_json(op)::text||',\"\
    targetType\":'||to_json(split_part(op,'.',1))::text||',\"targetId\":'||to_json(target)::text||',\"expectedVersion\":'||coalesce(to_json(expected)::text,'null')||',\"\
    predecessorRequestId\":'||coalesce(to_json(c->>'predecessorRequestId')::text,'null')||',\"inputs\":'||input_text||'}';\r\
    \n canonical:='{\"contractVersion\":2,\"requestId\":'||to_json(request::text)::text||',\"actor\":'||actor_text||',\"command\"\
    :'||command_text||',\"receipt\":'||receipt_text||'}';\r\n IF canonical IS DISTINCT FROM $1 THEN RAISE EXCEPTION 'noncanonical';END\
    \ IF;\r\n EXCEPTION WHEN OTHERS THEN RAISE EXCEPTION USING ERRCODE='22023',MESSAGE='Invalid canonical operation';END;\r\
    \n IF (SELECT count(*) FROM public.\"Partners\" WHERE lower(btrim(\"Login Email\"))=a->>'loginEmail')<>1 OR NOT EXISTS(SELECT\
    \ 1 FROM public.\"Partners\" WHERE \"Row ID\"=a->>'partnerId' AND lower(btrim(\"Login Email\"))=a->>'loginEmail') THEN\
    \ RAISE EXCEPTION USING ERRCODE='42501',MESSAGE='Current actor mapping required';END IF;\r\n IF op='preference.update'\
    \ AND target IS DISTINCT FROM a->>'partnerId' THEN RAISE EXCEPTION USING ERRCODE='42501',MESSAGE='Own preferences required';END\
    \ IF;\r\n PERFORM pg_advisory_xact_lock(1347895619,hashtext(request::text));\r\n SELECT * INTO old FROM public.pwa_payment_commands\
    \ p WHERE p.request_id=request;\r\n IF FOUND THEN\r\n  IF old.contract_version<>2 OR old.canonical_json<>$1 OR old.actor_issuer<>a->>'issuer'\
    \ OR old.actor_subject<>a->>'subject' THEN RETURN jsonb_build_object('kind','conflict');END IF;\r\n  RETURN public.pwa_operation_status_v2(request,a->>'issuer',a->>'subject');\r\
    \n END IF;\r\n BEGIN\r\n IF split_part(op,'.',1)='analytics' THEN result_value:=public.pwa_apply_analytics_v2($1);ELSIF\
    \ split_part(op,'.',1)='cash-openings' THEN result_value:=public.pwa_apply_cash_opening_v2($1);ELSIF split_part(op,'.',1)='assessment'\
    \ THEN result_value:=public.pwa_apply_assessment_v2($1);ELSIF split_part(op,'.',1) IN('capital-contribution','settlement','cash-movement')\
    \ THEN result_value:=public.pwa_apply_management_financial_v2($1);ELSIF split_part(op,'.',1) IN('cash-holder','cash-account','partner')\
    \ THEN result_value:=public.pwa_apply_management_v2($1);ELSIF op='preference.update' THEN result_value:=public.pwa_apply_preference_v2($1);ELSIF\
    \ split_part(op,'.',1)='expense' THEN result_value:=public.pwa_apply_expense_v2($1);ELSIF split_part(op,'.',1)='payment'\
    \ THEN result_value:=public.pwa_apply_payment_v2($1);ELSIF op='loan.create' THEN result_value:=public.pwa_apply_loan_create_v2($1);ELSIF\
    \ op='loan.close' THEN result_value:=public.pwa_apply_loan_close_v2($1);ELSIF split_part(op,'.',1)='loan' THEN result_value:=public.pwa_apply_loan_source_v2($1);ELSIF\
    \ split_part(op,'.',1)='charge' THEN result_value:=public.pwa_apply_charge_v2($1);ELSE\r\n PERFORM pg_advisory_xact_lock(public.pwa_lock_key_v1('borrower',target));\r\
    \n PERFORM 1 FROM public.\"Borrowers\" WHERE \"Row ID\"=target FOR UPDATE;\r\n source_version:=public.pwa_borrower_version_v2(target);\r\
