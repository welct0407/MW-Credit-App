    "name": "forecast_scenario_v1"
    "arguments": "ui numeric, up numeric, oi numeric, op numeric, ci numeric, cp numeric, rr numeric, scenario text"
    "kind": "f"
    "arguments_with_defaults": "ui numeric, up numeric, oi numeric, op numeric, ci numeric, cp numeric, rr numeric, scenario\
