    "definition": "CREATE OR REPLACE FUNCTION public.pwa_management_tools_text_v2(op text, i jsonb)\n RETURNS text\n LANGUAGE\
      \ plpgsql\n IMMUTABLE\n SET search_path TO 'pg_catalog', 'public'\nAS $function$\r\nDECLARE keys text[];k text;result\
      \ text:='{';row_value jsonb;previous_id text;items text:='';\r\nBEGIN\r\n IF jsonb_typeof(i) IS DISTINCT FROM 'object'\
      \ THEN RAISE EXCEPTION USING ERRCODE='22023';END IF;\r\n IF op IN('assessment.refresh','assessment.delete') THEN IF\
      \ i<>'{}'::jsonb THEN RAISE EXCEPTION USING ERRCODE='22023';END IF;RETURN '{}';\r\n ELSIF op='analytics.refresh' THEN\
      \ keys:=ARRAY['mode'];\r\n ELSIF op='cash-openings.initialize' THEN keys:=ARRAY['openings','reviewedBasisHash','notes'];\r\
      \n ELSIF op IN('assessment.create','assessment.update') THEN keys:=ARRAY['assessmentId','borrowerId','proposedLoanAmount','minimumDailyProfitRate','forecastStart','forecastEnd'];\r\
      \n ELSE RAISE EXCEPTION USING ERRCODE='22023';END IF;\r\n IF (SELECT array_agg(key ORDER BY key) FROM jsonb_object_keys(i)\
      \ key) IS DISTINCT FROM (SELECT array_agg(key ORDER BY key) FROM unnest(keys) key) THEN RAISE EXCEPTION USING ERRCODE='22023';END\
      \ IF;\r\n IF op='cash-openings.initialize' THEN\r\n IF jsonb_typeof(i->'openings') IS DISTINCT FROM 'array' OR jsonb_array_length(i->'openings')\
      \ NOT BETWEEN 1 AND 10000 THEN RAISE EXCEPTION USING ERRCODE='22023';END IF;\r\n FOR row_value IN SELECT value FROM\
      \ jsonb_array_elements(i->'openings') LOOP\r\n IF jsonb_typeof(row_value) IS DISTINCT FROM 'object' OR (SELECT array_agg(key\
      \ ORDER BY key) FROM jsonb_object_keys(row_value) key) IS DISTINCT FROM ARRAY['accountId','amount']\r\n OR jsonb_typeof(row_value->'accountId')\
      \ IS DISTINCT FROM 'string' OR octet_length(row_value->>'accountId') NOT BETWEEN 1 AND 256 OR row_value->>'accountId'~'[[:cntrl:]]'\r\
      \n OR jsonb_typeof(row_value->'amount') IS DISTINCT FROM 'string' OR octet_length(row_value->>'amount')>65536 OR row_value->>'amount'!~'^(0|-?[1-9][0-9]*)$'\r\
      \n OR (previous_id IS NOT NULL AND previous_id COLLATE \"C\">=(row_value->>'accountId') COLLATE \"C\") THEN RAISE EXCEPTION\
      \ USING ERRCODE='22023';END IF;\r\n items:=items||CASE WHEN items='' THEN '' ELSE ',' END||'{\"accountId\":'||to_json(row_value->>'accountId')::text||',\"\
      amount\":'||to_json(row_value->>'amount')::text||'}';previous_id:=row_value->>'accountId';\r\n END LOOP;\r\n END IF;\r\
      \n FOREACH k IN ARRAY keys LOOP\r\n IF k='openings' THEN result:=result||'\"openings\":['||items||']';CONTINUE;END IF;\r\
      \n IF jsonb_typeof(i->k) NOT IN('string','null') OR octet_length(i->>k)>65536 THEN RAISE EXCEPTION USING ERRCODE='22023';END\
      \ IF;\r\n IF k='borrowerId' AND i->k<>'null'::jsonb AND (octet_length(i->>k) NOT BETWEEN 1 AND 256 OR i->>k~'[[:cntrl:]]')\
      \ THEN RAISE EXCEPTION USING ERRCODE='22023';END IF;\r\n IF k IN('forecastStart','forecastEnd') AND (jsonb_typeof(i->k)\
      \ IS DISTINCT FROM 'string' OR i->>k!~'^[0-9]{4}-[0-9]{2}-[0-9]{2}$' OR ((i->>k)::date)::text<>i->>k) THEN RAISE EXCEPTION\
      \ USING ERRCODE='22023';END IF;\r\n IF k='proposedLoanAmount' AND i->k<>'null'::jsonb AND (i->>k!~'^(0|[1-9][0-9]*)(\\\
      .[0-9]{1,2})?$' OR (i->>k)::numeric>92233720368547758.07) THEN RAISE EXCEPTION USING ERRCODE='22023';END IF;\r\n IF\
      \ k='minimumDailyProfitRate' AND i->k<>'null'::jsonb AND (i->>k!~'^(0|[1-9][0-9]*)(\\.[0-9]+)?$' OR (i->>k)::numeric>3.4028234663852886e38)\
      \ THEN RAISE EXCEPTION USING ERRCODE='22023';END IF;\r\n IF k='mode' AND (i->>k IS NULL OR i->>k NOT IN('Recent','Full'))\
      \ OR k='reviewedBasisHash' AND (i->>k IS NULL OR i->>k!~'^[a-f0-9]{64}$') OR op='cash-openings.initialize' AND k='notes'\
      \ AND nullif(btrim(i->>k),'') IS NULL THEN RAISE EXCEPTION USING ERRCODE='22023';END IF;\r\n result:=result||CASE WHEN\
      \ result='{' THEN '' ELSE ',' END||to_json(k)::text||':'||coalesce(to_json(i->>k)::text,'null');END LOOP;RETURN result||'}';\r\
      \nEND $function$\n"
