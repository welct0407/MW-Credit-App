"content":
  "definition":
    "schema": "public"
    "name": "pwa_apply_payment_v2"
    "arguments": "canonical text"
    "kind": "f"
    "arguments_with_defaults": "canonical text"
    "result": "jsonb"
    "definition": "CREATE OR REPLACE FUNCTION public.pwa_apply_payment_v2(canonical text)\n RETURNS jsonb\n LANGUAGE plpgsql\n\
      \ SET search_path TO 'pg_catalog', 'public'\nAS $function$\r\nDECLARE e jsonb:=canonical::jsonb;c jsonb:=e->'command';i\
      \ jsonb:=c->'inputs';f jsonb:=i->'fields';a jsonb:=e->'actor';target text:=c->>'targetId';op text:=c->>'operation';old\
      \ public.\"Payments\"%ROWTYPE;desired public.\"Payments\"%ROWTYPE;actual public.\"Payments\"%ROWTYPE;provenance jsonb;head\
      \ uuid;plan jsonb;result_value jsonb;ids text;explicit_inverse boolean:=false;explicit_finish boolean:=false;message\
      \ text;borrower text;close_calculation jsonb;enter_close boolean:=false;repost boolean:=false;destination public.\"\
      Loans\"%ROWTYPE;\r\nBEGIN\r\n IF (current_database() NOT IN ('loan_manager_dev','payment_rehearsal','loan_manager_prod')\
      \ OR current_user<>CASE current_database() WHEN 'loan_manager_prod' THEN 'mw_app_prod_journal_owner' ELSE 'mw_app_dev_journal_owner'\
      \ END) THEN RAISE EXCEPTION USING ERRCODE='42501',MESSAGE='Governed operation required';END IF;\r\n IF NOT pg_try_advisory_xact_lock(9162026,2)\
      \ THEN RAISE EXCEPTION 'Cash pool is busy; retry';END IF;\r\n SELECT * INTO old FROM public.\"Payments\" WHERE \"Row\
      \ ID\"=target;IF NOT FOUND THEN RAISE EXCEPTION USING ERRCODE='P5B02';END IF;\r\n FOR borrower IN SELECT DISTINCT value\
      \ COLLATE \"C\" FROM unnest(ARRAY[old.\"Ref Borrower\",f->>'borrowerId']) value WHERE value IS NOT NULL ORDER BY value\
      \ COLLATE \"C\" LOOP PERFORM 1 FROM public.\"Borrowers\" WHERE \"Row ID\"=borrower FOR UPDATE;END LOOP;\r\n PERFORM\
      \ 1 FROM public.\"Loans\" WHERE \"Ref Borrowers\" IN(old.\"Ref Borrower\",f->>'borrowerId') ORDER BY \"Row ID\" COLLATE\
      \ \"C\" FOR UPDATE;\r\n PERFORM 1 FROM public.\"Charges\" WHERE \"Ref Loans\" IN(SELECT \"Row ID\" FROM public.\"Loans\"\
      \ WHERE \"Ref Borrowers\" IN(old.\"Ref Borrower\",f->>'borrowerId')) ORDER BY \"Row ID\" COLLATE \"C\" FOR UPDATE;\r\
      \n SELECT * INTO old FROM public.\"Payments\" WHERE \"Row ID\"=target FOR UPDATE;IF NOT FOUND THEN RAISE EXCEPTION USING\
      \ ERRCODE='P5B02';END IF;\r\n IF public.pwa_payment_version_v2(target) IS DISTINCT FROM c->>'expectedVersion' THEN RAISE\
      \ EXCEPTION USING ERRCODE='P5B01';END IF;\r\n head:=public.pwa_payment_head_v2(target);IF head::text IS DISTINCT FROM\
      \ c->>'predecessorRequestId' THEN RAISE EXCEPTION USING ERRCODE='P5B09';END IF;\r\n provenance:=public.pwa_effective_payment_plan_v2(target);\r\
      \n IF op='payment.correct' THEN\r\n IF (provenance IS NOT NULL) IS DISTINCT FROM (i->>'kind'='pwa-plan') THEN RAISE\
      \ EXCEPTION USING ERRCODE='P5B06';END IF;\r\n IF (f->>'paymentDate')::date>(CURRENT_TIMESTAMP AT TIME ZONE 'Asia/Bangkok')::date\
      \ THEN RAISE EXCEPTION USING ERRCODE='P5B08';END IF;\r\n IF NOT EXISTS(SELECT 1 FROM public.\"Borrowers\" WHERE \"Row\
      \ ID\"=f->>'borrowerId') THEN RAISE EXCEPTION USING ERRCODE='P5B04';END IF;\r\n IF NOT EXISTS(SELECT 1 FROM public.\"\
      Cash Accounts\" ca JOIN public.\"Cash Holders\" h ON h.\"Row ID\"=ca.\"Ref Cash Holder\" WHERE ca.\"Row ID\"=f->>'cashAccountId'\
      \ AND ca.\"Active\" IS TRUE AND h.\"Active\" IS TRUE) THEN RAISE EXCEPTION USING ERRCODE='P5B07';END IF;\r\n IF provenance\
      \ IS NOT NULL THEN\r\n enter_close:=f->>'allocationMethod'='Loan Close' AND (old.\"Allocation Method\" IS DISTINCT FROM\
      \ 'Loan Close' OR old.\"Ref Target Loan\" IS DISTINCT FROM f->>'targetLoanId');\r\n IF enter_close THEN\r\n  IF (f->>'paymentDate')::date<>(CURRENT_TIMESTAMP\
      \ AT TIME ZONE 'Asia/Bangkok')::date OR i->>'closePreparationHash' IS NULL THEN RAISE EXCEPTION USING ERRCODE='P5B08';END\
      \ IF;\r\n  SELECT * INTO destination FROM public.\"Loans\" WHERE \"Row ID\"=f->>'targetLoanId';\r\n  IF NOT FOUND OR\
      \ destination.\"Ref Borrowers\" IS DISTINCT FROM f->>'borrowerId' OR destination.\"Defaulted\" IS TRUE OR (destination.\"\
      Loan Status\"<>'ยังไม่ปิดยอด' AND destination.\"Ref Closing Payment\" IS DISTINCT FROM target) THEN RAISE EXCEPTION\
      \ USING ERRCODE='P5B04';END IF;\r\n  BEGIN close_calculation:=public.loan_close_calculation_v83(f->>'targetLoanId',(f->>'paymentDate')::date,target);\r\
      \n  EXCEPTION WHEN SQLSTATE 'P0001' THEN GET STACKED DIAGNOSTICS message=MESSAGE_TEXT;IF message IN('Loan Close requires\
      \ an open auto-enabled daily-interest loan','Loan Close requires valid loan date, principal and daily interest','Loan\
      \ charge components require reconciliation before closing','Loan has no outstanding principal to close','Principal already\
      \ due exceeds outstanding loan principal','Multiple charges today require reconciliation before closing','Final receipt\
      \ must be a positive whole-baht amount') THEN RAISE EXCEPTION USING ERRCODE='P5B06';ELSE RAISE;END IF;END;\r\n  IF close_calculation->>'planHash'\
      \ IS DISTINCT FROM i->>'closePreparationHash' OR close_calculation->'allocations' IS DISTINCT FROM f->'allocations'\
      \ OR close_calculation->>'amount' IS DISTINCT FROM f->>'amountReceived' OR close_calculation->>'targetChargeId' IS DISTINCT\
      \ FROM f->>'targetChargeId' THEN RAISE EXCEPTION USING ERRCODE='P5B09';END IF;\r\n ELSE\r\n  IF i->>'closePreparationHash'\
      \ IS NOT NULL THEN RAISE EXCEPTION USING ERRCODE='P5B09';END IF;\r\n IF EXISTS(WITH lines AS(SELECT value line FROM\
      \ jsonb_array_elements(f->'allocations')),paid AS(SELECT \"Ref Charges\" id,sum(\"Principal Paid\"::numeric) p,sum(\"\
      Interest Paid\"::numeric) i FROM public.\"Repayments\" WHERE \"Ref Payment\" IS DISTINCT FROM target GROUP BY \"Ref\
      \ Charges\") SELECT 1 FROM lines LEFT JOIN public.\"Charges\" ch ON ch.\"Row ID\"=line->>'chargeId' LEFT JOIN public.\"\
      Loans\" l ON l.\"Row ID\"=ch.\"Ref Loans\" LEFT JOIN paid ON paid.id=ch.\"Row ID\" WHERE ch.\"Row ID\" IS NULL OR l.\"\
      Ref Borrowers\" IS DISTINCT FROM f->>'borrowerId' OR ch.\"Charge Date\" IS DISTINCT FROM (line->>'chargeDate')::date\
      \ OR ch.\"Principal Due\"::numeric-coalesce(paid.p,0) IS DISTINCT FROM (line->>'expectedPrincipalRemaining')::numeric\
      \ OR ch.\"Interest Due\"::numeric-coalesce(paid.i,0) IS DISTINCT FROM (line->>'expectedInterestRemaining')::numeric\
      \ OR (line->>'principal')::numeric>ch.\"Principal Due\"::numeric-coalesce(paid.p,0) OR (line->>'interest')::numeric>ch.\"\
      Interest Due\"::numeric-coalesce(paid.i,0)) THEN RAISE EXCEPTION USING ERRCODE='P5B09';END IF;\r\n END IF;\r\n plan:=jsonb_build_object('borrowerId',f->'borrowerId','amountReceived',f->'amountReceived','allocations',f->'allocations','allocationMethod',f->'allocationMethod','targetChargeId',f->'targetChargeId','targetLoanId',f->'targetLoanId','cashAccountId',f->'cashAccountId','paymentDate',f->'paymentDate','paymentMethod',f->'paymentMethod');\r\
      \n SELECT string_agg(value->>'chargeId',',' ORDER BY (value->>'chargeId') COLLATE \"C\") INTO ids FROM jsonb_array_elements(f->'allocations');\r\
      \n IF f->>'allocationMethod'<>'Selected Charges' THEN ids:=NULL;END IF;\r\n ELSE SELECT string_agg(value#>>'{}',','\
      \ ORDER BY (value#>>'{}') COLLATE \"C\") INTO ids FROM jsonb_array_elements(CASE WHEN f->'selectedChargeIds'='null'::jsonb\
      \ THEN '[]'::jsonb ELSE f->'selectedChargeIds' END);END IF;\r\n desired:=jsonb_populate_record(old,jsonb_build_object('Ref\
      \ Borrower',f->'borrowerId','Amount Received',f->'amountReceived','Payment Date',f->'paymentDate','Payment Method',f->'paymentMethod','Ref\
      \ Received By Cash Account',f->'cashAccountId','Notes',f->'notes','Allocation Method',f->'allocationMethod','Ref Target\
      \ Charge',f->'targetChargeId','Ref Target Loan',f->'targetLoanId','Selected Charge IDs',ids,'Uploaded Receipt',CASE\
      \ i->>'receiptMode' WHEN 'preserve' THEN old.\"Uploaded Receipt\" WHEN 'replace' THEN e#>>'{receipt,storageReference}'\
      \ ELSE NULL END));\r\n repost:=provenance IS NOT NULL AND (public.payment_inputs(desired) IS DISTINCT FROM public.payment_inputs(old)\
      \ OR public.pwa_plan_effects_v83(provenance#>'{plan,allocations}') IS DISTINCT FROM public.pwa_plan_effects_v83(f->'allocations'));\r\
      \n IF provenance IS NOT NULL THEN\r\n  IF f->>'allocationMethod'='Selected Charges' AND (f->>'targetChargeId' IS NOT\
      \ NULL OR f->>'targetLoanId' IS NOT NULL) THEN RAISE EXCEPTION USING ERRCODE='P5B04';END IF;\r\n  IF repost AND f->>'allocationMethod'='First-day\
      \ Auto' THEN\r\n   SELECT l.* INTO destination FROM public.\"Charges\" ch JOIN public.\"Loans\" l ON l.\"Row ID\"=ch.\"\
      Ref Loans\" WHERE ch.\"Row ID\"=f->>'targetChargeId' AND ch.\"Charge Date\"=l.\"Loan Date\";\r\n   IF NOT FOUND OR destination.\"\
      Ref Borrowers\" IS DISTINCT FROM f->>'borrowerId' OR destination.\"Loan Type\" NOT IN('ดอกเบี้ยรายวัน','ผ่อนชำระรายวัน')\
      \ OR destination.\"Auto Charge Enabled\" IS NOT TRUE OR destination.\"Defaulted\" IS TRUE OR destination.\"Loan Date\"\
      \ IS DISTINCT FROM (f->>'paymentDate')::date OR f->>'paymentMethod'<>'Net-off at Disbursement' OR f->>'targetLoanId'\
      \ IS NOT NULL OR jsonb_array_length(f->'allocations')<>1 OR f#>>'{allocations,0,chargeId}' IS DISTINCT FROM f->>'targetChargeId'\
      \ OR (f#>>'{allocations,0,principal}')::numeric<>(f#>>'{allocations,0,expectedPrincipalRemaining}')::numeric OR (f#>>'{allocations,0,interest}')::numeric<>(f#>>'{allocations,0,expectedInterestRemaining}')::numeric\
      \ THEN RAISE EXCEPTION USING ERRCODE='P5B04';END IF;\r\n   IF public.cash_account_holder(f->>'cashAccountId',true)<>'ch:lisa'\
      \ THEN RAISE EXCEPTION USING ERRCODE='P5B07';END IF;\r\n  ELSIF repost AND f->>'allocationMethod'='Loan Close' AND NOT\
      \ enter_close THEN\r\n   IF NOT EXISTS(SELECT 1 FROM public.\"Loans\" WHERE \"Row ID\"=f->>'targetLoanId' AND \"Ref\
      \ Borrowers\"=f->>'borrowerId') OR NOT EXISTS(SELECT 1 FROM public.\"Charges\" WHERE \"Row ID\"=f->>'targetChargeId'\
      \ AND \"Ref Loans\"=f->>'targetLoanId') THEN RAISE EXCEPTION USING ERRCODE='P5B04';END IF;\r\n   IF EXISTS(WITH paid\
      \ AS(SELECT \"Ref Charges\" id,sum(\"Principal Paid\"::numeric) p,sum(\"Interest Paid\"::numeric) i FROM public.\"Repayments\"\
      \ WHERE \"Ref Payment\" IS DISTINCT FROM target GROUP BY \"Ref Charges\"),lines AS(SELECT value FROM jsonb_array_elements(f->'allocations'))\
      \ SELECT 1 FROM public.\"Charges\" ch LEFT JOIN paid ON paid.id=ch.\"Row ID\" FULL JOIN lines ON lines.value->>'chargeId'=ch.\"\
      Row ID\" WHERE (ch.\"Ref Loans\"=f->>'targetLoanId' OR lines.value IS NOT NULL) AND (ch.\"Ref Loans\" IS DISTINCT FROM\
      \ f->>'targetLoanId' OR (ch.\"Principal Due\"::numeric-coalesce(paid.p,0)>0 OR ch.\"Interest Due\"::numeric-coalesce(paid.i,0)>0)\
      \ AND (lines.value IS NULL OR (lines.value->>'principal')::numeric IS DISTINCT FROM ch.\"Principal Due\"::numeric-coalesce(paid.p,0)\
      \ OR (lines.value->>'interest')::numeric IS DISTINCT FROM ch.\"Interest Due\"::numeric-coalesce(paid.i,0)))) THEN RAISE\
      \ EXCEPTION USING ERRCODE='P5B09';END IF;\r\n  END IF;\r\n END IF;\r\n explicit_inverse:=provenance IS NOT NULL AND\
      \ public.payment_inputs(desired)=public.payment_inputs(old) AND public.pwa_plan_effects_v83(provenance#>'{plan,allocations}')\
      \ IS DISTINCT FROM public.pwa_plan_effects_v83(f->'allocations');\r\n explicit_finish:=explicit_inverse AND desired.\"\
      Ref Received By Cash Account\" IS NOT DISTINCT FROM old.\"Ref Received By Cash Account\";\r\n END IF;\r\n result_value:=jsonb_build_object('operation',op,'targetType','payment','targetId',target,'paymentId',CASE\
      \ WHEN op='payment.correct' THEN target ELSE NULL END,'plan',plan,'predecessorRequestId',head,'sourceCreatedBy',CASE\
      \ WHEN op='payment.correct' THEN old.\"Created By\" ELSE NULL END);\r\n INSERT INTO public.pwa_payment_commands(request_id,contract_version,actor_issuer,actor_subject,actor_partner_id,actor_login_email,canonical_json,payload_sha256,outcome,payment_id,rejection_code,result_json)\
      \ VALUES((e->>'requestId')::uuid,2,a->>'issuer',a->>'subject',a->>'partnerId',a->>'loginEmail',canonical,encode(sha256(convert_to(canonical,'UTF8')),'hex'),'applied',NULL,NULL,result_value);\r\
      \n BEGIN\r\n IF op='payment.delete' THEN UPDATE public.\"Payments\" SET \"Delete Requested\"=true WHERE \"Row ID\"=target;\r\
      \n ELSIF op='payment.move-interest' THEN\r\n IF provenance IS NOT NULL OR old.\"Allocation Method\" IS DISTINCT FROM\
      \ 'Lump Sum' THEN RAISE EXCEPTION USING ERRCODE='P5B06';END IF;\r\n UPDATE public.\"Payment Allocations\" SET \"Ref\
      \ Charge\"=i->>'targetChargeId' WHERE \"Row ID\"=i->>'allocationId' AND \"Ref Payment\"=target;IF NOT FOUND THEN RAISE\
      \ EXCEPTION USING ERRCODE='P5B04';END IF;\r\n ELSE\r\n IF explicit_inverse THEN\r\n PERFORM set_config('pwa.native_inverse_request',e->>'requestId',true);\r\
      \n desired:=public.payment_crud_prepare_core_v83(old,desired,'UPDATE');END IF;\r\n UPDATE public.\"Payments\" SET \"\
      Ref Borrower\"=desired.\"Ref Borrower\",\"Amount Received\"=desired.\"Amount Received\",\"Payment Date\"=desired.\"\
      Payment Date\",\"Payment Method\"=desired.\"Payment Method\",\"Ref Received By Cash Account\"=desired.\"Ref Received\
      \ By Cash Account\",\"Notes\"=desired.\"Notes\",\"Allocation Method\"=desired.\"Allocation Method\",\"Ref Target Charge\"\
      =desired.\"Ref Target Charge\",\"Ref Target Loan\"=desired.\"Ref Target Loan\",\"Selected Charge IDs\"=desired.\"Selected\
      \ Charge IDs\",\"Uploaded Receipt\"=desired.\"Uploaded Receipt\",\"Status\"=desired.\"Status\",\"Processed At\"=desired.\"\
      Processed At\" WHERE \"Row ID\"=target;\r\n SELECT * INTO actual FROM public.\"Payments\" WHERE \"Row ID\"=target;\r\
      \n IF actual.\"Status\" IS DISTINCT FROM 'Posted' OR actual.\"Posted Amount\"::numeric IS DISTINCT FROM (f->>'amountReceived')::numeric\
      \ THEN RAISE EXCEPTION 'Correction did not post exact requested amount';END IF;\r\n IF explicit_finish THEN PERFORM\
      \ public.payment_crud_finish_core_v83(old,actual,'UPDATE');END IF;\r\n PERFORM set_config('pwa.native_inverse_request','',true);\r\
      \n END IF;\r\n EXCEPTION WHEN foreign_key_violation THEN RAISE EXCEPTION USING ERRCODE='P5B05';WHEN SQLSTATE 'P0001'\
      \ THEN GET STACKED DIAGNOSTICS message=MESSAGE_TEXT;\r\n IF op='payment.move-interest' AND message='Interest move requires\
      \ an eligible charge on the same open loan' THEN RAISE EXCEPTION USING ERRCODE='P5B04';\r\n ELSIF op='payment.move-interest'\
      \ AND message='Target charge capacity conflict' THEN RAISE EXCEPTION USING ERRCODE='P5B09';\r\n ELSIF op='payment.move-interest'\
      \ AND message IN('Only a posted Lump Sum whole-interest allocation can move','Change receipt amounts through Payments;\
      \ allocation move only changes Ref Charge') THEN RAISE EXCEPTION USING ERRCODE='P5B06';\r\n ELSIF message IN('Payment\
      \ has a later loan default/write-off; reconcile that default first','Manually closed loan must be reopened explicitly\
      \ before its receipt changes','Corrected payment has a default dependency; undo default first') THEN RAISE EXCEPTION\
      \ USING ERRCODE='P5B05';ELSE RAISE;END IF;END;\r\n RETURN result_value;\r\nEXCEPTION WHEN OTHERS THEN PERFORM set_config('pwa.native_inverse_request','',true);RAISE;\r\
      \nEND $function$\n"
