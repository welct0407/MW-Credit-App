    "acl": "{postgres=X/postgres,mw_app_prod=X/postgres,mw_notify_owner_prod=X/postgres}"
    "comment": "R129/R184: the pending (unpaid) amount of a referral rebate expense: REFERRAL_REBATE_V3, Amount less its close-time\
      \ offset payment less the amounts settlements applied to it (pwa_rebate_settlement_allocations); 0 for offset-only,\
      \ paid and legacy rows; null for an unknown or non-referral expense. Read only."
