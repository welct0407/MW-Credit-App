    "comment": "R129: the pending (unpaid) amount of a referral rebate expense: REFERRAL_REBATE_V3, not linked to a settlement,\
      \ Amount less its offset payment; 0 for offset-only, paid and legacy rows; null for an unknown or non-referral expense.\
      \ Read only."
