    "definition": "CREATE OR REPLACE FUNCTION public.pwa_charge_version_v2(id text)\n RETURNS text\n LANGUAGE sql\n STABLE\n\
      \ SET search_path TO 'pg_catalog', 'public'\nAS $function$\r\n SELECT encode(sha256(convert_to(jsonb_build_object('source',to_jsonb(c),'loan',to_jsonb(l),\r\
      \n 'repayments',(SELECT coalesce(jsonb_agg(to_jsonb(r) ORDER BY r.\"Row ID\" COLLATE \"C\"),'[]'::jsonb) FROM public.\"\
      Repayments\" r WHERE r.\"Ref Charges\"=c.\"Row ID\"),\r\n 'allocations',(SELECT coalesce(jsonb_agg(to_jsonb(a) ORDER\
      \ BY a.\"Row ID\" COLLATE \"C\"),'[]'::jsonb) FROM public.\"Payment Allocations\" a WHERE a.\"Ref Charge\"=c.\"Row ID\"\
      ))::text,'UTF8')),'hex') FROM public.\"Charges\" c JOIN public.\"Loans\" l ON l.\"Row ID\"=c.\"Ref Loans\" WHERE c.\"\
      Row ID\"=$1;\r\n$function$\n"
