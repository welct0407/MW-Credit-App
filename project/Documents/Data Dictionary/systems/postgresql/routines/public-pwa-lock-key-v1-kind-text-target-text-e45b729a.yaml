    "definition": |
      CREATE OR REPLACE FUNCTION public.pwa_lock_key_v1(kind text, target text)
       RETURNS bigint
       LANGUAGE sql
       IMMUTABLE PARALLEL SAFE STRICT
      AS $function$
       SELECT pg_catalog.hashtextextended(kind OPERATOR(pg_catalog.||) ':' OPERATOR(pg_catalog.||) target, 0)
      $function$
