    "definition": "CREATE OR REPLACE FUNCTION public.post_payment_explicit_v6(p_id text)\n RETURNS void\n LANGUAGE plpgsql\n\
      \ SET search_path TO 'pg_catalog', 'public'\nAS $function$\r\nDECLARE p public.\"Payments\"%ROWTYPE; amount numeric;\
      \ available numeric; command jsonb; projected jsonb; invalid_plan boolean;\r\nBEGIN\r\n  SELECT public.pwa_effective_payment_plan_v2(p_id)->'plan'\
      \ INTO command;\r\n  IF command IS NULL THEN RAISE EXCEPTION 'PWA immutable plan required';END IF;\r\n  SELECT * INTO\
      \ STRICT p FROM public.\"Payments\" WHERE \"Row ID\"=p_id;\r\n  IF p.\"Status\"='Posted' THEN RETURN; END IF;\r\n  IF\
      \ p.\"Status\" IS DISTINCT FROM 'Processing' THEN\r\n    RAISE EXCEPTION 'Payment must be Processing before posting';\r\
      \n  END IF;\r\n  IF p.\"Allocation Method\" IS NULL OR p.\"Allocation Method\" NOT IN\r\n    ('Single Full','Single\
      \ Partial','Receive All','Lump Sum','First-day Auto','Loan Close','Selected Charges') THEN\r\n    RAISE EXCEPTION 'Unsupported\
      \ payment allocation method';\r\n  END IF;\r\n  amount:=p.\"Amount Received\"::numeric;\r\n  IF amount IS NULL OR amount<=0\
      \ OR amount<>trunc(amount) THEN\r\n    RAISE EXCEPTION 'Payment requires a positive whole-baht amount';\r\n  END IF;\r\
      \n  IF p.\"Payment Date\" IS NULL OR p.\"Payment Date\"> (statement_timestamp() AT TIME ZONE 'Asia/Bangkok')::date THEN\r\
      \n    RAISE EXCEPTION 'Payment date must be present and no later than today';\r\n  END IF;\r\n  PERFORM 1 FROM public.\"\
      Borrowers\" WHERE \"Row ID\"=p.\"Ref Borrower\" FOR UPDATE;\r\n  IF NOT FOUND THEN RAISE EXCEPTION 'Payment borrower\
      \ does not exist'; END IF;\r\n  -- The receipt BEFORE trigger acquires this same lock before INSERT. Re-read\r\n  --\
      \ after acquisition for callers invoking the business function directly.\r\n  SELECT * INTO STRICT p FROM public.\"\
      Payments\" WHERE \"Row ID\"=p_id FOR UPDATE;\r\n  IF p.\"Status\"='Posted' THEN RETURN; END IF;\r\n  IF EXISTS (SELECT\
      \ 1 FROM public.\"Payments\" q WHERE q.\"Ref Borrower\"=p.\"Ref Borrower\"\r\n    AND q.\"Row ID\"<>p_id AND q.\"Status\"\
      \ IN ('Processing','Error')\r\n    AND NOT coalesce(nullif(current_setting('payment_crud.parents',true),'')::jsonb ?\
      \ q.\"Row ID\",false)) THEN\r\n    RAISE EXCEPTION 'Another receipt for this borrower requires reconciliation';\r\n\
      \  END IF;\r\n  IF EXISTS (SELECT 1 FROM public.\"Payment Allocations\" WHERE \"Ref Payment\"=p_id)\r\n    OR EXISTS\
      \ (SELECT 1 FROM public.\"Repayments\" WHERE \"Ref Payment\"=p_id) THEN\r\n    RAISE EXCEPTION 'Existing receipt results\
      \ require reconciliation; reallocation refused';\r\n  END IF;\r\n  PERFORM 1 FROM public.\"Loans\" WHERE \"Ref Borrowers\"\
      =p.\"Ref Borrower\"\r\n    ORDER BY \"Row ID\" COLLATE \"C\" FOR UPDATE;\r\n  PERFORM 1 FROM public.\"Charges\" c JOIN\
      \ public.\"Loans\" l ON l.\"Row ID\"=c.\"Ref Loans\"\r\n    WHERE l.\"Ref Borrowers\"=p.\"Ref Borrower\" ORDER BY c.\"\
      Row ID\" COLLATE \"C\" FOR UPDATE OF c;\r\n  IF p.\"Allocation Method\" IS DISTINCT FROM command->>'allocationMethod'\
      \ OR p.\"Ref Borrower\" IS DISTINCT FROM command->>'borrowerId' OR p.\"Amount Received\"::numeric IS DISTINCT FROM (command->>'amountReceived')::numeric\
      \ THEN RAISE EXCEPTION 'Explicit allocation identity mismatch';END IF;\r\n  IF p.\"Allocation Method\"='First-day Auto'\
      \ AND p.\"Ref Received By Cash Account\" IS DISTINCT FROM command->>'cashAccountId' THEN RAISE EXCEPTION 'First-day\
      \ resolved account differs from immutable plan';END IF;\n-- One materialized projection provides both validation and\
      \ insertion inputs.\r\n  WITH lines AS MATERIALIZED (SELECT value line FROM jsonb_array_elements(command->'allocations')),\r\
      \n  paid AS MATERIALIZED (\r\n   SELECT \"Ref Charges\" charge,sum(\"Principal Paid\"::numeric) principal,sum(\"Interest\
      \ Paid\"::numeric) interest,count(*) FILTER(WHERE \"Principal Paid\" IS NULL OR \"Interest Paid\" IS NULL) invalid\r\
      \n   FROM public.\"Repayments\" WHERE \"Ref Charges\" IN (SELECT line->>'chargeId' FROM lines) GROUP BY \"Ref Charges\"\
      \r\n  ), plan AS MATERIALIZED (\r\n   SELECT line,c.\"Charge Date\" AS day,l.\"Ref Borrowers\" borrower,c.\"Principal\
      \ Due\"::numeric-coalesce(paid.principal,0) principal,c.\"Interest Due\"::numeric-coalesce(paid.interest,0) interest,coalesce(paid.invalid,0)\
      \ invalid,row_number() OVER(ORDER BY c.\"Charge Date\" DESC,(line->>'chargeId') COLLATE \"C\" DESC) ord\r\n   FROM lines\
      \ LEFT JOIN public.\"Charges\" c ON c.\"Row ID\"=line->>'chargeId' LEFT JOIN public.\"Loans\" l ON l.\"Row ID\"=c.\"\
      Ref Loans\" LEFT JOIN paid ON paid.charge=c.\"Row ID\"\r\n  )\r\n  SELECT jsonb_agg(jsonb_build_object('charge',line->>'chargeId','day',day,'principal',principal,'interest',interest,'paidPrincipal',(line->>'principal')::numeric,'paidInterest',(line->>'interest')::numeric,'ord',ord)\
      \ ORDER BY ord),\r\n   bool_or(borrower IS DISTINCT FROM p.\"Ref Borrower\" OR invalid>0 OR day IS NULL OR principal\
      \ IS NULL OR interest IS NULL OR principal<0 OR interest<0 OR principal<>trunc(principal) OR interest<>trunc(interest)\
      \ OR (line->>'principal')::numeric>principal OR (line->>'interest')::numeric>interest)\r\n  INTO projected,invalid_plan\
      \ FROM plan;\r\n  IF invalid_plan IS DISTINCT FROM false OR jsonb_array_length(projected)<>jsonb_array_length(command->'allocations')\
      \ THEN RAISE EXCEPTION 'Explicit allocation exceeds current components';END IF;\r\n  INSERT INTO public.\"Payment Allocations\"\
      (\"Row ID\",\"Ref Payment\",\"Ref Charge\",\"Charge Date Snapshot\",\"Charge Row Number Snapshot\",\"Interest Remaining\
      \ Snapshot\",\"Principal Remaining Snapshot\",\"Amount Remaining Snapshot\",\"Allocation Order\",\"Allocated Interest\"\
      ,\"Allocated Principal\",\"Allocated Amount\",\"Created At\")\r\n  SELECT 'pc6:'||length(p_id)||':'||p_id||':'||charge,p_id,charge,day,-ord,interest::money,principal::money,(principal+interest)::money,ord,\"\
      paidInterest\"::money,\"paidPrincipal\"::money,(\"paidPrincipal\"+\"paidInterest\")::money,statement_timestamp() AT\
      \ TIME ZONE 'Asia/Bangkok'\r\n  FROM jsonb_to_recordset(projected) AS x(charge text,day date,principal numeric,interest\
      \ numeric,\"paidPrincipal\" numeric,\"paidInterest\" numeric,ord integer);\r\n  INSERT INTO public.\"Repayments\"(\"\
      Row ID\",\"Payment Date\",\"Principal Paid\",\"Interest Paid\",\"Notes\",\r\n    \"Ref Loans\",\"Ref Charges\",\"Created\
      \ By\",\"Ref Payment\",\"Ref Payment Allocation\")\r\n  SELECT a.\"Row ID\",p.\"Payment Date\",a.\"Allocated Principal\"\
      ,a.\"Allocated Interest\",p.\"Notes\",\r\n    c.\"Ref Loans\",a.\"Ref Charge\",p.\"Created By\",p_id,a.\"Row ID\"\r\n\
      \  FROM public.\"Payment Allocations\" a JOIN public.\"Charges\" c ON c.\"Row ID\"=a.\"Ref Charge\"\r\n  WHERE a.\"\
      Ref Payment\"=p_id;\r\n  IF amount IS DISTINCT FROM (SELECT sum(\"Allocated Amount\"::numeric) FROM public.\"Payment\
      \ Allocations\" WHERE \"Ref Payment\"=p_id)\r\n    OR amount IS DISTINCT FROM (SELECT sum(\"Principal Paid\"::numeric+\"\
      Interest Paid\"::numeric) FROM public.\"Repayments\" WHERE \"Ref Payment\"=p_id) THEN\r\n    RAISE EXCEPTION 'Payment\
      \ ledger reconciliation failed';\r\n  END IF;\r\n  PERFORM public.close_payment_loans(p_id);\r\n  UPDATE public.\"Payments\"\
      \ SET \"Status\"='Posted',\"Processed At\"=clock_timestamp() AT TIME ZONE 'Asia/Bangkok'\r\n    WHERE \"Row ID\"=p_id;\r\
      \nEND $function$\n"
