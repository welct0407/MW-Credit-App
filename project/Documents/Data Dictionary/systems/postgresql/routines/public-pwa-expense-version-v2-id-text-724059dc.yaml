    "definition": "CREATE OR REPLACE FUNCTION public.pwa_expense_version_v2(id text)\n RETURNS text\n LANGUAGE sql\n STABLE\n\
      \ SET search_path TO 'pg_catalog', 'public'\nAS $function$\r\n SELECT encode(sha256(convert_to(jsonb_build_object('source',to_jsonb(e),'ledger',coalesce((SELECT\
      \ jsonb_agg(to_jsonb(c) ORDER BY c.\"Row ID\" COLLATE \"C\") FROM public.\"Cash Ledger\" c WHERE c.\"Ref Business Expense\"\
      =e.\"Row ID\"),'[]'))::text,'UTF8')),'hex') FROM public.\"Business Expenses\" e WHERE e.\"Row ID\"=$1;\r\n$function$\n"
