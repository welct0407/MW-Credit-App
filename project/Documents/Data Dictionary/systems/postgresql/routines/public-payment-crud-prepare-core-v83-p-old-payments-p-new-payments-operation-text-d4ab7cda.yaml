    "definition": "CREATE OR REPLACE FUNCTION public.payment_crud_prepare_core_v83(p_old \"Payments\", p_new \"Payments\"\
      , operation text)\n RETURNS \"Payments\"\n LANGUAGE plpgsql\n SET search_path TO 'pg_catalog', 'public'\nAS $function$\r\
      \n#variable_conflict use_column\r\nDECLARE b text; l public.\"Loans\"%ROWTYPE; context_before text; owned jsonb; parents_before\
      \ text:=current_setting('payment_crud.parents',true); cleanup_before text:=current_setting('payment_crud.id',true);\
      \ actual public.\"Payments\"%ROWTYPE;\r\nBEGIN\r\n IF pg_trigger_depth()=0 AND NOT public.pwa_native_inverse_permitted_v2(p_old.\"\
      Row ID\") THEN RAISE EXCEPTION USING ERRCODE='42501',MESSAGE='Protected correction context required';END IF;\r\n SELECT\
      \ * INTO actual FROM public.\"Payments\" WHERE \"Row ID\"=p_old.\"Row ID\" FOR UPDATE;\r\n IF NOT FOUND OR to_jsonb(actual)\
      \ IS DISTINCT FROM to_jsonb(p_old) THEN RAISE EXCEPTION USING ERRCODE='P5B01',MESSAGE='Source changed';END IF;\r\n IF\
      \ NOT pg_try_advisory_xact_lock(9162026,2) THEN RAISE EXCEPTION 'Cash pool is busy; retry'; END IF;\r\n FOR b IN SELECT\
      \ DISTINCT k COLLATE \"C\" FROM unnest(ARRAY[p_old.\"Ref Borrower\",CASE WHEN operation='UPDATE' THEN p_new.\"Ref Borrower\"\
      \ END]) k\r\n  WHERE k IS NOT NULL ORDER BY k COLLATE \"C\" LOOP\r\n  PERFORM 1 FROM public.\"Borrowers\" WHERE \"Row\
      \ ID\"=b FOR UPDATE NOWAIT;\r\n END LOOP;\r\n -- Loan Close prepared charges remain separately editable booked obligations.\r\
      \n PERFORM 1 FROM public.\"Loans\" WHERE \"Ref Borrowers\" IN (p_old.\"Ref Borrower\",CASE WHEN operation='UPDATE' THEN\
      \ p_new.\"Ref Borrower\" END)\r\n  ORDER BY \"Row ID\" COLLATE \"C\" FOR UPDATE NOWAIT;\r\n PERFORM 1 FROM public.\"\
      Charges\" WHERE \"Ref Loans\" IN (SELECT \"Row ID\" FROM public.\"Loans\"\r\n  WHERE \"Ref Borrowers\" IN (p_old.\"\
      Ref Borrower\",CASE WHEN operation='UPDATE' THEN p_new.\"Ref Borrower\" END))\r\n  ORDER BY \"Row ID\" COLLATE \"C\"\
      \ FOR UPDATE NOWAIT;\r\n PERFORM 1 FROM public.\"Payment Allocations\" WHERE \"Ref Payment\"=p_old.\"Row ID\" ORDER\
      \ BY \"Row ID\" COLLATE \"C\" FOR UPDATE NOWAIT;\r\n PERFORM 1 FROM public.\"Repayments\" WHERE \"Ref Payment\"=p_old.\"\
      Row ID\" ORDER BY \"Row ID\" COLLATE \"C\" FOR UPDATE NOWAIT;\r\n PERFORM 1 FROM public.\"Cash Ledger\" WHERE \"Ref\
      \ Payment\"=p_old.\"Row ID\" ORDER BY \"Row ID\" COLLATE \"C\" FOR UPDATE NOWAIT;\r\n IF EXISTS(SELECT 1 FROM public.\"\
      Repayments\" r JOIN public.\"Loans\" l ON l.\"Row ID\"=r.\"Ref Loans\"\r\n  WHERE r.\"Ref Payment\"=p_old.\"Row ID\"\
      \ AND l.\"Defaulted\" IS TRUE) THEN\r\n  RAISE EXCEPTION 'Payment has a later loan default/write-off; reconcile that\
      \ default first'; END IF;\r\n SELECT coalesce(jsonb_agg(to_jsonb(x)),'[]') INTO owned FROM public.\"Loans\" x WHERE\
      \ x.\"Row ID\" IN\r\n  (SELECT \"Ref Loans\" FROM public.\"Repayments\" WHERE \"Ref Payment\"=p_old.\"Row ID\");\r\n\
      \ IF EXISTS(SELECT 1 FROM jsonb_array_elements(owned) j WHERE j->>'Loan Status'='ปิดยอดแล้ว' AND j->>'Ref Closing Payment'\
      \ IS NULL) THEN\r\n  RAISE EXCEPTION 'Manually closed loan must be reopened explicitly before its receipt changes';\
      \ END IF;\r\n PERFORM set_config('payment_crud.parents',\r\n  (coalesce(nullif(current_setting('payment_crud.parents',true),'')::jsonb,'{}')||jsonb_build_object(p_old.\"\
      Row ID\",owned))::text,true);\r\n context_before:=current_setting('payment_crud.id',true);\r\n PERFORM set_config('payment_crud.id',p_old.\"\
      Row ID\",true);\r\n -- A payment-controlled closure is reversible. Manually closed/defaulted loans\r\n -- are not inferred\
      \ from balances and are never silently reopened.\r\n FOR l IN SELECT x.* FROM public.\"Loans\" x WHERE x.\"Ref Closing\
      \ Payment\" IS NOT NULL\r\n  AND (x.\"Ref Closing Payment\"=p_old.\"Row ID\" OR x.\"Row ID\" IN\r\n   (SELECT \"Ref\
      \ Loans\" FROM public.\"Repayments\" WHERE \"Ref Payment\"=p_old.\"Row ID\"))\r\n  ORDER BY x.\"Row ID\" COLLATE \"\
      C\" LOOP\r\n  IF l.\"Defaulted\" IS TRUE THEN RAISE EXCEPTION 'Defaulted loan requires explicit default reconciliation';\
      \ END IF;\r\n  DELETE FROM public.\"Cash Ledger\" WHERE \"Entry Origin\"='System' AND \"Source Type\"='Business Expense'\r\
      \n   AND \"Ref Business Expense\" IN (SELECT \"Row ID\" FROM public.\"Business Expenses\"\r\n    WHERE \"Ref Related\
      \ Loan\"=l.\"Row ID\" AND \"Source Type\"='Referral Rebate');\r\n  DELETE FROM public.\"Business Expenses\" WHERE \"\
      Ref Related Loan\"=l.\"Row ID\" AND \"Source Type\"='Referral Rebate';\r\n  -- Only the receipt which owns the closure\
      \ is reopened before reposting.\r\n  -- A later receipt's closure is checked against final balances in finish().\r\n\
      \  IF l.\"Ref Closing Payment\"=p_old.\"Row ID\" THEN\r\n   UPDATE public.\"Loans\" SET \"Loan Status\"='ยังไม่ปิดยอด',\"\
      Ref Closing Payment\"=NULL,\"Close Date\"=NULL,\"Closed By\"=NULL\r\n    WHERE \"Row ID\"=l.\"Row ID\";\r\n  END IF;\r\
      \n END LOOP;\r\n DELETE FROM public.\"Repayments\" WHERE \"Ref Payment\"=p_old.\"Row ID\";\r\n DELETE FROM public.\"\
      Payment Allocations\" WHERE \"Ref Payment\"=p_old.\"Row ID\";\r\n IF operation='DELETE' THEN\r\n  DELETE FROM public.\"\
      Cash Ledger\" WHERE \"Entry Origin\"='System' AND \"Source Type\"='Payment' AND \"Ref Payment\"=p_old.\"Row ID\";\r\n\
      \ ELSE\r\n  p_new.\"Status\":='Processing'; p_new.\"Processed At\":=NULL;\r\n END IF;\r\n PERFORM set_config('payment_crud.id',coalesce(context_before,''),true);\r\
      \n IF operation='DELETE' THEN RETURN p_old; END IF;\r\n RETURN p_new;\r\nEXCEPTION WHEN OTHERS THEN\r\n PERFORM set_config('payment_crud.id',coalesce(cleanup_before,''),true);\r\
      \n PERFORM set_config('payment_crud.parents',coalesce(parents_before,''),true);RAISE;\r\nEND $function$\n"
