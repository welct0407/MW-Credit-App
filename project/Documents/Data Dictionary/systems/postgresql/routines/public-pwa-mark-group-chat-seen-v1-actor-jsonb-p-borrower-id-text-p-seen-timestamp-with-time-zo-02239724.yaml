    "comment": "R149: records that the actor (its login email must map to exactly its Partner, 42501 otherwise) has seen the\
      \ borrower's group chat summary up to p_seen. Forward only and clamped to the summary's last_message_at; an equal or\
      \ older value touches no row. Returns {kind: stored | unchanged | ignored (no summary), seenAt}. Raises unknown_borrower\
      \ (P0002) or invalid_request (22023). Invoker rights."
