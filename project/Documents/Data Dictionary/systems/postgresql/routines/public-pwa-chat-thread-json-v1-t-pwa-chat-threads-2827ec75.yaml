    "definition": |
      CREATE OR REPLACE FUNCTION public.pwa_chat_thread_json_v1(t pwa_chat_threads)
       RETURNS jsonb
       LANGUAGE sql
       STABLE
       SET search_path TO 'pg_catalog', 'public'
      AS $function$
       SELECT jsonb_build_object('id',t.id,'title',t.title,'model',t.model,'status',t.status,'createdAt',public.pwa_chat_iso_v1(t.created_at),
        'lastMessageAt',public.pwa_chat_iso_v1(t.last_message_at),'messageCount',t.message_count)
      $function$
    "owner": "mw_chat_owner_prod"
    "language": "sql"
    "volatility": "s"
    "strict": false
    "security_definer": false
    "leakproof": false
    "parallel": "u"
    "settings":
    - "search_path=pg_catalog, public"
    "acl": "{mw_chat_owner_prod=X/mw_chat_owner_prod}"
    "comment": "mw-access:governance fixed chat boundary; explicit capability only"
