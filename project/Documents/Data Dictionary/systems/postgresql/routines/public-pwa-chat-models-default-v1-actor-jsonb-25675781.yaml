    "definition": |
      CREATE OR REPLACE FUNCTION public.pwa_chat_models_default_v1(actor jsonb)
       RETURNS text
       LANGUAGE plpgsql
       SECURITY DEFINER
       SET search_path TO 'pg_catalog', 'public'
      AS $function$
      DECLARE partner text:=public.pwa_chat_actor_v1(actor);
      BEGIN
       RETURN (SELECT t.model FROM public.pwa_chat_threads t WHERE t.partner_id=partner ORDER BY t.updated_at DESC,t.id DESC LIMIT 1);
      END $function$
    "owner": "mw_chat_owner_prod"
    "language": "plpgsql"
    "volatility": "v"
    "strict": false
