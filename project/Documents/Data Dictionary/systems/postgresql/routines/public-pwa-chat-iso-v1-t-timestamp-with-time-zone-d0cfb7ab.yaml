    "definition": |
      CREATE OR REPLACE FUNCTION public.pwa_chat_iso_v1(t timestamp with time zone)
       RETURNS text
       LANGUAGE sql
       IMMUTABLE STRICT
       SET search_path TO 'pg_catalog', 'public'
      AS $function$ SELECT to_char(t AT TIME ZONE 'UTC','YYYY-MM-DD"T"HH24:MI:SS.MS"Z"') $function$
