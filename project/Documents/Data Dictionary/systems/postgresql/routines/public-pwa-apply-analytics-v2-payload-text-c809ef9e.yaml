    "definition": "CREATE OR REPLACE FUNCTION public.pwa_apply_analytics_v2(payload text)\n RETURNS jsonb\n LANGUAGE plpgsql\n\
      \ SET search_path TO 'pg_catalog', 'public'\nAS $function$\r\nDECLARE e jsonb:=payload::jsonb;c jsonb:=e->'command';i\
      \ jsonb:=c->'inputs';target text:=c->>'targetId';snapshot jsonb;\r\nBEGIN\r\n IF (current_database() NOT IN ('loan_manager_dev','payment_rehearsal','loan_manager_prod')\
      \ OR current_user<>CASE current_database() WHEN 'loan_manager_prod' THEN 'mw_app_prod_journal_owner' ELSE 'mw_app_dev_journal_owner'\
      \ END) OR c->>'operation'<>'analytics.refresh' THEN RAISE EXCEPTION USING ERRCODE='42501';END IF;\r\n PERFORM public.pwa_management_tools_text_v2('analytics.refresh',i);\r\
      \n PERFORM pg_advisory_xact_lock(public.pwa_lock_key_v1('management:analytics',target));\r\n SELECT to_jsonb(s) INTO\
      \ snapshot FROM public.\"Statistics\" s WHERE \"Row ID\"=target FOR UPDATE;\r\n IF snapshot IS NULL THEN RAISE EXCEPTION\
      \ USING ERRCODE='P5B02';END IF;\r\n IF encode(sha256(convert_to(snapshot::text,'UTF8')),'hex') IS DISTINCT FROM c->>'expectedVersion'\
      \ THEN RAISE EXCEPTION USING ERRCODE='P5B01';END IF;\r\n UPDATE public.\"Statistics\" SET \"Analytics Refresh Request\"\
      =public.olap_reporting_date()::text||'|'||(i->>'mode')||'|'||(e->>'requestId') WHERE \"Row ID\"=target;\r\n RETURN jsonb_build_object('operation','analytics.refresh','targetType','analytics','targetId',target,'paymentId',NULL,'plan',NULL,'predecessorRequestId',NULL,'sourceCreatedBy',NULL);\r\
      \nEND $function$\n"
