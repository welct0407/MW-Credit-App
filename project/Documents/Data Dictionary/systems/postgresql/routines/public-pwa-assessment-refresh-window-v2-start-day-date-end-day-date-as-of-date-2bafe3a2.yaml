    "result": "date[]"
    "definition": "CREATE OR REPLACE FUNCTION public.pwa_assessment_refresh_window_v2(start_day date, end_day date, as_of\
      \ date)\n RETURNS date[]\n LANGUAGE plpgsql\n IMMUTABLE\n SET search_path TO 'pg_catalog', 'public'\nAS $function$\r\
      \nBEGIN\r\n IF start_day IS NULL OR end_day IS NULL OR as_of IS NULL OR start_day>end_day OR end_day-start_day>3660\
      \ OR start_day>as_of THEN RAISE EXCEPTION USING ERRCODE='P5B08';END IF;\r\n IF end_day<as_of THEN RETURN ARRAY[as_of,as_of];END\
      \ IF;\r\n RETURN ARRAY[start_day,end_day];\r\nEND $function$\n"
