    "extension": null
  "purpose": "Facts for the push text of up to 26 history events (one Notifications history page; more raise invalid_request) with the calling partner, resolved by pwa_notify_actor_v1, as the recipient: eventId, found (source row still exists), eventType, language ('th' for Partners \"Language Preference\" 'ไทย', else 'en'), borrowerName (Borrowers \"Borrower Name\" for Thai, the trimmed English name Borrowers \"Description\" for English, NULL when blank) and amount, with the V100 expressions. Only events that have a delivery to that partner are returned. The notification API renders title and body in services/notifications/content.mjs and shows the generic text for an event without a row or when the function is unavailable."
  "grants": "EXECUTE only mw_notify_api_<env>. No new grant: the owner mw_notify_owner_<env> already holds the V99/V100 column SELECT it reads (Partners \"Language Preference\"; Payments \"Row ID\", \"Ref Borrower\", \"Amount Received\"; Loans \"Row ID\", \"Ref Borrowers\", \"Principal Amount\"; Borrowers \"Row ID\", \"Borrower Name\", \"Description\")."
