    "comment": "R165: completes the open group chat summary refresh request named by the integration agent's command {\"command\"\
      :{schemaVersion,environment,requestId,outcome}} (outcome stored, unchanged, cleared, no_group or failed). Returns {kind:\
      \ completed | replayed (already completed; unchanged) | unknown_request (no row carries the id; nothing changes)}. Raises\
      \ invalid_request (22023). Invoker rights."
