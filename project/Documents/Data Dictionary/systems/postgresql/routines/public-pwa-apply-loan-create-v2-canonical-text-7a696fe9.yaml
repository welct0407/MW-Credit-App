    "definition": "CREATE OR REPLACE FUNCTION public.pwa_apply_loan_create_v2(canonical text)\n RETURNS jsonb\n LANGUAGE plpgsql\n\
      \ SET search_path TO 'pg_catalog', 'public'\nAS $function$\r\nDECLARE e jsonb:=canonical::jsonb;i jsonb:=e#>'{command,inputs}';a\
      \ jsonb:=e->'actor';target text:=e#>>'{command,targetId}';\r\n l public.\"Loans\"%ROWTYPE;component record;payment text;charge\
      \ text;plan jsonb;result_value jsonb;actual public.\"Payments\"%ROWTYPE;\r\nBEGIN\r\n IF (current_database() NOT IN\
      \ ('loan_manager_dev','payment_rehearsal','loan_manager_prod') OR current_user<>CASE current_database() WHEN 'loan_manager_prod'\
      \ THEN 'mw_app_prod_journal_owner' ELSE 'mw_app_dev_journal_owner' END) OR e#>>'{command,operation}'<>'loan.create'\
      \ THEN RAISE EXCEPTION USING ERRCODE='42501',MESSAGE='Governed operation required';END IF;\r\n PERFORM 1 FROM public.\"\
      Borrowers\" WHERE \"Row ID\"=i->>'borrowerId' FOR UPDATE;\r\n IF NOT FOUND THEN RAISE EXCEPTION USING ERRCODE='P5B04';END\
      \ IF;\r\n PERFORM pg_advisory_xact_lock(public.pwa_lock_key_v1('loan',target));\r\n IF EXISTS(SELECT 1 FROM public.\"\
      Loans\" WHERE \"Row ID\"=target) THEN RAISE EXCEPTION USING ERRCODE='P5B01';END IF;\r\n IF NOT EXISTS(SELECT 1 FROM\
      \ public.\"Cash Accounts\" ca JOIN public.\"Cash Holders\" ch ON ch.\"Row ID\"=ca.\"Ref Cash Holder\" WHERE ca.\"Row\
      \ ID\"=i->>'disbursingAccountId' AND ca.\"Active\" IS TRUE AND ch.\"Active\" IS TRUE AND ch.\"Row ID\"='ch:lisa') THEN\
      \ RAISE EXCEPTION USING ERRCODE='P5B07';END IF;\r\n l:=jsonb_populate_record(NULL::public.\"Loans\",jsonb_build_object('Row\
      \ ID',target,'Ref Borrowers',i->'borrowerId','Loan Date',i->'loanDate','Principal Amount',i->'principal','Transfer Fee',i->'transferFee','Ref\
      \ Disbursed From Cash Account',i->'disbursingAccountId','Loan Type',i->'type','Due Date',i->'dueDate','Daily Payment\
      \ Amount',i->'dailyPayment','Fixed Interest',i->'fixedInterest','Current Daily Interest',i->'currentDailyInterest','Interest\
      \ Payment Interval',i->'paymentInterval','Loan Arrangement',i->'arrangement','Auto Charge Enabled',i->'autoChargeEnabled','Created\
      \ By',a->'loginEmail','Loan Status','ยังไม่ปิดยอด','Defaulted',false));\r\n l.\"Interest Schedule Anchor Date\":=(i->>'scheduleAnchor')::date;\r\
      \n IF l.\"Interest Schedule Anchor Date\"<l.\"Loan Date\" THEN RAISE EXCEPTION USING ERRCODE='P5B08';END IF;\r\n SELECT\
      \ * INTO component FROM public.first_day_components_v83(l);\r\n IF FOUND AND component.principal+component.interest>0\
      \ THEN\r\n  IF component.principal<>trunc(component.principal) OR component.interest<>trunc(component.interest) THEN\
      \ RAISE EXCEPTION USING ERRCODE='P5B06';END IF;\r\n  charge:='fd6:'||target;payment:='fd6:'||charge;\r\n  plan:=jsonb_build_object('borrowerId',l.\"\
      Ref Borrowers\",'amountReceived',(component.principal+component.interest)::bigint::text,\r\n   'allocations',jsonb_build_array(jsonb_build_object('chargeId',charge,'principal',component.principal::bigint::text,'interest',component.interest::bigint::text,'expectedPrincipalRemaining',component.principal::bigint::text,'expectedInterestRemaining',component.interest::bigint::text,'chargeDate',l.\"\
      Loan Date\"::text)),\r\n   'allocationMethod','First-day Auto','targetChargeId',charge,'targetLoanId',NULL,'cashAccountId',coalesce(l.\"\
      Ref Disbursed From Cash Account\",public.default_cash_account('ch:lisa')),'paymentDate',l.\"Loan Date\"::text,'paymentMethod','Net-off\
      \ at Disbursement');\r\n END IF;\r\n result_value:=jsonb_build_object('operation','loan.create','targetType','loan','targetId',target,'paymentId',payment,'plan',plan,'predecessorRequestId',NULL,'sourceCreatedBy',CASE\
      \ WHEN payment IS NOT NULL THEN l.\"Created By\" ELSE NULL END);\r\n -- This row and every triggered effect share the\
      \ caller's savepoint and outer transaction.\r\n INSERT INTO public.pwa_payment_commands(request_id,contract_version,actor_issuer,actor_subject,actor_partner_id,actor_login_email,canonical_json,payload_sha256,outcome,payment_id,rejection_code,result_json)\r\
      \n VALUES((e->>'requestId')::uuid,2,a->>'issuer',a->>'subject',a->>'partnerId',a->>'loginEmail',canonical,encode(sha256(convert_to(canonical,'UTF8')),'hex'),'applied',NULL,NULL,result_value);\r\
      \n INSERT INTO public.\"Loans\"(\"Row ID\",\"Ref Borrowers\",\"Loan Date\",\"Principal Amount\",\"Transfer Fee\",\"\
      Ref Disbursed From Cash Account\",\"Loan Type\",\"Due Date\",\"Daily Payment Amount\",\"Fixed Interest\",\"Current Daily\
      \ Interest\",\"Interest Payment Interval\",\"Loan Arrangement\",\"Auto Charge Enabled\",\"Created By\",\"Loan Status\"\
      ,\"Defaulted\",\"Interest Schedule Anchor Date\")\r\n VALUES(l.\"Row ID\",l.\"Ref Borrowers\",l.\"Loan Date\",l.\"Principal\
      \ Amount\",l.\"Transfer Fee\",l.\"Ref Disbursed From Cash Account\",l.\"Loan Type\",l.\"Due Date\",l.\"Daily Payment\
      \ Amount\",l.\"Fixed Interest\",l.\"Current Daily Interest\",l.\"Interest Payment Interval\",l.\"Loan Arrangement\"\
      ,l.\"Auto Charge Enabled\",l.\"Created By\",l.\"Loan Status\",false,l.\"Interest Schedule Anchor Date\");\r\n IF payment\
      \ IS NOT NULL THEN\r\n  SELECT * INTO actual FROM public.\"Payments\" WHERE \"Row ID\"=payment;\r\n  IF NOT FOUND OR\
      \ actual.\"Status\" IS DISTINCT FROM 'Posted' OR actual.\"Amount Received\"::numeric IS DISTINCT FROM component.principal+component.interest\r\
      \n   OR (SELECT count(*) FROM public.\"Payment Allocations\" WHERE \"Ref Payment\"=payment)<>1\r\n   OR NOT EXISTS(SELECT\
      \ 1 FROM public.\"Payment Allocations\" WHERE \"Ref Payment\"=payment AND \"Ref Charge\"=charge AND \"Allocated Principal\"\
      ::numeric=component.principal AND \"Allocated Interest\"::numeric=component.interest) THEN RAISE EXCEPTION 'First-day\
      \ effect does not match immutable operation plan';END IF;\r\n ELSE\r\n  IF EXISTS(SELECT 1 FROM public.\"Payments\"\
      \ WHERE \"Row ID\"='fd6:fd6:'||target) THEN RAISE EXCEPTION 'Unexpected first-day receipt';END IF;\r\n END IF;\r\n RETURN\
      \ result_value;\r\nEND $function$\n"
