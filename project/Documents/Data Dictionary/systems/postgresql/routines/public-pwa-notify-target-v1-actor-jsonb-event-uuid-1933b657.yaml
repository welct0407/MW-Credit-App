    "definition": |
      CREATE OR REPLACE FUNCTION public.pwa_notify_target_v1(actor jsonb, event uuid)
       RETURNS TABLE(kind text, id text)
       LANGUAGE plpgsql
       SECURITY DEFINER
       SET search_path TO 'pg_catalog', 'public'
      AS $function$
      DECLARE partner text:=public.pwa_notify_actor_v1(actor);
      BEGIN
       RETURN QUERY SELECT e.source_kind,e.source_id FROM public.pwa_notification_events e WHERE e.event_id=$2 AND EXISTS(SELECT 1 FROM public.pwa_notification_deliveries d WHERE d.event_id=e.event_id AND d.recipient_partner_id=partner);
      END $function$
    "owner": "mw_notify_owner_prod"
    "language": "plpgsql"
    "volatility": "v"
    "strict": false
    "security_definer": true
    "leakproof": false
    "parallel": "u"
    "cost": 100.0
    "rows": 1000.0
