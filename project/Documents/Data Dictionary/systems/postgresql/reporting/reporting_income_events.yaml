    "comment": null
    "view_definition": |2-
       SELECT 'repayment:'::text || repayments."Row ID" AS "Event ID",
          repayments."Payment Date" AS "Date",
              CASE
                  WHEN repayments.loss_pair THEN 0::numeric
                  ELSE repayments."Interest Paid"::numeric
              END AS "Income",
          0::numeric AS "Expenses",
              CASE
                  WHEN repayments.loss_pair THEN repayments."Principal Paid"::numeric
                  ELSE 0::numeric
              END AS "Principal Write-offs"
         FROM ( SELECT wx."Row ID",
                  wx."Payment Date",
                  wx."Principal Paid",
                  wx."Interest Paid",
                  wx."Notes",
                  wx."Ref Loans",
                  wx."Ref Charges",
                  wx."Created By",
                  wx."Ref Payment",
                  wx."Ref Payment Allocation",
                  wx."Principal Returned Days MTD",
                  wx."Pool Total at Payment Date",
                  wx."Partner A Contribution at Payment Date",
                  wx."Partner B Contribution at Payment Date",
                  wx."Partner A Profit Share",
                  wx."Partner B Profit Share",
                  wx."Partner A Profit",
                  wx."Partner B Profit",
                  wx."30D Principal Reduction Days",
                  wx."Amount Received",
                  is_principal_writeoff(wx."Row ID", wx."Ref Payment", wx."Principal Paid"::numeric, wx."Interest Paid"::numeric, wx."Ref Charges", wc.principal, wc.interest, wc.repayments) AS loss_pair
                 FROM olap_repayments_analytics wx
                   LEFT JOIN LATERAL ( SELECT c."Principal Due"::numeric AS principal,
                          c."Interest Due"::numeric AS interest,
                          ( SELECT count(*) AS count
                                 FROM "Repayments" n
                                WHERE n."Ref Charges" = c."Row ID") AS repayments
                         FROM "Charges" c
                        WHERE c."Row ID" = wx."Ref Charges" AND wx."Ref Payment" IS NULL AND wx."Principal Paid"::numeric > 0::numeric AND wx."Interest Paid"::numeric = (- wx."Principal Paid"::numeric)) wc ON true) repayments
        WHERE repayments."Payment Date" <= olap_reporting_date()
      UNION ALL
       SELECT 'expense:'::text || "Business Expenses"."Row ID" AS "Event ID",
          "Business Expenses"."Expense Date" AS "Date",
          0::numeric AS "Income",
          "Business Expenses"."Amount"::numeric AS "Expenses",
          0::numeric AS "Principal Write-offs"
         FROM "Business Expenses"
        WHERE "Business Expenses"."Expense Date" <= olap_reporting_date();
