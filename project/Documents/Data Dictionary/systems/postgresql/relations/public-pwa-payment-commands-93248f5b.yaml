    "pwa_versioned_envelope":
      "schema": "public"
      "relation": "pwa_payment_commands"
      "name": "pwa_versioned_envelope"
      "kind": "c"
      "definition": |-
        CHECK ((jsonb_typeof(canonical_json::jsonb) = 'object'::text AND (canonical_json::jsonb ->> 'contractVersion'::text) = contract_version::text AND
        CASE
            WHEN contract_version = 1 THEN canonical_json::jsonb #>> '{command,requestId}'::text[]
            ELSE canonical_json::jsonb ->> 'requestId'::text
        END = request_id::text AND (canonical_json::jsonb #>> '{actor,issuer}'::text[]) = actor_issuer AND (canonical_json::jsonb #>> '{actor,subject}'::text[]) = actor_subject AND (canonical_json::jsonb #>> '{actor,partnerId}'::text[]) = actor_partner_id AND (canonical_json::jsonb #>> '{actor,loginEmail}'::text[]) = actor_login_email) IS TRUE)
      "deferrable": false
      "initially_deferred": false
      "validated": true
      "column_numbers":
      - 7
      - 2
      - 1
      - 3
      - 4
      - 5
      - 6
      "referenced_column_numbers": null
      "referenced_relation": null
      "update_action": " "
      "delete_action": " "
      "match_type": " "
      "comment": null
    "pwa_versioned_outcome":
      "schema": "public"
      "relation": "pwa_payment_commands"
      "name": "pwa_versioned_outcome"
      "kind": "c"
      "definition": "CHECK ((contract_version = 1 AND result_json IS NULL AND (outcome = 'posted'::text AND payment_id = ('pwa:'::text\
        \ || request_id::text) AND rejection_code IS NULL OR outcome = 'rejected'::text AND payment_id IS NULL AND (rejection_code\
        \ = ANY (ARRAY['invalid_date'::text, 'borrower_unavailable'::text, 'account_unavailable'::text, 'selection_unavailable'::text])))\
        \ OR contract_version = 2 AND payment_id IS NULL AND (outcome = 'applied'::text AND rejection_code IS NULL AND jsonb_typeof(result_json)\
        \ = 'object'::text AND octet_length(result_json::text) <= 524288 AND result_json ?& ARRAY['operation'::text, 'targetType'::text,\
        \ 'targetId'::text, 'paymentId'::text, 'plan'::text, 'predecessorRequestId'::text] AND (result_json - ARRAY['operation'::text,\
        \ 'targetType'::text, 'targetId'::text, 'paymentId'::text, 'plan'::text, 'predecessorRequestId'::text, 'sourceCreatedBy'::text])\
        \ = '{}'::jsonb AND (NOT result_json ? 'sourceCreatedBy'::text OR (jsonb_typeof(result_json -> 'sourceCreatedBy'::text)\
        \ = ANY (ARRAY['string'::text, 'null'::text]))) AND (result_json ->> 'operation'::text) = (canonical_json::jsonb #>>\
        \ '{command,operation}'::text[]) AND (result_json ->> 'targetType'::text) = (canonical_json::jsonb #>> '{command,targetType}'::text[])\
        \ AND (result_json ->> 'targetId'::text) = (canonical_json::jsonb #>> '{command,targetId}'::text[]) OR outcome = 'rejected'::text\
        \ AND result_json IS NULL AND (rejection_code = ANY (ARRAY['source_conflict'::text, 'not_found'::text, 'invalid_reference'::text,\
        \ 'borrower_name_exists'::text, 'dependency_conflict'::text, 'insufficient_funds'::text, 'plan_changed'::text, 'invalid_date'::text,\
        \ 'account_unavailable'::text, 'record_requires_reconciliation'::text])))) IS TRUE)"
      "deferrable": false
      "initially_deferred": false
      "validated": true
