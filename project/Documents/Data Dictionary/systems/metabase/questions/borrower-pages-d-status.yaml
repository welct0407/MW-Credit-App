    "key": "d-status",
    "id": 300,
    "name": "Activity dates & lifetime context",
    "description": "R035 additive borrower pages. Immutable borrower keys; Bangkok dates; current health from V41/V42. Signed receipts. No AppSheet/financial writes.",
    "display": "table",
    "type": "question",
    "dataset_query": {
      "stages": [
        {
          "template-tags": [
            {
              "widget-type": "date/all-options",
              "id": "bp-period",
              "name": "period",
              "display-name": "Activity period",
              "type": "dimension",
              "dimension": [
                "field",
                {
                  "base-type": "type/Date",
                  "lib/uuid": "ff66c66c-e3c0-4573-babe-f708b9fa6f20",
                  "effective-type": "type/Date"
                },
                82
              ],
              "alias": "d.\"Date\""
            },
            {
              "display-name": "Borrower",
              "id": "bp-borrower",
              "name": "borrower_id",
              "type": "text"
            }
          ],
          "lib/type": "mbql.stage/native",
          "native": "WITH clock AS (SELECT public.olap_reporting_date() today), selected AS (SELECT d.\"Date\" FROM (SELECT generate_series(DATE '1900-01-01',DATE '2199-12-31',interval '1 day')::date \"Date\") d WHERE [[{{period}} --]] d.\"Date\" BETWEEN (SELECT today-30 FROM clock) AND (SELECT today-1 FROM clock)\n), bounds AS (SELECT min(\"Date\") starts,max(\"Date\") ends,count(*) days,count(*)>0 AND count(*)=max(\"Date\")-min(\"Date\")+1 AND max(\"Date\")<=(SELECT today FROM clock) valid FROM selected), chosen AS (SELECT * FROM public.reporting_borrower_directory_v1 WHERE borrower_id= [[{{borrower_id}} --]] '__select_borrower__'\n), activity AS (SELECT a.* FROM public.reporting_borrower_activity_daily_v1 a JOIN chosen c USING(borrower_id) CROSS JOIN bounds b WHERE b.valid AND a.activity_date BETWEEN b.starts AND b.ends) SELECT b.starts::text||' → '||b.ends::text AS \"Activity dates\",CASE WHEN NOT b.valid THEN 'Choose one continuous range ending today or earlier' WHEN c.invalid_fact_count>0 THEN 'Incomplete source facts' WHEN b.ends=(SELECT today FROM clock) THEN 'Today provisional · live on refresh' ELSE 'Live on refresh' END AS \"Status\",c.lifetime_interest AS \"Lifetime interest ฿\",c.loan_count AS \"Lifetime loans\",h.default_count AS \"Recorded defaults\",h.recorded_default_loss AS \"Recorded loss ฿\",to_char(CURRENT_TIMESTAMP AT TIME ZONE 'Asia/Bangkok','YYYY-MM-DD HH24:MI') AS \"Queried at\" FROM chosen c CROSS JOIN bounds b LEFT JOIN public.reporting_borrower_payment_health_v1 h USING(borrower_id)"
        }
      ],
      "lib/type": "mbql/query",
      "database": 2
    },
