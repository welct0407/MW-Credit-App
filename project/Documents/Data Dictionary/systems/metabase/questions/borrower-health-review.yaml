  "name": "Unavailable ratings & default context · all borrowers"
  "description": "R028 automatic schedule categories. Payment score unchanged; auto-off plus <80% interest amount OR charge-date\
    \ coverage, >=7 observed days and >=2 due dates, restricts upper categories. Current 30 completed Bangkok days; no manual\
    \ confirmations."
  "display": "table"
  "dataset_query":
    "lib/type": "mbql/query"
    "stages":
    - "lib/type": "mbql.stage/native"
      "native": "SELECT b.\"Row ID\" AS \"Borrower ID\",b.\"Description\" AS \"Borrower\",h.has_active_loan AS \"Active loan\"\
        ,h.rating_status AS \"Status\",h.data_quality_status AS \"Data quality\",h.default_count AS \"Default count\",h.recorded_default_loss\
        \ AS \"Recorded loss ฿\",h.overdue_amount AS \"Overdue ฿\",h.reason_text AS \"Reason\" FROM public.reporting_borrower_payment_health_v1\
        \ h JOIN public.olap_borrowers_analytics b ON b.\"Row ID\"=h.borrower_id WHERE h.rating_status<>'Rated' ORDER BY h.borrower_id"
    "database": 2
