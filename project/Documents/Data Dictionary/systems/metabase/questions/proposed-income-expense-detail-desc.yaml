  "key": "income.expense-detail-desc"
  "id": 420
  "name": "Expense detail · newest first"
  "description": "Loan Reports · proposed (income.expense-detail-desc). Question 212's query ordered by Expense Date DESC,\
    \ Expense ID DESC. Template tags, column formats and the column set (Expense ID hidden) copied; maps `statement-period`\
    \ as 212 maps review-income. Basis: snippet 2 Income statement period (same query as question 212)."
  "display": "table"
  "dataset_query":
    "stages":
    - "template-tags":
      - "alias": "d.\"Date\""
        "widget-type": "date/all-options"
        "id": "r016-statement_period"
        "name": "statement_period"
        "display-name": "Statement period"
        "type": "dimension"
        "dimension":
        - "field"
        - "base-type": "type/Date"
          "lib/uuid": "8b260182-8cc5-407b-ab3f-1d551af8a791"
          "effective-type": "type/Date"
        - 82
      - "display-name": "Model 186"
        "type": "card"
        "id": "r016-model-186"
        "name": "#186"
        "card-id": 186
      - "type": "snippet"
        "snippet-id": 2
        "id": "r016-snippet-2"
        "name": "snippet: Income statement period"
        "display-name": "Income statement period"
        "snippet-name": "Income statement period"
      - "display-name": "Model 163"
        "type": "card"
        "id": "r016-model-163"
        "name": "#163"
        "card-id": 163
      "lib/type": "mbql.stage/native"
      "native": "WITH statement AS ({{snippet: Income statement period}}) SELECT e.\"Expense Date\",e.\"Expense Category\"\
        ,b.\"Payee Name\" AS \"Payee\",h.\"Cash Holder\" AS \"Paid By\",e.\"Expense Amount\" AS \"Expenses\",b.\"Notes\",e.\"\
        Expense ID\" FROM statement s JOIN {{#163}} e ON e.\"Expense Date\" BETWEEN s.\"Period Start\" AND s.\"Period End\"\
        \ LEFT JOIN public.\"Business Expenses\" b ON b.\"Row ID\"=e.\"Expense ID\" LEFT JOIN (SELECT DISTINCT \"Cash Holder\
        \ ID\",\"Cash Holder\" FROM public.reporting_cash_accounts) h ON h.\"Cash Holder ID\"=b.\"Ref Paid By Cash Holder\"\
        \ WHERE s.\"Continuous Period\" ORDER BY e.\"Expense Date\" DESC,e.\"Expense ID\" DESC"
    "lib/type": "mbql/query"
    "database": 2
