    "name": "Forecast coverage & exceptions",
    "display": "table",
    "dataset_query": {
      "database": 2,
      "type": "native",
      "native": {
        "query": "WITH args AS (SELECT coalesce([[{{ci}},]]100)::numeric ci,coalesce([[{{cp}},]]100)::numeric cp,coalesce([[{{rr}},]]0)::numeric rr,coalesce([[{{scenario}},]]'Planning')::text scenario,coalesce([[{{kind}},]]'All')::text kind,coalesce([[{{target}},]]NULL)::numeric target), loans AS MATERIALIZED (SELECT l.* FROM {{#344}} l,args a WHERE a.kind='All' OR l.loan_type=a.kind),\n actual AS (SELECT coalesce(sum(interest),0) a,coalesce(bool_or(invalid),false) invalid FROM {{#345}} l,args a WHERE a.kind='All' OR l.loan_type=a.kind),\n sums AS (SELECT coalesce(sum(ui),0) ui,coalesce(sum(up),0) up,coalesce(sum(oi),0) oi,coalesce(sum(op),0) op,coalesce(bool_or(incomplete),false) incomplete FROM loans),\n s AS (SELECT a.*,v.a actual,r.remaining_interest ri,r.remaining_principal rp,NOT (q.incomplete OR v.invalid OR c.invalid_receipts>0 OR c.orphan_charges>0) ready,c.reporting_date,c.calculated_at,c.current_cash,c.cash_status FROM args a CROSS JOIN sums q CROSS JOIN actual v CROSS JOIN {{#347}} c CROSS JOIN LATERAL public.forecast_scenario_v1(q.ui,q.up,q.oi,q.op,a.ci,a.cp,a.rr,a.scenario) r) SELECT label AS \"Coverage\",value AS \"Value\" FROM s CROSS JOIN LATERAL (VALUES\n (1,'Active loans',(SELECT count(*)::text FROM loans WHERE loan_status='ยังไม่ปิดยอด')),\n (2,'Active loans without source exceptions',(SELECT count(*)::text FROM loans WHERE loan_status='ยังไม่ปิดยอด' AND NOT incomplete)),\n (3,'Source-review loans',(SELECT count(*)::text FROM loans WHERE incomplete)),\n (4,'Recorded-plan-only loans',(SELECT count(*)::text FROM loans WHERE issues LIKE '%Manual schedule%')),\n (5,'Recovery-only principal + interest',(SELECT round(coalesce(sum(xi+xp),0),0)::text FROM loans)),\n (6,'Complete active principal coverage %',(SELECT round(100*sum(greatest(outstanding_principal,0)) FILTER(WHERE NOT incomplete)/nullif(sum(greatest(outstanding_principal,0)),0),1)::text FROM loans WHERE loan_status='ยังไม่ปิดยอด')),\n (7,'Invalid receipts / orphan charges',(SELECT invalid_receipts::text||' / '||orphan_charges::text FROM {{#347}})),\n (8,'Headline state',CASE WHEN ready THEN 'Known scheduled outlook' ELSE 'Incomplete: inspect watchlist' END)) v(ord,label,value) ORDER BY ord",
        "template-tags": {
