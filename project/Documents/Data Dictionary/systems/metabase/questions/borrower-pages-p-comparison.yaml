"content":
  "key": "p-comparison"
  "id": 289
  "name": "Borrower comparison · click a name for Detail"
  "description": "R035 additive borrower pages. Immutable borrower keys; Bangkok dates; current health from V41/V42. Signed\
    \ receipts. No AppSheet/financial writes."
  "display": "table"
  "type": "question"
  "dataset_query":
    "stages":
    - "template-tags":
      - "widget-type": "date/all-options"
        "id": "bp-period"
        "name": "period"
        "display-name": "Activity period"
        "type": "dimension"
        "dimension":
        - "field"
        - "base-type": "type/Date"
          "lib/uuid": "3f7c95cd-c161-4723-91e7-4204997273fe"
          "effective-type": "type/Date"
        - 82
        "alias": "d.\"Date\""
      - "type": "text"
        "id": "bp-population"
        "name": "population"
        "display-name": "Population"
        "default": "All with loan history"
      "lib/type": "mbql.stage/native"
      "native": |-
        WITH clock AS (SELECT public.olap_reporting_date() today), selected AS (SELECT d."Date" FROM (SELECT generate_series(DATE '1900-01-01',DATE '2199-12-31',interval '1 day')::date "Date") d WHERE [[{{period}} --]] d."Date" BETWEEN (SELECT today-30 FROM clock) AND (SELECT today-1 FROM clock)
        ), bounds AS (SELECT min("Date") starts,max("Date") ends,count(*) days,count(*)>0 AND count(*)=max("Date")-min("Date")+1 AND max("Date")<=(SELECT today FROM clock) valid FROM selected), cohort AS (SELECT p.* FROM bounds b CROSS JOIN LATERAL public.reporting_borrower_period_v1(b.starts,b.ends,[[{{population}} --]] 'All with loan history'
        ) p WHERE b.valid) SELECT c.borrower_label AS "Borrower",c.active_loans AS "Active loans",c.outstanding_principal AS "Principal ฿",c.principal_share AS "Principal share",c.interest_received AS "Interest ฿",c.principal_issued AS "Principal issued ฿",c.loans_issued AS "Loans issued",coalesce(h.current_health_status,'Unavailable') AS "Current health",c.principal_returned AS "Principal returned ฿",c.loan_count AS "Lifetime loans",c.last_payment_date AS "Last payment",c.borrower_id AS "Borrower ID",b.starts::text AS "Period start",b.ends::text AS "Period end" FROM cohort c LEFT JOIN public.reporting_borrower_payment_health_v1 h USING(borrower_id) CROSS JOIN bounds b ORDER BY c.principal_rank
    "lib/type": "mbql/query"
    "database": 2
