    "dataset_query": {
      "database": 2,
      "type": "native",
      "native": {
        "query": "WITH args AS (SELECT coalesce([[{{ci}},]]100)::numeric ci,coalesce([[{{cp}},]]100)::numeric cp,coalesce([[{{rr}},]]0)::numeric rr,coalesce([[{{scenario}},]]'Planning')::text scenario,coalesce([[{{kind}},]]'All')::text kind,coalesce([[{{target}},]]NULL)::numeric target) SELECT borrower AS \"Borrower\",borrower_id AS \"Borrower ID\",loan_id AS \"Loan reference\",due_date AS \"Due date\",origin AS \"Origin\",bucket AS \"Bucket\",interest AS \"Interest ฿\",principal AS \"Principal ฿\",issue AS \"Issue\" FROM {{#346}} ev,args a WHERE (a.kind='All' OR ev.loan_type=a.kind) ORDER BY due_date,loan_id,origin",
        "template-tags": {
          "ci": {
            "id": "fp-ci",
            "name": "ci",
            "display-name": "Interest collected %",
            "type": "number",
            "default": 100
          },
          "cp": {
            "id": "fp-cp",
            "name": "cp",
            "display-name": "Principal collected %",
            "type": "number",
            "default": 100
          },
          "rr": {
            "id": "fp-rr",
            "name": "rr",
            "display-name": "Overdue recovered %",
            "type": "number",
            "default": 0
          },
          "scenario": {
            "id": "fp-scenario",
            "name": "scenario",
            "display-name": "Forecast scenario",
            "type": "text",
            "default": "Planning"
          },
          "kind": {
            "id": "fp-kind",
            "name": "kind",
            "display-name": "Forecast loan type",
            "type": "text",
            "default": "All"
          },
          "target": {
            "id": "fp-target",
            "name": "target",
            "display-name": "Interest target ฿",
            "type": "number"
          },
          "#346": {
            "id": "fp-model-346",
            "name": "#346",
            "display-name": "Forecast source 346",
            "type": "card",
            "card-id": 346
          }
        }
