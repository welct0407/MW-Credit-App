"content":
  "key": "profit"
  "id": 312
  "name": "Borrowers 30 Days Profit Contribution"
  "description": "R037. Overall borrower economics; population filter applies, activity date slicer does not. Lifetime rate\
    \ uses completed Bangkok days and end-of-day outstanding principal. Gross interest before expenses. See chart context\
    \ and handover."
  "type": "question"
  "display": "pie"
  "dataset_query":
    "stages":
    - "template-tags":
      - "type": "text"
        "id": "r037-pop"
        "name": "population"
        "display-name": "Population"
        "default": "All with loan history"
      - "type": "card"
        "id": "r037-model"
        "name": "#310"
        "display-name": "Borrower lifetime economics"
        "card-id": 310
      "lib/type": "mbql.stage/native"
      "native": |-
        WITH cohort AS (SELECT * FROM {{#310}} m WHERE ([[{{population}} --]] 'All with loan history'
        ='All with loan history' OR [[{{population}} --]] 'All with loan history'
        ='Currently active' AND "Has active loan" OR [[{{population}} --]] 'All with loan history'
        ='Currently inactive' AND NOT "Has active loan")), ranked AS (SELECT *,row_number() OVER(ORDER BY "Interest 30D" DESC,"Borrower ID") rank FROM cohort WHERE "Interest 30D">0 AND NOT EXISTS(SELECT 1 FROM cohort WHERE "Interest 30D" IS NULL)), grouped AS (SELECT CASE WHEN rank<=9 THEN "Borrower" ELSE 'Others' END label,CASE WHEN rank<=9 THEN "Borrower ID" END id,sum("Interest 30D") amount,min(rank) rank FROM ranked GROUP BY 1,2) SELECT label AS "Borrower",amount AS "Amount ฿",id AS "Borrower ID" FROM grouped ORDER BY rank
    "lib/type": "mbql/query"
    "database": 2
  "visualization_settings":
    "pie.slice_threshold": 0
    "pie.percent_visibility": "inside"
    "pie.dimension": "Borrower"
    "pie.show_labels": false
