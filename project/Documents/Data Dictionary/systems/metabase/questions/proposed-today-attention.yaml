"content":
  "key": "today.attention"
  "id": 389
  "name": "Needs attention · strip"
  "description": "Loan Reports · proposed (today.attention). One row per attention item with people and baht: \U0001F7E3 Overdue\
    \ (count from model 162 as question 240, amount as question 254), \U0001F534 Not paid (model 162 count as 242, amount\
    \ left), \U0001F7E0 Partially paid (model 162 as 244, amount left), Modified plans (question 270). Columns Item, People,\
    \ Amount ฿, Opens, Tab and Tint (both hidden; Tint drives an even row tint). The installer substitutes __TAB_COLLECTION__\
    \ and __TAB_HEALTH__ with the proposed tab ids and sets the Item column click behaviour to the link template https://reports.mw-credit.com/dashboard/<dashboard>?tab={{Tab}}.\
    \ Replaces six chips with one card. Basis: models 162 Collection Status Summary and 77 Collection Worklist; views of questions\
    \ 254 and 270."
  "display": "table"
  "dataset_query":
    "stages":
    - "template-tags":
      - "type": "card"
        "id": "lrp-model-162"
        "name": "#162"
        "display-name": "Model 162"
        "card-id": 162
      "lib/type": "mbql.stage/native"
      "native": |-
        WITH s AS (SELECT "Collection Status" status,"Borrower Count" people,"Amount Remaining" remaining FROM {{#162}})
        SELECT v."Item",v."People",v."Amount ฿",v."Opens",v."Tab",v."Tint" FROM (VALUES
         (1,'🟣 Overdue',coalesce((SELECT people FROM s WHERE status='Overdue'),0)::bigint,(SELECT CASE WHEN bool_and(overdue_amount IS NOT NULL) THEN sum(overdue_amount) END FROM public.reporting_borrower_payment_health_v1)::numeric,'Collection','383','overdue'),
         (2,'🔴 Not paid',coalesce((SELECT people FROM s WHERE status='Not Paid'),0)::bigint,(SELECT remaining FROM s WHERE status='Not Paid')::numeric,'Collection','383','not_paid'),
         (3,'🟠 Partially paid',coalesce((SELECT people FROM s WHERE status='Partially Paid'),0)::bigint,(SELECT remaining FROM s WHERE status='Partially Paid')::numeric,'Collection','383','partial'),
         (4,'Modified plans',(SELECT count(*) FROM public.reporting_borrower_matrix_v3 WHERE arrangement_gate)::bigint,NULL::numeric,'Health','381','')
        ) v(ord,"Item","People","Amount ฿","Opens","Tab","Tint") ORDER BY v.ord
    "lib/type": "mbql/query"
    "database": 2
