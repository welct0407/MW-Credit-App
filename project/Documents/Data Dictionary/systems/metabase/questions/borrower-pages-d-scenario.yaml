    "key": "d-scenario",
    "id": 309,
    "name": "Additional lending · hypothetical only",
    "description": "R035 additive borrower pages. Immutable borrower keys; Bangkok dates; current health from V41/V42. Signed receipts. No AppSheet/financial writes.",
    "display": "table",
    "type": "question",
    "dataset_query": {
      "stages": [
        {
          "template-tags": [
            {
              "display-name": "Borrower",
              "id": "bp-borrower",
              "name": "borrower_id",
              "type": "text"
            },
            {
              "type": "number",
              "id": "bp-amount",
              "name": "amount",
              "display-name": "Additional principal",
              "default": 0
            }
          ],
          "lib/type": "mbql.stage/native",
          "native": "WITH clock AS (SELECT public.olap_reporting_date() today), chosen AS (SELECT * FROM public.reporting_borrower_directory_v1 WHERE borrower_id= [[{{borrower_id}} --]] '__select_borrower__'\n), input AS (SELECT [[{{amount}} --]] 0\n AS amount), total AS (SELECT CASE WHEN bool_and(outstanding_principal IS NOT NULL) THEN sum(outstanding_principal) END principal FROM public.reporting_borrower_directory_v1 WHERE loan_count>0)\n SELECT CASE WHEN i.amount<0 OR i.amount::text IN ('NaN','Infinity','-Infinity') THEN 'Enter a nonnegative finite amount' ELSE 'Scenario only · no loan saved' END AS \"Status\",c.outstanding_principal AS \"Current principal ฿\",CASE WHEN i.amount>=0 AND i.amount::text NOT IN ('NaN','Infinity','-Infinity') THEN c.outstanding_principal+i.amount END AS \"Proposed principal ฿\",CASE WHEN t.principal>0 THEN c.outstanding_principal/t.principal END AS \"Current share\",CASE WHEN i.amount>=0 AND i.amount::text NOT IN ('NaN','Infinity','-Infinity') AND t.principal+i.amount>0 THEN (c.outstanding_principal+i.amount)/(t.principal+i.amount) END AS \"Proposed share\" FROM chosen c CROSS JOIN input i CROSS JOIN total t"
        }
      ],
      "lib/type": "mbql/query",
      "database": 2
    },
