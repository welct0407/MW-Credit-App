  "key": "schedule-loans"
  "id": 272
  "name": "Modified schedules · loan and next-plan detail"
  "description": "R028 automatic schedule assessment. Counterfactual current setup, not extra debt. No manual inputs. Current\
    \ completed-day window; unsupported sources explicitly unassessed."
  "display": "table"
  "dataset_query":
    "lib/type": "mbql/query"
    "stages":
    - "lib/type": "mbql.stage/native"
      "native": "SELECT b.\"Row ID\" AS \"Borrower ID\",b.\"Description\" AS \"Borrower\",s.start_date AS \"Loan date\",s.payment_interval\
        \ AS \"Normal interval days\",s.daily_interest AS \"Daily interest ฿\",s.comparison_start AS \"Compared from\",s.expected_interest_30d\
        \ AS \"Expected interest ฿\",s.recorded_interest_30d AS \"Recorded interest ฿\",s.expected_due_dates_30d AS \"Expected\
        \ dates\",s.recorded_interest_dates_30d AS \"Recorded dates\",s.schedule_reason AS \"Rule reason\",s.next_plan_due_date\
        \ AS \"Next plan due\",s.next_plan_interest AS \"Next interest ฿\",s.next_plan_principal AS \"Next principal ฿\" FROM\
        \ public.reporting_loan_schedule_health_v1 s JOIN public.olap_borrowers_analytics b ON b.\"Row ID\"=s.borrower_id\
        \ WHERE s.modified_schedule ORDER BY b.\"Description\",s.start_date,s.loan_id"
    "database": 2
