  "content": {
    "key": "p-issued",
    "id": 282,
    "name": "Principal issued ฿",
    "description": "R035 additive borrower pages. Immutable borrower keys; Bangkok dates; current health from V41/V42. Signed receipts. No AppSheet/financial writes.",
    "display": "scalar",
    "type": "question",
    "dataset_query": {
      "stages": [
        {
          "template-tags": [
            {
              "widget-type": "date/all-options",
              "id": "bp-period",
              "name": "period",
              "display-name": "Activity period",
              "type": "dimension",
              "dimension": [
                "field",
                {
                  "base-type": "type/Date",
                  "lib/uuid": "2a32f65f-2817-40e4-a636-026900220727",
                  "effective-type": "type/Date"
                },
                82
              ],
              "alias": "d.\"Date\""
            },
            {
              "type": "text",
              "id": "bp-population",
              "name": "population",
              "display-name": "Population",
              "default": "All with loan history"
            }
          ],
          "lib/type": "mbql.stage/native",
          "native": "WITH clock AS (SELECT public.olap_reporting_date() today), selected AS (SELECT d.\"Date\" FROM (SELECT generate_series(DATE '1900-01-01',DATE '2199-12-31',interval '1 day')::date \"Date\") d WHERE [[{{period}} --]] d.\"Date\" BETWEEN (SELECT today-30 FROM clock) AND (SELECT today-1 FROM clock)\n), bounds AS (SELECT min(\"Date\") starts,max(\"Date\") ends,count(*) days,count(*)>0 AND count(*)=max(\"Date\")-min(\"Date\")+1 AND max(\"Date\")<=(SELECT today FROM clock) valid FROM selected), cohort AS (SELECT p.* FROM bounds b CROSS JOIN LATERAL public.reporting_borrower_period_v1(b.starts,b.ends,[[{{population}} --]] 'All with loan history'\n) p WHERE b.valid) SELECT CASE WHEN (SELECT valid FROM bounds) THEN CASE WHEN count(*)=0 THEN 0 WHEN bool_and(principal_issued IS NOT NULL) THEN sum(principal_issued) END END AS \"Principal issued ฿\" FROM cohort"
        }
      ],
      "lib/type": "mbql/query",
      "database": 2
    },
    "visualization_settings": {
      "scalar.field": "Principal issued ฿",
      "column_settings": {
        "[\"name\",\"Principal issued ฿\"]": {
          "number_style": "decimal",
          "decimals": 0,
          "number_separators": ".,",
          "compact": false
        }
      }
    },
