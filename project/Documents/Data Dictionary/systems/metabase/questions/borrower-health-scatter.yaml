    "dataset_query": {
      "stages": [
        {
          "lib/type": "mbql.stage/native",
          "native": "SELECT b.\"Description\"||' · '||m.quadrant||CASE WHEN m.arrangement_gate THEN ' · Modified schedule' ELSE '' END AS \"Borrower · category\",m.relative_contribution AS \"Contribution ×\",m.reliability_score AS \"Reliability /100\",m.outstanding_principal AS \"Principal ฿\" FROM public.reporting_borrower_matrix_v3 m JOIN public.reporting_borrower_payment_health_v1 h USING(borrower_id) JOIN public.olap_borrowers_analytics b ON b.\"Row ID\"=m.borrower_id WHERE m.quadrant<>'Unclassified' ORDER BY m.borrower_id"
        }
      ],
