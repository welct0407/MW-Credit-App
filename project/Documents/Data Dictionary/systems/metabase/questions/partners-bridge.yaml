          "lib/type": "mbql.stage/native",
          "native": "WITH totals AS (SELECT CASE WHEN count(*)=0 THEN 0 WHEN bool_and(interest_earned IS NOT NULL) THEN sum(interest_earned) END g,CASE WHEN count(*)=0 THEN 0 WHEN bool_and(expenses IS NOT NULL) THEN sum(expenses) END x,CASE WHEN count(*)=0 THEN 0 WHEN bool_and(net_earned IS NOT NULL) THEN sum(net_earned) END n,CASE WHEN count(*)=0 THEN 0 WHEN bool_and(completed IS NOT NULL) THEN sum(completed) END c,CASE WHEN count(*)=0 THEN 0 WHEN bool_and(pending IS NOT NULL) THEN sum(pending) END p,CASE WHEN count(*)=0 THEN 0 WHEN bool_and(other_reserved IS NOT NULL) THEN sum(other_reserved) END o,CASE WHEN count(*)=0 THEN 0 WHEN bool_and(available IS NOT NULL) THEN sum(available) END a FROM {{#318}} d WHERE true [[AND {{partner}}]])\n SELECT v.label AS \"Entitlement bridge\",v.amount AS \"Amount ฿\" FROM totals t CROSS JOIN LATERAL (VALUES\n (1,'Allocated interest',g),(2,'Less allocated expenses',-x),(3,'Net earned',n),(4,'Less completed payouts',-c),(5,'Less pending reservations',-p),(6,'Less other reservations',-o),(7,'Net available to settle',a)) v(ord,label,amount) WHERE v.ord<>6 OR o<>0 ORDER BY v.ord"
        }
