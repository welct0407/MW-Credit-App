"content":
  "key": "today.principal-top4"
  "id": 390
  "name": "Principal by borrower · top four + others"
  "description": "Loan Reports · proposed (today.principal-top4). Native on model 72: borrowers with Principal Rank ≤ 4 named,\
    \ the rest summed as \"Others (n)\" (n counts borrowers with principal above zero). Same total as question 60, four bars\
    \ instead of ten. Basis: model 72 Borrower Performance."
  "display": "row"
  "dataset_query":
    "stages":
    - "template-tags":
      - "type": "card"
        "id": "lrp-model-72"
        "name": "#72"
        "display-name": "Model 72"
        "card-id": 72
      "lib/type": "mbql.stage/native"
      "native": |-
        WITH r AS (SELECT "Borrower","Outstanding Principal" amount,"Principal Rank" rank FROM {{#72}})
        SELECT CASE WHEN rank<=4 THEN "Borrower" ELSE 'Others ('||(SELECT count(*) FROM r WHERE rank>4 AND amount>0)||')' END AS "Borrower",sum(amount) AS "Amount ฿",min(rank) AS "Order" FROM r GROUP BY 1 ORDER BY 3
    "lib/type": "mbql/query"
    "database": 2
  "visualization_settings":
    "graph.show_values": true
    "graph.show_legend": false
    "graph.x_axis.title_enabled": false
    "graph.y_axis.title_enabled": false
    "graph.metrics":
    - "Amount ฿"
    "graph.label_value_formatting": "full"
    "graph.colors":
    - "#178F8A"
    "column_settings":
      "[\"name\",\"Amount ฿\"]":
        "number_style": "decimal"
        "decimals": 0
        "number_separators": ".,"
        "compact": false
    "series_settings":
      "Amount ฿":
        "color": "#178F8A"
    "graph.max_categories_enabled": false
    "graph.dimensions":
    - "Borrower"
  "basis": "model 72 Borrower Performance"
  "build_kind": "native"
