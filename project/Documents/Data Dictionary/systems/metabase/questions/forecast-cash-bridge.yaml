    "id": 368,
    "key": "cash-bridge",
    "name": "Month-end cash bridge",
    "display": "table",
    "dataset_query": {
      "database": 2,
      "type": "native",
      "native": {
        "query": "WITH args AS (SELECT coalesce([[{{ci}},]]100)::numeric ci,coalesce([[{{cp}},]]100)::numeric cp,coalesce([[{{rr}},]]0)::numeric rr,coalesce([[{{scenario}},]]'Planning')::text scenario,coalesce([[{{kind}},]]'All')::text kind,coalesce([[{{target}},]]NULL)::numeric target), loans AS MATERIALIZED (SELECT l.* FROM {{#344}} l,args a WHERE a.kind='All' OR l.loan_type=a.kind),\n actual AS (SELECT coalesce(sum(interest),0) a,coalesce(bool_or(invalid),false) invalid FROM {{#345}} l,args a WHERE a.kind='All' OR l.loan_type=a.kind),\n sums AS (SELECT coalesce(sum(ui),0) ui,coalesce(sum(up),0) up,coalesce(sum(oi),0) oi,coalesce(sum(op),0) op,coalesce(bool_or(incomplete),false) incomplete FROM loans),\n s AS (SELECT a.*,v.a actual,r.remaining_interest ri,r.remaining_principal rp,NOT (q.incomplete OR v.invalid OR c.invalid_receipts>0 OR c.orphan_charges>0) ready,c.reporting_date,c.calculated_at,c.current_cash,c.cash_status FROM args a CROSS JOIN sums q CROSS JOIN actual v CROSS JOIN {{#347}} c CROSS JOIN LATERAL public.forecast_scenario_v1(q.ui,q.up,q.oi,q.op,a.ci,a.cp,a.rr,a.scenario) r), all_totals AS (SELECT coalesce(sum(ui),0) ui,coalesce(sum(up),0) up,coalesce(sum(oi),0) oi,coalesce(sum(op),0) op,coalesce(bool_or(incomplete),false) incomplete FROM {{#344}}),\n plan AS (SELECT coalesce([[{{lending}},]]NULL)::numeric lending,coalesce([[{{expenses}},]]NULL)::numeric expenses,coalesce([[{{withdrawals}},]]NULL)::numeric withdrawals,coalesce([[{{inflows}},]]NULL)::numeric inflows,coalesce([[{{reserve}},]]NULL)::numeric reserve),\n funding AS (SELECT s.*,p.*,f.remaining_interest all_interest,f.remaining_principal all_principal,\n s.current_cash+f.remaining_interest+f.remaining_principal+inflows-lending-expenses-withdrawals closing,\n (s.current_cash IS NOT NULL AND NOT q.incomplete AND c.invalid_receipts=0 AND c.orphan_charges=0 AND lending>=0 AND expenses>=0 AND withdrawals>=0 AND inflows>=0 AND reserve>=0 AND NOT ('NaN'=ANY(ARRAY[lending::text,expenses::text,withdrawals::text,inflows::text,reserve::text]))) valid\n FROM s CROSS JOIN plan p CROSS JOIN all_totals q CROSS JOIN {{#347}} c CROSS JOIN LATERAL public.forecast_scenario_v1(q.ui,q.up,q.oi,q.op,s.ci,s.cp,s.rr,s.scenario) f) SELECT label AS \"Component\",amount AS \"Amount ฿\" FROM funding CROSS JOIN LATERAL (VALUES\n (1,'Current business cash',current_cash),(2,'Remaining interest',CASE WHEN valid THEN all_interest END),(3,'Remaining principal',CASE WHEN valid THEN all_principal END),(4,'External inflows',CASE WHEN valid THEN inflows END),(5,'New lending',CASE WHEN valid THEN -lending END),(6,'Cash expenses',CASE WHEN valid THEN -expenses END),(7,'Payouts / withdrawals',CASE WHEN valid THEN -withdrawals END),(8,'Projected month-end cash',CASE WHEN valid THEN closing END),(9,'Desired reserve',reserve),(10,'Cash above reserve',CASE WHEN valid THEN closing-reserve END)) v(ord,label,amount) ORDER BY ord",
        "template-tags": {
