          "lib/type": "mbql.stage/native",
          "native": "WITH clock AS (SELECT public.olap_reporting_date() today), cohort AS (SELECT * FROM public.reporting_borrower_directory_v1 WHERE loan_count>0 AND ([[{{population}} --]] 'All with loan history'\n='All with loan history' OR [[{{population}} --]] 'All with loan history'\n='Currently active' AND has_active_loan OR [[{{population}} --]] 'All with loan history'\n='Currently inactive' AND NOT has_active_loan)) SELECT count(*) FILTER(WHERE has_active_loan) AS \"Active borrowers\" FROM cohort"
