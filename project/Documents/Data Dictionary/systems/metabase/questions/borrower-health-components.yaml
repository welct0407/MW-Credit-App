  "id": 268
  "name": "Reliability components & effective weights · active borrowers"
  "description": "R028 automatic schedule categories. Payment score unchanged; auto-off plus <80% interest amount OR charge-date\
    \ coverage, >=7 observed days and >=2 due dates, restricts upper categories. Current 30 completed Bangkok days; no manual\
    \ confirmations."
  "display": "table"
  "dataset_query":
    "lib/type": "mbql/query"
    "stages":
    - "lib/type": "mbql.stage/native"
      "native": "SELECT b.\"Row ID\" AS \"Borrower ID\",b.\"Description\" AS \"Borrower\",h.rating_status AS \"Status\",h.reliability_score\
        \ AS \"Final /100\",h.raw_score AS \"Raw /100\",h.recent_score AS \"Recent /100\",h.recent_effective_weight AS \"\
        Recent weight\",h.older_score AS \"Older /100\",h.older_effective_weight AS \"Older weight\",h.delay_score AS \"Delay\
        \ /100\",h.delay_effective_weight AS \"Delay weight\",h.current_score AS \"Current /100\",h.current_effective_weight\
        \ AS \"Current weight\",h.score_cap_applied AS \"Cap applied\",h.recent_on_time_count AS \"Recent on time\",h.recent_obligation_count\
        \ AS \"Recent observations\",h.history_span_days AS \"History days\",h.confidence AS \"Confidence\" FROM public.reporting_borrower_matrix_v3\
        \ m JOIN public.reporting_borrower_payment_health_v1 h USING(borrower_id) JOIN public.olap_borrowers_analytics b ON\
        \ b.\"Row ID\"=m.borrower_id ORDER BY h.reliability_score ASC NULLS FIRST,h.borrower_id"
    "database": 2
