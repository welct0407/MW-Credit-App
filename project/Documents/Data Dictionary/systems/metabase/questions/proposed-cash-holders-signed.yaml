"content":
  "key": "cash.holders-signed"
  "id": 419
  "name": "Net cash by holder · positive and negative"
  "description": "Loan Reports · proposed (cash.holders-signed). Question 210's query wrapped: Net Cash Balance split into\
    \ Positive (zero or more) and Negative (below zero) columns, stacked so each holder shows one bar, blue above zero and\
    \ red below; no legend, values shown. Template tags copied; maps `position-date` as 210 maps review-position. Basis: snippet\
    \ 4 Cash position source routing (same query as question 210)."
  "display": "bar"
  "dataset_query":
    "stages":
    - "template-tags":
      - "display-name": "Daily Cash Snapshots"
        "type": "card"
        "id": "r016-model-205"
        "name": "#205"
        "card-id": 205
      - "display-name": "Cash Account Positions"
        "type": "card"
        "id": "r016-model-164"
        "name": "#164"
        "card-id": 164
      - "display-name": "Account Cash Snapshots"
        "type": "card"
        "id": "r016-model-206"
        "name": "#206"
        "card-id": 206
      - "display-name": "Portfolio Overview"
        "type": "card"
        "id": "r016-model-73"
        "name": "#73"
        "card-id": 73
      - "type": "snippet"
        "snippet-name": "Cash position source routing"
        "id": "r016-cash-position-routing"
        "name": "snippet: Cash position source routing"
        "display-name": "Cash position source routing"
        "snippet-id": 4
      - "alias": "d.\"Date\""
        "widget-type": "date/all-options"
        "id": "r016-snapshot-position-date"
        "name": "position_date"
        "display-name": "Position date / period end"
        "type": "dimension"
        "dimension":
        - "field"
        - "base-type": "type/Date"
          "lib/uuid": "7b0eb89f-1871-474c-9fb5-d90e9edd1511"
          "effective-type": "type/Date"
        - 82
      "lib/type": "mbql.stage/native"
      "native": "SELECT t.\"Cash Holder\",CASE WHEN t.\"Net Cash Balance\">=0 THEN t.\"Net Cash Balance\" END AS \"Positive\"\
        ,CASE WHEN t.\"Net Cash Balance\"<0 THEN t.\"Net Cash Balance\" END AS \"Negative\" FROM (WITH position AS ({{snippet:\
        \ Cash position source routing}}) SELECT \"Cash Holder\",CASE WHEN bool_and(\"Balance\" IS NOT NULL) THEN sum(\"Balance\"\
        ) END AS \"Net Cash Balance\" FROM position WHERE \"Cash Holder ID\" IS NOT NULL GROUP BY \"Cash Holder ID\",\"Cash\
        \ Holder\" ORDER BY \"Cash Holder\") t ORDER BY t.\"Cash Holder\""
    "lib/type": "mbql/query"
    "database": 2
