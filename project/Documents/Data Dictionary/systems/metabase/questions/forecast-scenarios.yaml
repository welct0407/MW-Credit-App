    "dataset_query": {
      "database": 2,
      "type": "native",
      "native": {
        "query": "WITH args AS (SELECT coalesce([[{{ci}},]]100)::numeric ci,coalesce([[{{cp}},]]100)::numeric cp,coalesce([[{{rr}},]]0)::numeric rr,coalesce([[{{scenario}},]]'Planning')::text scenario,coalesce([[{{kind}},]]'All')::text kind,coalesce([[{{target}},]]NULL)::numeric target), loans AS MATERIALIZED (SELECT l.* FROM {{#344}} l,args a WHERE a.kind='All' OR l.loan_type=a.kind),\n actual AS (SELECT coalesce(sum(interest),0) a,coalesce(bool_or(invalid),false) invalid FROM {{#345}} l,args a WHERE a.kind='All' OR l.loan_type=a.kind),\n sums AS (SELECT coalesce(sum(ui),0) ui,coalesce(sum(up),0) up,coalesce(sum(oi),0) oi,coalesce(sum(op),0) op,coalesce(bool_or(incomplete),false) incomplete FROM loans),\n s AS (SELECT a.*,v.a actual,r.remaining_interest ri,r.remaining_principal rp,NOT (q.incomplete OR v.invalid OR c.invalid_receipts>0 OR c.orphan_charges>0) ready,c.reporting_date,c.calculated_at,c.current_cash,c.cash_status FROM args a CROSS JOIN sums q CROSS JOIN actual v CROSS JOIN {{#347}} c CROSS JOIN LATERAL public.forecast_scenario_v1(q.ui,q.up,q.oi,q.op,a.ci,a.cp,a.rr,a.scenario) r) SELECT sc AS \"Scenario\",CASE WHEN ready THEN f.remaining_interest END AS \"Remaining interest ฿\",CASE WHEN ready THEN f.remaining_principal END AS \"Remaining principal ฿\" FROM s CROSS JOIN sums CROSS JOIN (VALUES(1,'Schedule'),(2,'Planning'),(3,'Stress')) v(ord,sc) CROSS JOIN LATERAL public.forecast_scenario_v1(ui,up,oi,op,ci,cp,rr,sc) f ORDER BY ord",
