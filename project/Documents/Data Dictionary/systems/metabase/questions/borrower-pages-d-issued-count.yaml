  "content": {
    "key": "d-issued-count",
    "id": 299,
    "name": "Loans issued",
    "description": "R035 additive borrower pages. Immutable borrower keys; Bangkok dates; current health from V41/V42. Signed receipts. No AppSheet/financial writes.",
    "display": "scalar",
    "type": "question",
    "dataset_query": {
      "stages": [
        {
          "template-tags": [
            {
              "widget-type": "date/all-options",
              "id": "bp-period",
              "name": "period",
              "display-name": "Activity period",
              "type": "dimension",
              "dimension": [
                "field",
                {
                  "base-type": "type/Date",
                  "lib/uuid": "21d8c162-10df-4efc-8238-a4880b264185",
                  "effective-type": "type/Date"
                },
                82
              ],
              "alias": "d.\"Date\""
            },
            {
              "display-name": "Borrower",
              "id": "bp-borrower",
              "name": "borrower_id",
              "type": "text"
            }
          ],
          "lib/type": "mbql.stage/native",
          "native": "WITH clock AS (SELECT public.olap_reporting_date() today), selected AS (SELECT d.\"Date\" FROM (SELECT generate_series(DATE '1900-01-01',DATE '2199-12-31',interval '1 day')::date \"Date\") d WHERE [[{{period}} --]] d.\"Date\" BETWEEN (SELECT today-30 FROM clock) AND (SELECT today-1 FROM clock)\n), bounds AS (SELECT min(\"Date\") starts,max(\"Date\") ends,count(*) days,count(*)>0 AND count(*)=max(\"Date\")-min(\"Date\")+1 AND max(\"Date\")<=(SELECT today FROM clock) valid FROM selected), chosen AS (SELECT * FROM public.reporting_borrower_directory_v1 WHERE borrower_id= [[{{borrower_id}} --]] '__select_borrower__'\n), activity AS (SELECT a.* FROM public.reporting_borrower_activity_daily_v1 a JOIN chosen c USING(borrower_id) CROSS JOIN bounds b WHERE b.valid AND a.activity_date BETWEEN b.starts AND b.ends) SELECT (SELECT CASE WHEN count(*)=0 THEN 0 WHEN bool_and(loans_issued IS NOT NULL) THEN sum(loans_issued) END FROM activity) AS \"Loans issued\" FROM chosen CROSS JOIN bounds WHERE bounds.valid"
        }
      ],
      "lib/type": "mbql/query",
      "database": 2
    },
    "visualization_settings": {
      "scalar.field": "Loans issued",
      "column_settings": {
        "[\"name\",\"Loans issued\"]": {
          "number_style": "decimal",
          "decimals": 0,
          "number_separators": ".,",
          "compact": false
        }
      }
    },
