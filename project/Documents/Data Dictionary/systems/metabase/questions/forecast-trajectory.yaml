    "name": "Cumulative interest · actual and projected",
    "display": "line",
    "dataset_query": {
      "database": 2,
      "type": "native",
      "native": {
        "query": "WITH args AS (SELECT coalesce([[{{ci}},]]100)::numeric ci,coalesce([[{{cp}},]]100)::numeric cp,coalesce([[{{rr}},]]0)::numeric rr,coalesce([[{{scenario}},]]'Planning')::text scenario,coalesce([[{{kind}},]]'All')::text kind,coalesce([[{{target}},]]NULL)::numeric target), loans AS MATERIALIZED (SELECT l.* FROM {{#344}} l,args a WHERE a.kind='All' OR l.loan_type=a.kind),\n actual AS (SELECT coalesce(sum(interest),0) a,coalesce(bool_or(invalid),false) invalid FROM {{#345}} l,args a WHERE a.kind='All' OR l.loan_type=a.kind),\n sums AS (SELECT coalesce(sum(ui),0) ui,coalesce(sum(up),0) up,coalesce(sum(oi),0) oi,coalesce(sum(op),0) op,coalesce(bool_or(incomplete),false) incomplete FROM loans),\n s AS (SELECT a.*,v.a actual,r.remaining_interest ri,r.remaining_principal rp,NOT (q.incomplete OR v.invalid OR c.invalid_receipts>0 OR c.orphan_charges>0) ready,c.reporting_date,c.calculated_at,c.current_cash,c.cash_status FROM args a CROSS JOIN sums q CROSS JOIN actual v CROSS JOIN {{#347}} c CROSS JOIN LATERAL public.forecast_scenario_v1(q.ui,q.up,q.oi,q.op,a.ci,a.cp,a.rr,a.scenario) r), days AS (SELECT generate_series(date_trunc('month',reporting_date)::date,(date_trunc('month',reporting_date)+interval '1 month - 1 day')::date,interval '1 day')::date d FROM s),\n daily AS (SELECT d,coalesce((SELECT sum(interest) FROM {{#345}} r WHERE r.payment_date=d AND (s.kind='All' OR r.loan_type=s.kind)),0) actual_day,\n coalesce((SELECT sum(interest) FROM {{#346}} ev WHERE ev.eligible AND ev.bucket IN ('Today','Future') AND ev.due_date=d AND (s.kind='All' OR ev.loan_type=s.kind)),0) due_day FROM days CROSS JOIN s),\n cumulative AS (SELECT *,sum(actual_day) OVER(ORDER BY d) actual_total,sum(due_day) OVER(ORDER BY d) due_total FROM daily)\n SELECT d AS \"Date\",CASE WHEN d<=reporting_date THEN actual_total END AS \"Actual ฿\",\n CASE WHEN d>=reporting_date AND ready THEN actual+due_total*CASE scenario WHEN 'Schedule' THEN 1 WHEN 'Stress' THEN greatest(ci-20,0)/100 ELSE ci/100 END +CASE WHEN d=(date_trunc('month',reporting_date)+interval '1 month - 1 day')::date AND scenario='Planning' THEN (SELECT oi*rr/100 FROM sums) ELSE 0 END END AS \"Selected outlook ฿\",\n CASE WHEN d>=reporting_date AND ready THEN actual+due_total*greatest(ci-20,0)/100 END AS \"Stress ฿\",CASE WHEN target>=0 AND target::text<>'NaN' THEN target END AS \"Target ฿\" FROM cumulative CROSS JOIN s ORDER BY d",
        "template-tags": {
