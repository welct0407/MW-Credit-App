  "id": 423
  "name": "Expenses by category · statement period (negative)"
  "description": "Loan Reports · proposed (income.expense-categories-signed). Question 178's query wrapped: Expense Category\
    \ and −|Expenses|, largest cost first; red bars to the left of zero. Template tags copied; maps `statement-period` as\
    \ 178 maps review-income. Basis: snippet 2 Income statement period (same query as question 178)."
  "display": "row"
  "dataset_query":
    "stages":
    - "template-tags":
      - "alias": "d.\"Date\""
        "widget-type": "date/all-options"
        "id": "r016-statement_period"
        "name": "statement_period"
        "display-name": "Statement period"
        "type": "dimension"
        "dimension":
        - "field"
        - "base-type": "type/Date"
          "lib/uuid": "c38ca2ea-8494-4208-8a35-e140e9cc9e86"
          "effective-type": "type/Date"
        - 82
      - "display-name": "Model 186"
        "type": "card"
        "id": "r016-model-186"
        "name": "#186"
        "card-id": 186
      - "type": "snippet"
        "snippet-id": 2
        "id": "r016-snippet-2"
        "name": "snippet: Income statement period"
        "display-name": "Income statement period"
        "snippet-name": "Income statement period"
      - "display-name": "Model 163"
        "type": "card"
        "id": "r016-model-163"
        "name": "#163"
        "card-id": 163
      "lib/type": "mbql.stage/native"
      "native": "SELECT t.\"Expense Category\",-abs(t.\"Expenses\") AS \"Expenses\" FROM (WITH statement AS ({{snippet: Income\
        \ statement period}}) SELECT e.\"Expense Category\",sum(e.\"Expense Amount\") AS \"Expenses\" FROM statement s JOIN\
        \ {{#163}} e ON e.\"Expense Date\" BETWEEN s.\"Period Start\" AND s.\"Period End\" WHERE s.\"Continuous Period\" GROUP\
        \ BY 1 ORDER BY 2 DESC,1) t ORDER BY 2,1"
    "lib/type": "mbql/query"
    "database": 2
