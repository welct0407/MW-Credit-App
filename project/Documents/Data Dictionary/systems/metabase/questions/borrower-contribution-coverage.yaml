"content":
  "key": "coverage"
  "id": 314
  "name": "Lifetime Interest Return on Principal Lent · top 8"
  "description": "R038. Lifetime interest return = all signed interest received / total original principal lent, active and\
    \ closed loans, through current Bangkok date. Repeated lending counts each loan once. Gross interest before expenses/losses.\
    \ Activity slicer ignored; population applies."
  "type": "question"
  "display": "row"
  "dataset_query":
    "stages":
    - "template-tags":
      - "type": "text"
        "id": "r037-pop"
        "name": "population"
        "display-name": "Population"
        "default": "All with loan history"
      - "type": "card"
        "id": "r037-model"
        "name": "#310"
        "display-name": "Borrower lifetime economics"
        "card-id": 310
      "lib/type": "mbql.stage/native"
      "native": |-
        WITH cohort AS (SELECT * FROM {{#310}} m WHERE ([[{{population}} --]] 'All with loan history'
        ='All with loan history' OR [[{{population}} --]] 'All with loan history'
        ='Currently active' AND "Has active loan" OR [[{{population}} --]] 'All with loan history'
        ='Currently inactive' AND NOT "Has active loan")) SELECT "Borrower","Lifetime interest return","Borrower ID","Lifetime interest received","Total principal lent" FROM cohort WHERE "Lifetime interest return" IS NOT NULL ORDER BY "Lifetime interest return" DESC,"Borrower ID" LIMIT 8
    "lib/type": "mbql/query"
    "database": 2
  "visualization_settings":
    "graph.show_goal": true
    "graph.show_values": true
    "graph.show_legend": false
    "graph.x_axis.title_enabled": true
    "graph.goal_label": "100% interest earned"
    "graph.x_axis.title_text": "Lifetime interest / total principal lent · %"
    "graph.goal_value": 1
