  "key": "today.collection-rate"
  "id": 381
  "name": "Today's charges · paid x of due"
  "description": "Loan Reports · proposed (today.collection-rate). Text scalar \"<Amount Collected Today> of <Amount Due Today>\
    \ (<share>%)\" from model 73: the charges dated today that are paid, not receipts; the share is Amount Collection Rate\
    \ Today to one decimal, omitted when nothing is due. Placed on Today only; Collection shows the same share as question\
    \ 252. Basis: model 73 Portfolio Overview."
  "display": "scalar"
  "dataset_query":
    "stages":
    - "template-tags":
      - "type": "card"
        "id": "lrp-model-73"
        "name": "#73"
        "display-name": "Model 73"
        "card-id": 73
      "lib/type": "mbql.stage/native"
      "native": "SELECT to_char(\"Amount Collected Today\",'FM999,999,999')||' of '||to_char(\"Amount Due Today\",'FM999,999,999')||coalesce('\
        \ ('||to_char(100*\"Amount Collected Today\"/nullif(\"Amount Due Today\",0),'FM999,990.0')||'%)','') AS \"Charges\
        \ paid\" FROM {{#73}}"
    "lib/type": "mbql/query"
    "database": 2
  "visualization_settings":
    "scalar.field": "Charges paid"
