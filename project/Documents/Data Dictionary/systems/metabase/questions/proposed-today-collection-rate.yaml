"content":
  "key": "today.collection-rate"
  "id": 381
  "name": "Today's charges · paid of due"
  "description": "Loan Reports · proposed (today.collection-rate). One-row stacked bar from model 73: Paid = Amount Collected\
    \ Today (charges dated today that are paid, not receipts), Remaining = max(Amount Due Today − Paid, 0); the label (Share)\
    \ reads \"<paid> of <due> · <share>%\", the share being Amount Collection Rate Today. Placed on Today only; Collection\
    \ shows the same share as question 252. Basis: model 73 Portfolio Overview."
  "display": "row"
  "dataset_query":
    "stages":
    - "template-tags":
      - "type": "card"
        "id": "lrp-model-73"
        "name": "#73"
        "display-name": "Model 73"
        "card-id": 73
      "lib/type": "mbql.stage/native"
      "native": "SELECT to_char(\"Amount Collected Today\",'FM999,999,999')||' of '||to_char(\"Amount Due Today\",'FM999,999,999')||coalesce('\
        \ · '||to_char(100*\"Amount Collected Today\"/nullif(\"Amount Due Today\",0),'FM990.0')||'%','') AS \"Share\",\"Amount\
        \ Collected Today\" AS \"Paid\",greatest(\"Amount Due Today\"-\"Amount Collected Today\",0) AS \"Remaining\" FROM\
        \ {{#73}}"
    "lib/type": "mbql/query"
    "database": 2
  "visualization_settings":
    "graph.show_values": true
