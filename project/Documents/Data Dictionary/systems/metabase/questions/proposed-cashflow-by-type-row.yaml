"content":
  "key": "cashflow.by-type-row"
  "id": 386
  "name": "Cash movement by transaction type · waterfall"
  "description": "Loan Reports · proposed (cashflow.by-type-row). Question 203's query wrapped: Transaction Type and Net Movement,\
    \ TOTAL row and zero-net rows removed, increases first then decreases, each by size (ORDER BY Net Movement < 0, abs(Net\
    \ Movement) DESC). Waterfall: increases green, decreases red, the total bar (the period's net movement) blue. Basis: snippet\
    \ 3 Cashflow statement period (same query as question 203)."
  "display": "waterfall"
  "dataset_query":
    "stages":
    - "template-tags":
      - "alias": "d.\"Date\""
        "widget-type": "date/all-options"
        "id": "r016-cashflow_period"
        "name": "cashflow_period"
        "display-name": "Statement period"
        "type": "dimension"
        "dimension":
        - "field"
        - "base-type": "type/Date"
          "lib/uuid": "47b166d2-b6a1-4af3-9afd-d526dc348806"
          "effective-type": "type/Date"
        - 82
      - "type": "text"
        "required": true
        "id": "r016-cash-account"
        "name": "cash_account"
        "display-name": "Account"
        "default": "__ALL__"
      - "type": "snippet"
        "snippet-id": 3
        "id": "r016-snippet-3"
        "name": "snippet: Cashflow statement period"
        "display-name": "Cashflow statement period"
        "snippet-name": "Cashflow statement period"
      "lib/type": "mbql.stage/native"
      "native": "SELECT t.\"Transaction Type\",t.\"Net Movement\" FROM (WITH statement AS ({{snippet: Cashflow statement period}})\
        \ SELECT CASE WHEN grouping(t.\"Transaction Type\")=1 THEN 'TOTAL' ELSE t.\"Transaction Type\" END AS \"Transaction\
        \ Type\",coalesce(sum(t.\"Money In\"),0) AS \"Money In\",coalesce(sum(t.\"Money Out\"),0) AS \"Money Out\",coalesce(sum(t.\"\
        Net Movement\"),0) AS \"Net Movement\" FROM statement s LEFT JOIN LATERAL public.reporting_cash_period_entries(s.\"\
        Period Start\",s.\"Period End\",{{cash_account}}) t ON true WHERE s.\"Continuous Period\" GROUP BY GROUPING SETS ((t.\"\
        Transaction Type\"),()) HAVING bool_or(s.\"Continuous Period\") AND (grouping(t.\"Transaction Type\")=1 OR count(t.\"\
        Entry ID\")>0) ORDER BY grouping(t.\"Transaction Type\"),1) t WHERE t.\"Transaction Type\"<>'TOTAL' AND coalesce(t.\"\
        Net Movement\",0)<>0 ORDER BY (t.\"Net Movement\"<0),abs(t.\"Net Movement\") DESC,t.\"Transaction Type\""
    "lib/type": "mbql/query"
    "database": 2
  "visualization_settings":
    "waterfall.increase_color": "#13855B"
    "graph.show_values": true
    "waterfall.total_color": "#267DCC"
    "waterfall.decrease_color": "#D1495B"
    "graph.x_axis.title_enabled": false
    "graph.y_axis.title_enabled": false
    "graph.metrics":
    - "Net Movement"
    "graph.label_value_formatting": "compact"
    "column_settings":
      "[\"name\",\"Money In\"]":
        "number_style": "decimal"
        "decimals": 0
        "number_separators": ".,"
        "compact": false
      "[\"name\",\"Money Out\"]":
        "number_style": "decimal"
        "decimals": 0
        "number_separators": ".,"
        "compact": false
      "[\"name\",\"Net Movement\"]":
        "number_style": "decimal"
        "decimals": 0
        "number_separators": ".,"
        "compact": false
    "graph.dimensions":
    - "Transaction Type"
    "waterfall.show_total": true
  "basis": "snippet 3 Cashflow statement period (same query as question 203)"
